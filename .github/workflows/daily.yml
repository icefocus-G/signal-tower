name: 每日构建

on:
  schedule:
    # UTC 23:00 = 北京 07:00；UTC 07:00 = 北京 15:00
    - cron: "0 23,7 * * *"
  workflow_dispatch:          # 支持在网页上手动触发
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 零第三方依赖，不需要 pip install
      - name: 抓取并生成静态站点
        env:
          # 可选：在仓库 Secrets 里配 LLM_API_KEY，翻译质量会明显更好
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python build.py --out docs --articles 20

      - name: 提交更新
        run: |
          git config user.name  "signal-tower-bot"
          git config user.email "signal-tower-bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 数据更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 定时任务与手动触发可能并发，push 被拒时先 rebase 再推。
          # docs/ 是构建产物，冲突时保留本次构建结果。
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "推送被拒，第 $i 次重试前先同步远端…"
            git rebase --abort 2>/dev/null || true
            git pull --rebase -X theirs origin main || {
              git rebase --abort 2>/dev/null || true
              git checkout --theirs docs/ 2>/dev/null || true
              git add docs/
              git -c core.editor=true rebase --continue 2>/dev/null || true
            }
            sleep 6
          done
          echo "四次重试后仍无法推送"; exit 1

      - name: 保留构建摘要
        if: always()
        run: |
          [ -f docs/data/meta.json ] || exit 0
          {
            echo "## 构建结果"
            echo
            python3 .github/summary.py
          } >> "$GITHUB_STEP_SUMMARY"
