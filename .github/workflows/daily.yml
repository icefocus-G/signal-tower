name: 每日简报

# 已取消所有自动触发（原每日 07:00 定时与 push 触发均已下线）。
# 现在只有一种触发方式：在 Actions 页面手动点 Run workflow。
#
# 日常使用不依赖这里 —— 双击本地「信号塔.app」即可生成当天的简报。
# 想更新网页版时，再到这里手动跑一次。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "构建档位"
        type: choice
        options: [full, incremental]
        default: full

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 翻译记忆跨次复用：冷启动要翻几百条，热缓存只翻新增的几条
      - name: 恢复翻译缓存
        uses: actions/cache@v4
        with:
          path: cache
          key: translate-${{ github.run_id }}
          restore-keys: |
            translate-

      - name: 判定构建档位
        id: mode
        run: |
          # 只有手动触发，档位直接取输入值（默认全量）
          MODE="${{ inputs.mode }}"
          [ -n "$MODE" ] || MODE=full
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次档位：$MODE"

      # 零第三方依赖，不需要 pip install
      - name: 抓取并生成静态站点
        id: build
        env:
          # 可选：在仓库 Secrets 里配 LLM_API_KEY，翻译质量会明显更好
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          # 每日简报不做"内容没变就不发"的判断——简报本身要体现今天这次生成
          if [ "$MODE" = "full" ]; then
            python build.py --out docs --articles 20 --translate full
          else
            python build.py --out docs --articles 0 --translate title
          fi

      - name: 保留构建摘要
        if: always()
        run: |
          [ -f docs/data/meta.json ] || exit 0
          {
            echo "## 构建结果"
            echo
            echo "档位：\`${{ steps.mode.outputs.mode }}\`"
            echo
            python3 .github/summary.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
