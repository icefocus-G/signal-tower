name: 每日简报

# 定位是「每日简报」，不是实时快讯：
#   0 23   —— 每天北京 07:00 生成一次全量简报（标题 + 摘要 + 正文）
#   push   —— 改代码后立即重建
#   手动   —— 想立刻刷新就点 Run workflow
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "构建档位"
        type: choice
        options: [full, incremental]
        default: full
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 翻译记忆跨次复用：冷启动要翻几百条，热缓存只翻新增的几条
      - name: 恢复翻译缓存
        uses: actions/cache@v4
        with:
          path: cache
          key: translate-${{ github.run_id }}
          restore-keys: |
            translate-

      - name: 判定构建档位
        id: mode
        run: |
          # 定时与手动默认全量；push 只要快速验证代码没坏，跑增量档
          case "${{ github.event_name }}" in
            schedule) MODE=full ;;
            workflow_dispatch) MODE="${{ inputs.mode }}" ;;
            *) MODE=incremental ;;
          esac
          [ "$MODE" = "full" ] || MODE=incremental
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次档位：$MODE"

      # 零第三方依赖，不需要 pip install
      - name: 抓取并生成静态站点
        id: build
        env:
          # 可选：在仓库 Secrets 里配 LLM_API_KEY，翻译质量会明显更好
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          # 每日简报不做"内容没变就不发"的判断——简报本身要体现今天这次生成
          if [ "$MODE" = "full" ]; then
            python build.py --out docs --articles 20 --translate full
          else
            python build.py --out docs --articles 0 --translate title
          fi

      - name: 保留构建摘要
        if: always()
        run: |
          [ -f docs/data/meta.json ] || exit 0
          {
            echo "## 构建结果"
            echo
            echo "档位：\`${{ steps.mode.outputs.mode }}\`"
            echo
            python3 .github/summary.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
