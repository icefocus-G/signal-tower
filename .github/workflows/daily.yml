name: 每日构建

on:
  schedule:
    # UTC 23:00 = 北京 07:00；UTC 07:00 = 北京 15:00
    - cron: "0 23,7 * * *"
  workflow_dispatch:          # 支持在网页上手动触发
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 零第三方依赖，不需要 pip install
      - name: 抓取并生成静态站点
        env:
          # 可选：在仓库 Secrets 里配 LLM_API_KEY，翻译质量会明显更好
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python build.py --out docs --articles 20

      - name: 提交更新
        run: |
          git config user.name  "signal-tower-bot"
          git config user.email "signal-tower-bot@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 数据更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 保留构建摘要
        if: always()
        run: |
          if [ -f docs/data/meta.json ]; then
            python - <<'PY'
          import json
          m = json.load(open("docs/data/meta.json"))
          t = m["totals"]
          print(f"### 构建结果\n")
          print(f"- 生成时间：{m['generated_at_iso']}")
          print(f"- 翻译引擎：{m['engine']}")
          print(f"- 来源在线：{t['sources_ok']}/{t['sources_total']}")
          print(f"- 抓取 {t['fetched']} 条 → 保留 {t['kept']} 条")
          print(f"- 耗时：{m['elapsed']}s")
          print("\n" + "  ".join(f"{c['label']} {c['count']}" for c in m["categories"].values()))
          PY
          fi >> $GITHUB_STEP_SUMMARY
