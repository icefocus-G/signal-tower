作出赔付到底、售后兜底的承诺，该承诺属于对外作出的真实意思表示，不违反法律、行政法规的强制性规定，具备法律约束力，因此直播推广方应当依法承担相应连带责任。\n\n法官表示，周女士正是出于对主播承诺的信任，通过直播间链接下单购买面霜，这份公开承诺构成有效约定，购物公司应当按照承诺履行兜底赔付义务。与此同时，法院也对网络平台是否应当承担责任作出审查。\n\n朱海峰：平台没有参与本次交易，也没有作出赔付承诺，并且已经依法履行商家资质审核、信息公示等义务。按照消费者权益保护法，只有平台无法向消费者提供商家真实信息时，消费者才能要求平台先行赔付。\n\n最终，浙江省丽水市莲都区人民法院依据《中华人民共和国民法典》第五百八十五条判决商贸公司按照货值四倍退赔周女士7936元，直播购物公司对这笔款项承担连带责任，驳回周女士要求平台赔偿的诉讼请求。一审判决后，双方均未提起上诉。\n\n法官介绍，主播在直播中公开承诺“假一赔四”“假一赔十”等虽然高于法定标准的赔偿，但并不违反法律强制性规定，具有法律效力，经营者应当履约兑现。法官提醒直播从业者，直播间口头承诺并非营销空话，一经发布即需承担相应的法律责任。\n\n直播购物如果遭遇货不对板、虚假宣传、承诺不兑现等消费纠纷，消费者该怎样留存证据，依法维权？法官给出实用指引。\n\n法官介绍，在审理直播带货纠纷案件时，直播录屏回放是维权的核心证据。直播间的宣传、口头赔付承诺，大多只在直播瞬间出现，一旦直播结束，取证难度会大幅增加。\n\n丽水市莲都区人民法院副院长 涂诗雨：消费者下单前，可以在直播间弹幕向主播提问，确认商品品牌、材质、售后、赔付承诺等关键信息，在得到主播明确答复后再决定购买。录制直播画面时，尽量把主播账号名称、直播间商品购买入口一并录进去，同时保证视频自带录制时间。消费者也可以向平台申请调取直播回放，但平台保存的回放经常缺失弹幕对话，自己录制的视频如果同时保留弹幕交流，证明力会更强。\n\n消费维权案件里，不少消费者维权失败，就是因为证据链条不够完整，关键信息没能留存。\n\n涂诗雨：订单截图、支付凭证、物流信息都要完整保存。收货环节尤其关键，贵重商品尽量录制完整开箱视频，全程不间断拍摄，清晰展示包裹外观、快递面单、商品实物、包装标签。一旦发现商品和宣传不符，不要丢弃商品外包装、防伪标识，这些都是后续鉴定、诉讼的重要物证。另外，和平台客服、商家沟通的聊天记录不要删除，涉及商品质量、赔付承诺的对话，都可以作为证据。\n\n法官还特别提醒，尽量不要点击直播间跳转至微信、私域的外部链接下单。脱离平台监管的私下交易，后续举证、维权会更困难。\n\n涂诗雨：发现权益受损，首先可以直接和商家协商和解。协商不成，在平台内提交售后申请，由平台介入调解。也可以拨打12315消费者投诉举报专线，向市场监管部门投诉举报。如果经调解仍无法解决纠纷，可依法向人民法院提起诉讼。如果商品存在假冒伪劣，还可以申请专业机构鉴定，鉴定产生的合理费用，在符合条件的情况下，可以主张由商家承担。 【编辑:蔡星雨】\n\n泸州“花坛藏尸案”一审宣判：陈某芬被判死刑，杨某根被判死缓\n\n厦金大桥（厦门段）海上主线桥贯通 预计今年底建成通车\n\n杭州临平通报一起刑事案件：2人死亡 犯罪嫌疑人畏罪自杀\n\n公安部推出5项交管便民利企新措施 12月1日起全国推行\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"cbf435d286a6a9eb":{"body":"关于印发新冠病毒疫苗第二剂次加强免疫接种实施方案的通知\n\n各省、自治区、直辖市及新疆生产建设兵团应对新型冠状病毒肺炎疫情联防联控机制（领导小组、指挥部），国务院应对新型冠状病毒肺炎疫情联防联控机制疫苗接种工作协调组各成员单位：\n\n现将《新冠病毒疫苗第二剂次加强免疫接种实施方案》印发给你们，请结合实际认真贯彻落实。\n\n为深入贯彻落实党中央、国务院决策部署，进一步做好新冠肺炎疫情应对工作，保障人民群众生命安全和身体健康，经研究，现提出新冠病毒疫苗第二剂次加强免疫接种实施方案。\n\n现阶段，可在第一剂次加强免疫接种基础上，在感染高风险人群、60岁以上老年人群、具有较严重基础性疾病人群和免疫力低下人群中开展第二剂次加强免疫接种。\n\n（一）疫苗选择。根据疫苗研发工作进展，所有批准附条件上市或紧急使用的疫苗均可用于第二剂次加强免疫。优先考虑序贯加强免疫接种，或采用含奥密克戎毒株或对奥密克戎毒株具有良好交叉免疫的疫苗进行第二剂次加强免疫接种，有关组合如下：\n\n3剂灭活疫苗+1剂康希诺肌注式重组新冠病毒疫苗（5型腺病毒载体）；\n\n3剂灭活疫苗+1剂智飞龙科马重组新冠病毒疫苗（CHO细胞）；\n\n3剂灭活疫苗+1剂康希诺吸入用重组新冠病毒疫苗（5型腺病毒载体）；\n\n3剂灭活疫苗+1剂珠海丽珠重组新冠病毒融合蛋白（CHO细胞）疫苗；\n\n2剂康希诺肌注式腺病毒载体疫苗+1剂康希诺吸入用重组新冠病毒疫苗（5型腺病毒载体）；\n\n3剂灭活疫苗+1剂成都威斯克重组新冠病毒疫苗（sf9细胞）；\n\n3剂灭活疫苗+1剂北京万泰鼻喷流感病毒载体新冠病毒疫苗；\n\n3剂灭活疫苗+1剂浙江三叶草重组新冠病毒蛋白亚单位疫苗（CHO细胞）；\n\n3剂灭活疫苗+1剂神州细胞重组新冠病毒2价S三聚体蛋白疫苗。\n\n（二）时间间隔。根据国内外真实世界研究和临床试验数据，结合我国疫苗接种实际，第二剂次加强免疫与第一剂次加强免疫时间间隔为6个月以上。\n\n各地要继续把接种安全放在首要位置，严格按照《预防接种工作规范》要求，规范组织接种实施。各地卫生健康部门要落实接种单位有二级以上综合医院急诊急救人员驻点保障、有急救设备药品、有120急救车现场值守、有二级以上综合医院救治绿色通道的“四有”要求，保障接种安全。接种单位要做好加强免疫的接种信息登记和疫苗流向管理，及时准确更新免疫规划信息系统和预防接种凭证中接种记录相关内容。\n\n（一）强化属地主体责任。各地要落实属地管理责任，高度重视并统筹做好新冠病毒疫苗接种工作。要加强对辖区内疫苗接种工作的指导，全面掌握工作进展。地方各相关部门要加强对接，做好工作协同。\n\n（二）落实部门行业管理责任。各相关行业主管部门要指导本行业人员所在单位积极配合地方统一安排，共同做好组织动员工作。\n\n（三）加强监督指导。要密切跟踪监测各地第二剂次加强免疫接种进展，及时发现和研究解决相关问题。健全疫苗流向全程追溯体系，完善疫苗全链条安全监管机制，持续加强全流程管理和安全防范。\n\n（四）做好宣传引导。各地和有关部门要根据工作需要，有针对性地制定第二剂次加强免疫接种工作的宣传措施，重点宣传加强免疫接种的目的意义，积极引导目标人群主动接种，特别要引导提升老年人群的接种率。","body_orig":"","translated":false},"7c2c0c017bcf7839":{"body":"11月10日，第九届中国国际进口博览会在上海闭幕。六天的展期，交出了一份怎样的进博“成绩单”？下面就通过一组数据来盘点一下。\n\n全球首发、亚洲首秀、中国首展的代表性展品数量达485项；\n\n按一年计意向成交额854.5亿美元，较上届增长2.3%。\n\n本届进博会，境外参展企业数量创下历届新高。其中，首次参展的新面孔超过2000家，大多是海外中小企业、特色产地品牌。对他们而言，进博会降低了进入中国市场的门槛。同时，近200家连续九届参与进博会的“全勤生”，既是进博会成长的见证者，也是中国开放的参与者和受益者。\n\n新西兰纽仕兰乳业亚太区CEO 盛文灏：我身上的两个徽章，第一个是2018年第一届进博会，第二个是九届进博会全勤生的褒奖。我们在九届进博会里有满满的获得感。而我们的展台，从第一届的50平方米，到现在已经200平方米。\n\n本届进博会共组建51个交易团和700多个交易分团，注册观众47万余人，规模超过去年；会期举办80场配套活动，62场集中签约活动达成400多个合作意向。进博会已不只是外商对接中国采购商的单向平台，在这里，展商之间也在互相寻找合作伙伴，开放的朋友圈越扩越大。\n\n加拿大适必客公司全球CEO 布莱恩·贾米森：在进博会上，我们遇到了有意在英国、意大利分销我们产品的人，还有巴西、阿根廷的采购商，收获特别大。\n\n与此同时，第十届进博会筹备工作已经启动，已有143家企业及机构签约，展览面积超过10万平方米。\n\n随着6天的进博会落幕，365天线上进博会正式启动。越来越多的“进博同款”有了新的买法和逛法，成为百姓身边触手可及的消费新场景。\n\n上海北外滩(集团)有限公司副总经理 陈之怡：365天线上进博会不间断的福利，希望大家在这几天进博会之后，还能够把进博的效应延伸到更长。 【编辑:刘阳禾】\n\n（第九届进博会）离开中国8年，这位美国商人带着生意回来\n\n江苏扬州三江营“生态岛”试验区建设成效显著 筑牢南水北调源头生态屏障\n\n乘联分会：10月新能源乘用车零售、批发渗透率均创历史新高\n\n规范机票退改签！京津冀三地消协组织敦促10家航司、5家平台限期整改\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"a6832a623e99c81e":{"body":"中新网11月11日电 11月11日，国务院台办举行例行新闻发布会。有记者问，据报道，民进党当局称，因应“跨国镇压”犯罪，已启动修订“反渗透法”程序，增订罪责并加重处罚。陆委会称，未来将设立通报专线，协助“受害”民众。请问对此有何评论？\n\n国台办发言人张晗表示，所谓“反渗透法”是民进党当局炮制的打压政治异己、恐吓台湾民众、禁限两岸交流、谋取政治私利的工具，是一部不折不扣的“恶法”，从一开始就遭到岛内各界的严重质疑和抨击。所谓“跨国镇压”是民进党当局编造的谎言，是为其“台独”分裂张目，贩卖“两国论”，再次暴露其险恶用心。此时蓄意进行这番操作，不过是民进党当局进一步推行“绿色恐怖”，放大“寒蝉效应”，煽动两岸对立对抗，欺骗民众的拙劣把戏，不得人心。(中新网“燕新台”工作室)\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"a8c005f0371d202b":{"body":"中新网巴黎11月11日电 巴黎中国文化中心当地时间6日晚举办“聊聊”第五期“中国味道”主题沙龙。本次活动将趣味汉语学习与中华饮食文化相结合，邀请中文学习者和中国文化爱好者在轻松愉快的氛围中，以语言为桥梁、以味觉为线索，开启一场跨越古今的文化探索之旅。\n\n活动以“宴飨万年——数说中国古代饮食文化”展览为依托，借鉴了广受欢迎的“欧洲博物馆之夜”理念，在常规开馆时间之外特别开放展厅，并围绕展览内容设计互动体验，让观众从欣赏文物走向亲身参与，在游戏、交流与实践中感受中华文化的独特魅力。\n\n活动伊始，文化中心汉语教师以贴近日常生活的趣味提问，引导参与者认识“酸、甜、苦、咸、鲜、麻、辣”等中文词汇，并通过情境互动、双人对话和趣味游戏，鼓励大家运用简单句式表达自己的饮食喜好。无论是刚刚接触中文的初学者，还是具备一定汉语基础的爱好者，都能在轻松的交流中学以致用，感受语言学习的乐趣。\n\n随后，参与者被分为四组，依次走进四个主题体验区，在丰富多彩的活动中探索中国饮食文化。“古今对对碰”通过图像配对，引导观众在展览中寻找线索，发现古今饮食习惯的联系与变化。“舌尖上的中国”以传统食材辨识与中式甜品制作，让参与者从味蕾感受芝麻、桂花、红枣、红豆等中国风味。“一筹一味”借助茶文化体验与酒筹趣味问答，带领大家了解古代中国的宴饮习俗与礼仪文化。“席间雅戏”则通过投壶、五子棋、捶丸等传统游戏，让参与者在切磋互动中领略中国古人的生活雅趣。\n\n活动尾声，参与者围绕“你心中的中国味道”共同创作了一幅手风琴式长卷，以文字和绘画留下各自的感受。从一道难忘的菜肴，到一次中国旅行的回忆，再到与亲友相聚的温暖时光，不同语言与文化背景下的记忆在长卷上交汇，也让“中国味道”超越了食物本身，成为连接情感、分享故事的文化纽带。\n\n本次活动是巴黎中国文化中心“中国味道”系列活动重要组成部分，是推动语言教学与文化活动资源相结合、探索公共文化教育新形式的一次生动实践。(完)\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n成都蓉城俱乐部董事长、总经理辞职 主教练阿洛伊西离任\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"d5ff8013276ead77":{"body":"心梗发作前，身体会发出哪些警报？(健康驿站·急症早识别)\n\n立冬过后，气温走低，心血管急症风险随之升高。凶险的心梗，未必都是撕心裂肺的胸痛。哪些不适是容易被忽视的心梗警报？普通人该如何快速分辨小病还是心梗？本报记者就此采访了北京大学人民医院心血管内科主任医师刘健。\n\n记者：什么是心梗？发作时有哪些表现？为什么必须立即抢救？\n\n刘健：急性心肌梗死简称“急性心梗”或“心梗”，简单说，就是给心脏供血的冠状动脉突然堵了，或者严重变窄，导致一部分心肌长时间缺血、缺氧而坏死。最常见的情况是血管里的粥样硬化斑块破裂，随后引发血栓形成，把血管堵住或堵得更窄；少数也可由冠脉痉挛、栓塞、夹层等原因引起。\n\n心梗发作时，患者通常会感到胸口压榨样疼痛或闷痛，这种痛感有时会放射到左臂、肩背或下颌，还可能伴有冷汗淋漓、恶心呕吐、呼吸不畅等表现。但部分患者可能没有典型胸痛，而表现为胸闷、气短、乏力、上腹不适或晕厥。\n\n心梗可能导致恶性心律失常、心力衰竭、心源性休克甚至心脏骤停，因此属于需要立即抢救的危急病症。一旦怀疑心梗，应立即拨打急救电话，尽快开通堵塞的血管，切勿拖延，这是挽救生命的关键。\n\n刘健：心梗的发生，通常是在冠状动脉粥样硬化等基础病变上，叠加危险因素和诱发因素的结果。冠状动脉粥样硬化是最重要的基础病因；吸烟、糖尿病、血脂异常、超重或肥胖、不健康饮食等是重要的危险因素；情绪激动、气温骤变、突然进行高强度运动、长期熬夜或过度劳累、短时间内大量进食高脂饮食、激烈争吵、便秘时用力屏气排便等，可能让心脏负担突然加重，诱发急性缺血。因此，对已有冠心病等基础病变的人，生活中要尽量避免这些诱因，控制危险因素。\n\n记者：心梗在一天和一年中有哪些高发时段？日常应如何防范？\n\n刘健：心梗存在比较明显的时段规律，清晨和寒冷季节相对高发。\n\n清晨，人从睡眠状态醒来时，交感神经开始兴奋，血压上升、心率加快，血液中的血小板更容易聚集，抗凝能力相对下降。这些变化叠加在一起，会让原本不稳定的血管斑块更容易破裂，形成血栓。所以建议大家晨起时不要猛地起身，可以先在床上躺一会儿，活动活动手脚，再慢慢坐起来，坐一两分钟后再下床。\n\n此外，寒冷季节心梗风险更高。低温和气温骤降会刺激血管收缩，使血压升高、心率加快，加重心脏负担，容易诱发心绞痛、心梗。一般来说，每年11月到次年3月是急性心肌梗死等心血管事件的高发期。但夏季也要注意，尤其是从高温室外突然进入低温空调房，冷热交替同样可能诱发心脏事件。建议冬天外出注意保暖，尤其护好头颈和胸口；夏季空调不要调得过低，室内外温差尽量控制在7摄氏度以内，进屋前可先缓一缓。已有高血压、冠心病的人还应规律服药，避免血压大幅波动。\n\n记者：除典型的胸口压榨样疼痛外，心梗有哪些容易被忽视的不典型表现？哪些情况需高度警惕？\n\n刘健：胸痛是急性心梗的重要症状，但并非所有心梗都会出现胸痛。不典型表现可包括下颌至腹部范围内的疼痛或不适，如牙疼、下颌痛、肩背痛、上腹痛、咽喉不适等；疼痛性质可为压迫感、紧缩感、烧灼感、压榨样不适、撕裂样疼痛、隐痛，甚至难以描述的不适。部分患者可伴出汗、心慌、气短、呼吸困难、虚脱或濒死感。这些表现容易被误认为胃病、牙病、肌肉劳损或普通疲劳，从而延误救治。\n\n出现以下情况应高度警惕心梗：症状无法用原有疾病解释；同时伴有胸闷、气短、大汗、头晕或恶心；在体力活动或情绪激动时诱发或加重，休息后仅部分缓解；针对“疑似病因”的常规处理无效。老年人、女性和糖尿病患者症状更不典型，应更留意。任何突发、无法解释的身体不适，一旦怀疑心梗，应立即拨打120。\n\n时间就是生命，心肌梗死救治的黄金时间窗是120分钟，早一分钟开通血管，就能多保住一些心肌细胞，预后越好。\n\n记者：出现疼痛等不适时，普通人在家如何区分是普通胃病、肌肉劳损这样的小毛病，还是心梗这样的急症？\n\n刘健：在家判断的关键不是精确认定疾病，而是快速识别“不像小毛病”的危险信号，可按以下三步判断：\n\n第一步，按压和动作测试。能找到明确压痛点，按压更疼，或疼痛与抬手、转身、深呼吸等动作明确相关，休息或按摩热敷后缓解，更支持肌肉劳损；若按不到明确痛点，肢体动作不影响疼痛，按摩热敷无效，且为持续闷痛、压榨感，需警惕心脏问题。\n\n第二步，看有无全身警报。若不适同时伴有突然冒冷汗、呼吸困难、头晕、眼前发黑、恶心、莫名恐惧或濒死感中的任一项，无论疼痛位于何处，在无法排除心梗时都应优先怀疑心脏，并立即拨打120。\n\n第三步，看诱因和持续时间。普通胃病多与进食相关，有规律，调整饮食或服胃药后缓解；心脏信号常与体力活动或情绪激动有关，也可在安静时突发，与进食无关。若症状持续超过15分钟不缓解，或症状性质、程度与以往不同，常规处理无效，也应按心梗处理。\n\n记者：心梗发作前数天甚至数周可能有哪些前驱表现？什么情况下需要尽快就医？\n\n刘健：50%—80%的急性心肌梗死患者在发病前1—2天或更早可出现预警征兆，但多不特异，容易被当成劳累、感冒或“老胃病”。常见前驱表现包括：与活动量不匹配的极度疲劳，女性更突出，休息后也难以恢复；与进食无关、服胃药无效的上腹闷胀、烧灼感、恶心或消化不良，且可在活动或情绪激动时诱发或加重；胸部闷胀而非剧痛；放射至左肩、后背、下颌或咽喉却找不到具体痛点的疼痛；轻微活动即气短；莫名心慌、头晕、出冷汗。\n\n莫名乏力或胃部不适是否需就医，可沿用前述危险信号，并特别注意：无明确诱因、休息或对症处理后不缓解，或服胃药无效；伴有前述全身警报中的任一项；在走路、上楼或情绪激动时出现或加重，休息几分钟后减轻；上腹不适或胸部闷胀持续超过15分钟不缓解。糖尿病患者可能因神经病变仅表现为乏力或恶心，需更警觉。\n\n总之，当一种“小毛病”与以往经验不同、说不清原因时，宁可当作一次“虚惊”去排查，也不要当成“老毛病”硬扛。\n\n记者：怀疑心梗时，网上流传不少急救方法，比如用力咳嗽或拍打胳膊肘自救、喝水，自行服用阿司匹林、含服硝酸甘油或速效救心丸。其中，哪些是误区、存在风险？用药有哪些重要的前提和禁忌？\n\n刘健：怀疑心梗时，错误的处置可能比疾病本身更危险，任何自救动作，都不能替代立即拨打120和寻求专业医疗评估。\n\n首先，用力咳嗽、拍打胳膊肘不能疏通血管，反而会增加心脏负担，可能加重病情甚至诱发心跳骤停；喝水会增加心脏泵血负担，意识不清时还可能导致误吸、窒息。以上这些做法均错误。\n\n阿司匹林是抗血小板药物，核心作用是预防血栓，适合冠心病患者长期规律服用，不是应急药。在不确定病情的时候，不建议胸痛者服用阿司匹林，因为心梗并非引起胸痛的唯一原因。疑似主动脉夹层、活动性出血或近期脑出血、对阿司匹林过敏、正在使用其他抗凝药者，严禁服用阿司匹林，以免加重病情。如果既往有明确的冠心病史、意识清醒且能够吞咽、无禁忌，可在120调度或急救人员指导下嚼服300毫克阿司匹林(非肠溶片优先；如仅有肠溶片可嚼碎)。\n\n硝酸甘油是冠心病、心绞痛患者的必备急救药物，它能快速扩张血管、暂时缓解心绞痛，但不能替代就医。疑似心梗时，不建议自行反复含服；如既往有冠心病心绞痛史、血压正常、无禁忌，可在急救人员指导下舌下含服；5分钟不缓解可重复1次，最多3次；若仍不缓解，应立即拨打120，不得因反复含服延误救治。禁忌包括：低血压、严重贫血、右心室梗死、正在服用西地那非或他达拉非等PDE-5抑制剂、严重心动过缓或心动过速、肥厚型梗阻性心肌病、闭角型青光眼、颅内压增高或脑出血、对硝酸甘油过敏。含服时应坐位或半卧位，避免站立摔倒或平躺加重心脏负担。\n\n在怀疑心梗、手边没有硝酸甘油或存在硝酸甘油禁忌时，可以选择速效救心丸作为急救药，但它也不能替代就医。速效救心丸是由川芎、冰片等中药组成的中成药，能增加冠脉血流量，缓解心绞痛。它的禁忌人群包括：孕妇、哺乳期女性，对成分过敏者，低血压或休克者，有出血倾向或活动性出血者，正在服用抗凝、抗血小板药者等。如既往有冠心病心绞痛史、无禁忌，怀疑心梗时可舌下含服10至15粒，一般5分钟左右起效。如果用药10分钟后症状不缓解，可再含服1次，同时拨打120。\n\n记者：急救送医时，要不要舍近求远去大医院？选择就诊医院优先看哪些条件？\n\n刘健：心梗救治的核心是尽快开通堵塞血管。选择医院既要考虑距离，也要考虑救治能力。120调度会优先选择具有“胸痛中心”资质的医院，因其具备快速诊疗通道和心脏介入能力。若附近没有胸痛中心，应就近紧急处理(如溶栓)，再根据病情转运至有条件的医院。\n\n记者：高度怀疑心梗时，第一时间正确处置流程是什么？拨打120时应重点告知哪些信息？\n\n刘健：可概括为“停、呼、卧、等”，即停止活动、呼叫120、舒适静卧、等待专业救援和评估。只要所处位置安全，让患者就地平躺，或在有靠背处坐下，保持安静休息，不要扶起患者；立即拨打120，并重点告知准确地点、主要症状、意识状态、联系方式、既往病史和正在使用的药物。\n\n切记，不要自行开车送医，因为途中可能发生心律失常、休克甚至猝死，救护车有专业人员和设备，更安全。到院后不要到门诊挂号候诊，应直接去急诊；胸痛中心会按流程开设绿色通道。入院后，应听从医生建议，配合检查和治疗，犹豫等待会加重病情。急诊冠脉介入手术尽快开通堵塞血管，才能尽可能保留心肌细胞和心脏功能。\n\n记者：近些年，临床急诊中二三十岁的心梗患者并不罕见。为什么二三十岁的人也会发生心梗？\n\n刘健：与老年人相比，年轻人的心梗大多是多种后天危险因素叠加的结果。\n\n老年人心梗多为血管数十年逐步老化、动脉粥样硬化常年进展所致；而很多年轻人血管基础尚可，但多种不良生活习惯会加速血管内皮损伤。\n\n首要危险因素是吸烟。临床研究显示，35岁及以下心梗患者中74%存在吸烟习惯。尼古丁可直接损伤血管内壁，加速斑块形成。\n\n其次是长期熬夜、持续高压加班。熬夜可扰乱自主神经功能，使血压、心率长期波动，血管持续处于应激状态。此外，久坐不动也是重要因素：白天长时间伏案会减慢血液循环，若再叠加外卖高油、高盐、高糖饮食，高脂血症、高血压可能在不知不觉中发生，很多年轻人并不知道自己的血脂、血压已经超标。\n\n另一个值得注意的诱因是突击式、透支式运动。平时久坐少动，却在周末或下班后疲惫状态下突然进行高强度锻炼，突然的高强度刺激可能成为心梗发作的导火索。\n\n此外，不少年轻人忽视体检，认为“没有不舒服＝身体没问题”，但早期“三高”常没有明显症状，不筛查就难以发现。还有部分人存在先天性隐匿性心脏结构问题，平时毫无察觉。\n\n刘健：定期体检筛查，早发现隐患。即使自我感觉健康，每年也应完成至少一次全身体检，重点关注血压、血糖、血脂及体重指标。40岁以上人群，或具备心脑血管病家族史、“三高”、吸烟、肥胖等危险因素者，建议在医生指导下增加心脏专项检查，以便及早发现隐匿病变。\n\n严控“三高”因素，早干预风险。预防远比补救更重要。所有人应严格控制血压、血糖、血脂与体重，保持均衡饮食、戒烟限酒、充足睡眠和规律运动，并建立健康减压方式。确诊“三高”及心血管病者遵医嘱用药，记录好静息心率、血压等指标，当出现持续且无法解释的轻微不适时，可比对基线数据并及时咨询医生。\n\n制订急救计划，做好准备以应对险情。将急救电话、附近设有胸痛中心的医院联系方式及紧急联系人电话，保存在手机快捷菜单或易取位置，以备急需。同时，心梗高危人群应主动告知家人自身情况，并与家人共同了解心梗的典型和非典型症状，在医生指导下备好硝酸甘油等急救药物；一旦出现异常，及时呼叫救援，争取宝贵救治时间。\n\n《人民日报海外版》(2026年11月11日 第 09 版) 【编辑:蔡星雨】\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"75fead1a33cf6f9e":{"body":"The published evidence regarding VLCD before cholecystectomy in obese patients is limited. After acknowledging the limitations of the data, VLCD is associated with a significantly higher rate of weight loss preoperatively and directly impacts the ease of intraoperative dissection of Calot’s triangle. Routine use of VLCD should be considered for all obese patients undergoing elective LC.\n\nThere is an increasing global prevalence of obesity.[1] In England, 26% of adults are obese.[2] Obesity increases the complexity of surgical intervention, can increase operative time and can be associated with worse outcomes.[3-5]\n\nLaparoscopic cholecystectomy (LC) is one of the most frequently performed surgical procedures worldwide.[6] Given that obesity is a well-recognised risk factor for gallstone disease, it is common to perform LC on overweight and obese patients.[3] In the UK, over 40% of patients undergoing cholecystectomy have a body mass index (BMI) of 30 kg/m2 and above.[7]\n\nObesity can increase the technical difficulty of any laparoscopic procedure – the increased abdominal wall adiposity can make access to the abdominal cavity challenging and provide resistance to port movement.[8] With regard to LC, as a consequence of the metabolic syndrome of obesity, the liver becomes steatotic and enlarged.[4] A combination of an enlarged, rigid, left hemi-liver can make a fundal retraction and subsequent visualisation of the structures in Calot’s triangle challenging.[5,8] A failure to expose Calot’s triangle and the subsequent acquisition of the critical view of safety is an acknowledged risk factor for bile duct injury.[9] Obesity may also result in increased rates of bleeding from the liver as a consequence of the friable nature of a steatotic liver.[10]\n\nRisk mitigation strategies for obese patients have become an important area of research focus. Emerging evidence from within the wider medical literature has demonstrated that a pre-operative very low-calorie diet (VLCD) is associated with improved surgical outcomes for obese patients when undergoing bariatric and other upper gastrointestinal surgery.[11] VLCD induces the mobilisation of liver glycogen stores and alters metabolic pathways in vivo.[12,13] This results in a quantifiable reduction in liver size and volume.[10] As a consequence, this enables improved visualisation of key anatomical landmarks and reduces complication rates.[14] Although widely used, the role of VLCD before LC in obese patients is unclear. The aim of this systematic review and meta-analysis was to evaluate whether routine use of VLCD should be considered for all obese patients undergoing LC.\n\nThis systematic review and meta-analysis was performed with adherence to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidance.[15] A study protocol was prospectively registered on PROSPERO (CRD42022374610).\n\nA systematic search through the pre-existing medical literature was performed regarding VLCD before cholecystectomy. The search was performed on four online literature databases (PubMed, Embase, Medline and Cochrane Library archives). A specific search criterion was created and adjusted for each data archive. Medical Subject Headings and keywords were used for the purpose of the search. The search contained the following specific terminology: low calorie diet, liver shrinkage diet, very low energy diet, preoperative, pre-op and cholecystectomy. Boolean operators ‘AND’ and ‘OR’ were incorporated into the search to capture a comprehensive overview of the published literature. The grey literature was hand searched in addition to the reference lists of the included and excluded literature to identify additional relevant studies. Studies that were non-English articles, non-full text or conference abstracts were excluded.\n\nAll studies were compared to the pre-defined inclusion and exclusion criteria by independent screening by two authors (DH and ME). Following an abstract screen, a full-text screen was subsequently performed, and if the article was deemed appropriate, it was subsequently included in the study. Any data collection discrepancies were resolved by a consensus discussion. The following data were collected from all studies: study design and methodology, nature of dietary intervention, patient demographics and pre-defined outcomes (weight loss, operative time, ease of surgery/dissection/exposure of Calot’s triangle). All included articles were assessed for risk of bias and methodological quality by using the Cochrane Collaboration’s tool.[16]\n\nThe primary outcome measure of this meta-analysis was determining the impact of pre-operative VLCD on the operative findings and dissection during LC in obese patients, specifically the reported ease of Calot’s triangle dissection. The secondary outcome measures were pre-operative weight loss, operative time and the effect of VLCD on liver steatosis. The reported mean difficulty score for Calot’s dissection was collected and used in the quantitative meta-analysis. For articles that did not report the mean score, the mean value was estimated from the reported median value using the described method by Wan et al.[17] If articles used opposite ordinal grading of intraoperative difficulty, online digitizer software was used to generate digital images of graphs before obtaining absolute patient numbers per reporting metric of difficulty to establish a consistent semi-qualitative scale. Review Manager (RevMan, version 5.4) platform and R Foundation Statistical software (R 3.6.3) were used to perform statistical analysis. A random-effects model was performed, and results were visualised through forest plots. I2 values were calculated to assess for heterogeneity amongst studies. An I2 value of >75% was deemed to be a high degree of heterogeneity, whereas an I2 value of 25%–57% and <25% was deemed moderate and low degrees of heterogeneity, respectively. Results were deemed to be of statistical significance when P < 0.05. An assessment of publication bias through funnel plot was not feasible as <10 articles were used within the meta-analysis.[18]\n\nFollowing a systematic search through the literature, a total of 77 papers were found. After screening against the pre-defined inclusion and exclusion criteria, only two articles were included in the systematic review and meta-analysis.[19,20]Figure 1 illustrates the PRISMA flow chart of the literature search. Both included studies were single-centre studies, conducted within the United Kingdom. The study design and characteristics are highlighted in Table 1. It should be highlighted that the patient inclusion criteria did differ between both studies, Burnand et al. included patients with a BMI >30 with symptomatic gallstones, whereas Jones et al. did not use a pre-defined BMI cut-off and only included patients with symptomatic gallstones.[19,20] Both studies utilised VLCD preoperatively; the VLCD described was a diet consisting of a calorific intake of 800 Kcal/day for 2 weeks before surgery.\n\nPreferred Reporting Items for Systematic Reviews and Meta-Analyses flow chart\n\nCharacteristics of included studies\n\nBoth included studies had a small overall number of patients included.[19,20] The demographics of the patients are highlighted in Table 2. Both studies had a female predominance in the patient population, with a median age ranging between 43.5 and 48 years of age. The median BMI reported did differ between both studies. Burnand et al. reported a median BMI of 33.6 and 34 in the control and VCLD cohorts, respectively.[19] However, a much lower median BMI (30.2) was reported overall by Jones et al.[20]\n\nThe reporting of outcomes differed between studies [Table 3]. Burnand et al. published results on quantifiable timing metrics of both surgery and time to discharge, in addition to ease of dissection. They reported that within the VLCD cohort, the median operative time was less (25 vs. 31 min) and the median length of stay post-procedure was shorter (8 vs. 10 h) when compared to the control cohort.[19] They also reported on intraoperative assessment of ease of Calot’s dissection, fundal retraction and liver displacement. While all three of the aforementioned surgical steps of LC were reported as easier within the VLCD cohort, only Calot’s dissection was statistically significant (P = 0.02). Jones et al. only reported intraoperative subjective assessment of perceived difficulty of dissection of Calot’s triangle, gall bladder bed dissection, degree of liver steatosis and overall technical difficulty.[20] They reported on three different cohorts of patients: overall VLCD-compliant and non-compliant patients, obese and non-obese patients and, finally, VLCD-compliant and non-compliant obese patients. Within the final cohort, they noted that both visualisation of Calot’s triangle and gall bladder bed dissection were much easier within the VLCD-compliant obese cohort, although not statistically significant (P > 0.05).[20]\n\nA meta-analysis of reported outcomes for ease of Calot’s dissection was performed [Table 4]. For all patients included in both studies, there was no statistical improvement in the ease of Calot’s dissection with pre-operative VLCD (P = 0.21) [Table 4]. A moderate degree of heterogeneity was observed amongst studies (I2 of 48%). A subsequent subgroup analysis was performed, only using the obese patients from the Jones et al.’s study.[20] In the obese patient cohort, pre-operative VLCD before cholecystectomy significantly improved the ease of Calot’s dissection (P = 0.01). A low degree of heterogeneity was noted in this analysis (I2 of 0%). A meta-analysis of pre-operative weight loss was performed. VLCD before cholecystectomy was associated with significantly higher pre-operative weight loss when compared to normal diet/standard of care alone (P < 0.01) with low heterogeneity across studies (I2 of 3%).\n\nMeta-analysis of primary and secondary outcomes\n\nThe obesity pandemic remains an ongoing health crisis that displays no evidence of a plateau in incidence. Obesity converts patients with uncomplicated diseases into high-risk patients both from an anaesthetic and surgical perspective.[21] Weight loss optimisation serves as a crucial intervention to manage an individual’s risk.[22]\n\nThe literature regarding VLCD before bariatric surgery displays a clear benefit.[14] Van Nieuwenhove et al. presented a multicentre randomised study of pre-operative VLCD before laparoscopic gastric bypass.[14] They demonstrated that there was an observed benefit both intraoperatively and postoperatively, with a reduced complication rate, with VLCD.[14] While evaluating the advantage of VLCD, studies should also report on complication rates. Complication rates serves as an important outcome measure and studies should not solely focus on operative time metrics (e.g., duration of surgery) for the purpose of their outcome analysis. While VLCD is frequently used before LC, the perceived benefit is often extrapolated from the wider literature, which is predominantly composed of studies looking at its use before reflux or bariatric surgery. Only two studies were identified specifically looking at its use before LC. This was the rationale for performing this meta-analysis to evaluate the evidence for VLCD before LC in obese patients.\n\nOf the two included articles, only one of which recorded complication rates.[19] Burnand et al. revealed no significant. Burnand et al. revealed no significant difference in complication rates between both cohorts.[19] However, they did not report or comment on bile duct injury. Given the low incidence rate of bile duct injury in general, using this as a sole outcome measure would be inappropriate; in addition, future prospective studies would require an exceptionally large number of patients to demonstrate a reduction in bile duct injury rates with VLCD. An alternative approach would be assessing complications in general and cholecystectomy-specific complications (bile duct injury and bile leak) as a hybrid outcome measure.\n\nVLCD induces several metabolic alterations that improve the resting physiology of both the cardiovascular and endocrine systems. What is yet to be determined is the optimal time frame duration for VLCD before surgery. Both articles in this systematic review and meta-analysis utilised 2 weeks of VLCD. Norén and Forssell evaluated the impact of 4 weeks of VLCD on metabolic health.[23] They demonstrated that with the extended diet timeframe, the fasting glucose, HbA1c, cholesterol and triglyceride serum levels all improved.[23] It is likely that a prolonged diet will produce more drastic results. However, there is a delicate equilibrium between the duration of VLCD and patient adherence to the diet. As illustrated in both included papers, patient adherence to strict VLCD varied. Failure to complete the full 2-week diet course would render the intervention purposeless. As such, patient compliance is essential. An interesting systematic review published by Romeijn et al. assessed different LCDs before bariatric surgery.[10] They reviewed both VLCD and LCD, where an LCD consisted of a daily calorific intake of 800–1200 kcal.[10] They concluded that pursuing an LCD for 2–4 weeks produced the optimal results. Through using a less intensive diet, this, in turn, may improve patient compliance rates.\n\nAn important effect of VLCD that is not reported in either study is its effect on liver volume. There is evolving evidence to suggest that VLCD induces a reduction in liver size.[24] González-Pérez et al. demonstrated that a VLCD can result in a detectable reduction in liver volumetry based on cross-sectional imaging.[25] While not directly addressed in either study, the reduction in liver volume may be the underlying mechanism that facilitates better exposure and subsequent dissection of Calot’s triangle.\n\nAs a sequela to the COVID pandemic, an increasing number of patients with delayed complex gallstone disease are being seen by acute surgical teams. The meta-analysis of the results from within this study would suggest that there is evidence for VLCD in the elective setting. One aspect that remains unclear is how does this translate to the acute setting, especially in the context of obese patients presenting with acute biliary pathology. Further research is required to determine whether obese patients in the acute setting would benefit from conservative management in the first instance, followed by an elective cooling period accompanied by VLCD to have a ‘cold’ cholecystectomy with improved exposure to Calot’s anatomy. This should serve as a research focus for future studies.\n\nThere are limitations to note within this systematic review and meta-analysis. The total number of included articles is limited. In addition, within these articles, there are also a relatively small number of patients included. Consequently, the overall patient population available for meta-analysis is relatively small, and this may subsequently impact the statistical validity and the power of the analysis. While it would be desirable to have multiple studies to include in the analysis, the systematic search of the literature identified a lack of published data on the topic. A meta-analysis of the results was pursued, given the low heterogeneity (I2 of <3%) of the desired patient population across both studies.[26] Both included studies are single institutional studies with subjective outcome measures, which raises the question of reproducibility in a multi-centre context. The reporting of outcome measures differed between studies and as such limited our ability to conduct multiple meta-analyses of outcomes of interest. No benefit to VLCD was observed in the entire patient cohort with regard to Calot’s dissection; however, this result was likely skewed because the study by Jones et al. included non-obese patients. Upon subgroup analysis on obese patients alone, a benefit was noted with easier Calot’s dissection. Neither study formally quantified liver volumetry following VLCD. Patient adherence to diet also varied, thus impacting the results.\n\nThe current medical literature regarding VLCD before LC is limited. The evidence is based on small single-centre studies alone. After acknowledging the limitations of the data, this meta-analysis would suggest that VLCD should be used routinely preoperatively for obese patients undergoing elective cholecystectomy. VLCD is a non-invasive, affordable and effective intervention that promotes pre-operative weight loss and reduction in liver volume and may help with intraoperative dissection of Calot’s triangle. Further research should focus on addressing the optimal time window for VCLD preoperatively combined with the degree of calorific restriction in both a prospective and multi-centre setting.\n\nThere are no conflicts of interest.","body_orig":"The published evidence regarding VLCD before cholecystectomy in obese patients is limited. After acknowledging the limitations of the data, VLCD is associated with a significantly higher rate of weight loss preoperatively and directly impacts the ease of intraoperative dissection of Calot’s triangle. Routine use of VLCD should be considered for all obese patients undergoing elective LC.\n\nThere is an increasing global prevalence of obesity.[1] In England, 26% of adults are obese.[2] Obesity increases the complexity of surgical intervention, can increase operative time and can be associated with worse outcomes.[3-5]\n\nLaparoscopic cholecystectomy (LC) is one of the most frequently performed surgical procedures worldwide.[6] Given that obesity is a well-recognised risk factor for gallstone disease, it is common to perform LC on overweight and obese patients.[3] In the UK, over 40% of patients undergoing cholecystectomy have a body mass index (BMI) of 30 kg/m2 and above.[7]\n\nObesity can increase the technical difficulty of any laparoscopic procedure – the increased abdominal wall adiposity can make access to the abdominal cavity challenging and provide resistance to port movement.[8] With regard to LC, as a consequence of the metabolic syndrome of obesity, the liver becomes steatotic and enlarged.[4] A combination of an enlarged, rigid, left hemi-liver can make a fundal retraction and subsequent visualisation of the structures in Calot’s triangle challenging.[5,8] A failure to expose Calot’s triangle and the subsequent acquisition of the critical view of safety is an acknowledged risk factor for bile duct injury.[9] Obesity may also result in increased rates of bleeding from the liver as a consequence of the friable nature of a steatotic liver.[10]\n\nRisk mitigation strategies for obese patients have become an important area of research focus. Emerging evidence from within the wider medical literature has demonstrated that a pre-operative very low-calorie diet (VLCD) is associated with improved surgical outcomes for obese patients when undergoing bariatric and other upper gastrointestinal surgery.[11] VLCD induces the mobilisation of liver glycogen stores and alters metabolic pathways in vivo.[12,13] This results in a quantifiable reduction in liver size and volume.[10] As a consequence, this enables improved visualisation of key anatomical landmarks and reduces complication rates.[14] Although widely used, the role of VLCD before LC in obese patients is unclear. The aim of this systematic review and meta-analysis was to evaluate whether routine use of VLCD should be considered for all obese patients undergoing LC.\n\nThis systematic review and meta-analysis was performed with adherence to the Preferred Reporting Items for Systematic Reviews and Meta-Analyses (PRISMA) guidance.[15] A study protocol was prospectively registered on PROSPERO (CRD42022374610).\n\nA systematic search through the pre-existing medical literature was performed regarding VLCD before cholecystectomy. The search was performed on four online literature databases (PubMed, Embase, Medline and Cochrane Library archives). A specific search criterion was created and adjusted for each data archive. Medical Subject Headings and keywords were used for the purpose of the search. The search contained the following specific terminology: low calorie diet, liver shrinkage diet, very low energy diet, preoperative, pre-op and cholecystectomy. Boolean operators ‘AND’ and ‘OR’ were incorporated into the search to capture a comprehensive overview of the published literature. The grey literature was hand searched in addition to the reference lists of the included and excluded literature to identify additional relevant studies. Studies that were non-English articles, non-full text or conference abstracts were excluded.\n\nAll studies were compared to the pre-defined inclusion and exclusion criteria by independent screening by two authors (DH and ME). Following an abstract screen, a full-text screen was subsequently performed, and if the article was deemed appropriate, it was subsequently included in the study. Any data collection discrepancies were resolved by a consensus discussion. The following data were collected from all studies: study design and methodology, nature of dietary intervention, patient demographics and pre-defined outcomes (weight loss, operative time, ease of surgery/dissection/exposure of Calot’s triangle). All included articles were assessed for risk of bias and methodological quality by using the Cochrane Collaboration’s tool.[16]\n\nThe primary outcome measure of this meta-analysis was determining the impact of pre-operative VLCD on the operative findings and dissection during LC in obese patients, specifically the reported ease of Calot’s triangle dissection. The secondary outcome measures were pre-operative weight loss, operative time and the effect of VLCD on liver steatosis. The reported mean difficulty score for Calot’s dissection was collected and used in the quantitative meta-analysis. For articles that did not report the mean score, the mean value was estimated from the reported median value using the described method by Wan et al.[17] If articles used opposite ordinal grading of intraoperative difficulty, online digitizer software was used to generate digital images of graphs before obtaining absolute patient numbers per reporting metric of difficulty to establish a consistent semi-qualitative scale. Review Manager (RevMan, version 5.4) platform and R Foundation Statistical software (R 3.6.3) were used to perform statistical analysis. A random-effects model was performed, and results were visualised through forest plots. I2 values were calculated to assess for heterogeneity amongst studies. An I2 value of >75% was deemed to be a high degree of heterogeneity, whereas an I2 value of 25%–57% and <25% was deemed moderate and low degrees of heterogeneity, respectively. Results were deemed to be of statistical significance when P < 0.05. An assessment of publication bias through funnel plot was not feasible as <10 articles were used within the meta-analysis.[18]\n\nFollowing a systematic search through the literature, a total of 77 papers were found. After screening against the pre-defined inclusion and exclusion criteria, only two articles were included in the systematic review and meta-analysis.[19,20]Figure 1 illustrates the PRISMA flow chart of the literature search. Both included studies were single-centre studies, conducted within the United Kingdom. The study design and characteristics are highlighted in Table 1. It should be highlighted that the patient inclusion criteria did differ between both studies, Burnand et al. included patients with a BMI >30 with symptomatic gallstones, whereas Jones et al. did not use a pre-defined BMI cut-off and only included patients with symptomatic gallstones.[19,20] Both studies utilised VLCD preoperatively; the VLCD described was a diet consisting of a calorific intake of 800 Kcal/day for 2 weeks before surgery.\n\nPreferred Reporting Items for Systematic Reviews and Meta-Analyses flow chart\n\nCharacteristics of included studies\n\nBoth included studies had a small overall number of patients included.[19,20] The demographics of the patients are highlighted in Table 2. Both studies had a female predominance in the patient population, with a median age ranging between 43.5 and 48 years of age. The median BMI reported did differ between both studies. Burnand et al. reported a median BMI of 33.6 and 34 in the control and VCLD cohorts, respectively.[19] However, a much lower median BMI (30.2) was reported overall by Jones et al.[20]\n\nThe reporting of outcomes differed between studies [Table 3]. Burnand et al. published results on quantifiable timing metrics of both surgery and time to discharge, in addition to ease of dissection. They reported that within the VLCD cohort, the median operative time was less (25 vs. 31 min) and the median length of stay po","translated":false},"4c00340dae223390":{"body":"1. Department of Cardiology, Shengjing Hospital of China Medical University, Shenyang, Liaoning, China\n\n2. Department of Oncology, Shengjing Hospital of China Medical University, Shenyang, Liaoning, China\n\n3. Department of Pediatrics, Shengjing Hospital of China Medical University, Shenyang, Liaoning, China\n\n4. Department of Ultrasound, Shengjing Hospital of China Medical University, Shenyang, Liaoning, China\n\n5. Department of Gastroenterology, First Affiliated Hospital of China Medical University, Shenyang, Liaoning, China\n\n6. Department of Gastroenterology, Shengjing Hospital of China Medical University, Shenyang, Liaoning, China\n\nThe incidence and mortality of colorectal cancer (CRC) have been markedly increasing worldwide, causing a tremendous burden to the healthcare system. Therefore, it is crucial to investigate the risk factors and pathogenesis of CRC. Cholecystectomy is a gold standard procedure for treating symptomatic cholelithiasis and gallstone diseases. The rhythm of bile acids entering the intestine is altered after cholecystectomy, which leads to metabolic disorders. Nonetheless, emerging evidence suggests that cholecystectomy might be associated with the development of CRC. It has been reported that alterations in bile acid metabolism and gut microbiota are the two main reasons. However, the potential mechanisms still need to be elucidated. In this review, we mainly discussed how bile acid metabolism, gut microbiota, and the interaction between the two factors influence the development of CRC. Subsequently, we summarized the underlying mechanisms of the alterations in bile acid metabolism after cholecystectomy including cellular level, molecular level, and signaling pathways. The potential mechanisms of the alterations on gut microbiota contain an imbalance of bile acid metabolism, cellular immune abnormality, acid-base imbalance, activation of cancer-related pathways, and induction of toxin, inflammation, and oxidative stress.\n\nColorectal cancer (CRC) is the third most malignancy worldwide for humans ( 1 – 3 ). The incidence and mortality of CRC are terrifyingly high. CRC accounts for over 9% of all cancers incidence ( 4 ). It has been estimated that approximately 53,200 deaths projected in 2020 ( 5 ) and 3.2 million new CRC cases projected in 2040 ( 6 ). CRC exerts a significant geographic difference, more common in the western developed countries ( 7 – 9 ). The incidence rate was 10-fold higher in the highest rate countries than that in the lowest rate countries ( 10 ). The incidence of CRC in China is 23.3 per 100,000 ( 11 ). In addition, the prevalence of CRC has been growing in the young individuals ( 12 – 14 ), contributing to substantial social and economic burden to the healthcare system ( 2 , 6 ). Therefore, it is essential to explore the risk factors and pathogenesis of CRC.\n\nSeveral etiologies have been implicated in the pathogenesis of CRC, including genetic susceptibility and environmental factors, such as consumption of tobacco and alcohol, inflammatory bowel disease (IBD), adenomatous polyps, family history, unhealthy diet, physical inactivity and obesity ( 8 , 15 – 17 ). Cholecystectomy is a standard procedure for treatment of symptomatic cholelithiasis and gallstone diseases. The number of this procedure has been increasing. It has been reported that approximately 800,000 cases of cholecystectomy are performed in the United States per year, and the number is also growing in China ( 18 , 19 ). In the past, cholecystectomy was deemed to be almost harmless. Nevertheless, an increasing body of evidence suggests that cholecystectomy might be associated with the development of CRC ( 20 – 25 ). Alterations of bile acid metabolism and gut microbiota have been demonstrated to play significant roles in CRC. However, the potential specific mechanisms are still unclear. Therefore, in the present study, we described the current knowledge on the association between cholecystectomy and CRC, and summarized the potential mechanisms.\n\nCRC is the third most common cause of cancer-related mortality worldwide ( 2 ), and is also the second most common cause of cancer mortality in the United States ( 26 ). It has estimated that more than 1.8 million cases were diagnosed and 881,000 deaths occurred in 2018, accounting for 1 in 10 cancer cases and deaths ( 11 ). More recently, over 1.9 million new cases were reported in 2020 ( 27 ). Globally, CRC incidence and mortality vary widely across countries, according to GLOBOCAN 2020 data ( 28 ). The incidence of CRC is higher in males than in females, and the trend is younger in recent years ( 12 – 14 ). In general, the incidence of proximal colon tumors is the highest, while that of distal colon tumors is the lowest, which is more common in the elderly. The incidence rates increased by 1 and 2% each year among the 50–64 age group and under 50 years of age, respectively ( 26 ). The population of CRC patients as a whole is rapidly getting younger as the declining incidence in the older population coincides with the increasing incidence in the younger population, causing huge burden on the healthcare system. It has been well-acknowledged that CRC is associated with several risk factors such as smoking, unhealthy diet, alcohol abuse, physical inactivity and obesity ( 15 , 16 , 29 ). Nevertheless, the risk factors and pathogenesis of CRC still need to be further explored.\n\nCholecystectomy is the most common procedure performed in biliary surgery. In most cases, the procedure is relatively standardized and the long-term results after surgery are satisfactory. Cholecystectomy can be performed in two main ways: a laparoscopic or a classic open operation technique. Compared to the classic way, the laparoscopic cholecystectomy is a relatively minimally invasive surgical procedure and has basically replaced the open technique for cholecystectomies since the early 1990s ( 30 ). Several advantages have made it a popular procedure over the past few decades, including a short hospital stay, quick return to normal activities, and reduced pain after surgery, more acceptable cosmetic results, less morbidity and less mortality ( 31 – 33 ). The reported short-term complications include postoperative bleeding, biliary leakage biliary peritonitis, subhepatic effusion or subphrenic abscess, postoperative jaundice, postoperative pancreatitis, residual common bile duct stones, and gastrointestinal fistula, and the long-term complications include bile duct stricture, recurrent common bile duct stones, biliary bleeding, post-cholecystectomy syndrome, residual overgrown bile duct syndrome, and increased incidence of CRC.\n\nA meta-analysis of 10 cohort studies described that there was an increased risk for colon cancer up to 30% higher than the non-cholecystectomized group ( 24 ). In addition, the study also observed a positive relationship between the female gender and CRC. Moreover, a previous study confirmed that patients who performed cholecystectomy presented a 108% higher risk of developing CRC than the common population. The male and female patients who underwent cholecystectomy were reported to have a 74 and 154% higher risk of CRC, respectively ( 23 ). Furthermore, age was also regarded as a risk factor for gastrointestinal cancers in patients with a history of cholecystectomy ( 23 ). The standardized incidence ratio (SIR) was highest in individuals between 40 and 49 years old, followed by those in their ages more than 80 years old ( 23 ). The reported median duration from cholecystectomy to the diagnosis of CRC was about 5–15 years or more ( 34 , 35 ). Additionally, the right colon is more prone to be affected by cholecystectomy. Giovaimucci et al. ( 34 ) believed that the proximal and distal colon is related to the different sources of embryos, and they present different sensitivity to carcinogens. The right colon is more sensitive to bile acids, probably due to the high amount of stool fluid in the right colon. Thomas et al. ( 36 ) believed that the concentration of secondary bile acids and the activity of 7α-dehydroxylase were higher in the right colon than in the left colon, and there were obvious differences in bile acid metabolism, leading to the susceptibility of CRC in the right colon after cholecystectomy.\n\nBile acids are the main components of bile and are synthesized in the hepatocytes via cytochrome P450-mediated oxidation of cholesterol ( 37 , 38 ). This process takes place through two biosynthetic pathways: the “classical” and an “alternative” pathway ( 39 ). During the “classical” pathway, three cholesterol hydroxylase enzymes cholesterol 7α-hydroxylase (CYP7A1), sterol 12α-hydroxylase (CYP8B1) and mitochondrial sterol 27-hydroxylase (CYP27A1) produce the primary bile acids cholic acid (CA) and chenodeoxycholic acid (CDCA) ( 40 , 41 ). The “alternative” pathway produces CDCA via the hydroxylation of the cholesterol side chain by CYP27A1, and the oxysterol intermediates are then formed by 7α-hydroxylation by CYP7B141 ( 40 ). Bile acids can be divided into free bile acids and conjugated bile acids according to their structures. Free bile acids include CA, deoxycholic acid (DCA), CDCA, and lithocholic acid (LCA). The free bile acids are combined with glycine or taurine respectively to form various corresponding conjugated bile acids, including glycocholic acid, taurocholic acid, glycochenodeoxycholic acid and taurochenodeoxycholic acid. Conjugated bile acids are more water-soluble and generally exist in the body as sodium salts, which are more stable than free bile acids. In addition, bile acids can be divided into primary and secondary bile acids according to their sources. Primary bile acids are synthesized directly from cholesterol in hepatocytes including CA and CDCA, while secondary bile acids are formed when primary bile acids are secreted into the intestine and undergo 7-α-hydroxylation by intestinal bacteria including DCA, LCA, ursodeoxycholic acid (UDCA), and tauroursodeoxycholic acid (TUDC). Bile acids are secreted through the tubular membrane into the bile and stored in the gallbladder. After the animal eats, the duodenum secretes cholecystokinin, which stimulates gallbladder contraction, thereby releasing bile acids into the small intestine. In the small intestine, conjugated bile acids specifically activate pancreatic lipases and enhance fat-soluble vitamins solubilization by creating mixed micelles of dietary lipids, sterols, and fat-soluble vitamins. Finally, about 95% bile acids are reabsorbed in the ileum and returned to the liver via the portal vein. However, approximately 5% bile acids escaping from intestinal reabsorption enter the colon, where they are further converted to secondary, more hydrophilic bile acids by the intestinal flora ( 40 , 42 , 43 ).\n\nUnder normal conditions, the gallbladder controls the rate and flow of bile into the intestine and enterohepatic circulation of bile acids, which plays a key role in regulating physiological homeostasis ( 44 ). However, the rhythm of bile acids entering the intestine is altered after cholecystectomy, which leads to metabolic disorders. The normal bile acid pool is the total amount of bile acids in the enterohepatic circulation, which is about 3 g and consists of 50% CA, 30% CDCA, 20% DCA and very small amounts of other bile acids. Previous studies showed that the bile acid reabsorption and enterohepatic circulation increase due to the sphincter of Oddi disorders after cholecystectomy ( 45 , 46 ). However, there is also small number of studies finding that the bile acid pool decreases or remains unchanged after cholecystectomy. For example, a previous study observed that the bile acid pool decreased by about 16% three months after cholecystectomy ( 47 ). Two animal experiments showed that the total bile acid pool decreased by about 40% two weeks after cholecystectomy, as well as the reduction of circadian rhythm ( 48 , 49 ). In addition, the total amount of bile acids remained essentially unchanged after five to eight years of cholecystectomy ( 46 ). The above findings suggest that the size of bile acid pool decreases in the short-term outcome after cholecystectomy, but there is no significant effect on the long-term outcome. Moreover, it has been confirmed that cholecystectomy increases the bacterial uncoupling and dehydroxylation of bile acids, thereby leading to the high proportion of secondary bile acids ( 44 ). Zhang et al. ( 48 ) demonstrated that the contents of DCA, LCA and their binding products with taurine were significantly increased in the ileum of mice after cholecystectomy, together with the increasing of fecal bile acid.\n\nNumerous experimental studies have confirmed the tumorigenic potential of bile acids, particularly the secondary bile acids DCA and lesser extent of the LCA ( 50 – 55 ). It is important to note that the bile acids are usually considered as tumor promoters rather than tumor inducers, because the changed bile acid concentrations depend on exposure to carcinogenic chemicals or genetic susceptibility ( 56 ). The carcinogenic effects of secondary bile acids on CRC are summarized in Table 1 .\n\nThe carcinogenic effects of secondary bile acids on CRC.\n\nCRC, colorectal cancer; GDCA, glycodeoxycholic acid; DCA, deoxycholic acid; DC, deoxycholic; LCA, lithocholic acid; CHRM3, cholinergic receptor muscarinic 3; EGFR, epidermal growth factor receptor; TGR5, G protein-coupled bile acid receptor 1; ERK, extracellular signal regulated kinases; MAPK, mitogen activated protein kinase; TR, thioredoxin reductase; MMP2, matrix metalloproteinase 2; IL, interleukin; STAT, signal transduction and transcriptional activator; COX-2, cyclooxygenase 2; EPHA2, EPH receptor A2; PKC, protein kinase C; CREB, cAMP response element binding protein; PI3K, phosphoInositide-3 kinase; IKKB, Ikappa B; NF-κB, nuclear factor kappa-B; MSK1, mitogen and stress-activated protein kinase 1; AP-1, activated protein-1; JNK, c-jun N-terminal kinase; MUC2, mucin 2, oligomeric mucus/gel-forming; uPAR, urokinase-type plasminogen activator receptor.\n\nDCA has been reported to enhance colonic epithelial and colon cancer cell proliferation and/or invasiveness ( 57 – 60 ), promotes dysplasia ( 61 ), and disrupts the cell monolayer integrity of intestinal cancer and precancerous cells, increases the production of pro-inflammatory cytokines ( 51 , 62 ), promotes cell cycle arrest ( 63 ), and activate intestinal stem cells and epithelial regeneration ( 64 ). In addition, DCA has been demonstrated to inhibit wound healing in wounded colonic epithelial monolayers by impairing cell migration ability ( 65 ). Interestingly, DCA exerts pro-apoptotic and anti-apoptotic effects on colon cells ( 66 ). It has been revealed that DCA could promote transition from adenoma to carcinoma and resist apoptosis ( 67 ), and also induce epithelial-mesenchymal transition (EMT) process, increase vasculogenic mimicry (VM) formation ( 68 ). Furthermore, DCA could help cancer cells to escape immune surveillance ( 69 ). Besides, DCA was found to cause a redistribution of cholesterol and decrease the fluidity of the membranes ( 70 ). As well, previous studies have confirmed that DCA could be converted into a powerful carcinogen 3-methylcholanthrene (3-MC) ( 71 ), and also regulate cell junction and increase intestinal permeability ( 72 ). Besides, DCA/LCA could increase drug resistance and induce colon carcinogenesis ( 73 ).\n\nWith respect to the molecular mechanism, DCA and/or LCA was reported to induce expressions of cyclooxygenase (COX)-2 promoter ( 74 ) by transactivation of the epidermal growth factor receptor (EGFR) in HCT116, H508 and SNU-C4 human colon cancer cell lines ( 17 , 75 ), promote the stable and translocated pronucellin entering the nucleus and stimulate the expression of uPA, urokinase-type plasminogen activator receptor (uPAR) and cyclin D1 in SW480 and LoVo cells ( 57 ), activate muscarinic receptor (MR) in H508 human colon cancer cells ( 76 ), increase the expression of matrix metalloproteases (MMPs) in H508 cells ( 77 ), inhibit the effect of microRNA (miR)-199a-5p and/or promote the expression of CDK2 associated cullin domain 1 (CAC1) in HCT-8 cells ( 78 ). These above processes were associated with proliferation and invasion of DCA. For the anti-apoptotic characteristics, DCA was shown to upregulate the expression of X-linked inhibitor of apoptosis protein (XIAP) in normal intestinal epithelial cells (IEC-6), while downregulate the expression of p53 in HCT116 cells ( 79 , 80 ). It is noted that Hu et al. suggested that DCA and/or LCA presented a dual role in modulating cell survival and death by regulating expression of Nur77 and intracellular location in HCT116 and HT29 colon cancer cells ( 81 ). Likewise, DCA was revealed to decrease the expression of human leukocyte antigen (HLA) class I antigens on the surface of HT29, SK-CO-l and SW1116 cells to help cancer cells to escape immune surveillance ( 69 ). As well, DCA was also described to prompt colonic epithelial cells HCoEpiC into becoming cancer stem cells (CSCs) ( 73 ), and form aberrant crypt foci (ACF) and high-grade dysplasia in AKR/J mice ( 82 ). Besides, DCA endorses the recruitment of tumor-associated macrophages (TAM) ( 83 ), decrease the levels of secretory antibodies of the type IgA (sIgA) and promotes polarization of M2 macrophages in APC min/+ mice ( 51 ). Interestingly, DCA has also been reported to cause genomic instability including heteroploidy, intrachromosomal instability and gene point mutations ( 84 ). The genomic instability appears via several mechanisms, comprising DNA oxidative damage, mitochondria damage, endoplasmic reticulum damage, micronucleus rate increase, disruption of mitosis, and mutations of chromosome aneuploidy ( 85 , 86 ). DCA-induced DNA oxidative damage is caused after long-term exposure to high concentrations of nitro DCA and oxidation, which can induce apoptosis or DNA damage. Long-term DNA damage leads to mutation and natural selection of mutant cells, and ultimately promotes the development of cancer cells ( 87 ). Moreover, DCA can cause abnormal functions of some DNA mismatch repair enzymes by inducing mutations, such as adenomatous polyposis coli (APC) and tumor protein p53 (TP53). Subsequently, the dysfunction of DNA mismatch repair causes genome microsatellite instability ( 88 ). Long-term exposure to a high concentration of secondary bile acids can generate reactive oxygen species (ROS), induce oxidative stress ( 89 ), active nitrogen species, and cause DNA damage in intestinal epithelial cells, leading to genomic instability and increase gene mutations ( 90 ). In contrast, LCA has been reported to promote CRC via promoting expression of MMP-2 in CaCo-2 cells ( 91 ), interleukin (IL)-8 in HCT116 cells ( 92 ), ATP binding cassette subfamily B member 1 (ABCB1), ATP binding cassette subfamily G member 2 (ABCG2) in HCoEpiC cells ( 73 ), and miR-21, and inhibition of PTEN in HCT116 cells ( 93 ). As well, LCA induces DNA single-strand breaks ( 94 ) and inhibits mammalian DNA polymerase β in rat colon epithelial cells ( 95 ).\n\nSeveral signaling pathways have been reported to be involved in the tumor-promoting effect of DCA on CRC. For example, DCA promotes CRC by activation of EGFR-mitogen activated protein kinase (MAPK), and induction of calcium in HT-29 cells ( 96 ) and signal transduction and transcriptional activator (STAT) 3 signaling pathways in HCT116 and HCA-7 cells ( 97 ). DCR facilitates proliferation and invasiveness through COX-2 in HT-29, Caco-2, HCA7, and HCT116 cells ( 98 ) and/or COX-2/prostaglandin E2 (PGE2) signaling pathway in human colonic fibroblasts CCD-18Co cells ( 99 ). In addition, DCA and/or LCA has been demonstrated to promote CRC by regulating Wnt/β-catenin signaling in SW480, LoVo, or HCoEpiC cells ( 57 , 73 ), activation of extracellular signal regulated kinases (ERK) 1/2 cascade in HCT116, DLD-1, and SW620 cells ( 100 ), protein kinase C (PKC) in Caco-2 cells ( 101 ), RhoA/Rho-kinase pathway in HCT-8/E11 and SRC transformed PCmsrc cells ( 102 ), EGFR/PKC/Ras/ERK/cAMP response element binding protein (CREB), phosphoInositide-3 kinase (PI3K)/Akt/IkappaB (IKKB)/nuclear factor kappa-B (NF-κB) and p38/mitogen and stress-activated protein kinase 1 (MSK1)/CREB pathways and inactivates c-jun N-terminal kinase (JNK)/c-Jun/activated protein-1 (AP-1) pathway ( 103 ) and p53 pathway ( 80 ). Moreover, DCA activates JNK 1/2, and AKT signaling pathways that result in selective resistance to apoptosis, angiogenesis, proliferation and oxidative stress ( 40 , 104 ). Furthermore, DCA is also reported to activate anti-apoptotic effect of NF-κB and induces IL-8 ( 105 ) and to upregulate MUC2 transcription via MAPK, PKC-dependent activation of AP-1 pathway in LiM6 cells ( 106 ). Meanwhile, LCA induces expression of uPAR and increases cell invasiveness via activation of ERK1/2 MAPK and AP-1 pathway in HT29 and SW620 cells ( 107 ) and inactivation of STAT3 and Src/EGFR pathways in HCT116 cells ( 92 , 108 , 109 ).\n\nThe intestinal flora is a great deal number and diversity of microbial species, which is the most significant micro-ecosystem in the human body. It has been estimated that approximately more than 500 species of bacteria from 30 genera exist in healthy adult intestines ( 110 ). These bacteria are composed of aerobes, facultative anaerobes and anaerobes, and most of them are obligate anaerobes or facultative anaerobes. Among the bacteria, 90% of the intestinal flora is Bacteroidetes and Firmicutes ( 111 ). The intestinal flora is a significant contributor in several physiological activities, such as food residue metabolism, micronutrient synthesis, primary bile acid metabolism, secondary bile acid synthesis, and immune response regulation ( 112 ). In addition, these bacteria is able to establish a biological barrier in the gut via space-occupying effect, nutrient competition, and some secreted metabolites ( 113 ), which can decrease low-grade inflammatory response in the body and maintain the integrity of the intestinal wall. Motivating the intestine to create an effective immune defense system can modulate the absorption and conversion of sugar and fat in the intestinal tract, subsequently ameliorate glucose tolerance and oxidative stress, and lower blood glucose ( 114 ). Therefore, the homeostasis of gut microbiota plays significant roles in maintaining human health ( 115 – 118 ). However, dysbiosis of intestinal flora is involved in a wide range of human diseases. A large of human and animal experiments has confirmed that the dysbiosis of gut microbiota shows cancer-promoting effects on gastrointestinal carcinogenesis, especially CRC ( 119 – 126 ).\n\nIt has been well-acknowledged that cholecystectomy induces tremendous changes in the composition and function of the gut microbiota. For example, previous studies confirmed that after cholecystectomy, the number of Bifidobacteria and Lactobacillus was significantly decreased, while the number of Enterococcus , Oscillospira , Escherichia coli , Bacteroidaceae and Bacteroidetes was significantly increased ( 127 – 131 ). A previous study demonstrated that 1 mmol/L of DCA can effectively inhibit the growth of Clostridium perfringens , Bacteroides fragilis , Lactobacillus and Bifidobacterium in the intestinal tract ( 132 ). In addition, Cao et al. found that DCA significantly upregulated the populations of opportunistic pathogens, including Ruminococcus , Escherichia-Shigella , Desulfovibrio , and Dorea . Moreover, they also confirmed that DCA significantly increased the levels of Clostridium and Escherichia-Shigella , but markedly decreased the abundance of Lactobacillus_gasseri and mostly butyrate-producing bacteria, such as Clostridium leptum Lachnospiraceae bacterium and Eubaterium coprostanoligenes ( 83 ). On the contrary, an animal research showed that the population level of Bacteroides was increased in the ceca of rats fed with DCA ( 133 ). The main potential mechanisms include imbalance of bile acid metabolism, cellular immune abnormality, acid-base imbalance, and activation of cancer-related pathways and induction of toxin, inflammation and oxidative stress.\n\nFibroblast growth factors (FGF) are cellular factors that are synthesized by the terminal epithelial cells of the ileum and are involved in the regulation of bile acid metabolism ( 134 ). The FGF19 or FGF15 is transported to the liver through the portal vein system to inhibit bile acid synthesis. A previous study showed that the levels of FGF19 mRNA in the epithelial tissues of the gallbladder were 250 times higher than that in the terminal ileal epithelium ( 135 ). After cholecystectomy, the balance of bile acid metabolism is disturbed as the expression of FGF19 decreases and the primary bile acid production increases, altering the bidirectional interaction between bile acid and intestinal flora ( 128 ). The continuous drainage of bile into the intestinal lumen continuously stimulates intestinal motility, which increases peristalsis and shortens the total intestinal transit time. The enterohepatic circulation of bile acid is accelerated and the production of secondary bile acids is increased. The hydrophobic nature of secondary bile acids increases their affinity for the phospholipid bilayer of the intestinal bacterial cell membrane, leading to cell membrane damage and bacterial lysis and death ( 70 ).\n\nThe mucosal epithelium of the gallbladder could synthesize surfactant protein D (SP-D) ( 136 ). The SP-D is excreted into the intestinal lumen with bile and facilitates the synthesis of intestinal T cells ( 137 ). Intestinal T cells are involved in the regulation of inflammatory responses in the intestine. After cholecystectomy, the lack of SP-D in the gallbladder drastically reduces the number of intestinal T cells and predisposes the intestinal tract to bacterial infection and dysbiosis ( 137 ). Gallbladder surface protein D can also inhibit the growth of Lactobacilli in the intestinal tract by directly binding to Lactobacilli to induce lysis of Lactobacilli ( 137 ). Although Lactobacillus is beneficial to the human body, its excessive growth can affect the growth of other bacteria in the intestinal tract, thus causing dysbiosis of the intestinal flora.\n\nSmall intestinal fluid is weakly alkaline, with a pH value of 8.0–9.0. Normal bile is weakly acidic, and its pulsatile secretion helps to create a good intestinal microbiological environment and maintain a stable pH value in the intestine. After cholecystectomy, alkaline bile is continuously secreted, which affects the pH balance in the intestine. The optimal pH values for the growth of Lactobacilli and Bifidobacteria are 5.5–6.0 and 6.5–7.0, respectively ( 138 ). Therefore, the increase in pH in the intestine inhibits the growth of beneficial bacteria such as Lactobacillus and Bifidobacterium , leading to dysbiosis.","body_orig":"1. Department of Cardiology, Shengjing Hospital of China Medical University, Shenyang, Liaoning, China\n\n2. Department of Oncology, Shengjing Hospital of China Medical University, Shenyang, Liaoning, China\n\n3. Department of Pediatrics, Shengjing Hospital of China Medical University, Shenyang, Liaoning, China\n\n4. Department of Ultrasound, Shengjing Hospital of China Medical University, Shenyang, Liaoning, China\n\n5. Department of Gastroenterology, First Affiliated Hospital of China Medical University, Shenyang, Liaoning, China\n\n6. Department of Gastroenterology, Shengjing Hospital of China Medical University, Shenyang, Liaoning, China\n\nThe incidence and mortality of colorectal cancer (CRC) have been markedly increasing worldwide, causing a tremendous burden to the healthcare system. Therefore, it is crucial to investigate the risk factors and pathogenesis of CRC. Cholecystectomy is a gold standard procedure for treating symptomatic cholelithiasis and gallstone diseases. The rhythm of bile acids entering the intestine is altered after cholecystectomy, which leads to metabolic disorders. Nonetheless, emerging evidence suggests that cholecystectomy might be associated with the development of CRC. It has been reported that alterations in bile acid metabolism and gut microbiota are the two main reasons. However, the potential mechanisms still need to be elucidated. In this review, we mainly discussed how bile acid metabolism, gut microbiota, and the interaction between the two factors influence the development of CRC. Subsequently, we summarized the underlying mechanisms of the alterations in bile acid metabolism after cholecystectomy including cellular level, molecular level, and signaling pathways. The potential mechanisms of the alterations on gut microbiota contain an imbalance of bile acid metabolism, cellular immune abnormality, acid-base imbalance, activation of cancer-related pathways, and induction of toxin, inflammation, and oxidative stress.\n\nColorectal cancer (CRC) is the third most malignancy worldwide for humans ( 1 – 3 ). The incidence and mortality of CRC are terrifyingly high. CRC accounts for over 9% of all cancers incidence ( 4 ). It has been estimated that approximately 53,200 deaths projected in 2020 ( 5 ) and 3.2 million new CRC cases projected in 2040 ( 6 ). CRC exerts a significant geographic difference, more common in the western developed countries ( 7 – 9 ). The incidence rate was 10-fold higher in the highest rate countries than that in the lowest rate countries ( 10 ). The incidence of CRC in China is 23.3 per 100,000 ( 11 ). In addition, the prevalence of CRC has been growing in the young individuals ( 12 – 14 ), contributing to substantial social and economic burden to the healthcare system ( 2 , 6 ). Therefore, it is essential to explore the risk factors and pathogenesis of CRC.\n\nSeveral etiologies have been implicated in the pathogenesis of CRC, including genetic susceptibility and environmental factors, such as consumption of tobacco and alcohol, inflammatory bowel disease (IBD), adenomatous polyps, family history, unhealthy diet, physical inactivity and obesity ( 8 , 15 – 17 ). Cholecystectomy is a standard procedure for treatment of symptomatic cholelithiasis and gallstone diseases. The number of this procedure has been increasing. It has been reported that approximately 800,000 cases of cholecystectomy are performed in the United States per year, and the number is also growing in China ( 18 , 19 ). In the past, cholecystectomy was deemed to be almost harmless. Nevertheless, an increasing body of evidence suggests that cholecystectomy might be associated with the development of CRC ( 20 – 25 ). Alterations of bile acid metabolism and gut microbiota have been demonstrated to play significant roles in CRC. However, the potential specific mechanisms are still unclear. Therefore, in the present study, we described the current knowledge on the association between cholecystectomy and CRC, and summarized the potential mechanisms.\n\nCRC is the third most common cause of cancer-related mortality worldwide ( 2 ), and is also the second most common cause of cancer mortality in the United States ( 26 ). It has estimated that more than 1.8 million cases were diagnosed and 881,000 deaths occurred in 2018, accounting for 1 in 10 cancer cases and deaths ( 11 ). More recently, over 1.9 million new cases were reported in 2020 ( 27 ). Globally, CRC incidence and mortality vary widely across countries, according to GLOBOCAN 2020 data ( 28 ). The incidence of CRC is higher in males than in females, and the trend is younger in recent years ( 12 – 14 ). In general, the incidence of proximal colon tumors is the highest, while that of distal colon tumors is the lowest, which is more common in the elderly. The incidence rates increased by 1 and 2% each year among the 50–64 age group and under 50 years of age, respectively ( 26 ). The population of CRC patients as a whole is rapidly getting younger as the declining incidence in the older population coincides with the increasing incidence in the younger population, causing huge burden on the healthcare system. It has been well-acknowledged that CRC is associated with several risk factors such as smoking, unhealthy diet, alcohol abuse, physical inactivity and obesity ( 15 , 16 , 29 ). Nevertheless, the risk factors and pathogenesis of CRC still need to be further explored.\n\nCholecystectomy is the most common procedure performed in biliary surgery. In most cases, the procedure is relatively standardized and the long-term results after surgery are satisfactory. Cholecystectomy can be performed in two main ways: a laparoscopic or a classic open operation technique. Compared to the classic way, the laparoscopic cholecystectomy is a relatively minimally invasive surgical procedure and has basically replaced the open technique for cholecystectomies since the early 1990s ( 30 ). Several advantages have made it a popular procedure over the past few decades, including a short hospital stay, quick return to normal activities, and reduced pain after surgery, more acceptable cosmetic results, less morbidity and less mortality ( 31 – 33 ). The reported short-term complications include postoperative bleeding, biliary leakage biliary peritonitis, subhepatic effusion or subphrenic abscess, postoperative jaundice, postoperative pancreatitis, residual common bile duct stones, and gastrointestinal fistula, and the long-term complications include bile duct stricture, recurrent common bile duct stones, biliary bleeding, post-cholecystectomy syndrome, residual overgrown bile duct syndrome, and increased incidence of CRC.\n\nA meta-analysis of 10 cohort studies described that there was an increased risk for colon cancer up to 30% higher than the non-cholecystectomized group ( 24 ). In addition, the study also observed a positive relationship between the female gender and CRC. Moreover, a previous study confirmed that patients who performed cholecystectomy presented a 108% higher risk of developing CRC than the common population. The male and female patients who underwent cholecystectomy were reported to have a 74 and 154% higher risk of CRC, respectively ( 23 ). Furthermore, age was also regarded as a risk factor for gastrointestinal cancers in patients with a history of cholecystectomy ( 23 ). The standardized incidence ratio (SIR) was highest in individuals between 40 and 49 years old, followed by those in their ages more than 80 years old ( 23 ). The reported median duration from cholecystectomy to the diagnosis of CRC was about 5–15 years or more ( 34 , 35 ). Additionally, the right colon is more prone to be affected by cholecystectomy. Giovaimucci et al. ( 34 ) believed that the proximal and distal colon is related to the different sources of embryos, and they present different sensitivity to carcinogens. The right colon is more sensitive to bile acids, probably due to the high amount of stool fluid in the right colon. ","translated":false},"e4e6a4dceca1a5e4":{"body":"Ali RB, Cahill RA, Watson RG (2004) Weight gain after laparoscopic cholecystectomy. Ir J Med Sci 173:9–12\n\nAl-Khaifi A, Straniero S, Voronova V, Chernikova D, Sokolov V, Kumar C, Angelin B, Rudling M (2018) Asynchronous rhythms of circulating conjugated and unconjugated bile acids in the modulation of human metabolism. J Intern Med 284:546–559\n\nAlvarez-Sola G, Uriarte I, Latasa MU, Fernandez-Barrena MG, Urtasun R, Elizalde M, Barcena-Varela M, Jimenez M, Chang HC, Barbero R, Catalan V, Rodriguez A, Fruhbeck G, Gallego-Escuredo JM, Gavalda-Navarro A, Villarroya F, Rodriguez-Ortigosa CM, Corrales FJ, Prieto J, Berraondo P, Berasain C, Avila MA (2017) Fibroblast growth factor 15/19 (FGF15/19) protects from diet-induced hepatic steatosis: development of an FGF19-based chimeric molecule to promote fatty liver regeneration. Gut 66:1818–1828\n\nAmigo L, Husche C, Zanlungo S, Lutjohann D, Arrese M, Miquel JF, Rigotti A, Nervi F (2011) Cholecystectomy increases hepatic triglyceride content and very-low-density lipoproteins production in mice. Liver Int 31:52–64\n\nBarrera F, Azocar L, Molina H, Schalper KA, Ocares M, Liberona J, Villarroel L, Pimentel F, Perez-Ayuso RM, Nervi F, Groen AK, Miquel JF (2015) Effect of cholecystectomy on bile acid synthesis and circulating levels of fibroblast growth factor 19. Ann Hepatol 14:710–721\n\nBoursier J, Mueller O, Barret M, Machado M, Fizanne L, Araujo-Perez F, Guy CD, Seed PC, Rawls JF, David LA, Hunault G, Oberti F, Cales P, Diehl AM (2016) The severity of nonalcoholic fatty liver disease is associated with gut dysbiosis and shift in the metabolic function of the gut microbiota. Hepatology 63:764–775\n\nBrandl K, Schnabl B (2017) Intestinal microbiota and nonalcoholic steatohepatitis. Curr Opin Gastroenterol 33:128–133\n\nChalasani N, Younossi Z, Lavine JE, Diehl AM, Brunt EM, Cusi K, Charlton M, Sanyal AJ (2012) The diagnosis and management of non-alcoholic fatty liver disease: practice guideline by the American Gastroenterological Association, American Association for the Study of Liver Diseases, and American College of Gastroenterology. Gastroenterology 142:1592–1609\n\nChavez-Tapia NC, Kinney-Novelo IM, Sifuentes-Renteria SE, Torres-Zavala M, Castro-Gastelum G, Sanchez-Lara K, Paulin-Saucedo C, Uribe M, Mendez-Sanchez N (2012) Association between cholecystectomy for gallstone disease and risk factors for cardiovascular disease. Ann Hepatol 11:85–89\n\nCorkey BE, Shirihai O (2012) Metabolic master regulators: sharing information among multiple systems. Trends Endocrinol Metab 23:594–601\n\nCortes V, Amigo L, Zanlungo S, Galgani J, Robledo F, Arrese M, Bozinovic F, Nervi F (2015) Metabolic effects of cholecystectomy: gallbladder ablation increases basal meta  and meta-analysis. Dig Dis Sci 61:2389–2396","translated":false}},"ai":{"category":"ai","label":"前沿 AI","items":[{"id":"bec3e94618eb8a8b","title":"生成式 AI 过度美化现实","title_zh":"","title_orig":"","summary":"生成式 AI 如 ChatGPT 正融入日常生活，成为人们获取信息和辅助决策的重要工具。然而大模型中嵌入的错误信息和偏见引发了一系列伦理方面的担忧。以往的研究已揭示出 AI 在涉及人类特征的内容上存在偏见，例如肤色、性别以及地理文化背景等。为减轻文本生成图像（Text-to-Image）生成式模型中的偏见，OpenAI 等公司引入了提示词修订（Prompt Revision）机制。一种隐性的处理过程，即通过重写用户输入的提示词，添加更多细节，例如要求图像中呈现不同性别和肤色的人物，从而促进图像的多样性。然而重写用户提示词也可能引入其他偏见，在用户不知情下改变其原本的意图。发表在《Technology in Society》上的一项研究以集约化畜牧业（Intensive Livestock Farming）为例，首次提供证据表明，OpenAI 的文本生成图像模型 DALL-E 3 会通过提示词修订机制，抹去具有争议性议题的真实面貌。DALL-E 3 表现出一种明显的偏见，即倾向于将畜牧业浪漫化、美化。它生成的图像通常描绘奶牛在牧场上吃草、猪在泥地里拱土。即使研究人员明确要求生成真实的场景，这种偏见依然存在。当研究人员关闭提示词修订功能后，生成的图像便更加接近现代畜牧业的实际饲养方式，即将农场动物饲养在室内。研究人员要求模型生成北美、欧洲和大洋洲农场的图像。结果发现，无论指定哪个地区，模型生成的图像大多呈现田园牧歌式的场景在关闭提示词修订功能后，不同地区之间的差异开始显现。通过提示词修订机制将畜牧业浪漫化，掩盖其真实状况，可能会进一步强化公众对于农场动物饲养方式的错误认知，甚至传播","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85847","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794308672.0,"tags":["大模型"],"score":102.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"23d9d2ec66d087bd","title":"AI人工智能ETF平安(512930)标的指数涨超1.2%，CPO概念集体爆发","title_zh":"","title_orig":"","summary":"截至2026年11月11日 11:20，AI人工智能ETF平安(512930)标的指数中证人工智能主题指数(930713)强势上涨1.26%，成分股新易盛上涨9.82%，中际旭创上涨9.13%，光迅科技上涨5.29%。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15319810.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794368049.0,"tags":[],"score":100.5,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"f28f90d2895a812c","title":"Gilbert + Tobin rethinks the business of law with AI","title_zh":"Gilbert + Tobin借助人工智能重新思考法律业务","title_orig":"Gilbert + Tobin rethinks the business of law with AI","summary":"A conversation with Sam Nickless, Partner and Chief Executive Officer at Gilbert
