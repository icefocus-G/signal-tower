供免费的实用ChatGPT研讨会，帮助他们在日常生活中培养实用的人工智能技能。","summary_orig":"OpenAI Academy is bringing free, hands-on ChatGPT workshops to caregivers in five U.S. cities, helping them build practical AI skills for everyday life.","url":"https://openai.com/index/helping-caregivers-use-ai-in-everyday-life","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794312000.0,"tags":["大模型"],"score":94.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"508a465c2ee7ad9c","title":"南方基金旗下创业板人工智能ETF南方(159382)标的指数反复活跃涨超2%，AI算力侧投资加码驱动光通信净利延续高增","title_zh":"","title_orig":"","summary":"截至2026年11月11日 11:10，创业板人工智能ETF南方(159382)盘中换手5.61%，成交8536.73万元，跟踪指数创业板人工智能指数(970070)强势上涨2.19%。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15319797.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794368059.0,"tags":["芯片算力"],"score":95.5,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"86b7b41309e7b8e9","title":"高盛限制交易员和银行家使用第三方 AI 智能体","title_zh":"","title_orig":"","summary":"高盛限制交易员和银行家使用 Anthropic 的 Claude Code 和微软的 GitHub，此举主要是出于风险方面的考虑。AI 编程工具主要提供给软件工程师，以及负责交易、量化研究和软件工程等的策略师。交易员将无法再使用这些工具监控客户交易流、模拟市场走势和持仓，以及制作文字和图表。此次限制适用于能独立编写和运行代码的第三方智能体。以 Claude Code 为例，它能读取文件、编写程序并运行，通常拥有与使用者相同的权限。工程师用此类工具编写的代码通常会经过审查、测试和部署控制，然后才会投入使用。交易员编写的脚本则可能未经任何审查就被投入日常使用。使用智能体模拟仓位的交易员不太可能了解代码如何处理异常情况，在交易台上这可能意味着损失。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85838","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794222261.0,"tags":["大模型","智能体"],"score":94.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"5ca4dc7b6d88cb31","title":"Introducing Businesses in ChatGPT","title_zh":"在ChatGPT中介绍企业","title_orig":"Introducing Businesses in ChatGPT","summary":"Manage your business information, get insights about how your business shows up, and turn interest into action in ChatGPT.","summary_zh":"管理您的业务信息，深入了解您的业务展示方式，并在ChatGPT中将兴趣转化为行动。","summary_orig":"Manage your business information, get insights about how your business shows up, and turn interest into action in ChatGPT.","url":"https://openai.com/index/introducing-businesses-chatgpt","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794304800.0,"tags":["大模型"],"score":94.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"01a8528fa117926a","title":"Closing the AI guidance gap in education","title_zh":"缩小教育领域的人工智能指导差距","title_orig":"Closing the AI guidance gap in education","summary":"New ThinkYoung research and lessons from OpenAI’s EMEA education partnerships on supporting teachers, AI literacy, and independent learning.","summary_zh":"新的ThinkYoung研究和OpenAI在支持教师、人工智能素养和自主学习方面的EMEA教育合作伙伴关系的经验教训。","summary_orig":"New ThinkYoung research and lessons from OpenAI’s EMEA education partnerships on supporting teachers, AI literacy, and independent learning.","url":"https://openai.com/index/closing-ai-guidance-gap-education","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794301200.0,"tags":[],"score":94.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"571fb0494bf3f24f","title":"OpenAI acquires Odessia, travel startup created by Sonder founder","title_zh":"OpenAI收购由Sonder创始人创建的旅游创业公司Odessia","title_orig":"OpenAI acquires Odessia, travel startup created by Sonder founder","summary":"OpenAI has not yet said what its plans are for the future of travel. But Sonder founder Francis Davidson is a well-known figure in the travel industry.","summary_zh":"OpenAI尚未说明其对未来旅行的计划。但Sonder创始人弗朗西斯·戴维森（Francis Davidson）是旅游业的知名人物。","summary_orig":"OpenAI has not yet said what its plans are for the future of travel. But Sonder founder Francis Davidson is a well-known figure in the travel industry.","url":"https://techcrunch.com/2026/11/10/openai-acquires-odessia-travel-startup-created-by-sonder-founder/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794344932.0,"tags":[],"score":90.0,"translated":true,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"868a67cda63cc6a2","title":"全国产化算力底座：龙芯智能机器车实现深度视觉与目标抓取，由龙芯 2K3000 统一调度","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，龙芯中科昨日宣布，基于自研智能机器车完成 ROS2 Jazzy 版本的全栈移植，贯通建图定位、手柄遥控、机械臂控制与深度视觉的完整链路。整车由龙芯 2K3000 处理器统一调度，具备环境感知与目标抓取能力。\n\nROS2（IT之家注：机器人操作系统第二版，Robot Operating System 2，机器人领域主流的开源中间件框架）凭借跨平台与分布式通信特性，将传感器、算法与执行器连成可复用的网络。本次全栈移植验证形成了一套可复用的国产机器人开发方案。\n\n其核心算力来自龙芯 2K3000。该芯片采用 12nm 制程，集成 8 个基于自主龙架构的 LA364E 处理器核心，主频最高 2.5GHz。缓存配置为一级指令与数据缓存各 64KB，二级缓存共享 6MB。\n龙芯方面披露，其单核性能可对标 ARM Cortex-A76 级别处理器，实测 SPEC CPU 2006 Base 单核定点分值达到 30 分。\n\n感知系统分为两条链路。车身侧置激光雷达负责平面感知，机械臂末端的深度相机负责三维深度感知。龙芯针对室内场景完成参数校调，配合里程计互补，提升定位稳定性与建图完整度。\n底盘控制方面，小车搭载麦克纳姆轮，通过组合四个电机转速，实现前后、横移、旋转与斜向的全向运动。主控板直插 USB 手柄，龙芯自研程序将摇杆量翻译为速度指令，并设有死区过滤与安全使能键。\n龙芯方面表示，后续将补齐急停与看门狗功能，将动作组接入上层程序，并推进检测与点云融合的三维目标定位。从建图定位到机械臂抓取的完整链路，验证了龙芯 2K3000 在机器人运算处理与实时控制场景中的","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/330.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794368286.0,"tags":["芯片算力","具身智能","开源"],"score":91.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"6fcd75d626ddcf98","title":"PSI is trying to make a business out of AI-driven scientific discovery","title_zh":"PSI正试图利用人工智能驱动的科学发现做生意","title_orig":"PSI is trying to make a business out of AI-driven scientific discovery","summary":"PSI used an unreleased Anthropic model to answer a fundamental question about quantum computing that scientists have pursued for nearly two decades.","summary_zh":"PSI使用了一个未发布的人类模型来回答科学家们近二十年来一直追求的关于量子计算的一个基本问题。","summary_orig":"PSI used an unreleased Anthropic model to answer a fundamental question about quantum computing that scientists have pursued for nearly two decades.","url":"https://techcrunch.com/2026/11/10/psi-is-trying-to-make-a-business-out-of-ai-driven-scientific-discovery/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794337432.0,"tags":[],"score":90.0,"translated":true,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"d3066b7d90e37859","title":"Anthropic估值缩水，压力给到国内大模型公司","title_zh":"","title_orig":"","summary":"从2万亿美元到1万亿美元，全球AI估值体系正在经历一次现实检验。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15319890.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794369541.0,"tags":["大模型","融资并购"],"score":92.5,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"802ed492622a1ffd","title":"谷歌本月开放 3 个顶级域名注册：吃饭用 .eat、出行用 .fly、办事用 .here","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，谷歌昨日（11 月 10 日）发布公告，宣布旗下域名注册管理机构 Google Registry 推出 .eat、.fly 和 .here 三款顶级域名，为企业和个人提供新的网址后缀选择。\nIT之家援引博文介绍，上述 3 款顶级域名各有应用侧重，其中 .eat 围绕餐饮和食品业务展开，鸡翅连锁品牌 Wingstop 已使用 wingstop.eat，制作新鲜沙拉和餐食的机器人自助售餐服务 Xook 也已采用 xook.eat。\n.fly 的应用涵盖旅行、无人机及科技服务，例如 AI 旅行助手 Caddy 使用 caddy.fly，电力线路巡检无人机企业 Voltair 使用 voltair.fly。\n.here 则突出“在这里办事”的表达。房地产平台 Zillow 使用 rent.here 和 sell.here，分别对应租房与卖房；此外，谷歌还展示了法律服务网站 lawyer.here、求职平台 apply.here，以及居家血液检测服务网站 bloodtest.here。\n\n注册方面，三款后缀已进入抢先注册阶段，用户可通过域名注册商购买尚可注册的域名，但需支付一笔一次性额外费用（在全面开放注册前每日递减）。\n协调世界时 11 月 17 日 16 点（北京时间 11 月 18 日零时）起，三款后缀将全面开放注册，按基础年费收费，不再收取上述抢先注册附加费。","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/298.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794362522.0,"tags":["具身智能"],"score":91.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"97c5f109dd6ca8ff","title":"LLMs Play Zachtronics' TIS-100","title_zh":"LLM玩Zachtronics的TIS-100","title_orig":"LLMs Play Zachtronics' TIS-100","summary":"Article URL: https://tis-100.wincon.dev/\n\nComments URL: https:// ":"","title_orig":"","summary":"修复了一些bug，优化了效果。 有时候我们总想多做点什么，告诉LLM要怎么做，最后发现，什么都不说，让LLM自行判断才是最好的。说的越多，越容易带偏。 佛家说，放下自己的执着。 道家讲无为，或许对LLM会很适用。无为，就是让LLM自己判断，不做过多的干涉和引导。 软件简介 OwnCode 是一款面向开发者的桌面端 AI 编程工具...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503518","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794330820.0,"tags":["大模型"],"score":87.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"9922bcaa36cd876a","title":"Nvidia CEO Jensen Huang’s affair with alleged Chinese spy: a timeline","title_zh":"英伟达首席执行官Jensen Huang与涉嫌中国间谍的婚外情：时间表","title_orig":"Nvidia CEO Jensen Huang’s affair with alleged Chinese spy: a timeline","summary":"The affair could have ramifications for national security as the U.S. and China race to develop the most advanced AI infrastructure.","summary_zh":"随着美国和中国竞相开发最先进的人工智能基础设施，这一事件可能会对国家安全产生影响。","summary_orig":"The affair could have ramifications for national security as the U.S. and China race to develop the most advanced AI infrastructure.","url":"https://techcrunch.com/2026/11/10/nvidia-ceo-jensen-huangs-affair-with-alleged-chinese-spy-a-timeline/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794330259.0,"tags":["芯片算力"],"score":90.0,"translated":true,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"578c3223ec50a9c7","title":"Day-0 支持：摩尔线程完成 MiniMax H3-Image 图像生成模型适配","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，摩尔线程今天宣布，公司旗下 AI 训推一体智算卡 MTT S5000 及 MUSA 软件栈，已在昨天（开源当日）适配 MiniMax 图像生成模型 H3-Image。\n\n▲ MiniMax H3-Image 在单张 MTT S5000 上的生成效果IT之家了解到，MiniMax H3-Image 是一款衍生自 H3 的图像生成模型，具备文本生成图像、图像参考和图像编辑能力。它可在 10 秒内生成一张 4096 × 4096 像素、约 16MP（4K）的高分辨率图像，速度可达市面主流水平的 5 倍，同时呈现丰富、真实的细节，并具备优秀的指令遵循和多参考图理解能力。\n针对 MiniMax H3-Image 的核心能力特征，摩尔线程基于 MTT S5000 进行全链路适配和深度优化：\n扩散类生图与编辑模型注意力机制开销较大，Attention 占比高，尤其在多参考图输入的场景下 Key / Value 膨胀明显，参考图越多开销上升越快。MTT S5000 凭借高算力密度，可从容承接此类模型在理解与高分辨率生成过程中的高计算负载，充分释放 MiniMax H3-Image 的效能。\n\n摩尔线程此前已在 MiniMax H3 模型上，完成了 Attention、GEMM 等核心算子，以及通信与运行时等底层基础设施建设。此次面对 MiniMax H3-Image，团队结合视觉生成模型优化经验，复用 SGLang、MATE、MCCL 等成熟组件能力完成适配，同时也为后续更多生图、生视频模型的 Day-0 适配奠定了基础。","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/296.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794362183.0,"tags":["多模态","开源"],"score":91.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"f7afa1dd4ce8d146","title":"After 7 months, Glasswing overwelms maintainers with underwhelming findings","title_zh":"7个月后， Glasswing以令人印象深刻的发现淹没了维护人员","title_orig":"After 7 months, Glasswing overwelms maintainers with underwhelming findings","summary":"Article URL: https://www.vulncheck.com/blog/anthropic-glasswing-november-update\n\nComments URL: https://news.ycombinator.com/item?id=50447074\n\nPoints: 344\n\n# Comments: 154","summary_zh":"文章网址： https://www.vulncheck.com/blog/anthropic-glasswing-november-update\n\n评论网址： https://news.ycombinator.com/item?id=50447074\n\n积分： 344\n\n#评论： 154","summary_orig":"Article URL: https://www.vulncheck.com/blog/anthropic-glasswing-november-update\n\nComments URL: https://news.ycombinator.com/item?id=50447074\n\nPoints: 344\n\n# Comments: 154","url":"https://www.vulncheck.com/blog/anthropic-glasswing-november-update","source":"Hacker News","source_id":"hn","category":"ai","lang":"en","published":1794349076.0,"tags":[],"score":87.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"8edd1ca04d0c9de0","title":"成都第五代贡嘎人形机器人发布，宣称拥有“全球最领先人形机器人大脑核心技术”","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，成都人形机器人创新中心今日发布了第五代贡嘎人形机器人，宣称拥有“全球最领先人形机器人大脑核心技术”。\n\n作为成都人形机器人创新中心具身智能大脑技术的集大成之作，五代贡嘎搭载自研一体化具身智能系统，在场景感知、时空记忆、因果推理规划、动作世界模型等核心模块完成系统性迭代，宣称“代表当前全球第一梯队的人形机器人大脑技术最高水平”。\n五代贡嘎的具身大脑打通了“结构化感知 — 时空记忆 — 因果规划 — 动作推演 — 执行反馈”完整技术链路，实现环境认知、记忆更新、任务规划与操作执行的端到端协同。\n\n在环境感知维度，机器人融合 RGB 视觉、深度信息与本体位姿数据，构建层次化三维场景图。依托跨视角实体关联、语义关系建模与增量式场景更新机制，持续对动态家庭空间做结构化表征，能够稳定识别物品位置、类别、摆放关系，适应居家环境里物品移位、杂物新增这类高频变化。\n\n在记忆体系上，创新中心自研的物理时空记忆引擎，将空间坐标、物体物理状态、时间演化规律、历史交互经验统一存储管理。机器人可以长期维护物体身份一致性，支持时序记忆检索、多轮记忆对齐与冲突自动消解；简单来说，它能“记住”东西之前放在哪里、什么时候被挪动过、过往操作的成败经验，摆脱传统机器人单次任务无记忆的短板，支撑跨时长、分多天的长程家庭任务。\n\n决策规划模块引入因果关联推理框架，不再只依靠数据统计关联做动作选择。系统自动解析任务内的因果依赖、动作前置条件、预期执行效果以及机器人自身资源约束，自主完成层次化任务拆解；当环境突发变动、任务受阻时可实时动态重规划，遇到意外情况自主判断、调整方案，而不是简单停止","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/295.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794362054.0,"tags":["具身智能"],"score":91.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"772cb837d369489d","title":"基于 AgentKit 重塑研发协作：从编码提效到组织效能跃迁｜AICon北京","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/I49cXCJFBpOW3PcgPTW3?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794391200.0,"tags":["智能体"],"score":85.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"451bc7905d5856e1","title":"上海市新增6款已完成备案的生成式人工智能服务","title_zh":"","title_orig":"","summary":"11月11日，据“网信上海”微信公众号消息，截至11月11日，上海市新增6款已完成备案的生成式人工智能服务，累计已完成213款生成式人工智能服务备案。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15320070.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794370037.0,"tags":["政策监管"],"score":90.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"369640935efcece9","title":"$30M Raised to Redo the CPU","title_zh":"筹集$ 3000万用于重做CPU","title_orig":"$30M Raised to Redo the CPU","summary":"Article URL: https://tendrils.co/blog/2026-11-10/30m-raised\n\nComments URL: https://news.ycombinator.com/item?id=50447036\n\nPoints: 54\n\n# Comments: 36","summary_zh":"文章网址： https://tendrils.co/blog/2026-11-10/30m-raised\n\n评论网址： https://news.ycombinator.com/item?id=50447036\n\n积分： 54\n\n# Comments: 36","summary_orig":"Article URL: https://tendrils.co/blog/2026-11-10/30m-raised\n\nComments URL: https://news.ycombinator.com/item?id=50447036\n\nPoints: 54\n\n# Comments: 36","url":"https://tendrils.co/blog/2026-11-10/30m-raised","source":"Hacker News","source_id":"hn","category":"ai","lang":"en","published":1794348843.0,"tags":[],"score":87.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"3588ceed41552e46","title":"Work at the Frontier: AI’s effect on freelance work","title_zh":"前沿工作：人工智能对自由职业的影响","title_orig":"Work at the Frontier: AI’s effect on freelance work","summary":"New research from OpenAI and Upwork finds shifting demand for freelance work, new skill combinations, and larger budgets and more hours for AI-related projects.","summary_zh":"OpenAI和Upwork的最新研究发现，对人工智能相关项目的自由职业、新技能组合、更大的预算和更多时间的需求正在发生变化。","summary_orig":"New research from OpenAI and Upwork finds shifting demand for freelance work, new skill combinations, and larger budgets and more hours for AI-related projects.","url":"https://openai.com/index/ai-effect-on-freelance-work","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794294000.0,"tags":[],"score":89.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"4f4f581a2ac462b4","title":"机器人产业催化密集，南方基金旗下机器人ETF南方(159258)盘中活跃","title_zh":"","title_orig":"","summary":"截至11:04，机器人ETF南方（159258）盘中换手2.01%，成交2772.57万元，跟踪指数中证机器人指数（H30590）一度涨超1.73%，现涨1.21%。该指数近一周累计涨幅已超7.18%。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15319855.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794368037.0,"tags":["具身智能"],"score":90.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"db09e2e8ec2b8780","title":"What objective is reasoning solving?","title_zh":"推理求解的目标是什么？","title_orig":"What objective is reasoning solving?","summary":"Article URL: https://alexwang.ai/posts/reasoning-as-pathfinding/\n\nComments URL: https://news.ycombinator.com/item?id=50445013\n\nPoints: 126\n\n# Comments: 56","summary_zh":"文章网址： https://alexwang.ai/posts/reasoning-as-pathfinding/\n\n评论网址： https://news.ycombinator.com/item?id=50445013\n\n积分： 126\n\n#评论： 56","summary_orig":"Article URL: https://alexwang.ai/posts/reasoning-as-pathfinding/\n\nComments URL: https://news.ycombinator.com/item?id=50445013\n\nPoints: 126\n\n# Comments: 56","url":"https://alexwang.ai/posts/reasoning-as-pathfinding/","source":"Hacker News","source_id":"hn","category":"ai","lang":"en","published":1794338714.0,"tags":[],"score":87.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"38bbc974c2517115","title":"脚本 Ram Altman 监视 PC 闲置内存然后发邮件给 Sam Altman","title_zh":"","title_orig":"","summary":"OpenAI CEO Sam Altman 因为一句 PC 内存浪费的评论而成为无数梗图的讽刺对象，他甚至为此自嘲，在社交媒体上将用户名改名为“Ram Altman”。现在开发者 Iain Kay 为 Linux 系统开发了一个 BASH 脚本 Ram Altman，旨在监测 PC 的闲置内存容量。闲置内存的百分比会被发送邮件给 Sam Altman。当然只是说说，具体取决于用户的设置。默认情况下脚本未预先配置电邮服务器。如果闲置内存超过了总内存的 10%，Ram Altman 会从预设讽刺邮件模板库随机选择一条发送出去。其中一则模板是：“Hi Sam。请别惊慌，我有 8.6 GiB 内存在 PC 上，.它们不在数据中心里。这占了我 PC 总内存的 56.2%，而且据我所知，它们今天也没什么别的安排。一位负责任囤积内存的用户。”","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85834","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794209535.0,"tags":[],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"5f12cf459e5b89f7","title":"【钛晨报】李强签署国务院令，公布修订后的《基金会管理条例》；阿里拟分拆平头哥独立赴港上市；Anthropic IPO定价区间确定，目标市值约1万亿美元低于预期","title_zh":"","title_orig":"","summary":"i茅台将从“抢购”模式逐步转为日常售卖；台积电批准409亿美元资本预算，用于长期产能扩张；华为新型存储系统即将启动试商用；贾国龙质押西贝股权，股权数额超2660万；英伟达、黄仁勋遭股东集体诉讼；国家发改委：多渠道增加普通高中和高等教育学位供给；减少个人信息泄露，首批700专用码号服务业务试点获批。","summary_zh":"","summary_orig":"","url":"https://www.tmtpost.com/8200471.html","source":"钛媒体","source_id":"tmtpost","category":"ai","lang":"zh","published":1794352800.0,"tags":["芯片算力","融资并购","民生"],"score":82.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"bf0da7c1efa52b67","title":"创业板综指ETF鹏华(159289)标的指数涨近1%，产业订单密集落地，光伏、机器人领涨市场","title_zh":"","title_orig":"","summary":"光伏、机器人盘中活跃，消息面上，10月以来，国内光伏头部企业的海外订单密集落地。晶科、爱旭、天合、隆基、通威、帷盛六家企业，累计签单规模超过7GW。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15319870.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794368027.0,"tags":["具身智能"],"score":90.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"8d5a29627c4fceff","title":"phimint v0.8.0 发布：模型选择跨重启生效、终端贴图、长输出不再消失","title_zh":"","title_orig":"","summary":"phimint v0.8.0 已发布（2026-11-09） phimint 是一个用 Rust 写的终端 AI 编码 agent：一条命令装上、配好 API key，就能在终端里把需求变成跑通的代码——读代码、改多个文件、编译、测试、按报错迭代。 本轮更新重点在「模型选择」和「输入输出」两处。 更新重点 1. 模型选择跨重启生效 以前 /model 选完，重启就没了...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503517","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794321190.0,"tags":["智能体"],"score":83.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"a92c103556a09803","title":"Meta’s AI agent Muse lands on Apple Watch and Android Wear OS","title_zh":"Meta的AI代理Muse登陆Apple Watch和Android Wear OS","title_orig":"Meta’s AI agent Muse lands on Apple Watch and Android Wear OS","summary":"Users can now interact with Meta’s AI assistant through voice calls, text messages, or dictation on their Apple Watch.","summary_zh":"用户现在可以通过语音通话、短信或Apple Watch上的听写与Meta的AI助手进行交互。","summary_orig":"Users can now interact with Meta’s AI assistant through voice calls, text messages, or dictation on their Apple Watch.","url":"https://techcrunch.com/2026/11/10/metas-ai-agent-muse-lands-on-apple-watch-and-wear-os/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794324570.0,"tags":["智能体"],"score":86.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"7c7ce56614eeda55","title":"苹果将工程师的每日 AI 预算限制在 200 美元","title_zh":"","title_orig":"","summary":"世界市值最高的公司也开始对 AI 预算设限。苹果据报道将部分工程师的每日 AI 预算从 300 美元削减至 200 美元。苹果市值最近再次超过英伟达跃居第一。苹果此举并非是因为缺乏现金支持内部研发，而是因为在企业级规模下生成式 AI 存在着无法回避的经济规律。如果对先进模型的使用不加限制，成本曲线将呈指数级增长，这足以摧毁任何企业的利润空间，即便苹果也不例外。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85833","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794206412.0,"tags":["芯片算力","经济"],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"02776d74a152aa4b","title":"Microsoft’s DLSS competitor is out for the Xbox Ally X and works in handheld mode","title_zh":"微软的DLSS竞争对手推出了Xbox Ally X，并以手持模式工作","title_orig":"Microsoft’s DLSS competitor is out for the Xbox Ally X and works in handheld mode","summary":"Microsoft is now rolling out Automatic Super Resolution (Auto SR), an upscaling technology that competes with Nvidia's DLSS, for the Xbox Ally X, Xbox Ally X20, and select Windows Copilot Plus PCs, the company announced today. Auto SR is also getting some new features alongside this official release. In April, Microsoft started testing Auto SR […]","summary_zh":"","summary_orig":"Microsoft is now rolling out Automatic Super Resolution (Auto SR), an upscaling technology that competes with Nvidia's DLSS, for the Xbox Ally X, Xbox Ally X20, and select Windows Copilot Plus PCs, the company announced today. Auto SR is also getting some new features alongside this official release. In April, Microsoft started testing Auto SR […]","url":"https://www.theverge.com/tech/1031446/microsoft-automatic-super-resolution-auto-sr-upscaling","source":"The Verge","source_id":"verge","category":"ai","lang":"en","published":1794357264.0,"tags":["芯片算力","智能体"],"score":82.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"bf1a45003184b0a6","title":"微软正式发布 .NET 11：开发更省时，AI 工具更齐全","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，昨日（11 月 10 日）召开的.NET Conf 2026 线上大会上，微软正式发布 .NET 11，围绕运行性能、开发效率及 AI 应用构建推出一系列更新，覆盖网页、移动端和桌面应用开发。\n\nIT之家注：.NET 是由微软支持、与开源社区共同维护的软件开发平台。它免费、开源，开发者可以用它构建网站后台、桌面软件、手机应用、云服务等多种程序。\n本次 .NET 11 围绕性能、AI 应用及跨平台开发展开升级，涵盖 C# 15、网站开发框架 ASP.NET Core 和跨平台框架.NET MAUI 等，从而减少开发等待时间，简化现代应用构建流程。\n性能方面，新版带来数百项运行时与基础库优化，并通过原生编译的命令行入口、保持预热的构建服务，减少工具反复启动的开销。\nAI 方面，.NET 11 开发工具包内置 MCP 服务器模板，方便开发者将应用功能接入 AI 工具调用体系。配套 AI 库与智能体框架支持模型接入、工具调用和工作流编排；Blazor 还推出实验性 AI 界面组件，可用于流式聊天、工具展示与操作审批。\n编程体验上，C# 15 新增联合类型，让程序能够明确列出一项操作的不同结果，并由编译器检查是否遗漏处理。跨平台开发方面，.NET MAUI 默认采用 CoreCLR 运行时，同时改进界面调试与测试；Windows Forms 则提供可选的现代视觉样式。\n.NET 11 属于标准支持版本，提供两年支持，.NET 10 仍是长期支持选项。微软提醒，升级前应检查兼容性、依赖项和硬件要求，并以实际测试验证效果。\n参考\nAnnouncing .NE","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/246.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794360182.0,"tags":["开源"],"score":88.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"111b66d97ab01eca","title":"The climate case for AI has not been made","title_zh":"人工智能的气候案例尚未提出","title_orig":"The climate case for AI has not been made","summary":"This week, as countries meet in Antalya, Turkey for the United Nations climate conference, one topic likely to dominate the conversation is artificial intelligence. The host has already called on countries to commit to ensuring that AI is designed, powered, and deployed in ways that support climate action. But so far, industries around the world…","summary_zh":"本周，当各国在土耳其安塔利亚举行联合国气候大会时，一个可能主导对话的话题是人工智能。体验达人已经呼吁各国致力于确保人工智能的设计、驱动、","summary_orig":"This week, as countries meet in Antalya, Turkey for the United Nations climate conference, one topic likely to dominate the conversation is artificial intelligence. The host has already called on countries to commit to ensuring that AI is designed, powered, and deployed in ways that support climate action. But so far, industries around the world…","url":"https://www.technologyreview.com/2026/11/09/1148166/the-climate-case-for-ai-has-not-been-made/","source":"MIT 科技评论","source_id":"mittr","category":"ai","lang":"en","published":1794218400.0,"tags":[],"score":81.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"5175b6a2b765750a","title":"Show HN: Get your coding agent off ~2019 JavaScript, onto modern web primitives","title_zh":"Show HN：让您的编码代理脱离~ 2019 JavaScript，进入现代网络图元","title_orig":"Show HN: Get your coding agent off ~2019 JavaScript, onto modern web primitives","summary":"Browsers natively handle a lot of what used to take 50 lines of JS (or a dependency): `CSS.highlights` for text range highlighting without s everywhere, `` and showModal() give you backdrops and ideal focus management, `field-sizing` to auto-grow textareas as the user types.. (Something yesterday's ftrain post touched on [0])Models know about some of these by name, but consistently won't default to using the platform-native solution and instead prefer the incumbent +JS based pattern. We started an effort in Chrome to supplement coding agents with this key domain knowledge and we're shipping our 1.0 today, in collaboration with Firefox, MDN, and Edge.200+ guides (~1.7MB) of curated, hand-craf","summary_zh":"","summary_orig":"Browsers natively handle a lot of what used to take 50 lines of JS (or a dependency): `CSS.highlights` for text range highlighting without s everywhere, `` and showModal() give you backdrops and ideal focus management, `field-sizing` to auto-grow textareas as the user types.. (Something yesterday's ftrain post touched on [0])Models know about some of these by name, but consistently won't default to using the platform-native solution and instead prefer the incumbent +JS based pattern. We started an effort in Chrome to supplement coding agents with this key domain knowledge and we're shipping our 1.0 today, in collaboration with Firefox, MDN, and Edge.200+ guides (~1.7MB) of curated, hand-craf","url":"https://github.com/GoogleChrome/modern-web-guidance","source":"Hacker News","source_id":"hn","category":"ai","lang":"en","published":1794333675.0,"tags":["智能体"],"score":86.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"116b3e8cc8279f96","title":"从路透社到 Linux Magazine：openKylin 3.0 收获全球关注","title_zh":"","title_orig":"","summary":"openKylin 3.0 正式发布两个月来，这个来自中国的智能操作系统开源根社区正在被越来越多的国际技术媒体和全球开发者看见。 从路透社到 It's FOSS：国际媒体的多层关注 发布当月，路透社（Reuters）刊发 openKylin 3.0 相关报道《openKylin 3.0 Deepens AI Agent Integration, Explores Next-Generation Computing Ecosys...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503505","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794293682.0,"tags":["智能体","开源"],"score":83.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"8e51793c49fe8885","title":"Asahi Linux 从 MIT 许可证切换到 GPL 许可证","title_zh":"","title_orig":"","summary":"旨在将 Linux 移植到运行 Apple Silicon 芯片的 Mac 电脑的发行版项目 Asahi Linux 宣布从 MIT 许可证切换到 GPLv2 或以上版本的许可证。原因是有人将开发者分支尚在开发中的代码未注明出处发表，甚至利用 AI 重写代码以掩盖来源意图取代原项目和进行牟利。AI 出现前，代码洗白（Code laundering）通常涉及逐行手动重写代码、修改变量名，通过调整函数结构，使代码看起来与原版截然不同。LLM 的出现让这一过程变得更轻松、成本也更低。Asahi 团队此前已经注意到有人在利用宽松的 MIT 许可证劫持他们的工作成果。因此他们决定采用更严格的 GPL 许可证。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85832","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794205760.0,"tags":["大模型","芯片算力"],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"485a734c54fe8112","title":"Sony cancels live-service shooter Fairgames","title_zh":"索尼取消现场服务射击游戏Fairgames","title_orig":"Sony cancels live-service shooter Fairgames","summary":"Sony has canceled Fairgames, a heist game announced in 2023, according to Bloomberg. Fairgames had once been part of Sony's big planned push for PlayStation live service games, but the company ended up canceling some planned live service titles, including in the God of War and The Last of Us franchises, and it shut down […]","summary_zh":"据彭博社报道，索尼已经取消了2023年宣布的抢劫游戏Fairgames。Fairgames曾经是索尼计划大力推动PlayStation直播服务游戏的一部分，但该公司最终取消了一些计划中的直播服务游戏，包括","summary_orig":"Sony has canceled Fairgames, a heist game announced in 2023, according to Bloomberg. Fairgames had once been part of Sony's big planned push for PlayStation live service games, but the company ended up canceling some planned live service titles, including in the God of War and The Last of Us franchises, and it shut down […]","url":"https://www.theverge.com/games/1031242/sony-playstation-fairgames-canceled","source":"The Verge","source_id":"verge","category":"ai","lang":"en","published":1794344772.0,"tags":[],"score":82.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c012fc7ecd62b33e","title":"OpenAI, Anthropic face new oversight as New York’s AI safety law takes effect","title_zh":"随着纽约人工智能安全法生效， OpenAI、Anthropic面临新的监督","title_orig":"OpenAI, Anthropic face new oversight as New York’s AI safety law takes effect","summary":"New York is preparing to enforce its sweeping AI safety law, requiring major developers like OpenAI and Anthropic to register, disclose safety practices, and report critical incidents or face fines.","summary_zh":"纽约正准备执行其全面的人工智能安全法，要求OpenAI和Anthropic等主要开发商进行注册，披露安全实践，并报告重大事件或面临罚款。","summary_orig":"New York is preparing to enforce its sweeping AI safety law, requiring major developers like OpenAI and Anthropic to register, disclose safety practices, and report critical incidents or face fines.","url":"https://techcrunch.com/2026/11/10/openai-anthropic-face-new-oversight-as-new-yorks-ai-safety-law-takes-effect/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794343933.0,"tags":[],"score":85.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"aeadc78b15b8d97c","title":"Google’s Pixel Tag tracker is now available","title_zh":"Google的Pixel Tag跟踪器现已推出","title_orig":"Google’s Pixel Tag tracker is now available","summary":"After years of third-party Android trackers from companies like Samsung, Motorola, and Pebblebee, Google's Pixel Tag is now available for purchase. First announced in August, the Pixel Tag is designed to work with Google's tracking network and app that was renamed the Find Hub last year. The Pixel Tag is priced similar to Apple's AirTag […]","summary_zh":"经过三星、摩托罗拉和Pebblebee等公司多年的第三方Android跟踪器，谷歌的Pixel Tag现已上市。Pixel Tag于8月首次发布，旨在与谷歌的跟踪网络和应用程序配合使用，","summary_orig":"After years of third-party Android trackers from companies like Samsung, Motorola, and Pebblebee, Google's Pixel Tag is now available for purchase. First announced in August, the Pixel Tag is designed to work with Google's tracking network and app that was renamed the Find Hub last year. The Pixel Tag is priced similar to Apple's AirTag […]","url":"https://www.theverge.com/tech/1030766/google-pixel-tag-tracker-find-hub-uwb-bluetooth-sounding","source":"The Verge","source_id":"verge","category":"ai","lang":"en","published":1794337200.0,"tags":[],"score":82.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"445fc6287a33b8c1","title":"OpenAI rolls out new business profiles, making ChatGPT just a little bit more like Google","title_zh":"OpenAI推出新的业务配置文件，使ChatGPT更像谷歌","title_orig":"OpenAI rolls out new business profiles, making ChatGPT just a little bit more like Google","summary":"OpenAI is looking to make ChatGPT a more robust consumer discovery engine, and a host of new features seek to empower businesses to help it do that.","summary_zh":"OpenAI正在寻求使ChatGPT成为一个更强大的消费者发现引擎，许多新功能旨在帮助企业实现这一目标。","summary_orig":"OpenAI is looking to make ChatGPT a more robust consumer discovery engine, and a host of new features seek to empower businesses to help it do that.","url":"https://techcrunch.com/2026/11/10/openai-rolls-out-new-business-profiles-making-chatgpt-just-a-little-bit-more-like-google/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794336592.0,"tags":["大模型"],"score":85.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"a6795552e3b81150","title":"Placing LLM Lookup Tables by Per-Layer Prefetch Deadlines","title_zh":"按每层预取截止日期放置LLM查找表","title_orig":"Placing LLM Lookup Tables by Per-Layer Prefetch Deadlines","summary":"DeepSeek-V4.1's 203 GB of Engram n-gram tables sit in host DRAM today, taking 190 of the 223 GiB a 4-GPU serving process uses. Row indices depend only on input tokens, so reads can start with each step and overlap earlier layers. V4.1's two Engram layers have windows that differ by 30x (0.3 vs. 9.3 ms). We show that this deadline, together with session reuse and contention on a shared device, decides which tier each table can use and which layers need cache, and we give a model that predicts the resulting slowdown from measured read times. Agent and chat traffic reuse rows within sessions, and static hot sets transfer poorly. We build SlackTier, a table tier for SGLang that issues all lookup","summary_zh":"","summary_orig":"DeepSeek-V4.1's 203 GB of Engram n-gram tables sit in host DRAM today, taking 190 of the 223 GiB a 4-GPU serving process uses. Row indices depend only on input tokens, so reads can start with each step and overlap earlier layers. V4.1's two Engram layers have windows that differ by 30x (0.3 vs. 9.3 ms). We show that this deadline, together with session reuse and contention on a shared device, decides which tier each table can use and which layers need cache, and we give a model that predicts the resulting slowdown from measured read times. Agent and chat traffic reuse rows within sessions, and static hot sets transfer poorly. We build SlackTier, a table tier for SGLang that issues all lookup","url":"https://arxiv.org/abs/2611.13413v1","source":"arXiv cs.AI","source_id":"arxiv_ai","category":"ai","lang":"en","published":1794271662.0,"tags":["大模型","芯片算力"],"score":78.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"1dd73fd28d50d755","title":"阿里 Qwen Code 1.0 发布：Qoder 与 Qwen Code Harness 融合开源","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，阿里今日官宣推出 Qwen Code 1.0 版本，Qoder 与 Qwen Code 融合开源。\n阿里把在 Qoder 中打磨的 Harness 能力融入 Qwen Code，随 Qwen Code 1.0 Preview 一起开放，为开发者提供可嵌入自身产品的 Agent 运行基础。\n\nQwen Code 1.0 从进程内的内存事件总线起步，沿着统一事件模型向分布式演进：将接入、调度与执行分层扩展，通过“手脑分离”让推理编排与工具执行独立管理。在保留既有入口与返回方式的基础上，从“一个进程、多个会话”走向“多个节点、更多会话”。\n\nQwen Code 1.0 架构演进示意阿里官方表示，统一事件机制不仅连接入口与任务，也为能力扩展和资源管理建立清晰边界。各类处理单元围绕事件协作，模型、沙箱与外部扩展分别管理，让系统在承接更多任务时，更便于扩展能力、集中管控和控制成本。\n处理单元灵活扩展：推理、记忆与工具能力可以围绕事件按需接入，减少对主执行流程的侵入。\n\n模型接入集中管控：模型服务通过统一入口接入，集中管理配置、访问授权与调用记录，减少重复对接与分散维护。\n\n沙箱资源按需管理：在相同配置与权限边界内分配和复用，减少重复初始化与空闲占用，有助于降低运行成本。\n\n系统扩展集中治理：统一管理 MCP 的配置、授权与连接，减少分散维护。\n\n本次发布将 Qoder 与 Qwen Code 的 Harness 能力纳入同一套开源内核。Harness 负责衔接模型、工具与执行过程，开发者可以据此构建适合自身场景的 Agent 系统，将 AI 编程能力接入更","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/393.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794370807.0,"tags":["大模型","智能体","开源"],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"05bd9f0351a0c3a2","title":"Innovating with AI in the special chemicals industry","title_zh":"在特殊化学品行业使用人工智能进行创新","title_orig":"Innovating with AI in the special chemicals industry","summary":"As companies look to accelerate innovation with artificial intelligence, cloud computing, and advanced modeling, the primary challenge is connecting new technologies to reliable data, scientific expertise, and the practical realities of bringing products to market. For specialty chemicals manufacturer Lubrizol, digital transformation is all about giving researchers the tools to test ideas faster, make better-informed…","summary_zh":"随着公司希望通过人工智能、云计算和高级建模加速创新，主要挑战是将新技术与可靠的数据、科学专业知识以及将产品引入","summary_orig":"As companies look to accelerate innovation with artificial intelligence, cloud computing, and advanced modeling, the primary challenge is connecting new technologies to reliable data, scientific expertise, and the practical realities of bringing products to market. For specialty chemicals manufacturer Lubrizol, digital transformation is all about giving researchers the tools to test ideas faster, make better-informed…","url":"https://www.technologyreview.com/2026/11/09/1147654/innovating-with-ai-in-the-special-chemicals-industry/","source":"MIT 科技评论","source_id":"mittr","category":"ai","lang":"en","published":1794229200.0,"tags":[],"score":79.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"9c331579e229757a","title":"ChatGPT Enterprise now available in AWS Marketplace","title_zh":"ChatGPT Enterprise现已在AWS Marketplace中提供","title_orig":"ChatGPT Enterprise now available in AWS Marketplace","summary":"ChatGPT Enterprise is now available through AWS Marketplace, helping organizations simplify procurement through existing AWS purchasing and billing relationships.","summary_zh":"ChatGPT Enterprise现已通过AWS Marketplace提供，帮助组织通过现有的AWS采购和计费关系简化采购。","summary_orig":"ChatGPT Enterprise is now available through AWS Marketplace, helping organizations simplify procurement through existing AWS purchasing and billing relationships.","url":"https://openai.com/index/chatgpt-enterprise-aws-marketplace","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794250800.0,"tags":["大模型"],"score":84.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c1b54c2747a31bbb","title":"Edge AI Daily 早报（11月11日）","title_zh":"","title_orig":"","summary":"Anthropic以发行8.25亿股、70—78美元定价冲刺纳斯达克（代码ANT），含七家芯片与云巨头260亿美元私募配售，募资上限约900亿美元，估值自2万亿美元退守至1.2万亿—1.3万亿美元区间；招股书显示前九月营收332亿美元、净亏损1040亿美元，8954亿美元算力承诺与Q3算力成本占营收58%构成核心矛盾。同期发布Fable 5.2与Mythos 5.2，千级智能体8天从零构建可启动操作系统、30小时完成费马大定理形式化，API降价20%。谷歌一年四发TPU并以Gemini Intelligence扩分发，Meta用Muse Ember把竞争推向单位任务成本，OpenAI收购旅行代理Odessia构建服务闭环。纽约、澳大利亚同步推进强制性AI监管。","summary_zh":"","summary_orig":"","url":"https://www.tmtpost.com/8200609.html","source":"钛媒体","source_id":"tmtpost","category":"ai","lang":"zh","published":1794357294.0,"tags":["大模型","芯片算力","智能体"],"score":78.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"cf157c2027de085c","title":"FDA 警告 GLP-1 减肥药可能增加突然失明风险","title_zh":"","title_orig":"","summary":"FDA 周一表示，GLP-1 药物生产商须在产品标签上增加一项可能导致突然失明的警示。被称为非动脉炎性前部缺血性视神经病变(nonarteritic anterior ischemic optic neuropathy，NAION)的眼部疾病会影响视神经——负责将信号从眼睛传输至大脑的神经。当流向视神经的血液减少或受阻时，可能导致视力突然丧失，这种损伤是永久性的，目前无已知疗法。2024 年《JAMA Ophthalmology》期刊发表了一项研究，发现使用司美格鲁肽处方药的糖尿病患者患 NAION 的可能性是未使用该药患者的四倍。FDA 随后展开了调查，在审查了递交的副作用报告和多项临床试验的数据之后，FDA 发现所有 GLP-1 药物均出现 NAION 病例的报告。FDA 科学家尚未能明确药物导致 NAION 风险增加的具体机制。NAION 的某些危险因素，与 GLP-1 药物使用者中常见的健康状况——如 2 型糖尿病、肥胖症、睡眠呼吸暂停和高血压——存在重叠。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85843","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794292514.0,"tags":[],"score":84.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"af7403b4563990ca","title":"Anthropic launches Claude Meetings to turn workplace discussions into plans and tasks","title_zh":"Anthropic推出Claude Meetings，将工作场所的讨论转化为计划和任务","title_orig":"Anthropic launches Claude Meetings to turn workplace discussions into plans and tasks","summary":"As participants talk, Claude can draft the plan being discussed, map out a timeline on a whiteboard, answer questions in the meeting chat, and access connected work apps to retrieve information, such as last year's figures.","summary_zh":"在参与者交谈时， Claude可以起草正在讨论的计划，在白板上绘制时间表，在会议聊天中回答问题，并访问连接的工作应用程序以检索信息，例如去年的数字。","summary_orig":"As participants talk, Claude can draft the plan being discussed, map out a timeline on a whiteboard, answer questions in the meeting chat, and access connected work apps to retrieve information, such as last year's figures.","url":"https://techcrunch.com/2026/11/10/anthropic-launches-claude-meetings-to-turn-workplace-discussions-into-plans-and-tasks/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794331800.0,"tags":["大模型"],"score":85.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"12fa161ba55ab890","title":"成本仅1/3！Meta 新模型 Muse Ember 硬刚 Claude Haiku 5.5","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/Ou4l4aD7zvUzXWXsWJfY?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794324129.0,"tags":["大模型"],"score":78.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c28b42e224371c71","title":"华为麒麟 9050 系列芯片官宣搭载新一代达芬奇架构 NPU，业界首个 30B MoE 大模型入端","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，华为麒麟官方公众号今日发文，详细介绍了首款「逻辑折叠」技术 τ 芯片 —— 麒麟 9050 系列的新一代达芬奇架构 NPU，其支持 30B 大模型端侧运行，具备不用联网、不用等云端的特性。\n\n新一代达芬奇架构 NPU 性能提升 140%、功耗降低 66%，支持 Transformer 引擎、超低功耗感知引擎和 CANN 异构计算架构；业界首个 30B MoE 大模型入端，支持多级存算协同优化、低比特量化。\n落地到具体的功能上，新一代达芬奇架构 NPU 可提供感知屏幕-AI 屏幕朗读、感知影像-Xmage 智拍 2.0、感知人眼-AI 眼动翻页、感知位置-熄屏地图 2.0 等功能。\n据IT之家此前报道，在华为今年 10 月举行的 2026 麒麟媒体沟通会上，华为半导体业务无线终端芯片产品管理部部长徐松余表示，麒麟 9050 系列作为首款逻辑折叠的 τ 芯片，将开启未来 10 年新征程。PPT 显示，华为目标在 2031 年实现 P 核频率突破 5GHz。","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/331.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794368657.0,"tags":["大模型","芯片算力"],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"23b94c697622500f","title":"CodeRabbit scales agentic software development and ships 20x more","title_zh":"CodeRabbit可扩展代理软件开发并出货量增加20倍","title_orig":"CodeRabbit scales agentic software development and ships 20x more","summary":"CodeRabbit uses OpenAI models to govern and trust AI-generated code and Codex to ship 20 times more software with the same engineering team.","summary_zh":"CodeRabbit使用OpenAI模型来管理和信任AI生成的代码， Codex使用相同的工程团队出货20倍的软件。","summary_orig":"CodeRabbit uses OpenAI models to govern and trust AI-generated code and Codex to ship 20 times more software with the same engineering team.","url":"https://openai.com/index/coderabbit-codex-daybreak","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794211200.0,"tags":["智能体"],"score":84.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"4f180cc8f3f87266","title":"科创50ETF平安(589150)标的指数盘中飘红，我国算力总规模达310万PFLOPS居世界第二","title_zh":"","title_orig":"","summary":"截至2026年11月11日 11:24，科创50ETF平安(589150)标的指数上证科创板50成份指数(000688)上涨0.16%，成分股源杰科技上涨9.18%，国盾量子上涨6.83%，睿创微纳上涨3.93%。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15319920.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794369406.0,"tags":["芯片算力"],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"1233d3fb645aa4df","title":"SafeRoute-MAS: Coverage-Aware and Risk-Calibrated Message Routing for Multi-Agent Scientific Reasoning","title_zh":"SafeRoute-MAS：用于多Agent科学推理的覆盖感知和风险校准消息路由","title_orig":"SafeRoute-MAS: Coverage-Aware and Risk-Calibrated Message Routing for Multi-Agent Scientific Reasoning","summary":"We introduce SafeRoute-MAS, a coverage-aware, risk-calibrated procedure that keeps all specialist messages or removes one using only pre-integration information. On a sealed cache of 5,328 committees, its source-compatible operating point gains +1.80 percentage points (95% CI [+1.13, +2.52]) while removing 12.76% of message tokens. We also run 4,580 controlled integrations over a stratified 458-committee sample on a public gpt-oss-120b endpoint. The sample estimate is -0.09 points; design weighting to the original workload gives +0.94 points (95% CI [-1.31, +3.50]) and 18.72% acted-input reduction. A weighted token-matched comparison likewise does not establish a selector advantage (+1.68 po","summary_zh":"我们推出了SafeRoute-MAS，这是一种覆盖范围感知、风险校准的程序，仅使用集成前信息保留所有专家消息或删除专家消息。在5,328个委员会的密封缓存中，其源兼容操作点获得+1.80%","summary_orig":"We introduce SafeRoute-MAS, a coverage-aware, risk-calibrated procedure that keeps all specialist messages or removes one using only pre-integration information. On a sealed cache of 5,328 committees, its source-compatible operating point gains +1.80 percentage points (95% CI [+1.13, +2.52]) while removing 12.76% of message tokens. We also run 4,580 controlled integrations over a stratified 458-committee sample on a public gpt-oss-120b endpoint. The sample estimate is -0.09 points; design weighting to the original workload gives +0.94 points (95% CI [-1.31, +3.50]) and 18.72% acted-input reduction. A weighted token-matched comparison likewise does not establish a selector advantage (+1.68 po","url":"https://arxiv.org/abs/2611.13454v1","source":"arXiv cs.AI","source_id":"arxiv_ai","category":"ai","lang":"en","published":1794275779.0,"tags":["智能体"],"score":77.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f2a365891fa20b3c","title":"Synaptics patent claims stop work on DisplayLink drivers","title_zh":"Synaptics专利声明停止在DisplayLink驱动程序上的工作","title_orig":"Synaptics patent claims stop work on DisplayLink drivers","summary":"Article URL: https://lwn.net/SubscriberLink/1102549/acbc92e00cee3a3f/\n\nComments URL: https://news.ycombinator.com/item?id=50443824\n\nPoints: 327\n\n# Comments: 195","summary_zh":"文章网址： https://lwn.net/SubscriberLink/1102549/acbc92e00cee3a3f/\n\n评论网址： https://news.ycombinator.com/item?id=50443824\n\n积分： 327\n\n#评论： 195","summary_orig":"Article URL: https://lwn.net/SubscriberLink/1102549/acbc92e00cee3a3f/\n\nComments URL: https: so where…","summary_zh":"这个故事最初出现在我们的人工智能每周通讯《算法》上。要先在收件箱中获取此类故事，请在此处注册。当选民上周前往美国各地的民意调查时，我在弗吉尼亚州的阿什本，这是所谓的数据中心小巷的一部分","summary_orig":"This story originally appeared in The Algorithm, our weekly newsletter on AI. To get stories like this in your inbox first, sign up here. As voters went to the polls across the US last week, I was in Ashburn, Virginia, part of what’s known as Data Center Alley—the world’s largest data center hub. It’s also where…","url":"https://www.technologyreview.com/2026/11/09/1148194/the-backlash-about-data-centers-might-really-just-be-about-electricity/","source":"MIT 科技评论","source_id":"mittr","category":"ai","lang":"en","published":1794252933.0,"tags":[],"score":76.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"ddc22328ec45d56e","title":"AI从模型竞赛走向应用兑现，新一代国产芯片上市时间节点大幅前置，科创芯片ETF嘉实(588200)关注国产芯片投资机遇","title_zh":"","title_orig":"","summary":"截至2026年11月11日 10:50，上证科创板芯片指数下跌0.12%。成分股方面涨跌互现，源杰科技领涨5.96%，仕佳光子上涨4.41%，思瑞浦上涨3.30%；乐鑫科技领跌，华海清科、恒坤新材跟跌。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15320014.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794369351.0,"tags":["芯片算力"],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"5422acb9724fbcfb","title":"波士顿动力为其人形机器人加入了轮子","title_zh":"","title_orig":"","summary":"波士顿动力通过官方 YouTube 频道公布了一则新视频，展示了其人形机器人 Atlas 改用轮子在地面上移动。视频展示了 Atlas 能通过足部的轮子用脚尖旋转，以及做出其它高强度的动作。Atlas 能在平坦地面上的快速滚动与应对障碍物或不规则地面的关节式腿部运动之间实现平滑切换。Atlas 项目控制工程师 Andy Wu 称，系统在模拟环境中进行了训练，在模拟环境中学会所有动作后能在现实世界中以高准确度执行出来。Atlas 转换到移动模式仅需一个定制的适配器，就能将现有的滑板车轮毂安装到 Atlas 原有的踝关节执行器上。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85849","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794326299.0,"tags":["具身智能"],"score":81.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"3dbe0a2a6bc17884","title":"Arm 发布 Cortex-M42 处理器：向量算力最高达前代 3 倍，让更多小型设备用上本地 AI","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，Arm 昨日（11 月 10 日）发布公告，宣布推出 Cortex-M42 处理器，并将其纳入 Flexible Access 和 Total Access 两项技术授权计划。\n\n定位方面，Cortex-M42 处理器主要面向对成本和芯片面积敏感的智能终端，目标为可穿戴设备、工业控制器等产品带来更强的机器学习与数字信号处理能力。\n架构方面，Cortex-M42 处理器采用基于 Armv8.1-M 架构，结合 Helium 技术与紧凑的 AHB 总线设计，方便芯片厂商升级现有的 Cortex-M4、Cortex-M33 微控制器方案。\nHelium 是一套用于 Cortex-M 处理器的向量扩展技术，让同一个 CPU 既能执行控制代码，也能更高效地处理适合向量化的数据运算。\n性能方面，相比较 Cortex-M33，最新 Cortex-M42 处理器向量计算能力最高可达 3 倍，向量计算能效最高可达 2 倍。IT之家注：向量计算是指让处理器用一条指令，对一组数据执行同一种运算，主要通过 SIMD（单指令、多数据）提高数据处理效率。SIMD 把多个数据元素放进较大的寄存器中，每个元素所在的位置称为一个“通道”，然后对多个通道执行相同操作。\n\n在实际应用中，新处理器可用于可穿戴设备的音频处理和关键词识别，也可承担工业设备的传感器分析与状态监测。Arm 还举例称，它可在机器人电机、关节附近处理信号，帮助发现异常或磨损迹象。\n此次发布也扩充了 Arm 的技术授权组合。截至 2026 年 11 月，Flexible Access 拥有 319 家活跃成员，已","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/294.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794361929.0,"tags":["芯片算力"],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"e95669264d3cc4ea","title":"The VR Disney Plus app on Meta Quest now has 3D movies","title_zh":"Meta Quest上的VR Disney Plus应用程序现在有3D电影","title_orig":"The VR Disney Plus app on Meta Quest now has 3D movies","summary":"Disney is bringing more than 60 3D movies to the Disney Plus app on Meta Quest. The movies will be available to Disney Plus subscribers as part of an updated Disney Plus app that's rolling out today. The 3D movies you can check out include The Avengers and Black Panther, Meta says. But the updated […]","summary_zh":"迪士尼将为Meta Quest上的Disney Plus应用带来60多部3D电影。这些电影将作为今天推出的更新版Disney Plus应用程序的一部分提供给Disney Plus订阅者。您可以观看的3D电影包括《复仇者联盟》和《BLA》","summary_orig":"Disney is bringing more than 60 3D movies to the Disney Plus app on Meta Quest. The movies will be available to Disney Plus subscribers as part of an updated Disney Plus app that's rolling out today. The 3D movies you can check out inclu ,"lang":"zh","published":1794368029.0,"tags":["芯片算力"],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"196c0edf93f91dc3","title":"Google broadens its AI hardware portfolio with two new specialized chips","title_zh":"谷歌通过两款新的专用芯片扩大其人工智能硬件产品组合","title_orig":"Google broadens its AI hardware portfolio with two new specialized chips","summary":"Google's new tensor processing units (TPUs) broaden its chip portfolio to more use cases: confidential model training and more memory capacity.","summary_zh":"谷歌的新张量处理单元（TPU）将其芯片产品组合扩展到更多用例：机密模型培训和更大的内存容量。","summary_orig":"Google's new tensor processing units (TPUs) broaden its chip portfolio to more use cases: confidential model training and more memory capacity.","url":"https://techcrunch.com/2026/11/10/google-broadens-its-ai-hardware-portfolio-with-two-new-specialized-chips/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794326048.0,"tags":[],"score":81.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"44412dd85981d436","title":"Agent 从 Demo 到生产，究竟还差几步？4周实战课来了","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/gzNdPqAMp1Wh1JQ9d2JA?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794398525.0,"tags":["智能体"],"score":75.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"a99c652d6ace8f7b","title":"Anthropic 宣布额度免费重置：Pro、Max、Ultra 和 Team 用户可领，Claude 支持更多 MCP Apps 扩展","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，Anthropic 今日宣布修复了一项小 Bug，并为 Claude Pro、Max、Ultra 和 Team 用户提供一次免费的完整额度重置，覆盖所有模型及使用限制。\n\nAnthropic 表示，此前有部分小问题导致 Claude 用户的词元消耗量超出预期。虽然这些问题并未影响所有用户，但此前推出的 Fable 额度重置活动，对已经用完所有模型每周使用额度的用户帮助有限，因此公司决定额外提供一次完整额度重置，以为用户提供弥补。\n\n同时，Anthropic 宣布进一步扩大 Claude 对 MCP Apps 的支持，允许第三方开发者将完整应用界面嵌入 Claude，而不再局限于此前主要以对话内交互视图呈现的方式。\n根据 Anthropic 官方博客，此次升级支持更多 MCP 扩展能力，包括 App Tools（应用工具）和 Embedded Sites（嵌入式网站）。开发者可以将完整应用运行在 Claude 内部，用户无需在不同浏览器标签页之间切换，即可直接使用第三方应用，并让 Claude 在其中协助完成操作。\n具体而言，用户可以将连接的工具打开在 Claude 对话旁边，也可以将其扩展至全屏。Claude 能够直接修改用户当前打开的页面、表格行或文件，相关操作仍需经过用户授权，修改结果会同步显示在对应应用中。\nAnthropic 此次还介绍了多款支持交互式连接器的应用，包括 Adobe、Atlassian、Box、HubSpot 和 Notion。例如，用户可以让 Claude 编辑 Confluence 文档、修改 Box 文件、创建 N","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/292.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794361862.0,"tags":["大模型","智能体"],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"33157db345fc0a5e","title":"Oura is acquiring medical AI chatbot startup Counsel Health","title_zh":"Oura正在收购医疗AI聊天机器人初创公司Counsel Health","title_orig":"Oura is acquiring medical AI chatbot startup Counsel Health","summary":"Oura announced its quarterly earnings today and said it agreed to acquire Counsel Health for $625 million, after adding the company's AI chatbot to its app earlier this year. Counsel Health calls itself an \"AI-native primary care company,\" using the app to deliver AI-generated responses and insights based on users' health data reported from their […]","summary_zh":"Oura今天宣布了其季度收益，并表示在今年早些时候将该公司的人工智能聊天机器人添加到其应用程序之后，同意以6.25亿美元收购Counsel Health。Counsel Health称自己为“AI原生初级保健公司”，使用该应用程序来","summary_orig":"Oura announced its quarterly earnings today and said it agreed to acquire Counsel Health for $625 million, after adding the company's AI chatbot to its app earlier this year. Counsel Health calls itself an \"AI-native primary care company,\" using the app to deliver AI-generated responses and insights based on users' health data reported from their […]","url":"https://www.theverge.com/gadgets/1031284/oura-counsel-health-acquisition","source":"The Verge","source_id":"verge","category":"ai","lang":"en","published":1794346831.0,"tags":[],"score":77.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"adb88e055f606f79","title":"Bursts That Outlast Themselves: Persistent Degradation in Prefix-Cached Agent Serving","title_zh":"超越自身的突发：前缀缓存代理服务的持续降级","title_orig":"Bursts That Outlast Themselves: Persistent Degradation in Prefix-Cached Agent Serving","summary":"LLM agents drive inference engines with closed-loop sessions whose context grows every turn, and serving them economically depends on prefix caching: a hit costs an incremental prefill of about a thousand tokens, a miss recomputes a 10--40K-token context. We show that this makes prefix-cached agent serving metastable. With an identical base workload, a few minutes of extra arrivals leaves a vLLM server in a degraded regime--a ~10% hit ratio, about half the throughput, and a backlog that grows for the remaining 70 minutes--while its no-burst twin stays healthy (9 of 12 pairs; none in the reverse direction). The regime appears at loads the cache-warm server sustains, is absent without prefix c","summary_zh":"LLM代理通过闭环会话驱动推理引擎，其上下文每次都会增长，并且经济地提供服务取决于前缀缓存：命中成本约为1000个令牌的增量预填充，未命中则重新计算10--40K-令牌上下文。我们","summary_orig":"LLM agents drive inference engines with closed-loop sessions whose context grows every turn, and serving them economically depends on prefix caching: a hit costs an incremental prefill of about a thousand tokens, a miss recomputes a 10--40K-token context. We show that this makes prefix-cached agent serving metastable. With an identical base workload, a few minutes of extra arrivals leaves a vLLM server in a degraded regime--a ~10% hit ratio, about half the throughput, and a backlog that grows for the remaining 70 minutes--while its no-burst twin stays healthy (9 of 12 pairs; none in the reverse direction). The regime appears at loads the cache-warm server sustains, is absent without prefix c","url":"https://arxiv.org/abs/2611.13412v1","source":"arXiv cs.AI","source_id":"arxiv_ai","category":"ai","lang":"en","published":1794271611.0,"tags":["大模型","智能体"],"score":73.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f9ddc69f831717b4","title":"Adobe brings AI agents and new creative tools to Photoshop, Premiere, and Firefly","title_zh":"Adobe将AI代理和新的创意工具引入Photoshop、Premiere和Firefly","title_orig":"Adobe brings AI agents and new creative tools to Photoshop, Premiere, and Firefly","summary":"Adobe is taking on Figma with a new prototype builder tool in Firefly.","summary_zh":"Adobe正在Firefly中使用新的原型构建器工具来对抗Figma。","summary_orig":"Adobe is taking on Figma with a new prototype builder tool in Firefly.","url":"https://techcrunch.com/2026/11/10/adobe-adds-more-ai-to-its-products-and-launches-an-mcp/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794319510.0,"tags":["智能体"],"score":81.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c532f3a42db53b8b","title":"Cloudflare 推出面向 AI 应用程序的 Web Search API","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/SgXuVvzbHr8lKrihTAZW?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794395160.0,"tags":[],"score":75.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c5fc08c856e26611","title":"Chinese Short Dramas Own Overseas Attention but Not Yet the Profits","title_zh":"","title_orig":"","summary":"Vertical micro-dramas from Chinese teams now command extreme mobile engagement abroad. The real product is a paid-hook, ad-bought industrial system, not cultural soft power. Thin margins, rising user-acquisition costs, and copycats will decide whether the boom becomes a lasting business.","summary_zh":"","summary_orig":"","url":"https://www.tmtpost.com/8200340.html","source":"钛媒体","source_id":"tmtpost","category":"ai","lang":"zh","published":1794312006.0,"tags":[],"score":73.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"ee7b3c26684447e7","title":"AI is becoming an information gateway. Audiences still don’t want it making news","title_zh":"人工智能正在成为信息网关。观众仍然不希望它成为新闻","title_orig":"AI is becoming an information gateway. Audiences still don’t want it making news","summary":"Article URL: https://www.niemanlab.org/2026/11/ai-is-becoming-an-information-gateway-audiences-still-dont-want-it-making-their-news/\n\nComments URL: https://news.ycombinator.com/item?id=50448174\n\nPoints: 22\n\n# Comments: 10","summary_zh":"文章网址： https://www.niemanlab.org/2026/11/ai-is-becoming-an-information-gateway-audiences-still-dont-want-it-making-their-news/\n\n评论网址： https://news.ycombinator.com/item?id=50448174\n\n积分： 22\n\n#评论： 10","summary_orig":"Article URL: https://www.niemanlab.org/2026/11/ai-is-becoming-an-information-gateway-audiences-still-dont-want-it-making-their-news/\n\nComments URL: https://news.ycombinator.com/item?id=50448174\n\nPoints: 22\n\n# Comments: 10","url":"https://www.niemanlab.org/2026/11/ai-is-becoming-an-information-gateway-audiences-still-dont-want-it-making-their-news/","source":"Hacker News","source_id":"hn","category":"ai","lang":"en","published":1794356133.0,"tags":[],"score":77.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"4c19f4a5e4885ddc","title":"The PlayStation Plus PC app is shutting down next month","title_zh":"PlayStation Plus PC应用程序将于下个月关闭","title_orig":"The PlayStation Plus PC app is shutting down next month","summary":"Sony is retiring the PlayStation Plus app for PC on December 10th. Sony says it will notify users directly about the shutdown. The app allowed PlayStation Plus Premium subscribers to stream certain games on PC, but according to Sony, not many people are using that perk: With a very small number of eligible PlayStation Plus […]","summary_zh":"","summary_orig":"Sony is retiring the PlayStation Plus app for PC on December 10th. Sony says it will notify users directly about the shutdown. The app allowed PlayStation Plus Premium subscribers to stream certain games on PC, but according to Sony, not many people are using that perk: With a very small number of eligible PlayStation Plus […]","url":"https://www.theverge.com/games/1031144/sony-playstation-plus-windows-pc-app-shutting-down","source":"The Verge","source_id":"verge","category":"ai","lang":"en","published":1794339652.0,"tags":[],"score":77.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"7e89114282b1e80b","title":"The AI Era's Lines of Code? A Case Study on What an Engineer's Token Spend Measures","title_zh":"人工智能时代的代码线？工程师代币支出衡量标准的案例研究","title_orig":"The AI Era's Lines of Code? A Case Study on What an Engineer's Token Spend Measures","summary":"Organizations use engineers' token spend to monitor AI adoption, set budgets, and measure productivity, but the metric's relationship with engineering output is unclear. We link five weeks of token usage in coding agents to the commits of 404 engineers at JetBrains, and analyze a company survey of 412 employees. We find that token spend varied mostly between engineers, and which engineers spent the most stayed largely the same over the five weeks. Among weeks with similar commit counts, the 90th percentile of spend was 39 to 240 times the 10th. Within an engineer, doubling spend was associated with about 10% more commits. Available work metrics explained 38% of the variation in spend between","summary_zh":"组织使用工程师的代币支出来监控人工智能的采用、设定预算和衡量生产力，但该指标与工程输出的关系尚不清楚。我们将编码代理中五周的代币使用情况与JetB的404名工程师的承诺联系起来","summary_orig":"Organizations use engineers' token spend to monitor AI adoption, set budgets, and measure productivity, but the metric's relationship with engineering output is unclear. We link five weeks of token usage in coding agents to the commits of 404 engineers at JetBrains, and analyze a company survey of 412 employees. We find that token spend varied mostly between engineers, and which engineers spent the most stayed largely the same over the five weeks. Among weeks with similar commit counts, the 90th percentile of spend was 39 to 240 times the 10th. Within an engineer, doubling spend was associated with about 10% more commits. Available work metrics explained 38% of the variation in spend between","url":"https://arxiv.org/abs/2611.13396v1","source":"arXiv cs.AI","source_id":"arxiv_ai","category":"ai","lang":"en","published":1794269846.0,"tags":["智能体"],"score":73.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f37b680abcf7adcb","title":"Control Room: A central system to track and stop model workloads across our research infrastructure","title_zh":"控制室：一个中央系统，用于跟踪和停止整个研究基础设施的模型工作负载","title_orig":"Control Room: A central system to track and stop model workloads across our research infrastructure","summary":"Learn how OpenAI’s Control Room tracks model workloads across our research infrastructure and can rapidly stop them when safety or security concerns arise.","summary_zh":"了解OpenAI的控制室如何在我们的研究基础设施中跟踪模型工作负载，并在出现安全问题或安全问题时快速阻止它们。","summary_orig":"Learn how OpenAI’s Control Room tracks model workloads across our research infrastructure and can rapidly stop them when safety or security concerns arise.","url":"https://openai.com/index/control-room","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794229200.0,"tags":[],"score":79.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"9bfb605f2e708d66","title":"10x 工程师变成 100x 了，普通工程师还是那么普通","title_zh":"","title_orig":"","summary":"一位 CTO 用反证法证明：我们还没被 AI 取代，但理由可能和你想的不一样。 shaharglazner 是 keepalerting 的联合创始人兼 CTO，11 月 9 日他在 X 上发了篇长文《On Being an Engineer in 2026》，标题下面跟着一行小字：「我们还需要吗？」 他先承认了那种普遍的失控感。每隔一周，就有一块工作被交出去。最早是不写代码...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503514","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794305293.0,"tags":[],"score":73.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"e18f58ec7dc7acb9","title":"All 7 Anthropic founders will each cash out about $250M in IPO","title_zh":"所有7位Anthropic创始人都将在首次公开募股中兑现约$ 2.5亿","title_orig":"All 7 Anthropic founders will each cash out about $250M in IPO","summary":"Each of the seven co-founders plans to sell exactly the same number of shares in the IPO, which would bring each of them about $250 million in cash at the midpoint of the price range while leaving the group in control of the company.","summary_zh":"七位联合创始人中的每一位都计划在IPO中出售完全相同数量的股票，这将使他们在价格区间的中点获得约2.5亿美元的现金，同时让集团控制公司。","summary_orig":"Each of the seven co-founders plans to sell exactly the same number of shares in the IPO, which would bring each of them about $250 million in cash at the midpoint of the price range while leaving the group in control of the company.","url":"https://techcrunch.com/2026/11/10/all-7-anthropic-founders-will-each-cash-out-about-250m-in-ipo/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794340672.0,"tags":["融资并购"],"score":80.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"2fcf63146d057d41","title":"开源新生力：一群中学生登上 GOTC 主会场","title_zh":"","title_orig":"","summary":"上个周末，「百格成城」少年开源 AI 黑客松在北京亦庄实验中学收官。短短两天，同学们拿出的项目都很接地气：有人只用普通摄像头识别手语字母，帮听障朋友把手势转成文字和语音；有人想着家里长辈吃药容易忘，做了个吃药提醒工具，家人还能远程确认；还有人把二十四节气做成交互式网页，到立冬，就能在页面里 “包饺子”...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503507","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794295607.0,"tags":["多模态","开源"],"score":73.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"7c8a91a2ee020dca","title":"Aaron Swartz 诞辰四十周年","title_zh":"","title_orig":"","summary":"Aaron Swartz 出生于 1986 年 11 月 8 日，上周日原本是他四十岁生日。2011 年他因为从 MIT 网络下载数百万篇 JSTOR 学术论文计划免费公开而遭到逮捕，检方指控他犯有计算机欺诈等罪名，面临最高数十年监禁。2013 年 1 月 11 日他自杀身亡，年仅 26 岁。虽然他已去世 14 年但他的遗产仍然活着。Swartz 与 John Gruber 合作开发了 Markdown，一种简化的纯文本格式系统，允许用户使用普通文本创建结构化文档，不需要私有软件。Markdown 于 2004 年推出，二十多年后成为了最流行的文档和出版格式之一，广泛应用于论坛和维基等社区网站。LLM 产品和开发工具也广泛使用 Markdown。Swartz 还开发了 web.py，协助开发了 RSS 1.0。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85835","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794213774.0,"tags":[],"score":76.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"570c53d42f42c778","title":"DeepSeek Harness 日活154万，官方开始给插件作者发Token：Agent 生态要靠开发者了","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/Y7lTO7Q1M8oN5JhxhirK?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794324056.0,"tags":["大模型","智能体"],"score":73.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"18b8d2484c0234c5","title":"微软 Auto SR 正式登场：兼容华硕 ROG Xbox Ally X 掌机及部分 AMD 锐龙机型，帧率最高 120 FPS","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，当地时间 11 月 10 日，微软宣布旗下 AI 超分辨率技术 Automatic Super Resolution 正式面向 Xbox Ally X、Xbox Ally X20 以及部分搭载 AMD 锐龙处理器的 Windows Copilot+ PC 推出。\n微软 & 华硕 Xbox Ally X 用户现在可以在掌机模式下使用 Auto SR，不再需要将设备连接底座。\n\n与英伟达 DLSS、AMD FSR 等技术类似，Auto SR 是微软面向 Windows 游戏推出的 AI 超分技术，能够通过图像处理和 AI 算法提升游戏画面分辨率，在改善视觉效果的同时降低原生渲染负担。\n微软今年 4 月开始在 Xbox Ally X 上测试 Auto SR，当时该功能仅支持设备连接底座后的使用场景。此次正式推出后，玩家可以在手持设备、使用电池供电的情况下启用 Auto SR，同时新增对 1080p 游戏的支持。\n微软表示，掌机模式和 1080p 分辨率组合下的性能表现可能不如其他配置理想，但在部分较老游戏中，玩家仍能明显感受到画面质量改善。\n微软此次还引入了全新的 Performance Mode（性能模式），将 Auto SR 帧率上限从此前约 60 至 75 FPS 提高至 120 FPS。玩家可以通过 Xbox Game Bar 在 Quality（画质）和 Performance（性能）两种模式之间切换，并在游戏运行过程中调整设置。\n微软公布的演示数据显示，在《火箭联盟》中，ROG Xbox Ally X 以 720p 分辨率和高画质设置运行","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/311.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794365248.0,"tags":["芯片算力","智能体"],"score":82.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"fc6c9dc8d37c7ec9","title":"Anthropic 发布 Fable 5.2 与 Mythos 5.2，声称“8 天写出一个能开机的操作系统”","title_zh":"","title_orig":"","summary":"Anthropic 在 11 月 9 日发布了 Claude Fable 5.2 和 Claude Mythos 5.2。这两个名字看起来像两条产品线，实际上是同一个底层模型——Fable 带完整的网络安全和生物学防护，对所有用户开放；Mythos 卸掉部分限制，只通过验证计划提供给从事防御性安全或生物医学研究的机构。 对开发者来说，真正想知道的不是它能解什么难...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503499/claude-fable-and-mythos-5-2","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794281865.0,"tags":["大模型"],"score":73.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""}],"stats":{"input":271,"junk":1,"stale":4,"duplicate":0,"kept":139,"dropped_lowscore":127,"reasons":{"过期":4,"广告/导流":1},"sources_ok":20,"sources_total":21},"generated_at":1794372172.3006861},"politics":{"category":"politics","label":"时政","items":[{"id":"6613af3ef49427b5","title":"浩瀚大洋连起21个经济体 带你读懂APEC","title_zh":"","title_orig":"","summary":"浩瀚的太平洋，连接亚洲、大洋洲、北美洲和南美洲。亚太经合组织(APEC)21个经济体，因海相望，因合作相聚。亚太经合组织第三十三次领导人非正式会议即将拉开帷幕。APEC是个什么样的组织？","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gn/2026/11-11/10730035.shtml","source":"中新网 · 国内","source_id":"chinanews","category":"politics","lang":"zh","published":1794371115.0,"tags":["经济"],"score":92.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"9d0f95f77c7d8bb2","title":"以色列新一届议会议员宣誓就职 议会举行首次会议","title_zh":"","title_orig":"","summary":"中新网11月11日电 据《以色列时报》报道，当地时间11月10日，以色列第26届议会新任议员宣誓就职，议会于当天举行首次会议。新一届议会由120名议员组成。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10730001.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794366919.0,"tags":[],"score":92.0,"translated":false,"has_body":true,"to ":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"d4d6567c25bc8673","title":"特朗普称民主党针对美防长赫格塞思的弹劾“惨败”","title_zh":"","title_orig":"","summary":"中新网11月11日电 综合路透社等媒体报道，美国总统特朗普当地时间10日在社交媒体上称，民主党针对国防部长赫格塞思的弹劾努力遭遇“惨败”。他还指责民主党继续将美国“武器化”并滥用。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729998.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794366691.0,"tags":[],"score":92.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"b8e32259f4a50247","title":"市场监管总局部署多项举措 共建放心消费生态圈","title_zh":"","title_orig":"","summary":"围绕2026年全国优化消费环境月“放心消费、你我共享”主题，市场监管总局昨天(10日)召开平台企业放心消费承诺座谈会，引导平台企业作出放心消费承诺、改善消费体验。市场监管总局提出，平台要建立完善首问负责和先行赔付制度，在提高AI客服水平的同时做好与人工客服的衔接，及时处置消费纠纷。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/cj/2026/11-11/10729954.shtml","source":"中新网 · 财经","source_id":"chinanews_finance","category":"politics","lang":"zh","published":1794363930.0,"tags":["政策监管","经济"],"score":89.5,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"802cbc8d8f944a56","title":"国台办：将一如既往支持广大台商台企来大陆投资兴业","title_zh":"","title_orig":"","summary":"中新网11月11日电 11日，国务院台办举行例行新闻发布会。会上，有记者提问：台湾个人电脑品牌企业华硕、宏碁将部分泰国、越南产能转回中国大陆，这一调整近日在岛内受到关注，认为此番台企“回流”大陆，让外界再度关注两岸产业链供应链的深度嵌合。请问对此有何评论？","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gn/2026/11-11/10729992.shtml","source":"中新网 · 国内","source_id":"chinanews","category":"politics","lang":"zh","published":1794366959.0,"tags":[],"score":92.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"76cbe38eb2efa8be","title":"一艘运载4万吨俄柴油的油轮驶向纽约，却在“临门一脚”时停航？","title_zh":"","title_orig":"","summary":"中新网11月11日电 据路透社援引当地时间11月10日公布的航运数据，一艘装载约4万吨俄罗斯柴油、原计划驶往美国纽约的油轮已在美国东海岸外海停航。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729931.shtml","source":"中新网 · 国际","sour .chinanews.com.cn/gn/2026/11-11/10729985.shtml","source":"中新网 · 国内","source_id":"chinanews","category":"politics","lang":"zh","published":1794366465.0,"tags":[],"score":92.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"048f7edebc56a7d5","title":"2026年中英清洁能源合作论坛举行","title_zh":"","title_orig":"","summary":"中新网伦敦11月10日电 (记者 欧阳开宇)11月10日，中国驻曼彻斯特总领事唐锐出席2026年中英清洁能源合作论坛。曼彻斯特市议会副议长罗林斯、英能源安全与净零排放部主管官员科维、武汉市人民政府外事办公室副主任李军、英国中国商会副会长杨亚美以及两国知名企业和专家学者150人参会。英国驻华贸易使节韩瑞芬发表视频致辞，李军宣读了武汉市长熊征宇的致辞。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729960.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794364693.0,"tags":["经济"],"score":92.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"7941ac4067ddfcda","title":"直播间买到假货谁来赔？典型案例厘清商家、主播、平台责任","title_zh":"","title_orig":"","summary":"电商的促销活动中，网络直播带货中，有些主播会作出“保证正品”“售后兜底”“假一赔十”等承诺，这些口头承诺算不算数，有没有法律效力？一旦买到假货，销售商家、带货主播、网络平台，到底谁来兑现赔偿？来看最高人民法院发布的一起典型案例。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/sh/2026/11-11/10730032.shtml","source":"中新网 · 滚动","source_id":"chinanews_scroll","category":"politics","lang":"zh","published":1794370242.0,"tags":[],"score":87.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"cbf435d286a6a9eb","title":"国家卫健委发布新冠病毒疫苗第二剂次加强免疫接种实施方案","title_zh":"","title_orig":"","summary":"为深入贯彻落实党中央、国务院决策部署，进一步做好新冠肺炎疫情应对工作，保障人民群众生命安全和身体健康，经研究，现提出新冠病毒疫苗第二剂次加强免疫接种实施方案。","summary_zh":"","summary_orig":"","url":"http://www.news.cn/politics/2022-12/14/c_1129207117.htm","source":"新华网 · 时政","source_id":"xinhua_pol","category":"politics","lang":"zh","published":null,"tags":[],"score":85.5,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"7c2c0c017bcf7839","title":"开放朋友圈越扩越大 一组数据看进博 “成绩单”","title_zh":"","title_orig":"","summary":"11月10日，第九届中国国际进口博览会在上海闭幕。六天的展期，交出了一份怎样的进博“成绩单”？下面就通过一组数据来盘点一下。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/cj/2026/11-11/10729932.shtml","source":"中新网 · 财经","source_id":"chinanews_finance","category":"politics","lang":"zh","published":1794362271.0,"tags":[],"score":89.5,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"a6832a623e99c81e","title":"国台办：民进党当局所谓“反渗透法”是打压政治异己的工具","title_zh":"","title_orig":"","summary":"中新网11月11日电 11月11日，国务院台办举行例行新闻发布会。有记者问，据报道，民进党当局称，因应“跨国镇压”犯罪，已启动修订“反渗透法”程序，增订罪责并加重处罚。陆委会称，未来将设立通报专线，协助“受害”民众。请问对此有何评论？","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gn/2026/11-11/10729991.shtml","source":"中新网 · 国内","source_id":"chinanews","category":"politics","lang":"zh","published":1794366415.0,"tags":[],"score":92.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"a8c005f0371d202b","title":"巴黎中国文化中心举办“中国味道”主题沙龙活动","title_zh":"","title_orig":"","summary":"中新网巴黎11月11日电 巴黎中国文化中心当地时间6日晚举办“聊聊”第五期“中国味道”主题沙龙。本次活动将趣味汉语学习与中华饮食文化相结合，邀请中文学习者和中国文化爱好者在轻松愉快的氛围中，以语言为桥梁、以味觉为线索，开启一场跨越古今的文化探索之旅。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729956.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794364687.0,"tags":[],"score":92.0,"translated":false,"has_body":true,"topic":"","kind":"news","journal":"","year":""},{"id":"cef42063ccb86713","title":"巴西：里约华社纪念孙中山先生诞辰160周年","title_zh":"","title_orig":"","summary":"中新网圣保罗11月11日电 (记者 林春茵)当地时间11月9日，中国驻里约热内卢总领馆和巴西中国浙江商会等里约各华人社团共同举办纪念孙中山先生诞辰160周年座谈会暨“大道同行——孙中山先生与华侨”专题图片展开幕式。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/hr/2026/11-11/10730027.shtml","source":"中新网 · 滚动","source_id":"chinanews_scroll","category":"politics","lang":"zh","published":1794370206.0,"tags":[],"score":87.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"229a862edfc3caf2","title":"老年人现在打疫苗晚不晚？
