料中相关信息来源于基金管理人认为可靠的公开资料，相关观点、评估和预测仅反映当前的判断，后续可能有所变化。本材料所含任何市场观点的内容皆基于相应的假设条件，而任何假设条件都可能随时发生变化。基金管理人不承诺、不保证任何具有预测性质的市场观点必然得以实现。材料中提及的个股不构成投资推荐或建议。ETF基金的二级市场涨跌幅不代表基金实际收益率，请投资者关注场内价格波动风险。\n\n未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\n\n原创新闻有连云 · 2026/11/11 11:34来源：界面新闻","body_orig":"","translated":false},"cdc384b7cbd883c4":{"body":"IT之家 11 月 11 日消息，阿里巴巴今日官宣，全新一代千问大模型 Qwen4 即将发布：知识理解更深入，世界感知更立体，Coding 与 Agentic 能力持续进阶。\n\n现在，Qwen4-Max 预览版已首发上线阿里 Token Plan，限时最低 1 折即可体验 Qwen4 模型。同时，千问办公、Qoder、千问 App、QwenStudio 等也已第一时间接入新模型。\n\nIT之家查询了解到，阿里 Token Plan 个人版 Lite / Essential 日常限时价 39 元 / 月起，活动期间新客折上再享 5 折，低至 19.5 元。","body_orig":"","translated":false},"1aa894a8070b2461":{"body":"南方基金旗下通信ETF南方(159511)标的指数强势上涨2.25%，AI算力浪潮重塑光纤行业逻辑、供需缺口或将持续扩大\n\n截至2026年11月11日 11:30，通信ETF南方(159511)换手4.68%，成交1227.46万元，跟踪指数中证通信服务指数(000936)强势上涨2.25%。\n\n消息面上，近日，中国电信研究院、长飞公司联合中兴通讯，在1007.48公里空芯光纤链路上完成全球首个千公里双向实时传输验证，总容量达128Tb/s，单程传输仅需3.43毫秒。空芯光纤被视为下一代光通信的关键介质，此次突破将实时传输距离纪录推至新高度，标志着我国在新型光纤领域取得里程碑式进展。\n\n机构指出，AI算力浪潮将重塑光纤行业逻辑，智算中心光纤用量较传统数据中心有数倍提升，行业供需缺口或将持续扩大。伴随高毛利特种光纤需求快速放量，行业将摆脱传统普通光纤薄利模式，整体开启景气上行、价值重估的全新周期。CRU预测2025至2030年全球数据中心光纤需求年均增速达20.74%，2027年全球光纤供需缺口或扩大至1.5亿至2亿芯公里。\n\n通信ETF南方(159511)紧密跟踪中证通信服务指数，指数前三大权重股分别为中际旭创、新易盛、中国电信，场外联接(A：020704；C：020705)。\n\n未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\n\n原创新闻有连云 · 2026/11/11 11:56来源：界面新闻","body_orig":"","translated":false},"508a465c2ee7ad9c":{"body":"南方基金旗下创业板人工智能ETF南方(159382)标的指数反复活跃涨超2%，AI算力侧投资加码驱动光通信净利延续高增\n\n截至2026年11月11日 11:10，创业板人工智能ETF南方(159382)盘中换手5.61%，成交8536.73万元，跟踪指数创业板人工智能指数(970070)强势上涨2.19%。\n\n据报道，11月3日，国内光模块龙头企业在投资者关系活动中给出了明确的订单能见度信号：2027年绝大部分订单已覆盖全年；2028年至少已有一家重点客户给出明确需求指引，且“需求强劲”，其他客户指引仍在收集中。公司同时澄清“海外客户砍单”传言，明确绝大部分客户未下修需求或订单，数据中心客户拿货节奏正常，光模块供应整体仍偏紧；2027年800G、1.6T产品的年降幅度有限，“有些产品价格甚至未出现降价”。\n\n华泰证券研报显示，2026年第三季度通信行业合计营收/归母净利润分别同比增长13.05%/15.17%，整体延续稳健增长态势。细分来看，光模块&光芯片&光器件、光纤光缆板块中头部厂商AI归母净利润持续兑现。展望2026年第四季度及2027年，华泰证券认为全球AI算力侧投资加码有望驱动光通信板块归母净利润延续高增长。这一判断从行业总量层面验证了光模块景气度的持续性。\n\n创业板人工智能ETF南方(159382)紧密跟踪创业板人工智能指数，指数前三大权重股分别为中际旭创、新易盛、天孚通信，场外联接(A：024725；C：024726)。\n\n未经正式授权严禁转载本文，侵权必究。如需转载请联系：youlianyunpindao@163.com\n\n以上内容与数据仅供参考，与界面有连云频道立场无关，不构成投资建议，使用前请核实。据此操作，风险自担。\n\n原创新闻有连云 · 2026/11/11 11:34来源：界面新闻","body_orig":"","translated":false},"86b7b41309e7b8e9":{"body":"每个人都受两种教育，一种来自别人，另一种更重要的是来自自己。--爱德华·吉本\n\n本站提到的所有注册商标属于他们各自的所有人所有，评论属于其发表者所有，其余内容版权属于 solidot.org(2009- ) 所有 。\n\n京ICP证161336号 京ICP备15039648号-15 北京市公安局海淀分局备案号：11010802021500\n\n举报电话：010-62641205 涉未成年人举报专线：010-62641208 举报邮箱：jubao@zhiding.cn 网上有害信息举报专区：https://www.12377.cn","body_orig":"","translated":false},"571fb0494bf3f24f":{"body":"Anthropic推出Claude Meetings，将工作场所的讨论转化为计划和任务","body_orig":"OpenAI has acquired an AI travel agent called Odessia, according to Odessia’s founder, Francis Davidson. Davidson says in a post announcing the deal that he’s now working for OpenAI, helping the AI lab with the future of travel.\n\nTerms of the deal were not disclosed, but this looks like an acqui-hire. Davidson’s announcement focused largely on how he built his AI travel agent Odessia by directing teams of AI agents. The year-old Odessia raised a $6 million pre-seed round led by Sequoia and launched its AI travel agent around five months ago. Davidson says that it had helped early adopters plan millions of dollars’ worth of travel, but the tool has already been shut down.\n\nAn OpenAI spokesperson confirmed the hire to TechCrunch. “We’re thrilled to welcome Francis to OpenAI. Francis is a proven founder who has built multiple businesses to help people travel, and we’re excited he’s chosen to build with us.”\n\nHowever the AI lab has not announced new travel-specific products or plans. It does, however, count such companies as Bookings.com, Expedia, and KAYAK as customers or partners. Travel is also one of the main areas that people are using personal AI assistants to help with. And, back in July 2025, when OpenAI launched its ChatGPT agent, it mentioned travel as one of its potential uses.\n\nOpenAI’s spokesperson didn’t have more to share on its plans for travel-related products, except to say that travel is one of the areas that chatbot users frequently ask about. “1.2 billion people turn to ChatGPT each week for help with everyday tasks — from understanding their health, figuring out what to make for dinner, building a budget, and even planning a trip. We see a real opportunity to make these experiences even more useful,” the spokesperson said.\n\nAcquiring Odessia is interesting for another reason. Davidson is well known in the travel industry after he founded a travel startup called Sonder as a college student in 2014. It was sort of like Airbnb, but it focused on short-term leasing of upscale apartments in major cities worldwide. The pandemic badly hurt it, and as it climbed out of that rut, it went public via a SPAC but didn’t raise as much money as it needed, Davidson later said in a post announcing his resignation as CEO in June 2025.\n\nWhen a key partnership with Marriott fell through, the company went into bankruptcy and wound down. The bankruptcy trustee sold Sonder’s name, trademarks, and website domain in 2026 to TravelAI, and that website operates as a curated guide to the kind of travel rental properties that Sonder was once known for. Prior to its downfall, Davidson had built Sonder into a unicorn with $143 million in revenues. While Sonder was not, ultimately, a success story, Davidson is the kind of battle-scarred founder that Silicon Valley often values.\n\nSo we’ll have to wait and see what OpenAI has in store now with travel, now that he’s joined the company.\n\nNote: This story was updated with OpenAI’s comments.\n\nWhen you purchase through links in our articles, we may earn a small commission. This doesn’t affect our editorial independence.\n\nGet an Early Peek at the Next TechCrunch Disrupt\n\nDisrupt, Startup Battlefield, and more will return next year, and you can be at the front of the line.\n\nAnthropic launches Claude Meetings to turn workplace discussions into plans and tasks\n\nJensen Huang’s alleged honeypot scandal has inspired some top-notch memes\n\nWaymo robotaxis kept illegally passing school buses after software fix, feds say\n\nMusk says Tesla will refund some Cybertruck deposits, defends decision to end production\n\nTesla will stop making the Cybertruck in 2027\n\nClaude can now analyze your spending with its new Personal Finance tool\n\nHarbinger raises $240M after expanding into defense","translated":true},"868a67cda63cc6a2":{"body":"IT之家 11 月 11 日消息，龙芯中科昨日宣布，基于自研智能机器车完成 ROS2 Jazzy 版本的全栈移植，贯通建图定位、手柄遥控、机械臂控制与深度视觉的完整链路。整车由龙芯 2K3000 处理器统一调度，具备环境感知与目标抓取能力。\n\nROS2（IT之家注：机器人操作系统第二版，Robot Operating System 2，机器人领域主流的开源中间件框架）凭借跨平台与分布式通信特性，将传感器、算法与执行器连成可复用的网络。本次全栈移植验证形成了一套可复用的国产机器人开发方案。\n\n其核心算力来自龙芯 2K3000。该芯片采用 12nm 制程，集成 8 个基于自主龙架构的 LA364E 处理器核心，主频最高 2.5GHz。缓存配置为一级指令与数据缓存各 64KB，二级缓存共享 6MB。\n\n龙芯方面披露，其单核性能可对标 ARM Cortex-A76 级别处理器，实测 SPEC CPU 2006 Base 单核定点分值达到 30 分。\n\n感知系统分为两条链路。车身侧置激光雷达负责平面感知，机械臂末端的深度相机负责三维深度感知。龙芯针对室内场景完成参数校调，配合里程计互补，提升定位稳定性与建图完整度。\n\n底盘控制方面，小车搭载麦克纳姆轮，通过组合四个电机转速，实现前后、横移、旋转与斜向的全向运动。主控板直插 USB 手柄，龙芯自研程序将摇杆量翻译为速度指令，并设有死区过滤与安全使能键。\n\n龙芯方面表示，后续将补齐急停与看门狗功能，将动作组接入上层程序，并推进检测与点云融合的三维目标定位。从建图定位到机械臂抓取的完整链路，验证了龙芯 2K3000 在机器人运算处理与实时控制场景中的可行性，可为工业自动化、智能仓储等原型开发提供参考方案。","body_orig":"","translated":false},"6fcd75d626ddcf98":{"body":"Anthropic推出Claude Meetings，将工作场所的讨论转化为计划和任务","body_orig":"David Turturean, a recent MIT graduate and a member of the technical staff at the startup lab Physical Superintelligence (PSI), used early access to Anthropic’s Fable 5.2 model to solve an 18-year-old problem about quantum computing.\n\n“I’m totally accepting the idea that this might be the last paper I ever put out,” Turturean, who deferred plans to pursue a master’s at MIT’s prestigious computer science and AI lab to join PSI, told TechCrunch. “In a few months, like, why would you even put out a paper?”\n\nThe problem in question, the Aaronson-Ambainis conjecture, concerns the ability of quantum computers to solve problems faster than classical ones. Scott Aaronson, one of the two researchers who posed the problem, writes that he doesn’t quite understand the proof but that he believes it’s correct because it was autoformalized in Lean, a coding language for math, and explained by a team of top researchers with whom PSI shared the solution.\n\nThe solution appears to close the door on one avenue quantum computers could follow to solve certain difficult problems at high speed, but not all of them. “It’s a negative result that allows people to know, okay, we’re no longer looking there,” Turturean said.\n\nMore broadly, it reflects the upheaval in the scientific world caused by AI problem-solving.\n\n“A proof of full [Aaronson-Ambainis conjecture] was one of the last remaining open problems in quantum query complexity that everyone seemed to agree was centrally important,” Aaronson, who described himself feeling satisfied, awestruck, disappointed, and fatigued by the news, wrote. “I was surprised, honestly, to see it missing from OpenAI’s Mathocalypse dump a few weeks ago. Surely they tried it, so was it really so much harder than all the problems that were solved?”\n\nThat’s a point in favor of PSI’s model, which is to solve scientific problems with specialized model harnesses and scaffolding.\n\n“An effective kind of research system should have lots of things related to harnesses, lots related to tools, memory systems, simulation infrastructure,” PSI CEO Matt Pines told TechCrunch. “You want to be able to really go after a problem at breadth and depth, and be able to consider a wide range of potential alternatives.”\n\nFor now, the company’s revenue comes from using its tools to optimize data centers, simulating the variables of heat, power, water, sound — “where the performance of that site as well as its impact on the community are a direct function of its physics.” The long play, however, is converting theoretical physics breakthroughs into actual technologies.\n\n“Six to nine months ago, when I was talking to investors, like I had to sort of stretch to validate that conditional, right? Like, ‘no, no, no, trust me, pretty soon, theoretical physics is going to be mostly the domain of machines,’” Pines said. “And it’s not there yet, but it’s on its way.”\n\nStill, while AI has claimed important solutions in fields like mathematics and computer science where it’s possible to express them in validated code, doing so in less abstracted disciplines like the life sciences or physics has proven more difficult. Last week, the startup Discovered Materials released a $1 million grand challenge for researchers using AI to understand problems like superconductivity and heat dissipation.\n\n“At the end of the day, physics is different than math because it’s the real world … nature gets a vote in your models of reality,” Pines said. He said the startup is focused on understanding how to take computational results and validate them with experiments in the most efficient way possible.\n\n“If it’s a true fact of nature, that’s a trick that you can exploit,” Pines said. “You could build a device out of it, right? The AI suggests an idea; it allows you to do something in the world you weren’t able to do before … and so each of those are kind of loops that PSI is building.”\n\nAs “neolabs for science” become a pathway for potentially groundbreaking science, the participants are still figuring out what the standards are for this new world. Because PSI had to hold its result until Anthropic’s model was nearly ready for release, they were able to share it with relevant researchers to better understand it.\n\n“As an academic, we wanted to play our role in doing things the right way,” Jim Halverson, a professor at Northeastern University who advises PSI, said. He’ll be attending a summit at MIT next week where leading physicists will try to hash out a response to the new pace of science. “Best practices are still emerging … We figured that transparency is a good way to go, and contacting experts is a good way to go.”\n\n“We had some time to sit on it … and it was the first time that I actually took one of my AI-elicited solutions on print, and I read through it, and I was like, okay, how can I make this … be presented more naturally for a human?” Turturean, who said the academic community will expect him to be able to explain the result, told TechCrunch. “And I think it also made me realize, oh my God, the weight of what AI can do.”\n\nWhen you purchase through links in our articles, we may earn a small commission. This doesn’t affect our editorial independence.\n\nGet an Early Peek at the Next TechCrunch Disrupt\n\nDisrupt, Startup Battlefield, and more will return next year, and you can be at the front of the line.\n\nAnthropic launches Claude Meetings to turn workplace discussions into plans and tasks\n\nJensen Huang’s alleged honeypot scandal has inspired some top-notch memes\n\nWaymo robotaxis kept illegally passing school buses after software fix, feds say\n\nMusk says Tesla will refund some Cybertruck deposits, defends decision to end production\n\nTesla will stop making the Cybertruck in 2027\n\nClaude can now analyze your spending with its new Personal Finance tool\n\nHarbinger raises $240M after expanding into defense","translated":true},"d3066b7d90e37859":{"body":"从2万亿美元到1万亿美元，全球AI估值体系正在经历一次现实检验。\n\nAnthropic的IPO，原本被视为全球人工智能产业的一场资本盛宴。\n\n这家Claude大模型的开发商，计划登陆纳斯达克，成为全球资本市场第一批接受公开市场检验的顶级AI实验室之一。按照此前投资者的预期，其上市估值一度有望达到2万亿美元。\n\n先是2万亿美元的估值预期降至1.5万亿美元。随后，随着科技股调整、AI基础设施融资成本上升以及投资者重新审视公司的财务表现，部分潜在投资者开始讨论1万亿美元左右的估值。\n\n从2万亿美元到1万亿美元，意味着市场对Anthropic的估值预期可能打了五折。\n\n对于一家收入仍在高速增长的AI公司来说，1万亿美元依然是一个惊人的数字，但真正值得关注的是投资者为什么开始不愿意为它支付此前那么高的价格。\n\n过去两年，中国大模型公司同样享受着全球AI产业带来的估值溢价。智谱、MiniMax、月之暗面、DeepSeek等企业，已经成为资本市场关注的对象。\n\n当全球最具代表性的AI公司开始接受估值重估，国内大模型公司也将面临一次新的考验。\n\n相反，它的收入增长速度，仍然处于全球科技行业最前列。\n\n根据公司提交给美国证券交易委员会的IPO文件，2026年第一季度，Anthropic实现收入47.31亿美元；第二季度收入达到115.55亿美元；第三季度进一步增长至169.56亿美元。\n\n这个数字并不低，但与此前的增长速度相比，已经出现明显放缓。第二季度收入较第一季度增长约144%，而第三季度的环比增速降至47%左右。\n\n换句话说，Anthropic仍在快速增长，但增长的加速度正在下降。\n\n此前，市场愿意给Anthropic接近2万亿美元的估值，很大程度上是因为投资者相信，生成式AI将成为一个持续扩张的市场，而Anthropic有机会成为其中最重要的基础设施提供商。\n\nClaude在企业客户、软件开发和智能体应用中的渗透，为这种预期提供了支撑。\n\n当一家公司的收入规模已经达到数百亿美元，投资者不会只关心它还能增长多少，也会开始追问：增长需要付出多大的成本？新增收入能否覆盖新增算力？利润率是否能够稳定下来？\n\n2026年前三季度，公司累计收入达到332.42亿美元，远高于上年同期的25.45亿美元。\n\n同期，公司按照美国通用会计准则计算的营业亏损为12.6亿美元。\n\n如果按照公司自行定义的调整后营业利润计算，情况则有所不同：前三季度调整后营业利润达到40.81亿美元。\n\n以第三季度为例，Anthropic实现调整后营业利润24.63亿美元，但按照GAAP口径，公司仍录得5.67亿美元营业亏损。\n\n差异主要来自股份支付费用和非现金慈善捐赠等项目。公司第三季度分别将约10.7亿美元股份支付费用和19.6亿美元非现金慈善捐赠从调整后营业利润中剔除。\n\n调整后盈利能够反映部分经营效率的改善，但投资者仍需要判断，这些调整项目中有多少具有持续性，以及股权激励带来的稀释成本应该如何计入估值。\n\nAnthropic在IPO文件中披露，截至2026年9月30日及此后签订的算力采购和租赁协议，累计承诺支出约8954亿美元。\n\n其中，约4475亿美元预计将在2030年底前发生，未来12个月需要支付的金额约698亿美元。\n\n这不是一笔需要立即支付的账单，而是分布在未来多年、涉及算力采购和基础设施租赁的长期承诺。\n\n截至2026年9月底，Anthropic拥有约1466亿美元流动性，包括现金、短期投资和可用信贷额度。\n\n数字看起来足够庞大，但也说明了一件事：前沿大模型的竞争，已经不仅是研发投入的竞争，更是资本组织能力的竞争。\n\n企业必须提前锁定数据中心、芯片和电力资源，才能保证模型训练与商业服务不受算力短缺影响。\n\n如果模型需求持续增长，这些投入最终可以转化为规模优势；如果收入增长放缓，或者新一代模型很快改变市场竞争格局，提前签订的长期算力合同就可能成为沉重的财务负担。\n\nAnthropic的估值变化，实际上反映了投资者对这笔长期投资开始变得谨慎。\n\nAnthropic的估值变化之所以值得中国市场关注，是因为国内大模型公司的估值体系，同样建立在对未来市场空间的判断之上。\n\n过去一段时间，资本市场对大模型公司的关注，主要集中在三个方面：\n\n一是模型能力能否达到全球领先水平；二是Token消耗量能否持续增长；三是企业能否在全球AI产业链中占据重要位置。\n\n这些指标当然重要，但它们并不直接等于收入，更不等于利润。\n\n美国智库Rhodium Group在2026年9月发布的一份中国AI融资研究报告中，给出了一组值得关注的数据。\n\n该机构统计的七家中国头部AI模型开发商，包括DeepSeek、月之暗面、智谱、MiniMax、阿里巴巴、字节跳动和快手。\n\n这些公司的AI模型业务年化经常性收入（ARR）合计约107亿美元，仅相当于OpenAI和Anthropic两家公司相关收入规模的约10%。\n\n中国大模型公司的用户规模和模型调用量正在增长，但从商业化收入来看，与美国头部企业仍然存在明显差距。\n\n按照Rhodium Group当时的估算，Anthropic的估值与ARR之比约为21倍，OpenAI约为34倍。\n\n尽管这些数字来自研究机构对企业估值和ARR的估算，并非统一口径下的公开市场市销率，不能直接视为完全可比的交易倍数，但它们至少说明一个问题：中国部分大模型公司的估值，已经包含了相当高的未来增长预期。\n\n这意味着，一旦全球AI公司的估值锚发生变化，国内企业也很难完全置身事外。\n\n过去，市场愿意为中国大模型公司的技术突破、国产替代和全球竞争潜力支付溢价。\n\n现在，投资者可能会提出更具体的问题：这些公司究竟有多少收入来自真实付费客户？API业务能否形成稳定的规模效应？模型调用量增加之后，毛利率是否也会同步改善？\n\n中国大模型公司面临的另一个问题，是商业模式与美国头部企业并不完全相同。\n\nAnthropic的商业化路径相对清晰：通过Claude订阅、API调用以及企业级服务，将模型能力直接出售给客户。\n\n对于企业来说，只要模型能够帮助其提高软件开发效率、降低运营成本或者替代部分人工工作，企业就有理由为这些能力付费。\n\n一方面，国内云厂商、互联网公司和独立模型企业同时参与竞争；另一方面，开源模型的普及大幅降低了企业部署大模型的门槛。\n\n模型能力越强，用户越容易获得低成本的智能服务，但模型开发商未必能够从中获得与模型价值相匹配的收入。\n\n例如，一家企业可以使用开放权重模型自行部署，也可以通过第三方云服务商获得API服务。模型开发商即使获得了大量用户，也不一定能够从所有调用中直接获得收入。\n\nRhodium Group在报告中专门提到了这一问题。\n\n在开放权重模型的商业模式下，如果第三方云服务商部署模型并对外提供API服务，模型开发商未必能够从中获得收入分成。\n\n月之暗面和阿里巴巴已经开始尝试与主要模型使用方建立收入分成机制，但这仍然需要时间验证。\n\n与此同时，国内市场的价格竞争也在压低模型公司的利润空间。\n\nRhodium Group的研究指出，中国企业客户的付费意愿、激烈的市场竞争以及开放权重模型的广泛应用，都在限制大模型公司的定价能力。\n\nAnthropic面临的问题，是如何在庞大的算力投入之下维持高增长和高利润率。\n\n中国大模型公司则需要同时解决两个问题：如何让模型获得更多用户，以及如何让用户愿意为模型付出足够高的价格。\n\n如果只追求Token调用量，企业可以通过降低价格迅速扩大规模。\n\n但如果收入增长速度赶不上推理成本下降的速度，规模越大未必意味着利润越高。\n\n从这个角度看，模型调用量已经不再是衡量一家AI公司商业价值的充分指标。\n\n真正重要的是，每增加一个Token，企业能够留下多少收入和毛利。\n\nAnthropic和中国大模型公司还有一个重要区别：融资结构。\n\n美国前沿AI实验室可以通过大型科技公司投资、云计算合作和公开市场融资获得资金。\n\nAnthropic的投资者和合作伙伴中，包括谷歌、亚马逊等科技巨头。这些企业既提供资本，也提供算力和商业分发渠道。\n\n中国大模型公司的融资结构则更多依赖股权融资、银行贷款以及产业资本支持。\n\nRhodium Group的研究显示，2026年前八个月，智谱、MiniMax、DeepSeek和月之暗面四家企业获得的私募股权投资、IPO融资及定向增发资金合计达到1790亿元人民币。\n\n其中，智谱今年1月通过港股IPO融资约40亿元，7月又完成约270亿元的H股定向增发。\n\n但需要注意的是，资本市场的融资能力并不等于企业自身的造血能力。\n\n对于仍处于研发投入期的大模型公司来说，股权融资可以帮助它们维持模型迭代、购买算力和扩大团队。\n\n但如果估值持续依赖下一轮融资，而不是来自经营现金流，那么一旦市场风险偏好下降，融资成本就可能明显上升。\n\n这也是Anthropic此次IPO对国内市场最重要的启示。\n\n它并不意味着中国大模型公司的估值必须跟随Anthropic下跌，也不意味着美国资本市场的定价体系可以直接套用到中国企业身上。\n\n国产算力的发展、国内企业数字化需求、产业政策支持，以及开源模型带来的低成本扩张，都可能形成独立的估值逻辑。\n\n资本市场可以为技术突破支付溢价，却很难永远为尚未兑现的商业前景买单。\n\n对于智谱、MiniMax、月之暗面和DeepSeek来说，未来真正需要证明的，可能不只是模型能否继续追赶全球领先水平，而是能否在激烈的价格竞争中建立稳定的商业模式。\n\n收入增长是否来自持续付费的企业客户，毛利率能否随着规模扩大而改善，推理成本是否持续下降，研发投入能否转化为产品收入，以及经营现金流能否逐渐覆盖算力投入。\n\n这些指标看起来没有模型参数和榜单排名那么耀眼，却决定着一家大模型公司究竟是一家技术实验室，还是一家能够持续创造利润的科技企业。\n\nAnthropic的IPO，最终可能成为全球AI产业的一次定价分水岭。\n\n现在，投资者开始要求AI公司证明，这个未来究竟能够产生多少收入，又需要消耗多少资本。","body_orig":"","translated":false},"802ed492622a1ffd":{"body":"IT之家 11 月 11 日消息，谷歌昨日（11 月 10 日）发布公告，宣布旗下域名注册管理机构 Google Registry 推出 .eat、.fly 和 .here 三款顶级域名，为企业和个人提供新的网址后缀选择。\n\nIT之家援引博文介绍，上述 3 款顶级域名各有应用侧重，其中 .eat 围绕餐饮和食品业务展开，鸡翅连锁品牌 Wingstop 已使用 wingstop.eat，制作新鲜沙拉和餐食的机器人自助售餐服务 Xook 也已采用 xook.eat。\n\n.fly 的应用涵盖旅行、无人机及科技服务，例如 AI 旅行助手 Caddy 使用 caddy.fly，电力线路巡检无人机企业 Voltair 使用 voltair.fly。\n\n.here 则突出“在这里办事”的表达。房地产平台 Zillow 使用 rent.here 和 sell.here，分别对应租房与卖房；此外，谷歌还展示了法律服务网站 lawyer.here、求职平台 apply.here，以及居家血液检测服务网站 bloodtest.here。\n\n注册方面，三款后缀已进入抢先注册阶段，用户可通过域名注册商购买尚可注册的域名，但需支付一笔一次性额外费用（在全面开放注册前每日递减）。\n\n协调世界时 11 月 17 日 16 点（北京时间 11 月 18 日零时）起，三款后缀将全面开放注册，按基础年费收费，不再收取上述抢先注册附加费。","body_orig":"","translated":false},"97c5f109dd6ca8ff":{"body":"Every result here is a program we can run and test on fresh inputs, which makes a programming game a useful benchmark. Models get what a player can inspect, through text tools instead of a mouse and screenshots: the manual, visible test inputs, registers, and game feedback. They don’t get community code or exact records, only the game’s coarse score histograms.\n\nWhy test 100,000 inputs? The game checks a small set of cases per run. Our headline count requires a fresh-game replay and 100,000 passing tests on the independent TIS-100-CXX simulator, providing stronger evidence that a program generalizes to new inputs.\n\nUndecimal Twin RounderSPEC44149538, one of the eight tournament puzzles, rounds an input to the nearest multiple of N on one output and of 11−N on the other. When we froze the leaderboard, the best community program took 2,694 cycles. Opus 5.5 passed its first program after 6.5 minutes, at 5,669 cycles. It went under the record 16 minutes in and finished at 1,918, which is 29% faster. That speed cost one more node and 28 more instructions than the old record.\n\nThe core of the program is a two-speed search. Instead of subtracting N one step at a time, nodes 5 and 6 subtract 4N until they overshoot, then add N back until the value turns positive. Each drives a small coprocessor, node 2 or node 7, by sending it jump offsets through a port, so the coprocessor works as a lookup table for 4N and N.\n\nOpus 5.5 · 8 nodes · 88 instructions · passes 100,000 of 100,000 tests\n\nLoading puzzle trajectories…\n\nBest in-game score so far, before independent testing. Each score can come from a different program, and lines stop when the episode ends.\n\nFive models got under the old record in-game. The other two cycle records are GPT-6.1 Sol’s 3,460 on Intersection IdentifierSPEC64160260, against 3,872 (11% faster), and Gemini 4 Argon’s 188 on Error: 8SPEC79324720, against 198 (5% faster). All three are on tournament puzzles, none in the main game. Of the 133 new frontier points, 18 beat a community record outright. The other 115 are new tradeoffs: better balances between the three scores than any community solution.\n\nGPT-6.1 Sol reaches 75.6 record proximity at an estimated $0.75 per puzzle. Opus 5.5 reaches 77.2 at $5.08, 7 times the cost for 2 more points. Fable 5.1 is the most expensive at $7.19 and scores 70.2.\n\nOne point per model. Upper left is better.\n\nActivity doesn’t explain quality either. GPT-6.1 Sol averages 136 game calls per puzzle at 75.6 record proximity; Gemini 4 Argon averages 41 at 76.2.\n\nMean game-tool calls per puzzle\n\nNew frontier points appear on 14 hard puzzles, 4 medium puzzles, and no easy ones. Long-running puzzles are harder to solve but easier to improve: on puzzles with a cycle record of 200 or less, 88% of episodes pass and 4% find a new point. Above 500 cycles, 76% pass and 8% find one.\n\nFull bar = solve rate · dark segment = new-frontier rate\n\nPosition = community record · circle area = fewest nodes\n\nEvery model is closest to the community on nodes and furthest on cycles. Across all 13, mean proximity is 72 for nodes, 56 for instructions, and 45 for cycles.\n\nMean proximity to each community record · higher is better\n\nEvery dot is an episode · box = middle 50% · line = median · whiskers = minimum and maximum\n\nChoose a cell to inspect the scores in the Pareto explorer.\n\nWe grouped all 55 puzzles by their main demand, then read the programs. Fifteen of the sixteen models solved all five routing puzzles, and none found a new frontier point there. The examples below show how different designs spend the same resources.\n\nFraction solved · puzzles with new points below\n\nSignal Multiplier43786 has no MUL. Gemini 4 Argon and GPT-6 Astra use JRO, a relative jump, to enter a block of repeated instructions at the right position. The jump selects how many copies of a value to send and add, saving the counter updates and branches of a multiplication loop.\n\nGemini 4 Argon’s fastest program uses two paths to multiply in parallel and a final node to interleave their outputs. It takes 436 cycles against GPT-6 Astra’s 523, about 17% faster, at a cost of two more nodes and 33 more instructions.\n\nCycles per run · lower is better\n\nSignal Window Filter60099 outputs the sums of the last three and last five inputs, so a solution has to remember history as well as add. Gemini 4 Argon’s four-node program uses SWP to rotate stored values and ADD/SUB to update running state. GPT-6.1 Sol spreads that delay and aggregation across seven nodes, passing intermediate values between them.\n\nGPT-6.1 Sol’s program runs in 318 cycles with 26 instructions; Gemini 4 Argon’s takes 428 cycles with only 17. The difference is how much of the work runs in parallel, and how much communication and code that costs.\n\nT31 Node EmulatorNEXUS.23.727.9 needs eight addressable storage slots, but the available memory nodes are stacks. These programs move values between stacks to reach the requested slot, then read or replace it. MiMo-V2.6-Pro uses counted transfer loops; Opus 5.5 uses JRO to pick among unrolled transfers, spending extra instructions to save cycles.\n\nMemory isn’t one skill: MiMo-V2.6-Pro solves this emulator but fails Sequence Mode CalculatorNEXUS.09.904.9 and Signal Window Filter60099.\n\nEach row is that model’s fastest saved program for the puzzle, picked for illustration. Not all are new frontier points.\n\nThe main benchmark hides the community’s scores. In a separate study on six puzzles, five models got:\n\nEvery model improved: GPT-6 Astra from 82.8 to 91.8, GPT-6.1 Sol from 82.9 to 90.6, Opus 5.5 from 81.4 to 89.1, Grok 4.7 from 67.5 to 75.1, and Gemini 4 Argon from 83.5 to 87.9 in mean record proximity. Scores rose in 28 of the 30 model–puzzle pairs.\n\nMean record proximity · same six puzzles per model · higher is better\n\nThe diagnostics changed what models did next. On Signal Multiplexer22280, GPT-6.1 Sol’s first passing program took 294 cycles. Its profile showed node 2 working 86% of the time while nodes 1 and 3 spent 84% blocked waiting to write to it. GPT-6.1 Sol moved the branching out of node 2 and into those two neighbors. The next run took 204 cycles, 31% faster, at a cost of two more nodes and five more instructions.\n\nMean elapsed minutes per puzzle · same episodes\n\nInformation, tools, and time all changed together, so this study can’t say which addition helped most. These runs are outside the main leaderboard and the headline count.\n\nPuzzles: Signal Multiplexer, Sequence Generator, Signal Edge Detector, Interrupt Handler, Sequence Peak Detector, and Signal Error Corrector.\n\nWe submitted selected programs to the leaderboard, and the community improved on them almost immediately. On Undecimal Twin RounderSPEC44149538, @LongingForRest took Opus 5.5’s 1,918-cycle program and cut it to 1,744 by the next day. The record is now credited to both: LongingForRest/opus-5-5.\n\nNeither got there alone. The models found new tradeoffs quickly, and players read those programs, worked out why they worked, and took them further.\n\nMathematics is seeing the same shift. Terence Tao and colleagues used LLM-guided search across 67 problems and improved on the best known results in several. In “After Math,” Silvia De Toffoli and Eamon Duede argue that a result only becomes a solution once mathematicians can understand it, and that AI fits better as an assistant than a competitor. TIS-100 is a small, measurable version of that future: a model finds a better program, and people turn it into something they understand.\n\nChoose a puzzle and model, then select a point to see its scores and the program that produced it. Every puzzle also has its own page with records and the best programs: all 55 puzzles.\n\nThe plot shows cycles and instructions; node counts can differ. New frontier points are judged on all three scores.\n\nDownload all 3,714 model Pareto points (CSV) · all 3,714 programs (ZIP), also on GitHub and Hugging Face. 186 rows are marked as new frontier points, which pool to 133 across models.\n\nSuite. All 22 campaign puzzles, all 25 TIS-NET puzzles, and eight tournament puzzles from 2018: 19 easy (10 minutes), 17 medium (30), and 19 hard (45). Every model has one scored episode per puzzle. Time limits differ by difficulty, so difficulty and search time can’t be separated.\n\nScoring. Each model–puzzle pair contributes one selected attempt, with no best-of-attempts scoring, so solve rates are pass@1: a puzzle counts as solved when that one episode saved a program that replays in a fresh game. Unsolved puzzles stay in every average and score zero.\n\nNew frontier points. The reference is the community leaderboard as of October 15, 2026. Ties don’t count. Models found 154 candidate points on 23 puzzles. Our count pools and deduplicates them across models and keeps the 133 on 18 puzzles with fresh-game replay and 100,000 passing tests. Testing is strong evidence of correctness, not proof.\n\nRecord proximity. The community record divided by the model’s best score, averaged across the three scores and all puzzles, ×100. Each score can come from a different program.\n\nLimits. One episode per pair compares the configurations as tested and doesn’t measure repeated-run variability. Spread between puzzles is variation across tasks. Public puzzles may overlap with training data. Mechanic groups are our own labels.\n\nPrograms. Every model Pareto point’s program is public under the MIT License, in TIS-100 save format and named like the community leaderboard’s files (<puzzle>.<cycles>-<nodes>-<instructions>.txt). They are mirrored as one file per program on GitHub and as a table on Hugging Face. Two points replay in the game but fail some random tests; they are included and never count as new frontier points.\n\nResources. Costs are estimated from recorded October 2026 API list prices, including cache discounts. Tokens accumulate across responses, so repeated input counts again, and tokenizers differ. Game calls count individual dispatched tools, including errors, and exclude the automatic final submission.\n\nRun-early guidance adds a prompt note to test drafts early.","body_orig":"Every result here is a program we can run and test on fresh inputs, which makes a programming game a useful benchmark. Models get what a player can inspect, through text tools instead of a mouse and screenshots: the manual, visible test inputs, registers, and game feedback. They don’t get community code or exact records, only the game’s coarse score histograms.\n\nWhy test 100,000 inputs? The game checks a small set of cases per run. Our headline count requires a fresh-game replay and 100,000 passing tests on the independent TIS-100-CXX simulator, providing stronger evidence that a program generalizes to new inputs.\n\nUndecimal Twin RounderSPEC44149538, one of the eight tournament puzzles, rounds an input to the nearest multiple of N on one output and of 11−N on the other. When we froze the leaderboard, the best community program took 2,694 cycles. Opus 5.5 passed its first program after 6.5 minutes, at 5,669 cycles. It went under the record 16 minutes in and finished at 1,918, which is 29% faster. That speed cost one more node and 28 more instructions than the old record.\n\nThe core of the program is a two-speed search. Instead of subtracting N one step at a time, nodes 5 and 6 subtract 4N until they overshoot, then add N back until the value turns positive. Each drives a small coprocessor, node 2 or node 7, by sending it jump offsets through a port, so the coprocessor works as a lookup table for 4N and N.\n\nOpus 5.5 · 8 nodes · 88 instructions · passes 100,000 of 100,000 tests\n\nLoading puzzle trajectories…\n\nBest in-game score so far, before independent testing. Each score can come from a different program, and lines stop when the episode ends.\n\nFive models got under the old record in-game. The other two cycle records are GPT-6.1 Sol’s 3,460 on Intersection IdentifierSPEC64160260, against 3,872 (11% faster), and Gemini 4 Argon’s 188 on Error: 8SPEC79324720, against 198 (5% faster). All three are on tournament puzzles, none in the main game. Of the 133 new frontier points, 18 beat a community record outright. The other 115 are new tradeoffs: better balances between the three scores than any community solution.\n\nGPT-6.1 Sol reaches 75.6 record proximity at an estimated $0.75 per puzzle. Opus 5.5 reaches 77.2 at $5.08, 7 times the cost for 2 more points. Fable 5.1 is the most expensive at $7.19 and scores 70.2.\n\nOne point per model. Upper left is better.\n\nActivity doesn’t explain quality either. GPT-6.1 Sol averages 136 game calls per puzzle at 75.6 record proximity; Gemini 4 Argon averages 41 at 76.2.\n\nMean game-tool calls per puzzle\n\nNew frontier points appear on 14 hard puzzles, 4 medium puzzles, and no easy ones. Long-running puzzles are harder to solve but easier to improve: on puzzles with a cycle record of 200 or less, 88% of episodes pass and 4% find a new point. Above 500 cycles, 76% pass and 8% find one.\n\nFull bar = solve rate · dark segment = new-frontier rate\n\nPosition = community record · circle area = fewest nodes\n\nEvery model is closest to the community on nodes and furthest on cycles. Across all 13, mean proximity is 72 for nodes, 56 for instructions, and 45 for cycles.\n\nMean proximity to each community record · higher is better\n\nEvery dot is an episode · box = middle 50% · line = median · whiskers = minimum and maximum\n\nChoose a cell to inspect the scores in the Pareto explorer.\n\nWe grouped all 55 puzzles by their main demand, then read the programs. Fifteen of the sixteen models solved all five routing puzzles, and none found a new frontier point there. The examples below show how different designs spend the same resources.\n\nFraction solved · puzzles with new points below\n\nSignal Multiplier43786 has no MUL. Gemini 4 Argon and GPT-6 Astra use JRO, a relative jump, to enter a block of repeated instructions at the right position. The jump selects how many copies of a value to send and add, saving the counter updates and branches of a multiplication loop.\n\nGemini 4 Argon’s fastest program uses two paths to multiply in parallel and a final node to interleave their outputs. It takes 436 cycles against GPT-6 Astra’s 523, about 17% faster, at a cost of two more nodes and 33 more instructions.\n\nCycles per run · lower is better\n\nSignal Window Filter60099 outputs the sums of the last three and last five inputs, so a solution has to remember history as well as add. Gemini 4 Argon’s four-node program uses SWP to rotate stored values and ADD/SUB to update running state. GPT-6.1 Sol spreads that delay and aggregation across seven nodes, passing intermediate values between them.\n\nGPT-6.1 Sol’s program runs in 318 cycles with 26 instructions; Gemini 4 Argon’s takes 428 cycles with only 17. The difference is how much of the work runs in parallel, and how much communication and code that costs.\n\nT31 Node EmulatorNEXUS.23.727.9 needs eight addressable storage slots, but the available memory nodes are stacks. These programs move values between stacks to reach the requested slot, then read or replace it. MiMo-V2.6-Pro uses counted transfer loops; Opus 5.5 uses JRO to pick among unrolled transfers, spending extra instructions to save cycles.\n\nMemory isn’t one skill: MiMo-V2.6-Pro solves this emulator but fails Sequence Mode CalculatorNEXUS.09.904.9 and Signal Window Filter60099.\n\nEach row is that model’s fastest saved program for the puzzle, picked for illustration. Not all are new frontier points.\n\nThe main benchmark hides the community’s scores. In a separate study on six puzzles, five models got:\n\nEvery model improved: GPT-6 Astra from 82.8 to 91.8, GPT-6.1 Sol from 82.9 to 90.6, Opus 5.5 from 81.4 to 89.1, Grok 4.7 from 67.5 to 75.1, and Gemini 4 Argon from 83.5 to 87.9 in mean record proximity. Scores rose in 28 of the 30 model–puzzle pairs.\n\nMean record proximity · same six puzzles per model · higher is better\n\nThe diagnostics changed what models did next. On Signal Multiplexer22280, GPT-6.1 Sol’s first passing program took 294 cycles. Its profile showed node 2 working 86% of the time while nodes 1 and 3 spent 84% blocked waiting to write to it. GPT-6.1 Sol moved the branching out of node 2 and into those two neighbors. The next run took 204 cycles, 31% faster, at a cost of two more nodes and five more instructions.\n\nMean elapsed minutes per puzzle · same episodes\n\nInformation, tools, and time all changed together, so this study can’t say which addition helped most. These runs are outside the main leaderboard and the headline count.\n\nPuzzles: Signal Multiplexer, Sequence Generator, Signal Edge Detector, Interrupt Handler, Sequence Peak Detector, and Signal Error Corrector.\n\nWe submitted selected programs to the leaderboard, and the community improved on them almost immediately. On Undecimal Twin RounderSPEC44149538, @LongingForRest took Opus 5.5’s 1,918-cycle program and cut it to 1,744 by the next day. The record is now credited to both: LongingForRest/opus-5-5.\n\nNeither got there alone. The models found new tradeoffs quickly, and players read those programs, worked out why they worked, and took them further.\n\nMathematics is seeing the same shift. Terence Tao and colleagues used LLM-guided search across 67 problems and improved on the best known results in several. In “After Math,” Silvia De Toffoli and Eamon Duede argue that a result only becomes a solution once mathematicians can understand it, and that AI fits better as an assistant than a competitor. TIS-100 is a small, measurable version of that future: a model finds a better program, and people turn it into something they understand.\n\nChoose a puzzle and model, then select a point to see its scores and the program that produced it. Every puzzle also has its own page with records and the best programs: all 55 puzzles.\n\nThe plot shows cycles and instructions; node counts can differ. New frontier points are judged on all three scores.\n\nDownload all 3,714 model Pareto points (CSV) · all 3,714 programs (ZIP), also on GitHub and Hugging Face. 186 rows are marked as new frontier points, which pool to 133","translated":false},"5d01611fd6de2935":{"body":"Nvidia’s chips are powering America’s AI boom. Of course Chinese spies are interested.\n\nAs espionage targets go, Jensen Huang is perhaps one of the least surprising on Earth. The Nvidia CEO runs one of the world’s most valuable companies, controls the in-demand technology fueling the AI boom, and is cozy with presidents, CEOs, and all manner of important people. He also wears a cool leather jacket.\n\nWhich makes Huang’s admission that he had an affair with a woman suspected of being a Chinese spy — reportedly while her spying was known to US intelligence and even President Donald Trump — all the more shocking. The fallout goes well beyond his marriage, his reputation, or Nvidia itself. Experts tell The Verge the incident threatens to disrupt the entire US AI industry, potentially jeopardize national security, and could undermine America’s efforts to maintain its fragile technological lead over China in AI.\n\n“With those chips, the US lead could vanish in a matter of weeks or months.”\n\nNvidia is the undisputed leader in advanced computer chips, among the AI industry’s scarcest resources. While many ingredients go into building AI models — including talent, energy, capital, and data — top-tier chips are one of the most important, and Nvidia is one of a handful of companies with the expertise to design or manufacture them at the cutting edge. That makes it a gatekeeper to hardware that has become a key bottleneck in global AI development. US companies — including Meta, Anthropic, and OpenAI — are racing to develop chips of their own, in part to reduce their dependence on Nvidia, even as they spend billions securing ever more compute.\n\nFor China, the US’s main rival at the frontier of AI, that bottleneck is even tighter. To maintain its technological lead, the US has restricted the sale of the most advanced AI chips to the country in the hopes of slowing its progress in the sector, which has been impressive and is thought to trail the US by a matter of months. In response, China has made developing domestic alternatives a strategic national priority, though its leaders still lag Nvidia at the bleeding edge. At the same time, a thriving black market for restricted Nvidia chips has emerged.\n\nExperts tell The Verge that China could exploit access to Nvidia to accelerate its own development, or to impede the US development of AI.\n\nGetting its hands on more Nvidia chips is the most obvious win for Beijing, says Emily Kilcrease, a senior fellow and director of the energy, economics, and security program at the Center for a New American Security (CNAS) think tank. China has advantages in other parts of the AI race — including abundant energy and a solid ecosystem of open weight models — but without the latest Nvidia chips, it “cannot close the gap with US frontier capabilities,” Kilcrease tells The Verge. “With those chips, the US lead could vanish in a matter of weeks or months.”\n\nIt is not clear how successful the alleged spying operation has been on that front. There is no public evidence indicating that Huang himself has helped direct restricted Nvidia chips toward China or that sensitive information about them was obtained from him. But companies linked to the alleged spy, Alice Huang — no relation to Jensen — have reportedly enabled at least $7 billion of Nvidia chip sales to China.\n\nBrookings fellow Kyle Chan tells The Verge that a concern for US industry could be that companies with alleged ties to China may have had priority access to Nvidia’s latest GPUs. “In a time of chip scarcity,” that would make it much harder for American companies to access them, Chan says.\n\nHuang is also a prominent critic of American restrictions on chip sales, and Nvidia spends a formidable amount lobbying in Washington. Last year, he successfully secured White House approval to start exporting Nvidia’s H200 AI GPU chips to “approved customers” in China and other countries. Crucially, Huang also has the ear of President Trump as well as other world leaders, giving him great influence over policy decisions.\n\nHardware is not the only thing of value China could get from close access to Huang, Sunny Cheung, a fellow for China studies at the Jamestown Foundation think tank, tells The Verge. “I actually think too many people are focused on whether somebody managed to steal Nvidia’s trade secrets,” Cheung says, calling it a “very narrow way” of looking at espionage. “I would hope Jensen Huang isn’t foolish enough to hand over the blueprints for Nvidia’s next-generation chips to a suspected Chinese intelligence operative.”\n\nThe Nvidia CEO’s relationships with other tech executives, senior policymakers, and Trump himself give him an unusually intimate view into how some of the most powerful people in the US are thinking and planning. Beijing could use information on how American companies are planning major infrastructure expansions, their compute requirements, or broad industry trends to inform its own investments and industrial strategy, Cheung says.\n\nHuang’s intelligence value could extend well beyond AI, too. “That information alone could be extremely valuable,” says Cheung, pointing to insights Beijing could glean into White House thinking about export controls or the private views of Silicon Valley executives on China and Taiwan.\n\n“When so much of America’s AI infrastructure depends on one company, any significant security or governance problem at Nvidia can create uncertainty across the industry.”\n\nBut helping China advance is only one side of this equation. Disrupting Nvidia — as this scandal clearly has — could destabilize America’s entire AI industry. More than most companies, Nvidia is remarkably closely tied to the identity and reputation of its rockstar CEO. Huang cofounded the company more than three decades ago, and ever since then he has served as its president, chief executive, and a member of the board of directors. Despite holding a relatively small stake in the company, in many ways Nvidia is Jensen Huang. Nvidia shares have slumped since news of the affair broke.\n\nKilcrease echoes those concerns, warning that the scandal could “destabilize” the company. At the very least, she says the various investigations already underway “will consume an immense amount of bandwidth within the company,” creating a very real risk of weighing down Nvidia’s day-to-day operations. If those distractions begin to affect Nvidia’s ability to execute — slowing decisions, product rollouts, or the allocation of already scarce chips — the consequences could quickly reach customers. The AI labs and hyperscalers such as OpenAI and Anthropic “could have a real issue accessing the vast amounts of compute they need,” Kilcrease says, adding that switching to other hardware “takes time.”\n\nIn a race to build increasingly powerful AI, time is a precious resource. Experts say China trails the US closely, meaning that even modest delays for American companies can help Chinese rivals catch up. Nvidia is almost certain to face further disruption as investigations continue, though the extent to which the turmoil will roil the rest of the industry may be difficult to measure.\n\nFor China, however, the scandal could be about to backfire spectacularly now everything is out in the open. “The odds of AI chip control legislation being passed in Congress just went through the roof,” Kilcrease says.\n\nCorrection, Tuesday November 10th: A sentence in this article misstated that Anthropic is the leader in advanced computer chips. It is Nvidia.\n\nThis is the title for the native ad","body_orig":"Nvidia’s chips are powering America’s AI boom. Of course Chinese spies are interested.\n\nAs espionage targets go, Jensen Huang is perhaps one of the least surprising on Earth. The Nvidia CEO runs one of the world’s most valuable companies, controls the in-demand technology fueling the AI boom, and is cozy with presidents, CEOs, and all manner of important people. He also wears a cool leather jacket.\n\nWhich makes Huang’s admission that he had an affair with a woman suspected of being a Chinese spy — reportedly while her spying was known to US intelligence and even President Donald Trump — all the more shocking. The fallout goes well beyond his marriage, his reputation, or Nvidia itself. Experts tell The Verge the incident threatens to disrupt the entire US AI industry, potentially jeopardize national security, and could undermine America’s efforts to maintain its fragile technological lead over China in AI.\n\n“With those chips, the US lead could vanish in a matter of weeks or months.”\n\nNvidia is the undisputed leader in advanced computer chips, among the AI industry’s scarcest resources. While many ingredients go into building AI models — including talent, energy, capital, and data — top-tier chips are one of the most important, and Nvidia is one of a handful of companies with the expertise to design or manufacture them at the cutting edge. That makes it a gatekeeper to hardware that has become a key bottleneck in global AI development. US companies — including Meta, Anthropic, and OpenAI — are racing to devel ps. It is Nvidia.\n\nThis is the title for the native ad","translated":false},"9922bcaa36cd876a":{"body":"Nvidia co-founder CEO Jensen Huang has never been as flashy or controversy-prone as AI leaders like OpenAI’s Sam Altman or SpaceXAI’s Elon Musk. Now, the 63-year-old industry kingpin has admitted that he cheated on his wife of 40 years in an affair that could have ramifications beyond Huang’s personal life and potentially impact national security.\n\nUnited States officials believe that Huang’s likely romantic interest, Megaspeed executive Alice Huang, is a Chinese spy who has been feeding information back to Beijing. (Alice Huang, a Chinese citizen, is of no relation to Jensen Huang.)\n\nMegaspeed, a Singapore-based AI infrastructure company, had reportedly purchased $4.8 billion in Nvidia chips over the last two years. The U.S. and Singapore have both previously investigated Megaspeed over suspicions that the firm was illegally sharing chips with China.\n\nThe U.S. and China are embroiled in a fierce technological arms race to build the most advanced AI infrastructure, which could shape each country’s economic future, military prowess, and capacity for innovation. Nvidia is valuable in this competition as one of the world’s largest makers of AI chips, which are essential for accelerating AI development. But as an American company, Nvidia faces government restrictions on the sale of its most powerful chips to Chinese entities.\n\nAs the controversy unfolds, we are organizing the most relevant events into a reverse-chronological timeline to keep you up to date.\n\nThe Nvidia CEO pulled out of upcoming speaking engagements at the ElevenLabs Summit and Anthropic CEO Forum.\n\nAlice Huang and her family reportedly built a network of companies in China and Singapore to acquire Nvidia chips, including founding a Chinese company called Shanghai Century Litong. Founded in 2023, it became an Nvidia-preferred cloud partner, giving it priority access to chips, The Information reported. The Information also reported that Shanghai Century Litong facilitated buying $7.5 billion worth of Nvidia’s chips, including banned chips.\n\nNvidia’s head lawyer, Tim Teter, intervened in a 2025 U.S. government probe surrounding the suspected smuggling of AI chips by Megaspeed International, Bloomberg reported. Teter contacted Commerce Under Secretary Jeffrey Kessler asking questions about whether the Trump administration played a role in detaining Alice Huang.\n\nIn early 2025, Alice Huang and a business partner sought China-based investors for an Asian data center, promising they had no problem in securing GPUs, the Financial Times reported.\n\nOn Sunday night, President Trump weighed in on Huang’s controversy and showed support for the Nvidia CEO.\n\n“I have not spoken to him about it. I just know he’s a fine person, but you never know what’s going on,” Trump said.\n\nWhen asked if Huang should remain chief of Nvidia, Trump said, “I think so. Oh yeah, sure.”\n\nJensen Huang wrote in a letter to Nvidia employees — which was also published as a press release — that he cheated on his wife.\n\n“I owe my family and all of you an apology,” Huang told his company. “I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did. I am deeply sorry.”\n\nHuang did not mention Alice Huang by name in the message, but linked his infidelity to “the national security concerns raised in news reports.”\n\n“Nvidia’s Board of Directors has initiated an independent investigation. I support the investigation and will cooperate fully. I love our country and our company. I am committed to protecting Nvidia and supporting America’s national security. I am proud and grateful to be an American,” Huang wrote.\n\nNvidia shares slid over 5% the following day.\n\nThree Republican congressmen — Chairman John Moolenaar of the House Select Committee on China, Chairman Brian Mast of the House Foreign Affairs Committee, and Chairman Rick Crawford of the House Permanent Select Committee on Intelligence — sent a request to Huang for a closed-door joint briefing with their three committees.\n\n“Recent reports raise significant national security concerns regarding the [People’s Republic of China]’s access to sensitive U.S. technology and information,” the chairmen wrote. “The issue of PRC infiltration and access to cutting-edge U.S. technology is core to the investigative work of our three committees this Congress. It is vital that Congress determines the extent to which U.S. national security has been placed at risk.”\n\nU.S. officials had been investigating Alice Huang and Megaspeed for more than a year when the New York Times broke the story in late October that the two executives also had a close relationship.\n\nAn Nvidia spokesperson denied that this relationship was something out of the ordinary.\n\n“Jensen’s interactions with Ms. Huang are not unusual or unexpected. Meetings with customers are part of a CEO’s job; Jensen talks with thousands of customer executives every year,” Nvidia spokesperson John Rizzo said. He added that “if the U.S. government believes that any person is a threat to American industry, it would let us know.”\n\nU.S. officials circulated a secret memo among policymakers that warned that Megaspeed’s Alice Huang, who had a relationship with Jensen Huang, was a spy for China’s Ministry of State Security. This memo was not public knowledge until it was later reported by the New York Times.\n\nSecretary of State Marco Rubio supervised the drafting of the memo.\n\nAround the same time, per the New York Times’ report, U.S. President Donald Trump was briefed about intelligence findings that possible Chinese spy Alice Huang had formed a close relationship with Jensen Huang. Trump did not act on this information.\n\nThe Nvidia CEO, an ally of Trump, has repeatedly advocated for the U.S. government to let Nvidia expand its business in China.\n\nMegaspeed was confirmed to be under investigation by both the U.S. and Singaporean governments in October 2025. As a customer of Nvidia, Megaspeed was suspected of helping Chinese companies get around American embargoes on chip exports.\n\nMegaspeed, a neocloud that used Nvidia chips, had been renting computing power to Chinese internet giant Alibaba and other Chinese companies, the Times reported. A Commerce Department official who had visited Megaspeed’s data center in Malaysia in 2024 had found a hoard of Nvidia equipment that was still packed in boxes and the concern was that this equipment was being directly shipped somewhere else, like China, rather than installed and sold as a cloud service.\n\nJensen Huang had been spotted socializing with Megaspeed executive Alice Huang as early as 2024 in Taiwan, where the Nvidia CEO was born.\n\nThese investigations into Megaspeed highlighted concerns about the degree to which Nvidia is able to track its chip exports. At the time, an Nvidia spokesperson told press that the company did not have “any reason to believe products had been diverted.”\n\n“NVIDIA visited multiple Megaspeed sites yet again earlier this week and confirmed what we previously observed — Megaspeed is running a small commercial cloud, like many other companies throughout the world, as allowed by U.S. export control rules,” the Nvidia spokesperson said at the time.\n\nWhen you purchase through links in our articles, we may earn a small commission. This doesn’t affect our editorial independence.\n\nAmanda Silberling is a senior writer at TechCrunch covering the intersection of technology and culture. She has also written for publications like Polygon, MTV, the Kenyon Review, NPR, and Business Insider. She is the co-host of Wow If True, a podcast about internet culture, with science fiction author Isabel J. Kim. Prior to joining TechCrunch, she worked as a grassroots organizer, museum educator, and film festival coordinator. She holds a B.A. in English from the University of Pennsylvania and served as a Princeton in Asia Fellow in Laos.\n\nYou can contact or verify outreach from Amanda by emailing [email protected] or via encrypted message at @amanda.100 on Signal.\n\nGet an Early Peek at the Next TechCrunch Disrupt\n\nDisrupt, Startup Battlefield, and more will return next year, and you can be at the front of the line.\n\nAnthropic launches Claude Meetings to turn workplace discussions into plans and tasks\n\nJensen Huang’s alleged honeypot scandal has inspired some top-notch memes\n\nWaymo robotaxis kept illegally passing school buses after software fix, feds say\n\nMusk says Tesla will refund some Cybertruck deposits, defends decision to end production\n\nTesla will stop making the Cybertruck in 2027\n\nClaude can now analyze your spending with its new Personal Finance tool\n\nHarbinger raises $240M after expanding into defense","body_orig":"Nvidia co-founder CEO Jensen Huang has never been as flashy or controversy-prone as AI leaders like OpenAI’s Sam Altman or SpaceXAI’s Elon Musk. Now, the 63-year-old industry kingpin has admitted that he cheated on his wife of 40 years in an affair that could have ramifications beyond Huang’s personal life and potentially impact national security.\n\nUnited States officials believe that Huang’s likely romantic interest, Megaspeed executive Alice Huang, is a Chinese spy who has been feeding information back to Beijing. (Alice Huang, a Chinese citizen, is of no relation to Jensen Huang.)\n\nMegaspeed, a Singapore-based AI infrastructure company, had reportedly purchased $4.8 billion in Nvidia chips over the last two years. The U.S. and Singapore have both previously investigated Megaspeed over suspicions that the firm was illegally sharing chips with China.\n\nThe U.S. and China are embroiled in a fierce technological arms race to build the most advanced AI infrastructure, which could shape each country’s economic future, military prowess, and capacity for innovation. Nvidia is valuable in this competition as one of the world’s largest makers of AI chips, which are essential for accelerating AI development. But as an American company, Nvidia faces government restrictions on the sale of its most powerful chips to Chinese entities.\n\nAs the controversy unfolds, we are organizing the most relevant events into a reverse-chronological timeline to keep you up to date.\n\nThe Nvidia CEO pulled out of upcoming speaking engagements at the ElevenLabs Summit and Anthropic CEO Forum.\n\nAlice Huang and her family reportedly built a network of companies in China and Singapore to acquire Nvidia chips, including founding a Chinese company called Shanghai Century Litong. Founded in 2023, it became an Nvidia-preferred cloud partner, giving it priority access to chips, The Information reported. The Information also reported that Shanghai Century Litong facilitated buying $7.5 billion worth of Nvidia’s chips, including banned chips.\n\nNvidia’s head lawyer, Tim Teter, intervened in a 2025 U.S. government probe surrounding the suspected smuggling of AI chips by Megaspeed International, Bloomberg reported. Teter contacted Commerce Under Secretary Jeffrey Kessler asking questions about whether the Trump administration played a role in detaining Alice Huang.\n\nIn early 2025, Alice Huang and a business partner sought China-based investors for an Asian data center, promising they had no problem in securing GPUs, the Financial Times reported.\n\nOn Sunday night, President Trump weighed in on Huang’s controversy and showed support for the Nvidia CEO.\n\n“I have not spoken to him about it. I just know he’s a fine person, but you never know what’s going on,” Trump said.\n\nWhen asked if Huang should remain chief of Nvidia, Trump said, “I think so. Oh yeah, sure.”\n\nJensen Huang wrote in a letter to Nvidia employees — which was also published as a press release — that he cheated on his wife.\n\n“I owe my family and all of you an apology,” Huang told his company. “I was unfaithful to my wife. My actions hurt her and our children. There is no excuse for what I did. I am deeply sorry.”\n\nHuang did not mention Alice Huang by name in the message, but linked his infidelity to “the national security concerns raised in news reports.”\n\n“Nvidia’s Board of Directors has initiated an independent investigation. I support the investigation and will cooperate fully. I love our country and our company. I am committed to protecting Nvidia and supporting America’s national security. I am proud and grateful to be an American,” Huang wrote.\n\nNvidia shares slid over 5% the following day.\n\nThree Republican congressmen — Chairman John Moolenaar of the House Select Committee on China, Chairman Brian Mast of the House Foreign Affairs Committee, and Chairman Rick Crawford of the House Permanent Select Committee on Intelligence — sent a request to Huang for a closed-door joint briefing with their three committees.\n\n“Recent reports raise significant national security concerns regarding the [People’s Republic of China]’s access to sensitive U.S. technology and information,” the chairmen wrote. “The issue of PRC infiltration and access to cutting-edge U.S. technology is core to the investigative work of our three committees this Congress. It is vital that Congress determines the extent to which U.S. national security has been placed at risk.”\n\nU.S. officials had been investigating Alice Huang and Megaspeed for more than a year when the New York Times broke the story in late October that the two executives also had a close relationship.\n\nAn Nvidia spokesperson denied that this relationship was something out of the ordinary.\n\n“Jensen’s interactions with Ms. Huang are not unusual or unexpected. Meetings with customers are part of a CEO’s job; Jensen talks with thousands of customer executives every year,” Nvidia spokesperson John Rizzo said. He added that “if the U.S. government believes that any person is a threat to American industry, it would let us know.”\n\nU.S. officials circulated a secret memo among policymakers that warned that Megaspeed’s Alice Huang, who had a relationship with Jensen Huang, was a spy for China’s Ministry of State Security. This memo was not public knowledge until it was later reported by the New York Times.\n\nSecretary of State Marco Rubio supervised the drafting of the memo.\n\nAround the same time, per the New York Times’ report, U.S. President Donald Trump was briefed about intelligence findings that possible Chinese spy Alice Huang had formed a close relationship with Jensen Huang. Trump did not act on this information.\n\nThe Nvidia CEO, an ally of Trump, has repeatedly advocated for the U.S. government to let Nvidia expand its business in China.\n\nMegaspeed was confirmed to be under investigation by both the U.S. and Singaporean governments in October 2025. As a customer of Nvidia, Megaspeed was suspected of helping Chinese companies get around American embargoes on chip exports.\n\nMegaspeed, a neocloud that used Nvidia chips, had been renting computing power to Chinese internet giant Alibaba and other Chinese companies, the Times reported. A Commerce Department official who had visited Megaspeed’s data center in Malaysia in 2024 had found a hoard of Nvidia equipment that was still packed in boxes and the concern was that this equipment was being directly shipped somewhere else, like China, rather than installed and sold as a cloud service.\n\nJensen Huang had been spotted socializing with Megaspeed executive Alice Huang as early as 2024 in Taiwan, where the Nvidia CEO was born.\n\nThese investigations into Megaspeed highlighted concerns about the degree to which Nvidia is able to track its chip exports. At the time, an Nvidia spokesperson told press that the company did not have “any reason to believe products had been diverted.”\n\n“NVIDIA visited multiple Megaspeed sites yet again earlier this week and confirmed what we previously observed — Megaspeed is running a small commercial cloud, like many other companies throughout the world, as allowed by U.S. export control rules,” the Nvidia spokesperson said at the time.\n\nWhen you purchase through links in our articles, we may earn a small commission. This doesn’t affect our editorial independence.\n\nAmanda Silberling is a senior writer at TechCrunch covering the intersection of technology and culture. She has also written for publications like Polygon, MTV, the Kenyon Review, NPR, and Business Insider. She is the co-host of Wow If True, a podcast about internet culture, with science fiction author Isabel J. Kim. Prior to joining TechCrunch, she worked as a grassroots organizer, museum educator, and film festival coordinator. She holds a B.A. in English from the University of Pennsylvania and served as a Princeton in Asia Fellow in Laos.\n\nYou can contact or verify outreach from Amanda by emailing [email protected] or via encrypted message at @amanda.100 on Signal.\n\nGe","translated":false},"578c3223ec50a9c7":{"body":"IT之家 11 月 11 日消息，摩尔线程今天宣布，公司旗下 AI 训推一体智算卡 MTT S5000 及 MUSA 软件栈，已在昨天（开源当日）适配 MiniMax 图像生成模型 H3-Image。\n\nIT之家了解到，MiniMax H3-Image 是一款衍生自 H3 的图像生成模型，具备文本生成图像、图像参考和图像编辑能力。它可在 10 秒内生成一张 4096 × 4096 像素、约 16MP（4K）的高分辨率图像，速度可达市面主流水平的 5 倍，同时呈现丰富、真实的细节，并具备优秀的指令遵循和多参考图理解能力。\n\n针对 MiniMax H3-Image 的核心能力特征，摩尔线程基于 MTT S5000 进行全链路适配和深度优化：\n\n扩散类生图与编辑模型注意力机制开销较大，Attention 占比高，尤其在多参考图输入的场景下 Key / Value 膨胀明显，参考图越多开销上升越快。MTT S5000 凭借高算力密度，可从容承接此类模型在理解与高分辨率生成过程中的高计算负载，充分释放 MiniMax H3-Image 的效能。\n\n摩尔线程此前已在 MiniMax H3 模型上，完成了 Attention、GEMM 等核心算子，以及通信与运行时等底层基础设施建设。此次面对 MiniMax H3-Image，团队结合视觉生成模型优化经验，复用 SGLang、MATE、MCCL 等成熟组件能力完成适配，同时也为后续更多生图、生视频模型的 Day-0 适配奠定了基础。","body_orig":"","translated":false},"6613af3ef49427b5":{"body":"浩瀚的太平洋，连接亚洲、大洋洲、北美洲和南美洲。亚太经合组织(APEC)21个经济体，因海相望，因合作相聚。亚太经合组织第三十三次领导人非正式会议即将拉开帷幕。APEC是个什么样的组织？\n\nAPEC是4个英文单词的缩写，A是Asia，代表亚洲。P是Pacific，代表太平洋，这两个字母代表它的成员从哪里来。E—Economic，经济，告诉大家它是搞经济的，C—Cooperation代表合作，这4个字母合起来就是“亚太经合组织”的简称APEC。\n\n1989年正式成立后至今，APEC已成为亚太地区层级最高、领域最广、最具影响力的经济合作机制。\n\nAPEC现有21个成员，发达成员与发展中成员并存，还有中国香港和中国台北两个地区经济体。此外，APEC还有3个观察员，分别是东盟(ASEAN)秘书处、太平洋经济合作理事会(PECC)、太平洋岛国论坛(PIF)秘书处。\n\n目前，其成员经济总量占全球约六成，贸易额占比近一半，覆盖约30亿人口。如果把亚太经合组织比作一架大马车的话，这驾马车上的21个成员影响着大半个地球的发展，它早已是全球经济名副其实的“压舱石”。 【编辑:蔡星雨】\n\n国际首台！中国团队研制成功无液氦铌三锡薄膜射频超导电子加速器\n\n中国海警舰艇编队11月9日在我钓鱼岛及其附属岛屿领海内维权巡航\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n成都蓉城俱乐部董事长、总经理辞职 主教练阿洛伊西离任\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"9d0f95f77c7d8bb2":{"body":"中新网11月11日电 据《以色列时报》报道，当地时间11月10日，以色列第26届议会新任议员宣誓就职，议会于当天举行首次会议。新一届议会由120名议员组成。\n\n据报道，看守政府总理内塔尼亚胡在发言时称，伊朗正“试图重启核武器进程”，消除这一“威胁”的唯一途径是“推翻伊朗政权”，他再次呼吁各党派与他组成“民族团结政府”。内塔尼亚胡领导的右翼阵营在10月27日举行的议会选举中失去多数席位。\n\n报道称，正直党领导人加迪·埃森科特依靠的四个政党联盟仅拥有48个议席，未达到组阁所需的61席多数。在以色列议会开幕前夕，埃森科特表示，他致力于尽快组建“国家紧急政府”，同时不会放弃自身原则。\n\n据此前报道，以色列总统赫尔佐格8日正式授权埃森科特组建新政府。根据以色列法律，埃森科特有28天时间组建新政府，必要时可申请最多延长14天。\n\n以色列媒体Ynet新闻网发文分析称，埃森科特的组阁前景并不乐观。若拉拢极端正统派政党入阁并争取阿拉伯裔政党外部支持，虽可凑足多数席位，但难以解决相关立法争议；若组建仅48席的少数政府，则因阵营内右翼伙伴及部分潜在盟友反对，且远低于61席门槛，难以稳定运转；与内塔尼亚胡组建团结政府，双方目前均缺乏兴趣。 【编辑:孔庆玲】\n\n特朗普称将停止向以色列提供每年总额约40亿美元的军援\n\n达纳·怀特同特朗普出席新闻发布会，拒绝担任白宫新闻秘书\n\n埃及海洋研究专家：中国为非洲国家环保事业发展提供有力支持\n\n特朗普宣布实施“铁门”行动：“几乎没有东西能进出伊朗！”伊朗否认并谴责\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n成都蓉城俱乐部董事长、总经理辞职 主教练阿洛伊西离任\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"f0e7fce82686764e":{"body":"中新网11月11日电 11日，国务院台办举行例行新闻发布会。有记者问：近日，2026年中国金鸡百花电影节系列活动受到两岸关注，两岸业者参加有关活动并通过影视作品交流切磋。请介绍有关情况。请问如何看待、评价两岸业者在影视方面的交流与合作？\n\n国台办发言人张晗表示，第39届金鸡百花电影节活动于11月6日至10日在福建厦门成功举办，60余位台湾知名演艺人员及相关业者出席，《入学许可》、《深度安静》等7部台湾电影参展。电影节期间，还举办了第七届“海峡两岸暨港澳青年短片季”以及“金鸡电影市场·台湾专场”等专题活动，共有144部台湾优秀短片参赛、7个电影项目得到重点推介，为两岸电影人创造交流研讨、产业合作的平台。\n\n此外，还举办了“厦金光影通”特色活动，5000余名台胞通过便捷渠道参与电影生活季优惠福利活动及金鸡奖闭幕式颁奖典礼影院直播活动。我们始终鼓励两岸电影人加强合作，促进两岸影视产业共同发展，做大做强属于中华民族自己的电影事业，携手弘扬中华文化。 【编辑:苏亦瑜】\n\n国际首台！中国团队研制成功无液氦铌三锡薄膜射频超导电子加速器\n\n中国海警舰艇编队11月9日在我钓鱼岛及其附属岛屿领海内维权巡航\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"80a4ec8b8469fae9":{"body":"中新社华盛顿11月10日电 (记者 陈孟统)美国国会众议院10日通过一项程序性动议，搁置了旨在推动弹劾国防部长赫格塞思的决议案。\n\n美国共和党籍联邦众议员托马斯·梅西9日提出决议，推动众议院就弹劾赫格塞思举行投票。这份决议案共列出8项弹劾条款，其中3项涉及伊朗战事。\n\n在10日举行的一场程序性投票中，众议院以211票赞成、204票反对，决定将这份弹劾决议案提交委员会审议，实际上阻止了相关弹劾程序在本届国会任期内继续推进。\n\n投票结果基本呈现党派分野，梅西是唯一与民主党人一道投反对票的共和党议员。\n\n当天上午，赫格塞思在五角大楼举行记者会，就国会的弹劾动议作出回应。他指责梅西的行为“是一场政治闹剧”。\n\n在上述程序性投票结果公布后，美国总统特朗普通过社交媒体表示，这是对赫格塞思的正名，同时指责民主党将弹劾作为政治武器。\n\n赫格塞思并不是首位遭到弹劾的内阁成员。最近一位遭弹劾的是拜登政府时期的国土安全部长马约卡斯。2024年，他因边境安全问题遭到众议院弹劾，但参议院随后驳回全部弹劾指控，未进入正式审判程序。(完) 【编辑:管娜】\n\n达纳·怀特同特朗普出席新闻发布会，拒绝担任白宫新闻秘书\n\n埃及海洋研究专家：中国为非洲国家环保事业发展提供有力支持\n\n特朗普宣布实施“铁门”行动：“几乎没有东西能进出伊朗！”伊朗否认并谴责\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n成都蓉城俱乐部董事长、总经理辞职 主教练阿洛伊西离任\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"292f3c92db62942d":{"body":"许多网友观察到，今年的“双11”有了新变化：年轻人的购物车被米面粮油、家居日用等物品占据，电商平台的促销手段也更务实简单了。\n\n有声音质疑：消费动力不足了？年轻人都将就着花钱了，这不是消费降级吗？\n\n答案并非如此。先看数据怎么“说”。据第三方统计，从2023年到2025年，“双11”全网销售额约为1.14万亿元、1.44万亿元和1.70万亿元，实现连续增长。这证明集中促销对消费的拉动作用仍然明显。\n\n结构性数据更值得细读：今年前三季度，我国服务零售额同比增长5.0%，比商品零售额增速高出4个百分点；居民人均服务性消费支出同比增长4.6%，快于居民人均消费支出增速1个百分点。这意味着，消费者追求的不只是买好东西，更要买“好体验”。\n\n这样的转变符合发展规律。有研究表明，人均GDP在达到1.5万美元左右时，消费开始由满足基本商品需求转向服务领域，迎来“结构性转折”。2025年，我国人均GDP已接近1.4万美元，正处于这一关键转变期。线下服务消费更火了，而以线上商品消费为主的“双11”则处于平稳增长中。\n\n还有就是场景多元了。除了线下逛、线上挑，即时零售、社区团购、私域社群等都在吸引消费者。“双11”这个曾经“一年一度的价格洼地”，其不可替代性正被丰富的日常促销场景所稀释。与其说消费者冷落了“双11”，不如说“双11效应”更普遍、更寻常了。\n\n简单说，需求还在，钱还在花，但花法变了。这意味着在商品供给极大丰富之后，消费者重新分配预算、时间和注意力，把日常开销用到真正提升生活品质的地方——一次“诗和远方”的奔赴、一个精美的手办、一场心仪已久的演出。这不是消费降级，而是一场深远的消费迁移。\n\n关键是心态变了。一方面变得更理性，“可以买贵的，但不能买贵了”，追求“质价比”；另一方面更愿意为悦己、解压、陪伴、认同付费，追求“心价比”。没有将就，反而是更讲究了。主打“该省省、该花花”的年轻人，消费主体性越来越强。\n\n往更深层次看，理性从容的消费心态，恰是一种回归纯粹的主动选择，也是丰厚物质基础托举的结果。\n\n《人民日报》(2026年11月11日 第 05 版) 【编辑:蔡星雨】\n\n（第九届进博会）离开中国8年，这位美国商人带着生意回来\n\n江苏扬州三江营“生态岛”试验区建设成效显著 筑牢南水北调源头生态屏障\n\n乘联分会：10月新能源乘用车零售、批发渗透率均创历史新高\n\n规范机票退改签！京津冀三地消协组织敦促10家航司、5家平台限期整改\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n成都蓉城俱乐部董事长、总经理辞职 主教练阿洛伊西离任\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"9e933ad767136991":{"body":"中新网11月11日电 11日，国务院台办举行例行新闻发布会。会上，有记者提问：党的二十届五中全会胜利召开，全会公报发表后受到台湾各界关注，许多台胞台商对公报中“深入挖掘内需潜力，进一步深化改革开放”“推动经济持续向新向优向好发展”等内容深表认同。请问对此有何评论？\n\n国台办发言人张晗表示，党的二十届五中全会在“十五五”开局之年召开，意义重大。五中全会公报发表后，台胞台商反响热烈，表示全会公报精神对其在大陆干事创业、更好发展具有重要启发意义。\n\n张晗称，中国式现代化是全体中华儿女的共同事业，实现中华民族伟大复兴是两岸中国人的夙愿。我们将结合对台工作实际，持续出台相关政策举措，加强两岸经贸合作、深化两岸融合发展、促进两岸交往交流，同广大台湾同胞分享中国式现代化的发展机遇和成果。 【编辑:苏亦瑜】\n\n国际首台！中国团队研制成功无液氦铌三锡薄膜射频超导电子加速器\n\n中国海警舰艇编队11月9日在我钓鱼岛及其附属岛屿领海内维权巡航\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n成都蓉城俱乐部董事长、总经理辞职 主教练阿洛伊西离任\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"d4d6567c25bc8673":{"body":"中新网11月11日电 综合路透社等媒体报道，美国总统特朗普当地时间10日在社交媒体上称，民主党针对国防部长赫格塞思的弹劾努力遭遇“惨败”。他还指责民主党继续将美国“武器化”并滥用。\n\n特朗普还称，赫格塞思在伊朗、委内瑞拉等问题上的表现，使这位“伟大的美国爱国者”得以洗清指责。\n\n此前报道，共和党籍众议员托马斯·梅西9日正式对赫格塞思提出弹劾，列出未经国会授权对伊朗发动军事行动等8项指控。10日，众议院共和党人在程序性投票中，阻止继续推进对赫格塞思的弹劾。除梅西外，其他共和党议员都不支持继续推进这一弹劾。\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n成都蓉城俱乐部董事长、总经理辞职 主教练阿洛伊西离任\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"b8e32259f4a50247":{"body":"围绕2026年全国优化消费环境月“放心消费、你我共享”主题，市场监管总局昨天(10日)召开平台企业放心消费承诺座谈会，引导平台企业作出放心消费承诺、改善消费体验。市场监管总局提出，平台要建立完善首问负责和先行赔付制度，在提高AI客服水平的同时做好与人工客服的衔接，及时处置消费纠纷。\n\n目前，优化消费环境三年行动、全国优化消费环境月活动同步推进，全国放心消费平台已上线，商家可公示放心消费标识、获取流量支持，消费者可查询商家信用、便捷评价维权，平台明年还将上线一键和解功能，构建各方共建放心消费生态圈。\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n成都蓉城俱乐部董事长、总经理辞职 主教练阿洛伊西离任\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"802cbc8d8f944a56":{"body":"中新网11月11日电 11日，国务院台办举行例行新闻发布会。会上，有记者提问：台湾个人电脑品牌企业华硕、宏碁将部分泰国、越南产能转回中国大陆，这一调整近日在岛内受到关注，认为此番台企“回流”大陆，让外界再度关注两岸产业链供应链的深度嵌合。请问对此有何评论？\n\n国台办发言人张晗表示，大陆拥有门类最为齐全的工业体系、成熟完善的产品配套网络，是台资制造企业投资发展的最佳选择。紧密、强韧的两岸产业链供应链不仅有利于台企发展壮大，增进两岸同胞福祉，也有利于全球产业链安全稳定畅通。\n\n张晗称，当前，“十五五”规划蓝图已经展开，高水平开放和深层次改革高效联动，将释放出更强劲的动能，为台企在产业变局下更好更快发展提供有力支撑。我们将一如既往支持广大台商台企抢抓机遇，来大陆投资兴业，参与大陆经济高质量发展，实现自身更好更快发展。 【编辑:苏亦瑜】\n\n国际首台！中国团队研制成功无液氦铌三锡薄膜射频超导电子加速器\n\n中国海警舰艇编队11月9日在我钓鱼岛及其附属岛屿领海内维权巡航\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"76cbe38eb2efa8be":{"body":"中新网11月11日电 据路透社援引当地时间11月10日公布的航运数据，一艘装载约4万吨俄罗斯柴油、原计划驶往美国纽约的油轮已在美国东海岸外海停航。\n\n据报道，这艘油轮10月22日在俄罗斯普里莫尔斯克港装载了约4万吨超低硫柴油，原定于11月7日抵达目的地。\n\n但一周后，负责管理该油轮的希腊公司表示，该船正处于“等待指令”状态，卸货港尚未指定或最终确定。\n\n该公司10日向路透社表示：“关于该船的目的地，目前没有任何变化，该船仍在等待指令。”\n\n达纳·怀特同特朗普出席新闻发布会，拒绝担任白宫新闻秘书\n\n埃及海洋研究专家：中国为非洲国家环保事业发展提供有力支持\n\n特朗普宣布实施“铁门”行动：“几乎没有东西能进出伊朗！”伊朗否认并谴责\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"9d816c9d3b4481f1":{"body":"《本草纲目》里最早记载了怎么喝咖啡？郑和下西洋的宝船已经用上了蒸汽机？乍一听，这些说法荒诞不经，但是在一些短视频平台上，它们却被包装成足以推翻教科书的“历史新发现”。\n\n这些所谓的“新发现”、视频里呈现的“铁证”，往往连最基础的文献检索和历史常识都经不起推敲。荒谬的“伪史论”究竟是如何被炮制出来的？背后又藏着怎样一条筛选受众、卖课带货的灰色利益链？\n\n在短视频平台上，各类打着“颠覆认知”旗号的伪史视频五花八门：有人宣称古埃及金字塔是近代混凝土浇筑的，有人言之凿凿地声称明朝《永乐大典》第18234卷记载了郑和宝船使用“蒸汽火轮机”，还有博主宣称，人类历史上最早记录咖啡的典籍是《本草纲目》。\n\n伪史博主称网上很容易就能搜到《本草纲目》里关于咖啡要配牛奶或加糖的说法，还称《本草纲目》传到欧洲后，欧洲才开始大规模种植咖啡；有了咖啡，才有了从中国传过去的煮热水习惯。\n\n面对网上层出不穷的伪史谣言，科普作家河森堡近期制作了多期《肘击伪史论》短视频逐一辟谣。他发现，许多看似头头是道的“古籍铁证”，只需一次最基础的全文检索就能戳破。\n\n河森堡：这个谣言很容易澄清，在《本草纲目》全书检索“咖啡”这个关键词，没有任何结果。不止明代，到了清代，《康熙字典》中都找不到咖啡的“咖”字。咖啡真正进入中国，已经是清代中后期的事了。\n\n除了凭空捏造古籍，另一类伪史论则是拿中学课本里的基础常识“做文章”。\n\n伪史博主：2026年人教版历史教材的地名标注变了。第12课写着：今北京在历史上叫南京，今河南开封在历史上叫东京，古代史中经常出现的大秦，在这本教科书里直接标注为罗马帝国。这意味着历史版图被刻意更改、缩小过。\n\n如此荒谬的教科书解读，偷换概念、断章取义，拿课本做幌子，既可能迷惑学生，又误导广大网友。\n\n河森堡：其中一页插图内容讲的是宋辽时期。当时辽国国土大部分在北方，今天的北京在当时被定为“南京析津府”；北宋时期开封汴梁被称为“东京”；把罗马称为“大秦”，《后汉书》里就有记载。这些都是常识问题，却被一些伪史博主当成藏着天大的阴谋。这样错漏百出、是非颠倒的视频，在视频号上能有一千多个点赞。\n\n中国科学技术大学科技传播系副主任袁岚峰长期在网络上批驳伪史论，他也明显感受到，这股风潮在近十年间经历了剧烈的膨胀与激进化。\n\n袁岚峰：2015年，常见的说法只是中国古代科技很先进这类老生常谈，那时还没有出现把国外所有成果都归于中国这种说法。如今一旦有内容不符合这类人的预期，他们通常有两种做法：一是说这是假的、是伪史，二是把原因归咎于某个对象。这类内容只输出情绪，完全不管真实性。\n\n一段来源可疑的史料，怎样被包装成看似证据确凿的视频？伪史论能层出不穷地发明“历史”，究竟是谁在推波助澜？我们又该如何甄别这些历史相关的谣言呢？\n\n中国传媒大学信息传播学院院长李舒注意到，这类内容往往按照相似的步骤进行包装——绕过思考，直接给出答案。\n\n李舒：这类内容先用一个真实的碎片打底，比如开头放一段真实的考古画面，后面接上的往往是跟它没有实质关系的错误结论；再用声音和剪辑绕过思考，配上“科学已经确证”这类斩钉截铁的字幕，形成一个完整的逻辑闭环；加上很快的画面、很满的旁白，不给观众停下来思考和追问证据的空间；最后用不可证伪的说法封住退路，凡是和它的结论相冲突的文献、文物，它就用一句“后人伪造”搪塞过去。\n\n违背常识的言论，制作者自己真的相信吗？河森堡发现，许多鼓吹伪史论的博主其实是“揣着明白装糊涂”——有人在自己早年出版的图书里还正常引用亚里士多德的学术观点，到了镜头前却为了迎合情绪高喊“亚里士多德根本不存在”。在这场流量生意里，夸张的伪史言论往往只是一张用来筛选受众、实现高转化变现的“筛子”。\n\n河森堡：绝大多数伪史博主自己并不相信伪史论。有人直接带货，店铺里挂着所谓的书或者日用品，转成生意；也有人先把这部分人聚拢起来，再向他们卖课。他们用极端反智的内容“提纯”受众。\n\n河森堡告诉记者，最初他只是偶然刷到某条伪史论视频，为了全面批驳其中的荒谬逻辑，他必须耐着性子把整条视频看完。没想到，正是这个“看完视频”的动作，让他掉进了平台算法的推荐漩涡。\n\n河森堡：一旦看完，收看时长会让算法误以为我喜欢这类内容，之后便不停地推送。看完一个伪史论博主，接着就被推七八个，最后几十个，没完没了。\n\n华东师范大学传播学教授甘莅豪认为，此类伪史内容早年间只在特定的小圈子内流传，但在算法时代，猎奇的伪史论因自带流量而被进一步放大。\n\n甘莅豪：算法推荐机制并不关心内容是否真实，平台只关心视频有多少完播、评论、点赞、转发和停留时长。如果视频博人眼球、转发量高，就会让制作者获得很大流量，这种流量就有利可图。\n\n李舒认为，伪史传播的危害，远不止搞错几个具体的历史常识，甚至可能会影响青少年一代唯物史观的建立。\n\n李舒：这类内容的危害不在于具体说错了哪段历史，而在于培养了一种无需证据也可以确信的认知习惯，从整体上弱化了社会的逻辑思辨能力。它危害文化安全，制造圈层对立，其中一些极端认知带有鲜明的历史虚无主义特征。特别是对于历史认知正在形成的青少年，非常容易误导他们，影响年轻一代唯物史观的建立。\n\n对平台来说，不能把争议当流量，更应该把辨别、审核的关口前移。\n\n李舒：平台要管好入口，不能把争议当流量。伪史内容的监督有一个非常现实的难题：历史类内容没有当事方，不像名誉侵权那样有具体受害人可以投诉，平台难以依据举报作出处理。所以平台不能等举报才动，必须把审核门槛前移。对缺乏可靠史料支撑、以掩盖真相为核心的内容，要自觉、主动降低推荐权重，而不是等它大面积传播后再删除、限流。\n\n泸州“花坛藏尸案”一审宣判：陈某芬被判死刑，杨某根被判死缓\n\n厦金大桥（厦门段）海上主线桥贯通 预计今年底建成通车\n\n杭州临平通报一起刑事案件：2人死亡 犯罪嫌疑人畏罪自杀\n\n公安部推出5项交管便民利企新措施 12月1日起全国推行\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"9d8efed7cc4ca10d":{"body":"央视网消息(焦点访谈)：11月10日，第九届进博会落下帷幕。“十五五”开局之年的这一届，既有新面孔、新产品，还有一群老朋友。他们连续参展9年一场不落，被称为“全勤生”。像这样的“全勤生”企业和境外机构有近200家。9年来，他们见证着越办越好的进博会；进博会也成就他们从试试看到留下来，从参展商变为投资商。这些“全勤生”们的成长记正是进博会与参展方双向奔赴、共同成长的生动注脚。\n\n11月5日到10日，上海又迎来一年一度的进博时刻。黄浦江畔涌动着全球客商的身影，“四叶草”展馆内人潮如织。虽然进博会已经举办9届，但是创新、突破的脚步从未停止。一组数据彰显进博会越办越有活力、越办越好。在本届展会上，全球首发、亚洲首展、中国首秀的代表性展品超过480件。\n\n不仅展品多，参展商也多。世界500强和行业龙头企业首次超过300家，首次参展的企业超2000家。\n\n除了“头回客”以外，还有不少是“回头客”。据统计，有169家企业和30家境外组展机构已经连续9届参展，场场不落。因此，他们有了一个共同的名字——“全勤生”。\n\n9年前，不少企业都是抱着试试看的想法参加进博会，没想到进博会带给他们的发展机遇远远超乎想象。\n\n进博会溢出效应不断显现，9年下来，它早已不是企业试水的跳板，而是扎根中国的沃土，一个个双向奔赴的故事持续上演。一家生产深度清洁设备的德国企业，作为连续9年参展的“全勤生”，他们不断深耕中国市场，加大对华投资，把根扎得越来越深，如今这棵大树已经枝繁叶茂。\n\n卡赫大中华区总裁唐晓东：“今年我们为第九届进博会带来了全球和亚洲首展的、目前市场上最大的清洁机器人。我们既有德国研发的产品，全球平台，也有本地团队研发的产品，为中国市场，同时也返销到欧洲市场。”\n\n为了深入了解这家公司是如何把根扎进中国土壤的，我们暂别进博会来到位于常熟的研发生产基地，不少进博会明星产品都诞生在这里。现在正值销售旺季，生产线十分繁忙，每分钟有2台设备下线。\n\n最初，这家企业的策略是国外研发中国生产，但随着中国供应链的成熟，技术的快速迭代，越来越多的新产品都变为中国研发中国生产，产品发往全球。\n\n卡赫中国高级工程总监石嵘：“现在我们整个总部的策略是，将来新一代蒸汽机的所有生产和研发都在中国完成。在很多年前不可想象，很多年前我们的研发依赖于德国，但现在慢慢变成中国设计，开始反哺德国和全球市场。”\n\n因为看好中国，所以企业不断加大投资，9年来累计在华投资超过30亿元，完成了从参展商向深度本土投资商的身份蜕变。\n\n唐晓东：“在过去9年的时间里，卡赫的整个中国业务持续高速发展，加强了我们集团总部对于中国市场的信心。从2018年开始，我们不只在常熟工厂做二期、三期、四期增资增产。在2023年，我们把卡赫常熟的研发中心升级为全球除了德国以外最大的研发中心，不只为卡赫中国开发产品，也为卡赫的全球开发产品。”\n\n根据《中国国际进口博览会溢出效应指数研究报告(2026)》，2025年全国溢出效应指数达62.94，同比上涨10.27%；进博会举办地上海的溢出效应指数达68.19，同比增长18.88%。用大白话讲，就是进博会带来的流量被稳稳地接住了，流量变成了留量。\n\n中国国际进口博览局副局长肖露：“我们的‘全勤生’阵容彰显出进博会的长期主义价值，不少‘全勤生’从6天参展转向扎根中国、加码投资，对于这些企业而言，进博会已经成为他们谋划在中国长期战略的必答题。”\n\n每年进博会的消费品展区都是人头攒动。葡萄酒、巧克力、珠宝、化妆品等等，世界优品好物让人应接不暇。一家法国化妆品企业也是“全勤生”。\n\n欧莱雅集团首席执行官叶鸿慕：“进博会是一个非常重要的时刻，我们向中国展示我们最前沿的创新成果，同时也向世界展现这个伟大国家蕴藏的无限可能，我们在中国落地了很多投资。”\n\n2年前，这家企业在苏州建成了集团全球首家智能运营中心，成为在中国处理订单的重要服务枢纽。\n\n中国电商快速发展，让这家企业建起现代化运营中心。无论硬件还是软件、系统、算法，都离不开中国合作伙伴的助力，中国已经成为企业发展最有力的支撑。这也让企业更加坚定对中国的信心。\n\n叶鸿慕：“中国不只是我们的第二大市场，更是灵感与创新的源泉。我们会把很多我们和中国合作伙伴共同开发的创新成果推向全球。”\n\n中国社会科学院世界经济与政治研究所所长廖凡：“中国提供了难得的稳定性、确定性，这些‘全勤生’们也是看中了中国的这份确定性，进博会就是这个确定性非常重要的象征。他们投的不仅仅是展位，更是对于中国未来的预期和信心。”\n\n美国企业是进博会的常客。一家美国能源企业也是连续参展9年的“全勤生”，对他们而言，参加进博会意义非凡。\n\n通用电气能源投资(中国)有限公司董事长许欣：“第一是我们展示先进设备、先进技术和先进理念的平台，第二，也是我们聆听国家政策和倾听客户声音的平台，第三是我们和国内合作伙伴一块加速成果落地、走向海外的平台。”\n\n在上海，他们与央企华电集团成立了一家合资公司，专注于轻型燃气轮机发电机组的组装、测试以及维修，同时华电集团又采购该合资公司生产的设备。在上海闵行区，记者见到了一个已经投入运营的发电项目。\n\n因为看好中国市场，所以这家美国企业还在国内多地加大投资，不少项目已经陆续投入运营。\n\n从展品到商品，从参展商到投资商，一大批参展企业借着进博会的东风，实现了从走进中国到扎根中国的转变。进博会的溢出效应如同涟漪一般不断向外延展。对他们而言，进博会早已不再是简单的“试水”平台，而是扎根中国市场、行稳致远的重要依托。\n\n肖露：“进博会已经超越传统贸易场的边界，成为全球共享的国际公共产品，为世界注入了三重机遇：第一重是共享中国大市场的红利机遇，第二重是维护全球化底盘的稳定机遇，第三重是普惠包容发展的公平机遇。进博会就像一座桥，真正让发展的成果更多也更公平地惠及世界各国人民。”\n\n开放底色更鲜明、创新动能更强劲、共享属性更彰显是本届进博会三个鲜明特点。九年深耕，近200家“全勤生”的成长轨迹，正是进博会与全球市场双向赋能的鲜活缩影。从携新品试水到落子投资，从走进中国到融入中国，这些企业的成长故事，既是中国大市场吸引力的最佳注脚，也是世界共享中国发展机遇的生动见证。 【编辑:刘阳禾】\n\n（第九届进博会）离开中国8年，这位美国商人带着生意回来\n\n江苏扬州三江营“生态岛”试验区建设成效显著 筑牢南水北调源头生态屏障\n\n乘联分会：10月新能源乘用车零售、批发渗透率均创历史新高\n\n规范机票退改签！京津冀三地消协组织敦促10家航司、5家平台限期整改\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n成都蓉城俱乐部董事长、总经理辞职 主教练阿洛伊西离任\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"0de3551319f5519e":{"body":"2026年11月11日，据北京市第一中级人民法院消息，该院依法公开宣判北京电影学院原副院长尼跃红犯受贿罪一案，对被告人尼跃红以受贿罪判处有期徒刑十年，并处罚金人民币五十万元；对被告人尼跃红受贿犯罪所得予以没收，上缴国库。\n\n公开简历显示，尼跃红，男，汉族，1957年9月生于河北，现年已69岁。1974年12月参加工作，1977年12月加入中国共产党。\n\n尼跃红1984年获中央工艺美术学院学士学位，1988年获同校硕士学位，2003年于清华大学美术学院获博士学位。曾任北京服装学院工艺美术系副主任、主任、院长助理、副院长等职务。2005年7月-2012年1月，尼跃红担任北京青年政治学院副院长、党委委员。\n\n2012年起，尼跃红开始担任北京电影学院副院长。公开报道没有显示尼跃红是何时卸任这一职务，期间他曾兼任北京电影学院中国电影衍生产业研究院院长。2022年时，他在媒体报道中的身份已经变成南充电影工业职业学院院长。据媒体报道，近年来尼跃红仍较为频繁地出现在各类工艺美术活动中。\n\n2025年10月28日，北京市纪委监委发布消息，北京电影学院原副院长尼跃红涉嫌严重违纪违法被查。\n\n北京电影学院前身是1950年创建的表演艺术研究所，1953年更名为北京电影学校，1956年改为四年本科建制的北京电影学院。\n\n艺术类院校近年腐败案频发，成为高校反腐的重点领域，此前已有沈阳音乐学院原党委书记董亲学、星海音乐学院原党委书记王秀明、中央美术学院设计学院原院长宋协伟、哈尔滨音乐学院原党委书记关健等人先后落马。2025年还有南京艺术学院原副院长谢建明、中央美术学院设计学院原副院长张欣荣、中央音乐学院作曲系原副主任常平等人被查。\n\n原创新闻翟瑞民 · 2026/11/11 11:54来源：界面新闻","body_orig":"","translated":false},"e4c4331e50295547":{"body":"中新网11月11日电 11日，国务院台办举行例行新闻发布会。会上，有记者提问：近期台湾农渔产品陆续恢复输往大陆，本届进博会也有一些台湾企业参展。台湾农贸企业普遍看好大陆市场，同时也对民进党当局人为设置障碍干扰两岸农贸合作表示担心。请问对此有何评论？\n\n国台办发言人张晗表示，我们秉持“两岸一家亲”的理念，始终把台湾民众的生计与福祉放在心上，积极为台湾农渔业者办好事、解难事，帮助台湾农渔产品在大陆拓宽销路，让两岸同胞共享两岸经贸合作、融合发展的红利。大陆拥有稳定、开放的超大规模市场，两岸农渔业者合作空间广阔。民进党当局应正视岛内农渔业界的诉求，停止政治操弄，切实为民谋利。\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"048f7edebc56a7d5":{"body":"中新网伦敦11月10日电 (记者 欧阳开宇)11月10日，中国驻曼彻斯特总领事唐锐出席2026年中英清洁能源合作论坛。曼彻斯特市议会副议长罗林斯、英能源安全与净零排放部主管官员科维、武汉市人民政府外事办公室副主任李军、英国中国商会副会长杨亚美以及两国知名企业和专家学者150人参会。英国驻华贸易使节韩瑞芬发表视频致辞，李军宣读了武汉市长熊征宇的致辞。\n\n唐锐表示，中国拥有全球最大、最完整、最具竞争力的清洁能源产业链，英国是重要的清洁技术市场。希望各界用好论坛，在电动汽车、光伏储能等领域达成务实成果。与会嘉宾认为，两国在清洁能源领域的政策目标契合、合作潜力巨大，论坛为双方企业对接提供了重要平台。\n\n与会代表围绕绿色城市建设、清洁能源合作等深入探讨，达成了一批初步合作意向。(完) 【编辑:管娜】\n\n英国警方：一美军士兵因涉嫌从事与俄相关间谍活动在英被捕\n\n英国央行副行长警示通胀有持续风险 释放进一步加息信号\n\n达纳·怀特同特朗普出席新闻发布会，拒绝担任白宫新闻秘书\n\n埃及海洋研究专家：中国为非洲国家环保事业发展提供有力支持\n\n特朗普宣布实施“铁门”行动：“几乎没有东西能进出伊朗！”伊朗否认并谴责\n\n与世界共享机遇：进博会是中国坚持“开门发展”的生动注脚\n\n员工疑因玩梗遭辞退？律师：如属实，企业或涉嫌违法解除\n\n服务乡村振兴高校招生专项计划来了！2030年将正式落地实施\n\n“双11”电商大促再度开启 专家提示法律风险防范要点\n\n成都蓉城俱乐部董事长、总经理辞职 主教练阿洛伊西离任\n\n“花坛藏尸案”死者儿子痛哭：想告诉妈妈 这个儿子没有白生\n\n运动会上小女孩在场下自信舞蹈 网友：这一刻 她就是主角！","body_orig":"","translated":false},"7941ac4067ddfcda":{"body":"电商的促销活动中，网络直播带货中，有些主播会作出“保证正品”“售后兜底”“假一赔十”等承诺，这些口头承诺算不算数，有没有法律效力？一旦买到假货，销售商家、带货主播、网络平台，到底谁来兑现赔偿？来看最高人民法院发布的一起典型案例。\n\n周女士在一家购物公司直播间主播的推荐下，在某商贸公司开设的“美妆专营店”花费1859元购买了一瓶面霜。直播过程中，主播当众作出售后兜底的承诺。\n\n主播介绍，这款面霜是专柜正品，资质齐全、可溯源。但周女士收货比对后，发现商品存在问题，委托专业机构鉴定，确认商品并非正品，鉴定花费500元。\n\n事后，商贸公司虽然口头答应，按照四倍货款加上鉴定费进行赔偿，却迟迟没有兑现。周女士多次沟通无果后诉至法院，要求商贸公司、直播购物公司承担赔偿责任，同时主张网络平台承担连带赔偿责任。\n\n直播带货中，推广方承诺兜底赔付的情况并不少见。可一旦消费者维权，各方却经常相互推诿。销售商家、直播推广方，责任该如何划分？\n\n丽水市莲都区人民法院民二庭庭长 朱海峰：销售方是商品质量和违约赔偿的第一责任人。本案中，买卖合同的出卖人是这家商贸公司，需要承担卖方对应的法律责任。而购物公司作为直播推广方，主播在直播间公开
