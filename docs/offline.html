ource_id":"chinanews_finance","category":"politics","lang":"zh","published":1794360309.0,"tags":[],"score":89.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"17256810d4204e0b","title":"保加利亚连环车祸已致12死 政府宣布全国哀悼","title_zh":"","title_orig":"","summary":"中新网11月11日电 据英国广播公司(BBC)等外媒报道，当地时间10日，保加利亚东部城市扬博尔附近一条高速公路发生两起严重连环车祸事故，涉及数十辆轿车和重型货车。保加利亚总理拉德夫表示，事故已造成12人死亡。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729883.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794352782.0,"tags":[],"score":92.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"0d788572029280e4","title":"中国深部岩芯钻探最大深度提升至7000米级","title_zh":"","title_orig":"","summary":"中新社济南11月10日电 (周艺伟)据山东省地质矿产勘查开发局11月10日消息，日前投用的中国地矿领域首台全自动化钻机——ZJ50DB/XD70DB，将中国深部岩芯钻探的最大深度提升至7000米级。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gn/2026/11-10/10729849.shtml","source":"中新网 · 国内","source_id":"chinanews","category":"politics","lang":"zh","published":1794319818.0,"tags":[],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"bcd31cc17944f790","title":"云南南部及华南等地降雨增多 华北黄淮等地大气扩散条件较差","title_zh":"","title_orig":"","summary":"中新网11月11日电 据中央气象台网站消息，昨日，全国大部地区降水稀少，仅云南东北部和中西部等地出现中到大雨，局地暴雨。预计11-13日，受南支槽东移影响，云南、广西、广东、贵州、湖南、江西、福建等地降水将增多、增强。另外，11-15日，受中亚低槽东移影响，新疆北部山区和沿天山地区等地部分地区有明显降雪。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/sh/2026/11-11/10729909.shtml","source":"中新网 · 滚动","source_id":"chinanews_scroll","category":"politics","lang":"zh","published":1794359717.0,"tags":[],"score":87.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"ebfe4e11b54dd677","title":"阿布扎比首日会谈持续近4小时 俄美乌三方表态","title_zh":"","title_orig":"","summary":"中新网11月11日电 综合报道，当地时间10日，新一轮俄罗斯、美国和乌克兰三方会谈在阿联酋首都阿布扎比举行，首日会谈持续近4小时。这是2026年2月谈判陷入停滞以来，俄美乌三方时隔9个月重启面对面磋商。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729881.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794351403.0,"tags":["外交"],"score":92.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"6b2fedf062368da6","title":"中国首个实现沙漠化逆转的省区，如何做到？宁夏官员向世界分享生态保护经验","title_zh":"","title_orig":"","summary":"中新网安塔利亚11月10日电(记者 王庆凯 魏园)当地时间11月10日，在土耳其安塔利亚举行的《联合国气候变化框架公约》第三十一次缔约方大会(COP31)中国角主题边会上，宁夏回族自治区生态环境厅宣传教育处处长王波分享了生态环境保护的宁夏探索实践。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gn/2026/11-10/10729844.shtml","source":"中新网 · 国内","source_id":"chinanews","category":"politics","lang":"zh","published":1794319508.0,"tags":["外交","民生"],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"ba733ea9302b8b1e","title":"火流星散落石家庄周边 “天外来客”价值几何？","title_zh":"","title_orig":"","summary":"日前，一颗明亮绚烂的火流星划过华北地区上空，众多“陨石猎人”随即根据目击地点和影像记录，在石家庄市鹿泉区发现了陨石个体及碎块。消息传出后，不只是陨石爱好者、收藏者，周边一带的村民也加入到“寻宝”队伍中；而二手交易平台上，已有不少卖家挂出链接，出售此次火流星坠落下的陨石。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/sh/2026/11-11/10729905.shtml","source":"中新网 · 滚动","source_id":"chinanews_scroll","category":"politics","lang":"zh","published":1794358922.0,"tags":[],"score":87.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"cbf435d286a6a9eb","title":"国家卫健委发布新冠病毒疫苗第二剂次加强免疫接种实施方案","title_zh":"","title_orig":"","summary":"为深入贯彻落实党中央、国务院决策部署，进一步做好新冠肺炎疫情应对工作，保障人民群众生命安全和身体健康，经研究，现提出新冠病毒疫苗第二剂次加强免疫接种实施方案。","summary_zh":"","summary_orig":"","url":"http://www.news.cn/politics/2022-12/14/c_1129207117.htm","source":"新华网 · 时政","source_id":"xinhua_pol","category":"politics","lang":"zh","published":null,"tags":[],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"748c77247832a3f8","title":"俄美乌时隔9个月再谈 欧洲争取上桌 俄乌互袭不止","title_zh":"","title_orig":"","summary":"新一轮俄罗斯、美国和乌克兰三方会谈11月10日在阿联酋首都阿布扎比举行，探讨推动乌克兰危机政治解决的途径。首日会谈持续近4小时，这也是今年2月谈判陷入停滞以来，三方时隔9个月重启面对面磋商，会谈将于11日继续进行。乌方称会谈富有建设性，美方评价积极，而俄方对停火持谨慎态度。与此同时，俄乌之间的军事互袭仍在继续。专家认为，各方的政治考量并不一致，推动谈判的节奏也不同步，难以实质性形成突破。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729880.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794351041.0,"tags":["外交"],"score":92.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"a6ff6244529d1dc4","title":"中国国民党举办孙中山先生诞辰纪念座谈会","title_zh":"","title_orig":"","summary":"中新社台北11月10日电 (记者 路梅)今年适逢孙中山先生诞辰160周年，中国国民党10日在位于台北的中央党部中山厅举办纪念座谈会。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gn/2026/11-10/10729840.shtml","source":"中新网 · 国内","source_id":"chinanews","category":"politics","lang":"zh","published":1794319386.0,"tags":[],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"0dc5e5b6caa48ae7","title":"未来三天北京晴天持续昼夜温差可达15℃ 扩散条件逐渐转差","title_zh":"","title_orig":"","summary":"中国天气网讯 未来三天(11月11日至13日)，北京晴天持续，最高气温可达16℃，但昼夜温差较大，早晚时段寒意足，公众需持续做好保暖工作。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/sh/2026/11-11/10729903.shtml","source":"中新网 · 滚动","source_id":"chinanews_scroll","category":"politics","lang":"zh","published":1794358486.0,"tags":[],"score":87.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"229a862edfc3caf2","title":"老年人现在打疫苗晚不晚？受基础病影响的能不能打？独居老人是否有必要接种？【科学防疫小贴士】","title_zh":"","title_orig":"","summary":"在目前新冠流行的情况下，建议没有完成接种的老年人尽快接种，尽快按照程序完成全程和加强免疫，使疫苗的保护作用得到更好发挥。","summary_zh":"","summary_orig":"","url":"http://www.news.cn/politics/2022-12/14/c_1129207047.htm","source":"新华网 · 时政","source_id":"xinhua_pol","category":"politics","lang":"zh","published":null,"tags":[],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year": ","category":"politics","lang":"zh","published":1794357754.0,"tags":[],"score":87.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"564ed92fed46920f","title":"关于BQ.1，你需要知道的几件事——","title_zh":"","title_orig":"","summary":"近日网络流传：代号“地狱犬”的新冠变异毒株，在日本“杀疯了”？消息称，一种名为BQ.1.1的新型变异毒株已经出现。该毒株的传染性和致死率都很高，被称作“地狱犬”，已经在日本“杀疯了”。","summary_zh":"","summary_orig":"","url":"http://www.news.cn/politics/2022-12/14/c_1129206954.htm","source":"新华网 · 时政","source_id":"xinhua_pol","category":"politics","lang":"zh","published":null,"tags":[],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c08081a5d0a007a8","title":"中国地矿领域首台全自动化钻机在川西高原投用","title_zh":"","title_orig":"","summary":"中新网济南11月10日电(周艺伟 郭美丽)据山东省地质矿产勘查开发局(以下简称“山东省地矿局”)11月10日消息，日前投用的中国地矿领域首台全自动化钻机——ZJ50DB/XD70DB，将中国深部岩芯钻探的最大深度提升至7000米级。该设备由山东省地矿局第六地质大队联合中国地质装备集团有限公司研制，在四川省甘孜藏族自治州鲜水河断裂带科研钻探项目现场起塔投用。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/cj/2026/11-10/10729835.shtml","source":"中新网 · 财经","source_id":"chinanews_finance","category":"politics","lang":"zh","published":1794319336.0,"tags":[],"score":86.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"5e8823eb17487540","title":"河北今年已建设改造农村公路5215.8公里","title_zh":"","title_orig":"","summary":"中新网石家庄11月10日电(陈林 宋文浩)河北省政府新闻办10日举行河北省奋力推动“四好农村路”高质量发展新闻发布会。据通报，今年以来，河北建设改造农村公路5215.8公里，为全年任务的104.3%。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gn/2026/11-10/10729810.shtml","source":"中新网 · 国内","source_id":"chinanews","category":"politics","lang":"zh","published":1794319168.0,"tags":[],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"63214e6985afbcf2","title":"中央气象台：云南华南江南等地有降水 新疆等地多雨雪 华北黄淮等地将有霾天气","title_zh":"","title_orig":"","summary":"中新网11月11日电 据中央气象台网站11日消息，昨日，全国大部地区降水稀少，仅云南部分地区出现较强降雨。预计未来三天，云南南部及华南等地降雨较强，注意防范局地强降雨可能引发的次生灾害；新疆北部、川西高原、西藏东部关注雨雪天气对交通、农牧业及工程建设等的影响。另外，华北、黄淮及汾渭平原等地有轻至中度霾、局地重度霾，关注对人体健康、交通的影响。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/sh/2026/11-11/10729898.shtml","source":"中新网 · 滚动","source_id":"chinanews_scroll","category":"politics","lang":"zh","published":1794357220.0,"tags":[],"score":87.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"6027f6045582ff47","title":"6年、10年、12年，他们都经历了什么？","title_zh":"","title_orig":"","summary":"为了再次“飞天”圆梦，指令长陈冬准备了6年，刘洋已经准备整整10年，而首次飞向太空的蔡旭哲为了这一天，已经刻苦训练了12年。","summary_zh":"","summary_orig":"","url":"http://www.news.cn/politics/2022-12/14/c_1129206833.htm","source":"新华网 · 时政","source_id":"xinhua_pol","category":"politics","lang":"zh","published":null,"tags":[],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"873999f13321ced4","title":"重庆两江新区三方面发力 将科创优势转化为发展动能","title_zh":"","title_orig":"","summary":"中新网重庆11月10日电 (记者 钟旖)“如何把已有科创优势转化为高质量发展的强劲动能，是我们思考的核心命题。”10日，在重庆市政府新闻办召开的发布会上，重庆两江新区政府副区长郑航表示，“十五五”期间，该区将重点抓好三项工作助力重庆市创新发展。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/cj/2026/11-10/10729826.shtml","source":"中新网 · 财经","source_id":"chinanews_finance","category":"politics","lang":"zh","published":1794319284.0,"tags":[],"score":86.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"91f8ebd1ab2bae72","title":"吉姆·乔丹当选美国下一届国会众议院共和党领袖","title_zh":"","title_orig":"","summary":"央视记者当地时间11月10日获悉，美国国会众议院共和党人当天举行党内投票，以106票对73票选举俄亥俄州共和党籍众议员吉姆·乔丹担任下一届国会众议院共和党领袖，击败现任众议院多数党领袖史蒂夫·斯卡利斯。这是乔丹第三次竞选国会共和党领导职务。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729878.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794348226.0,"tags":[],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"097c47c42b6b7260","title":"第三届纪检监察学科建设高端论坛在中国人民大学举办","title_zh":"","title_orig":"","summary":"中新网北京11月10日电 (记者 谢雁冰)以“深入学习贯彻党的二十届五中全会精神 持之以恒推进全面从严治党与纪检监察学科高质量发展”为主题，第三届纪检监察学科建设高端论坛11月8日在中国人民大学举办。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gn/2026/11-10/10729808.shtml","source":"中新网 · 国内","source_id":"chinanews","category":"politics","lang":"zh","published":1794319166.0,"tags":[],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"2f3db0dcac5862c7","title":"第一批新车次列车车票 今起陆续发售","title_zh":"","title_orig":"","summary":"全国铁路列车车次编排改革顺利推进，11月25日0时起始发开行的普速旅客列车、11月24日18时起始发开行的货物列车将正式使用新车次。第一批实行新车次的列车车票，今日起陆续发售。动车组列车车次此次变更暂时保持不变，将于12月下旬实施变更。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/sh/2026/11-11/10729887.shtml","source":"中新网 · 滚动","source_id":"chinanews_scroll","category":"politics","lang":"zh","published":1794353673.0,"tags":[],"score":87.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"63e9906236249303","title":"习近平将向《生物多样性公约》第十五次缔约方大会第二阶段高级别会议开幕式致辞","title_zh":"","title_orig":"","summary":"外交部发言人华春莹14日宣布：国家主席习近平将于12月15日以视频方式向《生物多样性公约》第十五次缔约方大会第二阶段高级别会议开幕式致辞。","summary_zh":"","summary_orig":"","url":"http://www.news.cn/politics/2022-12/14/c_1129206906.htm","source":"新华网 · 时政","source_id":"xinhua_pol","category":"politics","lang":"zh","published":null,"tags":["外交"],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f8f444996f410790","title":"马龙：应对气候变化不是少数国家的选择题","title_zh":"","title_orig":"","summary":"中新网安塔利亚11月10日电(记者 魏园)当地时间11月10日，普华永道中国税收政策服务主管合伙人马龙在土耳其安塔利亚表示，中国近年来的一系列财税政策，正用税收杠杆推动绿色承诺转化为企业的实际行动。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/cj/2026/11-10/10729802.shtml","source":"中新网 · 财经","source_id":"chinanews_finance","category":"politics","lang":"zh","published":1794319212.0,"tags":["政策监管"],"score":86.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"49c1da235d21ffc3","title":"英国警方：一美军士兵因涉嫌从事与俄相关间谍活动在英被捕","title_zh":"","title_orig":"","summary":"当地时间11月10日，英国反恐警察表示，一名41岁的美国陆军士兵因涉嫌从事与俄罗斯有关的间谍活动，在英格兰格洛斯特附近被捕。该男子涉嫌协助外国情报机构、获取或泄露受保护信息，目前被拘押在伦敦一处警察局。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729877.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794348154.0,"tags":[],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"34cfe6f0b5f69f97","title":"怒批民进党！罗大佑盼台湾民众觉醒","title_zh":"","title_orig":"","summary":"台湾资深音乐人罗大佑10日接受知名媒体人唐湘龙广播节目专访时对民进党当局“火力全开”，不仅质疑其拿到权力后整个变样，成了民众恐惧的来源，还对当前台湾文化环境提出批评，认为民进党当局为了选举降低文化门槛，导致台湾的文化水准一再下降。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gn/2026/11-10/10729831.shtml","source":"中新网 · 国内","source_id":"chinanews","category":"politics","lang":"zh","published":1794318925.0,"tags":[],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"31c1a26f63a33284","title":"明起新一轮冷空气接踵而至 我国大部将迎大风降温","title_zh":"","title_orig":"","summary":"今天（12月14日），全国大部降水仍稀少，雨雪零散分布，冷空气影响也进入尾声阶段。不过，从明天开始，新一轮实力更强的冷空气接踵而至，将率先从新疆北部展开，随后逐渐给我国大部地区带来大风降温天气，同时西南、江汉等地降水也将增多。","summary_zh":"","summary_orig":"","url":"http://www.news.cn/politics/2022-12/14/c_1129206671.htm","source":"新华网 · 时政","source_id":"xinhua_pol","category":"politics","lang":"zh","published":null,"tags":[],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"0f7ebcab9127e65c","title":"2026年“云南社科专家文山行”在“珠江第一港”富宁港启动","title_zh":"","title_orig":"","summary":"中新网云南文山11月10日电(肖弼钰)10日，2026年“云南社科专家文山行”集中调研咨询活动启动。专家将深入文山壮族苗族自治州文山市、砚山县、富宁县开展为期4天的实地调研咨询，为文山州加快中国绿色铝谷核心区建设研提决策咨询建议。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/cj/2026/11-10/10729832.shtml","source":"中新网 · 财经","source_id":"chinanews_finance","category":"politics","lang":"zh","published":1794319081.0,"tags":[],"score":86.5,"t _id":"chinanews_finance","category":"politics","lang":"zh","published":1794319011.0,"tags":["民生"],"score":86.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"8613fc511a44a329","title":"英国央行副行长警示通胀有持续风险 释放进一步加息信号","title_zh":"","title_orig":"","summary":"中新社伦敦11月10日电 (记者 欧阳开宇)英国央行负责货币政策的副行长克莱尔·隆巴代利10日在一场央行会议上表示，英国通胀持续风险正在显现，若无通胀降温的明确证据，短期内大概率需要再度加息。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729870.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794347992.0,"tags":["政策监管"],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"329986ffea2b803d","title":"北京今天最高温0℃山区有零星小雪 明起三天冷空气又将来降温","title_zh":"","title_orig":"","summary":"今天（12月14日），北京气温将有所回升，最高气温0℃，下午天空云量增多，山区有零星小雪。明起三天，又有冷空气影响北京，北风将再度增大，气温逐渐下降。本周冷空气频繁，气温持续较低，公众请注意防寒保暖。","summary_zh":"","summary_orig":"","url":"http://www.news.cn/politics/2022-12/14/c_1129206415.htm","source":"新华网 · 时政","source_id":"xinhua_pol","category":"politics","lang":"zh","published":null,"tags":[],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"4e4ca0d7c7a22393","title":"重庆两江新区加快打造智能网联新能源汽车之都核心承载地","title_zh":"","title_orig":"","summary":"中新网重庆11月10日电 (记者 钟旖)重庆两江新区区委常委、区政府常务副区长肖文军10日在当地召开的新闻发布会上透露，作为打造重庆市智能网联新能源汽车之都的核心区，两江新区已形成了从汽车整车到三电系统、智能零部件以及后市场服务的完整汽车生态。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/cj/2026/11-10/10729823.shtml","source":"中新网 · 财经","source_id":"chinanews_finance","category":"politics","lang":"zh","published":1794318921.0,"tags":[],"score":86.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"88c9846a074d5c4e","title":"今年前10个月柬埔寨实现国际贸易总额突破634亿美元","title_zh":"","title_orig":"","summary":"中新社金边11月10日电 (张堰林 杨强)柬埔寨海关总署当地时间10日发布的报告显示，今年前10个月该国实现货物进出口总额接近634.6亿美元，与上年同期相比增长20.9%。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729871.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794347962.0,"tags":["经济"],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"8237062d04b20fc3","title":"2亿年前蝈蝈嗓门有多高？化石研究得出答案","title_zh":"","title_orig":"","summary":"12月13日，《美国科学院院报》（PNAS）在线发表了一项中国科学院南京地质古生物研究所的成果，科研人员对全球各大博物馆1000多块螽斯化石进行研究，重建了其鸣声频率的宏演化历史，发现在2.4亿年前的三叠纪，螽斯可以发出高达12—16kHz的鸣声,这也是整个动物界最古老的高频声音记录。","summary_zh":"","summary_orig":"","url":"http://www.news.cn/politics/2022-12/14/c_1129206396.htm","source":"新华网 · 时政","source_id":"xinhua_pol","category":"politics","lang":"zh","published":null,"tags":[],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"1603c95fd6ba1607","title":"第20届全球创业周中国站启幕 国际化能级跃升","title_zh":"","title_orig":"","summary":"中新网上海11月10日电(记者 陈静)2026(第20届)创业周暨全球创业周中国站(下称：创业周)10日开幕。本届创业周进一步提升国际化能级，通过搭建国际协作对话平台，推动国内外创业者、投资机构开展沟通、对接与务实合作。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/cj/2026/11-10/10729817.shtml","source":"中新网 · 财经","source_id":"chinanews_finance","category":"politics","lang":"zh","published":1794318891.0,"tags":[],"score":86.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"7cdf09f7ac6c69b2","title":"南非第三季度失业率升至33.7%","title_zh":"","title_orig":"","summary":"中新社约翰内斯堡11月10日电 南非统计局10日发布的《季度劳动力调查报告》显示，今年第三季度南非失业率为33.7%，较第二季度上升0.1个百分点。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729873.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794347890.0,"tags":[],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"ae6e9b5dd7f3ccb7","title":"孙春兰在北京调研时强调 细化致微落实各项优化措施 确保疫情防控转段平稳有序","title_zh":"","title_orig":"","summary":"国务院副总理孙春兰13日到北京市调研指导疫情防控工作，转达习近平总书记对首 9809.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794318945.0,"tags":["民生"],"score":89.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"e9a1e851f5555838","title":"新华全媒+丨南京，城祭","title_zh":"","title_orig":"","summary":"13日，南京在寒冬中迎来第九个国家公祭日。10时01分，凄厉的防空警报响起，江上的轮船、路上的汽车跟随鸣笛，警报声、鸣笛声响彻大街小巷、长江两岸。","summary_zh":"","summary_orig":"","url":"http://www.news.cn/politics/2022-12/13/c_1129205727.htm","source":"新华网 · 时政","source_id":"xinhua_pol","category":"politics","lang":"zh","published":null,"tags":[],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""}],"stats":{"input":244,"junk":11,"stale":59,"duplicate":14,"kept":159,"dropped_lowscore":1,"reasons":{"过期":59,"同链接":12,"无信息标题":6,"非时政内容":4,"标题雷同":2,"广告/导流":1},"sources_ok":19,"sources_total":21},"generated_at":1794361669.74755},"health":{"category":"health","label":"养生","items":[{"id":"8a613feb86b5838e","title":"Role of diet in hyperuricemia and gout","title_zh":"饮食在高尿酸血症和痛风中的作用","title_orig":"Role of diet in hyperuricemia and gout","summary":"Background\nGout is the most common form of inflammatory arthritis, affecting 41 million adults worldwide. The global burden of gout has been increasing over the last three decades, yet its management remains suboptimal. The primary aim of this manuscript is to review the impact of various diets such as the DASH, Mediterranean, and low purine diets; weight loss; and individual foods, including alcohol, caffeine, cherry, dairy, high-fructose corn syrup, omega-3 fatty acids, and vitamin C on hyperuricemia and clinical gout outcomes such as flares and tophi.Conclusion\nFew studies to date have specifically evaluated the effect of various dietary approaches on hyperuricemia among people with gout and on gout-specific outcomes. Overall, the dietary factors appear to have a small effect on serum urate levels, and their impact on the long-term clinical course of gout is uncertain. Limited evidenc","summary_zh":"背景痛风是最常见的炎性关节炎形式，影响全球4100万成年人。 痛风的全球负担在过去三十年中一直在增加，但其管理仍然不理想。 这份手稿的主要目的是","summary_orig":"Background\nGout is the most common form of inflammatory arthritis, affecting 41 million adults worldwide. The global burden of gout has been increasing over the last three decades, yet its management remains suboptimal. The primary aim of this manuscript is to review the impact of various diets such as the DASH, Mediterranean, and low purine diets; weight loss; and individual foods, including alcohol, caffeine, cherry, dairy, high-fructose corn syrup, omega-3 fatty acids, and vitamin C on hyperuricemia and clinical gout outcomes such as flares and tophi.Conclusion\nFew studies to date have specifically evaluated the effect of various dietary approaches on hyperuricemia among people with gout and on gout-specific outcomes. Overall, the dietary factors appear to have a small effect on serum urate levels, and their impact on the long-term clinical course of gout is uncertain. Limited evidenc","url":"https://doi.org/10.1016/j.berh.2021.101723","source":"Europe PMC · Best practice & research. Cl","source_id":"epmc","category":"health","lang":"en","published":1610640000.0,"tags":["高尿酸","循证文献"],"score":69.5,"translated":true,"has_body":false,"topic":"uric","kind":"paper","journal":"Best practice & research. Clinical rheumatology","year":"2021"},{"id":"cf72d76c7eebb390","title":"The role of diet in hyperuricemia and gout","title_zh":"饮食在高尿酸血症和痛风中的作用","title_orig":"The role of diet in hyperuricemia and gout","summary":"Purpose of review\nAlthough gout's cardinal feature is inflammatory arthritis, it is closely associated with insulin resistance and considered a manifestation of the metabolic syndrome. As such, both gout and hyperuricemia are often associated with major cardiometabolic and renal comorbidities that drive the persistently elevated premature mortality rates among gout patients. To that end, conventional low-purine (i.e., low-protein) dietary advice given to many patients with gout warrant reconsideration.Recent findings\nRecent research suggests that several healthy diets, such as the Mediterranean or Dietary Approaches to Stop Hypertension (DASH) diets, in combination with weight loss for those who are overweight or obese, can drastically improve cardiometabolic risk factors and outcomes. By treating gout as a part of the metabolic syndrome and shifting our dietary recommendations to these","summary_zh":"评审目的虽然痛风的主要特征是炎性关节炎，但它与胰岛素抵抗密切相关，被认为是代谢综合征的表现。 因此，痛风和高尿酸血症通常与","summary_orig":"Purpose of review\nAlthough gout's cardinal feature is inflammatory arthritis, it is closely associated with insulin resistance and considered a manifestation of the metabolic syndrome. As such, both gout and hyperuricemia are often associated with major cardiometabolic and renal comorbidities that drive the persistently elevated premature mortality rates among gout patients. To that end, conventional low-purine (i.e., low-protein) dietary advice given to many patients with gout warrant reconsideration.Recent findings\nRecent research suggests that several healthy diets, such as the Mediterranean or Dietary Approaches to Stop Hypertension (DASH) diets, in combination with weight loss for those who are overweight or obese, can drastically improve cardiometabolic risk factors and outcomes. By treating gout as a part of the metabolic syndrome and shifting our dietary recommendations to these","url":"https://doi.org/10.1097/bor.0000000000000779","source":"Europe PMC · Current opinion in rheumatol","source_id":"epmc","category":"health","lang":"en","published":1610640000.0,"tags":["高尿酸","循证文献"],"score":69.5,"translated":true,"has_body":false,"topic":"uric","kind":"paper","journal":"Current opinion in rheumatology","year":"2021"},{"id":"766368c8cf60e824","title":"Diet After Cholecystectomy","title_zh":"胆囊切除术后.","title_orig":"Diet After Cholecystectomy","summary":"Patients with gallstones are often affected by alimentary disorders contributing to the onset of gallstones disease. Cholecystectomy can have nutritional and metabolic consequences in the short-term (diarrhea, abdominal pain and bloating) and in the long-term (increased Body Mass Index with metabolic syndrome, gastritis, liposoluble vitamin deficiency). Pathogenic mechanisms behind these disturbances are reviewed and the need for an early post-operative nutritional intervention based on low-lipid, high-fibers diet, is highlighted.","summary_zh":"","summary_orig":"Patients with gallstones are often affected by alimentary disorders contributing to the onset of gallstones disease. Cholecystectomy can have nutritional and metabolic consequences in the short-term (diarrhea, abdominal pain and bloating) and in the long-term (increased Body Mass Index with metabolic syndrome, gastritis, liposoluble vitamin deficiency). Pathogenic mechanisms behind these disturbances are reviewed and the need for an early post-operative nutritional intervention based on low-lipid, high-fibers diet, is highlighted.","url":"https://doi.org/10.2174/0929867324666170518100053","source":"Europe PMC · Current medicinal chemistry","source_id":"epmc","category":"health","lang":"en","published":1547481600.0,"tags":["胆囊术后","循证文献"],"score":69.5,"translated":true,"has_body":false,"topic":"gallstone","kind":"paper","journal":"Current medicinal chemistry","year":"2019"},{"id":"17e93add5fc13c60","title":"Uric Acid and Plant-Based Nutrition","title_zh":"尿酸和植物性营养","title_orig":"Uric Acid and Plant-Based Nutrition","summary":"Plant-based diets (PBDs) are associated with decreased risk of morbidity and mortality associated with important noncommunicable chronic diseases. Similar to animal-based food sources (e.g., meat, fish, and animal visceral organs), some plant-based food sources (e.g., certain soy legume products, sea vegetables, and brassica vegetables) also contain a high purine load. Suboptimally designed PBDs might consequently be assoc is well known as an inflammatory rheumatic disease presenting with arthritis and abnormal metabolism of uric acid. The recognition of diet-induced systemic metabolic pathways have provided new mechanistic insights and potential interventions on gout progression. However, the dietary recommendations for gouty patients generally focus on food categories, with few simultaneous considerations of nutritional factors and systemic metabolism. It is worthwhile to comprehensively review the mechanistic findings and potential interventions of diet-related nutrients against the development of gout, including purine metabolism, urate deposition, and gouty inflammation. Although piecemeal modifications of various nutrients often provide incomplete dietary recommendations, understanding the role of nutritional factors in gouty development can help patients choose their healthy diet based on perso","summary_zh":"痛风是一种众所周知的炎性风湿性疾病，伴有关节炎和尿酸代谢异常。对饮食诱导的全身代谢途径的认识为痛风进展提供了新的机制见解和潜在的干预措施","summary_orig":"Gout is well known as an inflammatory rheumatic disease presenting with arthritis and abnormal metabolism of uric acid. The recognition of diet-induced systemic metabolic pathways have provided new mechanistic insights and potential interventions on gout progression. However, the dietary recommendations for gouty patients generally focus on food categories, with few simultaneous considerations of nutritional factors and systemic metabolism. It is worthwhile to comprehensively review the mechanistic findings and potential interventions of diet-related nutrients against the development of gout, including purine metabolism, urate deposition, and gouty inflammation. Although piecemeal modifications of various nutrients often provide incomplete dietary recommendations, understanding the role of nutritional factors in gouty development can help patients choose their healthy diet based on perso","url":"https://doi.org/10.3390/nu14173525","source":"Europe PMC · Nutrients","source_id":"epmc","cate tionship between fructose intake and the risk of hyperuricemia. This review highlights the metabolic process of fructose in the liver, small intestine, and kidney. Furthermore, we discuss molecular insights on fructose metabolism to reveal the underlying mechanism of fructose metabolism. Additionally, we elabora","url":"https://doi.org/10.1016/j.biopha.2020.110795","source":"Europe PMC · Biomedicine & pharmacotherap","source_id":"epmc","category":"health","lang":"en","published":1579017600.0,"tags":["高尿酸","循证文献"],"score":64.5,"translated":true,"has_body":false,"topic":"uric","kind":"paper","journal":"Biomedicine & pharmacotherapy = Biomedecine & pharmacotherapie","year":"2020"},{"id":"e56903b6c371e3ff","title":"Changes in Pancreatic Fat Content Following Diet-Induced Weight Loss","title_zh":"饮食诱导的体重减轻后胰腺脂肪含量的变化","title_orig":"Changes in Pancreatic Fat Content Following Diet-Induced Weight Loss","summary":"Background\nObesity can lead to ectopic pancreatic fat accumulation and increase the risk for type 2 diabetes. Smaller intervention trials have shown a decrease in pancreatic fat content (PFC) with weight loss, and we intended to investigate the effects of weight loss on PFC in a larger trial.Methods\nData from the HELENA-Trial, a randomized controlled trial (RCT) among 137 non-diabetic obese adults were used. The study cohort was classified into 4 quartiles based on weight change between baseline and 12 weeks post-intervention. Changes in PFC (baseline, 12 weeks and 50 weeks post-intervention) upon weight loss were analyzed by linear mixed models. Spearman's coefficients were used to obtain correlations between anthropometric parameters, blood biochemical markers, and PFC.Results\nAt baseline, PFC only showed a significant correlation with visceral adipose tissue (VAT) (r = 0.41). Relative","summary_zh":"背景肥胖可导致异位胰腺脂肪堆积并增加2型糖尿病的风险。 较小的干预试验显示胰腺脂肪含量（PFC）随体重减轻而下降，我们打算研究称重","summary_orig":"Background\nObesity can lead to ectopic pancreatic fat accumulation and increase the risk for type 2 diabetes. Smaller intervention trials have shown a decrease in pancreatic fat content (PFC) with weight loss, and we intended to investigate the effects of weight loss on PFC in a larger trial.Methods\nData from the HELENA-Trial, a randomized controlled trial (RCT) among 137 non-diabetic obese adults were used. The study cohort was classified into 4 quartiles based on weight change between baseline and 12 weeks post-intervention. Changes in PFC (baseline, 12 weeks and 50 weeks post-intervention) upon weight loss were analyzed by linear mixed models. Spearman's coefficients were used to obtain correlations between anthropometric parameters, blood biochemical markers, and PFC.Results\nAt baseline, PFC only showed a significant correlation with visceral adipose tissue (VAT) (r = 0.41). Relative","url":"https://doi.org/10.3390/nu11040912","source":"Europe PMC · Nutrients","source_id":"epmc","category":"health","lang":"en","published":1547481600.0,"tags":["胰腺脂肪浸润","循证文献"],"score":64.5,"translated":true,"has_body":false,"topic":"pancreas","kind":"paper","journal":"Nutrients","year":"2019"},{"id":"3c83b5be24319a3a","title":"Hydrogel-Based Therapeutic Strategies for Post-Cholecystectomy NAFLD: Targeting Bile Acid Signaling, Gut Microbiota, Inflammation, and Hepatic Fibrosis","title_zh":"基于水凝胶的胆囊切除术后NAFLD治疗策略：靶向胆汁酸信号传导、肠道微生物群、炎症和肝纤维化","title_orig":"Hydrogel-Based Therapeutic Strategies for Post-Cholecystectomy NAFLD: Targeting Bile Acid Signaling, Gut Microbiota, Inflammation, and Hepatic Fibrosis","summary":"Post-cholecystectomy non-alcoholic fatty liver disease (NAFLD), now encompassed within metabolic dysfunction-associated steatotic liver disease (MASLD), is increasingly linked to persistent disruption of bile acid kinetics and gut-liver axis signaling after gallbladder removal. Continuous bile delivery to the intestine reshapes the bile acid pool, perturbs FXR-FGF19/TGR5 pathways, remodels gut microbiota, and compromises epithelial barrier integrity, collectively promoting portal endotoxemia, chronic hepatic inflammation, and fibrogenic remodeling. Hydrogel-based biomaterials offer a mechanistically aligned therapeutic platform for this setting because they enable localized, sustained, and stimuli-responsive interventions at intestinal or hepatic sites. Functional hydrogels can sequester excess bile acids, protect and deliver probiotics/prebiotics/postbiotics, reinforce mucosal barrier f","summary_zh":"胆囊切除术后非酒精性脂肪性肝病（NAFLD），现在包含在代谢功能障碍相关性脂肪性肝病（MASLD）中，越来越多地与胆汁酸动力学的持续破坏和ga后的肠-肝轴信号传导有关。","summary_orig":"Post-cholecystectomy non-alcoholic fatty liver disease (NAFLD), now encompassed within metabolic dysfunction-associated steatotic liver disease (MASLD), is increasingly linked to persistent disruption of bile acid kinetics and gut-liver axis signaling after gallbladder removal. Continuous bile delivery to the intestine reshapes the bile acid pool, perturbs FXR-FGF19/TGR5 pathways, remodels gut microbiota, and compromises epithelial barrier integrity, collectively promoting portal endotoxemia, chronic hepatic inflammation, and fibrogenic remodeling. Hydrogel-based biomaterials offer a mechanistically aligned therapeutic platform for this setting because they enable localized, sustained, and stimuli-responsive interventions at intestinal or hepatic sites. Functional hydrogels can sequester excess bile acids, protect and deliver probiotics/prebiotics/postbiotics, reinforce mucosal barrier f","url":"https://doi.org/10.3390/gels12020179","source":"Europe PMC · Gels (Basel, Switzerland)","source_id":"epmc","category":"health","lang":"en","published":1768406400.0,"tags":["胆囊术后","循证文献"],"score":59.5,"translated":true,"has_body":false,"topic":"gallstone","kind":"paper","journal":"Gels (Basel, Switzerland)","year":"2026"},{"id":"0c2931035eae36a2","title":"2026 ACC/AHA/AACVPR/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA Guideline on the Management of Dyslipidemia: A Report of the American College of Cardiology/American Heart Association Joint Committee on Clinical Practice Guidelines","title_zh":"2026 ACC/AHA/AACVPR/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA血脂异常管理指南：美国心脏病学会/美国心脏协会临床实践指南联合委员会的报告","title_orig":"2026 ACC/AHA/AACVPR/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA Guideline on the Management of Dyslipidemia: A Report of the American College of Cardiology/American Heart Association Joint Committee on Clinical Practice Guidelines","summary":"Aim\nThe \"2026 ACC/AHA/AACVPR/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA Guideline on the Management of Dyslipidemia\" retires and replaces the \"2018 AHA/ACC/AACVPR/AAPA/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA Guideline on the Management of Blood Cholesterol.\"Methods\nA comprehensive literature search was conducted from October 2024 to December 2024 to identify clinical studies, systematic reviews and meta-analyses, and other evidence conducted on human participants that were published in English from MEDLINE (through PubMed), EMBASE, the Cochrane Library, Agency for Healthcare Research and Quality, and other selected databases relevant to this guideline.Structure\nThe focus of this clinical practice guideline is to address the evaluation, management, and monitoring of individuals with dyslipidemias, including high blood cholesterol, hypertriglyceridemia, and elevated lipoprotein(a).","summary_zh":"瞄准\n《2026年ACC/AHA/AACVPR/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA血脂异常管理指南》淘汰并取代《2018年AHA/ACC/AACVPR/AAPA/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA血胆固醇管理指南》。\nA com","summary_orig":"Aim\nThe \"2026 ACC/AHA/AACVPR/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA Guideline on the Management of Dyslipidemia\" retires and replaces the \"2018 AHA/ACC/AACVPR/AAPA/ABC/ACPM/ADA/AGS/APhA/ASPC/NLA/PCNA Guideline on the Management of Blood Cholesterol.\"Methods\nA comprehensive literature search was conducted from October 2024 to December 2024 to identify clinical studies, systematic reviews and meta-analyses, and other evidence conducted on human participants that were published in English from MEDLINE (through PubMed), EMBASE, the Cochrane Library, Agency for Healthcare Research and Quality, and other selected databases relevant to this guideline.Structure\nThe focus of this clinical practice guideline is to address the evaluation, management, and monitoring of individuals with dyslipidemias, including high blood cholesterol, hypertriglyceridemia, and elevated lipoprotein(a).","url":"https://doi.org/10.1016/j.jacc.2025.11.016","source":"Europe PMC · Journal of the American Coll","source_id":"epmc","category":"health","lang":"en","published":1768406400.0,"tags":["高血脂","循证文献"],"score":59.5,"translated":true,"has_body":false,"topic":"lipid","kind":"paper","journal":"Journal of the American College of Cardiology","year":"2026"},{"id":"8bc5f25aef941408","title":"Association between intra-pancreatic fat deposition and diseases of the exocrine pancreas: A narrative review","title_zh":"胰内脂肪沉积与外分泌胰腺疾病的关系：叙事综述","title_orig":"Association between intra-pancreatic fat deposition and diseases of the exocrine pancreas: A narrative review","summary":"Intrapancreatic fat deposition (IPFD) has garnered increasing attention in recent years. The prevalence of IPFD is relatively high and associated with factors such as obesity, age, and sex. However, the pathophysiological mechanisms underlying IPFD remain unclear, with several potential contributing factors, including oxidative stress, alterations in the gut microbiota, and hormonal imbalances. IPFD was found to be highly correlated with the occurrence and prognosis of exocrine pancreatic diseases. Although imaging techniques remain the primary diagnostic approach for IPFD, an expanding array of biomarkers and clinical scoring systems have been identified for screening purposes. Currently, effective treatments for IPFD are not available; however, existing medications, such as glucagon-like peptide-1 receptor agonists, and new therapeutic approaches explored in animal models have shown co","summary_zh":"胰内脂肪沉积（IPFD）近年来越来越受到关注。IPFD的患病率相对较高，并与 e from the National Lipid Association","title_zh":"","title_orig":"Nutrition interventions for adults with dyslipidemia: A Clinical Perspective from the National Lipid Association","summary":"Lifestyle habits can have a profound impact on atherosclerotic cardiovascular disease (ASCVD) risk. The National Lipid Association previously published recommendations for lifestyle therapies to manage dyslipidemia. This Clinical Perspective provides an update with a focus on nutrition interventions for the three most common dyslipidemias in adults: 1) low-density lipoprotein cholesterol (LDL-C) elevation; 2) triglyceride (TG) elevation, including severe hypertriglyceridemia with chylomicronemia; and 3) combined dyslipidemia, with elevations in both LDL-C and TG levels. Lowering LDL-C and non-high-density lipoprotein cholesterol are the primary objectives for reducing ASCVD risk. With severe TG elevation (≥500 mg/dL), the primary objective is to prevent pancreatitis and ASCVD risk reduction is secondary. Nutrition interventions that lower LDL-C levels include reducing cholesterol-raising","summary_zh":"","summary_orig":"Lifestyle habits can have a profound impact on atherosclerotic cardiovascular disease (ASCVD) risk. The National Lipid Association previously published recommendations for lifestyle therapies to manage dyslipidemia. This Clinical Perspective provides an update with a focus on nutrition interventions for the three most common dyslipidemias in adults: 1) low-density lipoprotein cholesterol (LDL-C) elevation; 2) triglyceride (TG) elevation, including severe hypertriglyceridemia with chylomicronemia; and 3) combined dyslipidemia, with elevations in both LDL-C and TG levels. Lowering LDL-C and non-high-density lipoprotein cholesterol are the primary objectives for reducing ASCVD risk. With severe TG elevation (≥500 mg/dL), the primary objective is to prevent pancreatitis and ASCVD risk reduction is secondary. Nutrition interventions that lower LDL-C levels include re ncluded in the study. The control group consisted of individuals included in a surveillance screening program. Magnetic resonance imaging (MRI) of the pancreas was performed in all patients and fat measurement was made using 2-point Dixon imaging. Fecal elastase-1 (FE-1) was performed to evaluate pancreatic exocrine function. Additionally, a 13C-mixed triglyceride breath test (13 C-MTG-BT) was performed in patients with FE-1 Results\nImaging signs of NAFPD were present in 17 (71%) patients; 11 (85%","url":"https://doi.org/10.1080/00365521.2023.2200452","source":"Europe PMC · Scandinavian journal of gast","source_id":"epmc","category":"health","lang":"en","published":1673712000.0,"tags":["胰腺脂肪浸润","循证文献"],"score":59.5,"translated":false,"has_body":false,"topic":"pancreas","kind":"paper","journal":"Scandinavian journal of gastroenterology","year":"2023"},{"id":"4c00340dae223390","title":"Cholecystectomy promotes the development of colorectal cancer by the alternation of bile acid metabolism and the gut microbiota","title_zh":"","title_orig":"Cholecystectomy promotes the development of colorectal cancer by the alternation of bile acid metabolism and the gut microbiota","summary":"The incidence and mortality of colorectal cancer (CRC) have been markedly increasing worldwide, causing a tremendous burden to the healthcare system. Therefore, it is crucial to investigate the risk factors and pathogenesis of CRC. Cholecystectomy is a gold standard procedure for treating symptomatic cholelithiasis and gallstone diseases. The rhythm of bile acids entering the intestine is altered after cholecystectomy, which leads to metabolic disorders. Nonetheless, emerging evidence suggests that cholecystectomy might be associated with the development of CRC. It has been reported that alterations in bile acid metabolism and gut microbiota are the two main reasons. However, the potential mechanisms still need to be elucidated. In this review, we mainly discussed how bile acid metabolism, gut microbiota, and the interaction between the two factors influence the development of CRC. Subse","summary_zh":"","summary_orig":"The incidence and mortality of colorectal cancer (CRC) have been markedly increasing worldwide, causing a tremendous burden to the healthcare system. Therefore, it is crucial to investigate the risk factors and pathogenesis of CRC. Cholecystectomy is a gold standard procedure for treating symptomatic cholelithiasis and gallstone diseases. The rhythm of bile acids entering the intestine is altered after cholecystectomy, which leads to metabolic disorders. Nonetheless, emerging evidence suggests that cholecystectomy might be associated with the development of CRC. It has been reported that alterations in bile acid metabolism and gut microbiota are the two main reasons. However, the potential mechanisms still need to be elucidated. In this review, we mainly discussed how bile acid metabolism, gut microbiota, and the interaction between the two factors influence the development of CRC. Subse","url":"https://doi.org/10.3389/fmed.2022.1000563","source":"Europe PMC · Frontiers in medicine","source_id":"epmc","category":"health","lang":"en","published":1642176000.0,"tags":["胆囊术后","循证文献"],"score":59.5,"translated":false,"has_body":false,"topic":"gallstone","kind":"paper","journal":"Frontiers in medicine","year":"2022"},{"id":"6d39b3d5b5da68dc","title":"An Isoenergetic Multifactorial Diet Reduces Pancreatic Fat and Increases Postprandial Insulin Response in Patients With Type 2 Diabetes: A Randomized Controlled Trial","title_zh":"","title_orig":"An Isoenergetic Multifactorial Diet Reduces Pancreatic Fat and Increases Postprandial Insulin Response in Patients With Type 2 Diabetes: A Randomized Controlled Trial","summary":"Objective\nTo compare the effect of an isocaloric multifactorial diet with a diet rich in monounsaturated fatty acids (MUFA) and similar macronutrient composition on pancreatic fat (PF) and postprandial insulin response in type 2 di unction-associated fatty liver disease: unveiling the metabolic and chronobiologic clues behind the bile acid enterohepatic circulation","title_zh":"","title_orig":"Cholecystectomy as a risk factor for metabolic dysfunction-associated fatty liver disease: unveiling the metabolic and chronobiologic clues behind the bile acid enterohepatic circulation","summary":"Metabolic dysfunction-associated fatty liver disease (MAFLD) is highly prevalent worldwide. Recent clinical and experimental studies have addressed the association between cholecystectomy and MAFLD, confirming that cholecystectomy is an independent risk factor for MAFLD. In this review, we describe the epidemiologic evidence that links cholecystectomy to MAFLD, and discuss the possible mechanisms behind these connections, in order to unveil the metabolic and chronobiologic signals conveyed by the waves of the bile acid enterohepatic circulation.","summary_zh":"","summary_orig":"Metabolic dysfunction-associated fatty liver disease (MAFLD) is highly prevalent worldwide. Recent clinical and experimental studies have addressed the association between cholecystectomy and MAFLD, confirming that cholecystectomy is an independent risk factor for MAFLD. In this review, we describe the epidemiologic evidence that links cholecystectomy to MAFLD, and discuss the possible mechanisms behind these connections, in order to unveil the metabolic and chronobiologic signals conveyed by the waves of the bile acid enterohepatic circulation.","url":"https://doi.org/10.1007/s13105-020-00782-w","source":"Europe PMC · Journal of physiology and bi","source_id":"epmc","category":"health","lang":"en","published":1610640000.0,"tags":["胆囊术后","循证文献"],"score":59.5,"translated":false,"has_body":false,"topic":"gallstone","kind":"paper","journal":"Journal of physiology and biochemistry","year":"2021"},{"id":"fa15ec9bdb8e342e","title":"The Role of Specific Components of a Plant-Based Diet in Management of Dyslipidemia and the Impact on Cardiovas tension Information Specialist searched the following databases for randomized controlled trials up to April 2018 and a top-up search in March 2020: the Cochrane Hypertension Specialised Register, the Cochrane Central Register of Controlled Trials (CENTRAL), MEDLINE (from 1946), Embase (from 1974), the World Health Organization International Clinical Trials Registry Platform, and ClinicalTrials.gov. We also contacted authors of relevant papers regarding further published and unpubli","url":"https://doi.org/10.1002/14651858.cd004022.pub5","source":"Europe PMC · The Cochrane database of sys","source_id":"epmc","category":"health","lang":"en","published":1579017600.0,"tags":["高血脂","循证文献"],"score":59.5,"translated":false,"has_body":false,"topic":"lipid","kind":"paper","journal":"The Cochrane database of systematic reviews","year":"2020"},{"id":"c390e6daf072cea0","title":"Management of Dyslipidemia for Cardiovascular Disease Risk Reduction: Synopsis of the 2020 Updated U.S. Department of Veterans Affairs and U.S. Department of Defense Clinical Practice Guideline","title_zh":"","title_orig":"Management of Dyslipidemia for Cardiovascular Disease Risk Reduction: Synopsis of the 2020 Updated U.S. Department of Veterans Affairs and U.S. Department of Defense Clinical Practice Guideline","summary":"Description\nIn June 2020, the U.S. Department of Veterans Affairs (VA) and U.S. Department of Defense (DoD) released a joint update of their clinical practice guideline for managing dyslipidemia to reduce cardiovascular disease risk in adults. This synopsis describes the major recommendations.Methods\nOn 6 August to 9 August 2019, the VA/DoD Evidence-Based Practice Work Group (EBPWG) convened a joint VA/DoD guideline development effort that included clinical stakeholders and conformed to the Institute of Medicine's tenets for trustworthy clinical practice guidelines. The guideline panel developed key questions, systematically searched and evaluated the literature (English-language publications from 1 December 2013 to 16 May 2019), and developed 27 recommendations and a simple 1-page algorithm. The recommendations were graded by using the GRADE (Grading of Recommendations Assessment, Devel","summary_zh":"","summary_orig":"Description\nIn June 2020, the U.S. Department of Veterans Affairs (VA) and U.S. Department of Defense (DoD) released a joint update of their clinical practice guideline for managing dyslipidemia to reduce cardiovascular disease risk in adults. This synopsis describes the major recommendations.Methods\nOn 6 August to 9 August 2019, the VA/DoD Evidence-Based Practice Work Group (EBPWG) convened a joint VA/DoD guideline development effort that included clinical stakeholders and conformed to the Institute of Medicine's tenets for trustworthy clinical practice guidelines. The guideline panel developed key questions, systematically searched and evaluated the literature (English-language publications from 1 December 2013 to 16 May 2019), and developed 27 recommendations and a simple 1-page algorithm. The recommendations were graded by using the GRADE (Grading of Recommendations Assessment, Devel","url":"https://doi.org/10.7326/m20-4648","source":"Europe PMC · Annals of internal medicine","source_id":"epmc","category":"health","lang":"en","published":1579017600.0,"tags":["高血脂","循证文献"],"score":59.5,"translated":false,"has_body":false,"topic":"lipid","kind":"paper","journal":"Annals of internal medicine","year":"2020"},{"id":"0d86d06514dcf0df","title":"Pancreatic Steatosis Is Associated With Impaired Exocrine Pancreatic Function","title_zh":"","title_orig":"Pancreatic Steatosis Is Associated With Impaired Exocrine Pancreatic Function","summary":"Objectives\nThe aim of this study was to investigate if pancreatic steatosis measured by proton density fat fraction (PDFF) is associated with exocrine pancreatic function defined by fecal elastase concentrations.Materials and methods\nA total of 1458 volunteers (777 women; age range, 21-88 years) underwent magnetic resonance imaging of the pancreas, and organ fat content was quantified by using confounder corrected PDFF. Exocrine pancreatic function was categorized by fecal elastase levels using defined cutoffs: greater than 200 μg/g normal function (n = 1319) and 200 μg/g or less impaired function (n = 139). Statistical analysis to correlate pancreatic fat content with fecal elastase included linear regression, and analyses were adjusted for known confounders for pancreatic steatosis, such as age, sex, and body mass index.Results\nOverall mean (±standard deviation) of pancreatic fat conte","summary_zh":"","summary_orig":"Objectives\nThe aim of this study was to investigate if pancreatic steatosis measured by proton density fat fraction (PDFF) is associated with exocrine pancreatic function defined by fecal elastase concentrations.Materials and methods\nA total of 1458 volunteers (777 women; age range, 21-88 years) underwent magnetic resonance imaging of the pancreas, and organ fat content was quantified by using confounder corrected PDFF. Exocrine pancreatic function was categorized by fecal elastase levels using defined cutoffs: greater than 200 μg/g normal function (n = 1319) and 200 μg/g or less impaired function (n = 139). Statistical analysis to correlate pancreatic fat content with fecal elastase included linear regression, and analyses were adjusted for known confounders for pancreatic steatosis, such as age, sex, and body mass index.Results\nOverall mean (±standard deviation) of pancreatic fat conte","url":"https://doi.org/10.1097/rli.0000000000000554","source":"Europe PMC · Investigative radiology","source_id":"epmc","category":"health","lang":"en","published":1547481600.0,"tags":["胰腺脂肪浸润","循证文献"],"score":59.5,"translated":false,"has_body":false,"topic":"pancreas","kind":"paper","journal":"Investigative radiology","year":"2019"},{"id":"7c1d3878f60acebe","title":"心脑血管急症身体会有哪些预警？这些症状要警惕","title_zh":"","title_orig":"","summary":"随着冷空气来袭，气温下降明显，心梗、脑梗进入了高发期。研究显示，气温每降低1摄氏度，心梗风险升高2%。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/jk/2026/11-08/10728273.shtml","source":"中新网 · 健康","source_id":"chinanews_health","category":"health","lang":"zh","published":1794106641.0,"tags":["高血脂"],"score":57.4,"translated":false,"has_body":false,"topic":"lipid","kind":"news","journal":"","year":""}],"stats":{"input":22,"kept":21,"by_topic":{"uric":5,"gallstone":5,"pancreas":5,"lipid":6},"paper_count":20,"news_count":1,"sources_ok":19,"sources_total":21},"generated_at":1794361669.74755,"topics":[{"id":"gallstone","name":"胆囊术后","short":"胆囊切除后的消化适应"},{"id":"lipid","name":"高血脂","short":"血脂管理与心血管风险"},{"id":"uric","name":"高尿酸","short":"尿酸控制与痛风预防"},{"id":"pancreas","name":"胰腺脂肪浸润","short":"胰脂肪沉积与胰腺功能保护"}],"guides":{"gallstone":{"headline":"切除胆囊不是「不能吃油」，而是「不能一次吃太多油」。","intro":"胆囊的作用是储存和浓缩胆汁。切除后胆汁改为持续少量流入肠道，遇到一顿高脂大餐时没有足够的胆汁「突击」支援，未消化的脂肪进入结肠，就会出现腹胀、腹泻、油花样大便。绝大多数人在 3–6 个月内通过肠道适应自然缓解。","diet":[{"t":"术后 4–6 周是适应期","d":"脂肪供能比控制在 20–25%，优先植物油、深海鱼、坚果等不饱和来源；避免油炸、肥肉、奶油点心、动物皮。"},{"t":"少量多餐优于一日三大餐","d":"把一天的脂肪总量分散到 4–5 餐，单餐脂肪越少，胆汁供需越容易匹配。"},{"t":"不需要终身严格低脂","d":"适应期后逐步恢复常规饮食。长期过度限脂反而可能影响脂溶性维生素（A、D、E、K）吸收。"},{"t":"膳食纤维是长期盟友","d":"可溶性纤维（燕麦、豆类、苹果、魔芋）能结合胆汁酸、改善腹泻，并降低胆汁酸在肠道的过度刺激。"},{"t":"警惕「隐性高脂」","d":"坚果酱、沙拉酱、酥皮点心、奶茶、火锅蘸料，往往比一块瘦肉更容易触发症状。"},{"t":"限制酒精与含糖饮料","d":"两者都会加重胆汁成分异常与肝脏脂质负担，是胆总管结石复发的可干预因素。"}],"life":[{"t":"稳步减重，避免快速减重","d":"每周减重超过 1.5 kg 会增加胆汁胆固醇饱和度，是结石形成的经典诱因。目标为每周 0.5–1 kg。"},{"t":"规律进食，不长时间空腹","d":"空腹时间过长会使胆汁淤积、胆囊（或胆管）内压力升高。"},{"t":"餐后散步 15–20 分钟","d":"促进胃肠蠕动与胆汁排空，对腹胀和胆汁反流有实际帮助。"}],"watch":[{"t":"右上腹持续疼痛、发热、黄疸","d":"三者同时出现提示胆管梗阻或胆管炎，需立即就医，不能观察等待。"},{"t":"持续水样腹泻超过 3 个月","d":"可能是胆汁酸性腹泻，属于可治疗的问题，医生可用胆汁酸结合剂，不必硬扛。"},{"t":"油腻餐后反复右肩背放射痛","d":"需排查胆总管残余结石或乳头功能障碍。"}],"myths":[{"q":"切了胆囊就不能吃鸡蛋？","a":"可以吃。蛋黄确实含脂肪，但同时富含卵磷脂与优质蛋白。关键是不要一次吃多个油炸蛋，水煮蛋通常耐受良好。"},{"q":"切了胆囊就不会再长结石？","a":"不对。结石仍可能在胆总管内形成，发生率约 5–15%，所以长期饮食管理依然有意义。"}]},"lipid":{"headline":"降 LDL 靠「换油」和「加纤维」，降甘油三酯靠「减糖」和「戒酒」——这是两条不同的路径。","intro":"血脂不是单一指标。低密度脂蛋白胆固醇（LDL-C）主要由饱和脂肪摄入和遗传决定，是动脉粥样硬化的直接推手；甘油三酯（TG）则高度受精制碳水、果糖和酒精影响。弄混这两条路径，是很多人「吃得很清淡但指标不降」的原因。","diet":[{"t":"把饱和脂肪压到总能量 7% 以下","d":"具体做法：换掉肥肉、猪油、黄油、椰子油、全脂奶制品，改吃菜籽油、橄榄油、亚麻籽油。"},{"t":"可溶性纤维每天 10 g 以上","d":"约等于 60 g 燕麦 + 一份豆类。β-葡聚糖和果胶能结合胆汁酸、促进 LDL 清除，LDL 可降 5–10%。"},{"t":"植物甾醇 2 g/天","d":"可再降 LDL 约 8–10%。强化植物甾醇的食用油或酸奶是现实来源。"},{"t":"每周 2 次深海鱼","d":"三文鱼、鲭鱼、沙丁鱼提供 EPA/DHA，主要降低甘油三酯，对 TG 偏高者收益更明显。"},{"t":"严格限制添加糖与果糖","d":"含糖饮料、果汁、蜂蜜、糕点中的果糖在肝脏直接转化为 TG。这一条对甘油三酯的影响大于对胆固醇的影响。"},{"t":"酒精是甘油三酯的强升因素","d":"TG 偏高者建议完全戒酒；即使少量饮酒也可能使 TG 上升 20–30%。"},{"t":"用坚果替代零食，而不是额外加餐","d":"每天 20–30 g 原味坚果有益，但热量密度高，需等量替换而非叠加。"}],"life":[{"t":"每周 150 分钟中等强度有氧 + 2 次抗阻","d":"运动主要提升 HDL、降低 TG，对 LDL 影响有限——这也说明为什么「光靠运动」降不了 LDL。"},{"t":"减重 5–10%","d":"对 TG 和 HDL 改善最明显，对 LDL 的降幅通常只有 3–5%。"},{"t":"戒烟","d":"吸烟降低 HDL 并加速 LDL 氧化，是独立于血脂数值的风险因素。"}],"watch":[{"t":"TG ≥ 5.6 mmol/L","d":"急性胰腺炎风险显著升高，需尽快就医，不能只靠饮食调整。"},{"t":"服药后出现肌肉酸痛、乏力","d":"需查肌酸激酶，排除他汀相关肌病，不要自行停药或硬扛。"},{"t":"调脂治疗 4–12 周需复查","d":"复查血脂 + 肝功能，评估疗效与耐受性，再决定是否调整方案。"}],"myths":[{"q":"吃素血脂就一定正常？","a":"不一定。精制碳水、油炸素食、椰子油制品同样会推高 TG 和 LDL。关键在脂肪类型与碳水质量，而非「有没有肉」。"},{"q":"胆固醇吃多了才血脂高？","a":"膳食胆固醇的影响远小于饱和脂肪与遗传。多数人每天 1 个鸡蛋无碍，真正要盯的是饱和脂肪和总能量。"}]},"uric":{"headline":"升尿酸最猛的不是海鲜，是含糖饮料和酒。","intro":"尿酸是嘌呤代谢的终产物。约 2/3 来自体内自身合成，1/3 来自食物。果糖在肝脏代谢时会消耗 ATP、加速嘌呤分解，同时竞争性抑制尿酸排泄——这是含糖饮料比多数海鲜更能推高尿酸的原因。","diet":[{"t":"严格限制高嘌呤动物性食物","d":"动物内脏、浓肉汤/火锅老汤、沙丁鱼、凤尾鱼、贝类。红肉每日不超过 100 g。"},{"t":"含糖饮料与果汁要断","d":"包括「鲜榨」果汁和蜂蜜水。果糖的双重机制（生成增加 + 排泄减少）使其成为最强饮食因素之一。"},{"t":"酒精，尤其啤酒和白酒","d":"啤酒既含嘌呤又含酒精，是痛风发作的经典诱因；发作期应完全避免。"},{"t":"每天饮水 2000–3000 ml","d":"心、肾功能正常者适用。分次饮用，尿液保持清淡色，有助于尿酸排出与预防尿酸结石。"},{"t":"低脂乳制品有保护作用","d":"牛奶、无糖酸奶可促进尿酸排泄，是少数「可主动增加」的食物类别。"},{"t":"豆制品不必一概禁止","d":"这是过时观念。植物嘌呤对血尿酸影响远小于动物嘌呤，豆腐、豆浆可适量食用。"},{"t":"蔬菜、樱桃、咖啡可正常吃","d":"蔬菜总体不升尿酸；樱桃与咖啡有弱的降尿酸证据，属「有益无害」，但不足以替代治疗。"}],"life":[{"t":"避免剧烈运动与脱水","d":"一次性高强度运动使 ATP 大量分解、乳酸堆积抑制尿酸排泄，是常见的发作诱因。中等强度有氧更安全。"},{"t":"避免受凉与关节外伤","d":"温度下降使尿酸盐更易析出结晶，夜间足部保暖有实际意义。"},{"t":"减重但避免饥饿式减重","d":"快速减重与生酮饮食会升高血尿酸，需平稳推进。"}],"watch":[{"t":"急性发作期不加用降尿酸药","d":"通常待急性期缓解 2–4 周后再启动，否则血尿酸波动可能加重发作。具体时机由医生决定。"},{"t":"目标值：< 360 μmol/L","d":"有痛风石者需 < 300 μmol/L。达标后仍需维持，不可自行停药。"},{"t":"关节红肿热痛伴发热","d":"需与化脓性关节炎、蜂窝织炎鉴别，不能一律按痛风处理。"}],"myths":[{"q":"不吃海鲜内脏，尿酸就能正常？","a":"多数人不行。内源性合成占 2/3，饮食干预通常只能降 60–90 μmol/L。是否用药取决于基线水平和是否有痛风/结石。"},{"q":"痛风不痛了就可以停药？","a":"不对。疼痛消失只代表炎症消退，尿酸盐结晶仍在沉积。擅自停药是复发和痛风石形成的主因。"}]},"pancreas":{"headline":"胰腺脂肪浸润是可逆的——减重是目前证据最强的干预。","intro":"胰腺脂肪浸润（脂肪胰）指脂肪在胰腺实质内异常沉积，常与肥胖、内脏脂肪堆积、高甘油三酯、酒精摄入并存。它本身多无症状，但长期可影响胰腺外分泌功能（消化吸收）与内分泌功能（血糖调节），也是胰腺炎风险的背景因素。好消息是：随着体重和甘油三酯下降，影像上的脂肪沉积可以明显减少。","diet":[{"t":"减重是核心，不是辅助","d":"减重 5–10% 即可显著降低胰腺脂肪含量。这是目前所有干预中证据最一致的。"},{"t":"严格限酒，最好戒酒","d":"酒精对胰腺腺泡细胞有直接毒性，且与脂肪浸润协同损伤，是胰腺炎最强的可控危险因素。"},{"t":"把甘油三酯压到 2.3 mmol/L 以下","d":"TG > 5.6 mmol/L 时急性胰腺炎风险陡增。控糖、戒酒、减重、必要时用药，缺一不可。"},{"t":"避免单次高脂大餐","d":"一次大量脂肪会刺激胆囊收缩素大量释放、胰酶分泌骤增，对已有脂肪浸润的胰腺是额外负荷。"},{"t":"脂肪泻时考虑中链甘油三酯（MCT）","d":"MCT 不需要脂肪酶和胆盐参与即可吸收，可作为部分脂肪替代。需在医生或营养师指导下使用。"},{"t":"关注脂溶性维生素","d":"若存在胰腺外分泌功能不全，维生素 A、D、E、K 吸收会受影响，必要时检测并补充。"}],"life":[{"t":"有氧 + 抗阻结合","d":"抗阻训练增加骨骼肌量、改善胰岛素敏感性，对减少异位脂肪沉积有独立价值。"},{"t":"控制血糖与胰岛素抵抗","d":"胰岛素抵抗是脂肪异位沉积的重要机制，控糖本身就是护胰。"},{"t":"定期影像随访","d":"腹部超声敏感度有限，MRI-PDFF 或超声内镜（EUS）更能定量评估脂肪含量，随访方案由医生制定。"}],"watch":[{"t":"脂肪泻、体重下降、饭后腹胀","d":"提示胰腺外分泌功能不全，需检测粪弹性蛋白酶，可能需要胰酶替代治疗。"},{"t":"持续上腹痛并向背部放射","d":"警惕慢性胰腺炎或急性发作，需及时就诊。"},{"t":"新发血糖升高或难以控制","d":"胰腺内分泌功能受损的表现，需评估是否为胰源性糖尿病（3c 型）。"}],"myths":[{"q":"脂肪胰只是「影像上的小问题」？","a":"不是。它与代谢综合征、胰腺外分泌功能不全、胰腺炎风险相关，且是可干预的，值得认真对待。"},{"q":"只要不吃油就能改善？","a":"不准确。关键在总能量与体重、酒精、甘油三酯。单纯把油减到极低而不减重，脂肪浸润不会明显改善。"}]}},"disclaimer":"以上内容整理自公开的临床指南与共识（如《中国血脂管理指南》《中国高尿酸血症与痛风诊疗指南》、AGA/ESGE 相关综述等），仅作健康科普与生活方式参考，不构成诊断或处方建议。个体情况（尤其合并用药、肝肾功能、术后并发症）差异较大，具体方案请由你的主诊医生确定。"}};</script>
<script>
(() => {
"use strict";

const CAT_LABEL = { ai: "前沿 AI", politics: "时政", health: "养生" };
const state = {
  cat: "ai",
  topic: "",
  items: [],
  meta: null,
  healthMeta: null,
  data: { ai: [], politics: [], health: [] },
  articleCache: {},
  articlesIndex: null,
  source: "",          // 来源筛选（source_id）
  query: "",
  onlyTrans: false,
  hideRead: false,
  bilingual: true,
  autoTrans: localStorage.getItem("st_autotrans") === "1",
  zhShown: new Set(JSON.parse(localStorage.getItem("st_zh") || "[]")),
  mode: "static",      // static | api
  read: new Set(JSON.parse(localStorage.getItem("st_read") || "[]")),
  stat: null,
};

const $ = (s) => document.querySelector(s);
const listEl = $("#list");
const readerEl = $("#reader");
const overlayEl = $("#overlay");
const toastEl = $("#toast");

/* ---------------- 工具 ---------------- */

function ago(ts) {
  if (!ts) return "时间未知";
  const d = Math.floor(Date.now() / 1000 - ts);
  if (d < 0) return "刚刚";
  if (d < 60) return "刚刚";
  if (d < 3600) return Math.floor(d / 60) + " 分钟前";
  if (d < 86400) return Math.floor(d / 3600) + " 小时前";
  if (d < 86400 * 3) return Math.floor(d / 86400) + " 天前";
  const t = new Date(ts * 1000);
  return `${t.getMonth() + 1}月${t.getDate()}日`;
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("on"), 2100);
}

function saveRead() {
  localStorage.setItem("st_read", JSON.stringify([...state.read].slice(-800)));
}

/* ---------------- 数据加载 ---------------- */

async function loadMeta() {
  // 内联数据版（单文件，双击即可看）优先
  if (window.__DATA__ && window.__DATA__.meta) {
    state.mode = "inline";
    return window.__DATA__.meta;
  }
  // 再探测静态数据，最后回退到本地 API
  try {
    const r = await fetch("data/meta.json", { cache: "no-store" });
    if (r.ok) {
      state.mode = "static";
      return await r.json();
    }
  } catch (e) { /* 忽略，尝试 API */ }
  try {
    const r = await fetch("/api/health", { cache: "no-store" });
    if (r.ok) {
      state.mode = "api";
      return { api: true, ...(await r.json()) };
    }
  } catch (e) { /* 都没有 */ }
  throw new Error("无法加载数据");
}

async function loadCategory(cat) {
  if (state.mode === "inline") {
    const d = window.__DATA__[cat] || { items: [] };
    state.data[cat] = d.items || [];
    if (cat === "health") {
      state.healthMeta = { topics: d.topics || [], guides: d.guides || {}, disclaimer: d.disclaimer || "" };
    }
    return d;
  }
  if (state.mode === "static") {
    const r = await fetch(`data/${cat}.json`, { cache: "no-store" });
    if (!r.ok) throw new Error("分类数据缺失");
    const d = await r.json();
    state.data[cat] = d.items || [];
    if (cat === "health") {
      state.healthMeta = {
        topics: d.topics || [],
        guides: d.guides || {},
        disclaimer: d.disclaimer || "",
      };
    }
    return d;
  }
  // 本地服务模式
  const r = await fetch(`/api/feed?category=${cat}`, { cache: "no-store" });
  if (!r.ok) throw new Error("接口错误");
  const d = await r.json();
  state.data[cat] = d.items || [];
  if (cat === "health") {
    state.healthMeta = { topics: d.topics || [], guides: d.guides || {}, disclaimer: d.disclaimer || "" };
  }
  return d;
}

/* ---------------- 渲染 ---------------- */

function renderStatus() {
  const m = state.meta || {};
  const el = $("#statusbar");
  const t = m.generated_at || (state.stat && state.stat.updated_at);
  const when = t ? new Date(t * 1000).toLocaleString("zh-CN", { hour12: false }) : "—";
  const total = m.totals || {};
  const engineName = { google: "Google", llm: "大模型", mymemory: "MyMemory" }[m.engine] || "免费引擎";

  el.innerHTML = `
    <span class="pill"><span class="dot"></span>更新于 ${esc(when)}</span>
    ${total.sources_total ? `<span class="pill">源 ${total.sources_ok}/${total.sources_total} 在线</span>` : ""}
    ${total.fetched ? `<span class="pill">抓取 ${total.fetched} → 保留 ${total.kept}</span>` : ""}
    <span class="pill"><span class="dot ${m.engine === "google" ? "" : "warn"}"></span>翻译 ${esc(engineName)}</span>
    ${state.mode === "static" ? '<span class="pill">静态托管</span>'
      : state.mode === "inline" ? '<span class="pill">单文件离线版</span>'
      : '<span class="pill">本地服务</span>'}
  `;
  $("#foot-meta").textContent =
    `上次构建 ${m.generated_at_iso || when} · 耗时 ${m.elapsed || "?"}s · ${total.sources_total || "—"} 个源`;
}

function renderRail() {
  const m = state.meta || {};
  const srcs = (m.sources || []).filter((s) => s.ok);
  const countBy = {};
  state.items.forEach((it) => { countBy[it.source_id] = (countBy[it.source_id] || 0) + 1; });
  const mine = srcs.filter((s) => countBy[s.id]);
  mine.sort((a, b) => countBy[b.id] - countBy[a.id]);

  let html = `<button class="rail-item ${state.source === "" ? "on" : ""}" data-src="">
      全部来源 <span class="c">${state.items.length}</span></button>`;
  for (const s of mine) {
    html += `<button class="rail-item ${state.source === s.id ? "on" : ""}" data-src="${esc(s.id)}">
      ${esc(s.name)} <span class="c">${countBy[s.id]}</span></button>`;
  }
  $("#rail-sources").innerHTML = html;
  $("#rail-sources").querySelectorAll(".rail-item").forEach((b) => {
    b.onclick = () => { state.source = b.dataset.src; renderRail(); renderList(); };
  });
}

function visibleItems() {
  const q = state.query.trim().toLowerCase();
  return state.items.filter((it) => {
    if (state.source && it.source_id !== state.source) return false;
    if (state.onlyTrans && !it.translated) return false;
    if (state.hideRead && state.read.has(it.id)) return false;
    if (state.topic && it.topic !== state.topic) return false;
    if (q) {
      const blob = (it.title + " " + it.summary + " " + it.source + " " + (it.title_orig || "")).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function isZh(it) {
  return !!it.title_zh && (state.autoTrans || state.zhShown.has(it.id));
}

function cardHTML(it, catClass) {
  const isRead = state.read.has(it.id);
  const isPaper = it.kind === "paper";
  const zh = isZh(it);
  const title = zh ? it.title_zh : it.title;
  const summary = zh ? (it.summary_zh || it.summary) : it.summary;
  const tbtn = it.title_zh
    ? `<button class="tbtn ${zh ? "on" : ""}" data-tid="${it.id}" title="${zh ? "切换回英文原文" : "显示中文译文"}">${zh ? "原文" : "译"}</button>`
    : "";
  return `<article class="card ${isRead ? "read" : ""}" data-id="${it.id}">
    <div class="card-top">
      <span class="src ${catClass}">${esc(it.source)}</span>
      <span class="meta-sep">·</span>
      <span>${isPaper && it.year ? esc(it.year) + " 年" : ago(it.published)}</span>
      ${zh ? '<span class="tr-badge">译文</span>' : ""}
      ${isPaper ? '<span class="paper-badge">循证文献</span>' : ""}
      ${tbtn}
    </div>
    <h3>${esc(title)}</h3>
    ${summary ? `<p>${esc(summary)}</p>` : ""}
    ${it.tags && it.tags.length ? `<div class="tags">${it.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
  </article>`;
}

function toggleZh(id) {
  if (state.zhShown.has(id)) state.zhShown.delete(id);
  else state.zhShown.add(id);
  localStorage.setItem("st_zh", JSON.stringify([...state.zhShown]));
  renderList();
}

function bindCards() {
  listEl.querySelectorAll(".tbtn").forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      toggleZh(b.dataset.tid);
    };
  });
  listEl.querySelectorAll(".card").forEach((c) => {
    c.onclick = () => {
      const it = findItem(c.dataset.id);
      // 文献条目没有正文可抓，直接去 DOI
      if (it && it.kind === "paper") {
        window.open(it.url, "_blank", "noopener");
        return;
      }
      openReader(c.dataset.id);
    };
  });
}

function renderList() {
  if (state.cat === "health") return renderHealth();

  const items = visibleItems();
  const catClass = state.cat === "ai" ? "ai" : "pol";
  $("#feed-title").textContent = CAT_LABEL[state.cat];
  $("#feed-sub").textContent = items.length
    ? `${items.length} 条${state.source ? " · 已按来源筛选" : ""}`
    : "";

  if (!items.length) {
    listEl.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <p>没有匹配的内容</p>
      <small>换个关键词，或清除左侧筛选条件</small></div>`;
    return;
  }

  listEl.innerHTML = items.map((it) => cardHTML(it, catClass)).join("");
  bindCards();
}

/* ---------------- 养生栏目 ---------------- */

function renderHealth() {
  const meta = state.healthMeta;
  $("#feed-title").textContent = "养生";
  if (!meta) {
    listEl.innerHTML = `<div class="empty"><p>指南数据缺失</p><small>请重新构建后再试</small></div>`;
    return;
  }

  const chips = `<div class="topic-row">
    <button class="topic-chip ${!state.topic ? "on" : ""}" data-topic="">
      <b>全部</b><span>四个主题总览</span></button>
    ${meta.topics.map((t) => {
      const n = state.items.filter((i) => i.topic === t.id).length;
      return `<button class="topic-chip ${state.topic === t.id ? "on" : ""}" data-topic="${t.id}">
        <b>${esc(t.name)}</b><span>${esc(t.short)} · ${n} 条</span></button>`;
    }).join("")}
  </div>`;

  let body = "";

  if (!state.topic) {
    // 总览：四个主题的要点预览
    $("#feed-sub").textContent = "点击主题查看完整要点与相关文献";
    body = meta.topics.map((t) => {
      const g = meta.guides[t.id];
      if (!g) return "";
      const n = state.items.filter((i) => i.topic === t.id).length;
      return `<article class="guide" data-goto="${t.id}" style="cursor:pointer">
        <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:10px">
          <h3 style="font-size:15px;font-weight:700;color:var(--hl)">${esc(t.name)}</h3>
          <span style="font-size:11.5px;color:var(--ink-4)">${esc(t.short)} · ${n} 条相关内容</span>
        </div>
        <div class="guide-lead">${esc(g.headline)}</div>
        <div class="gsec" style="margin-bottom:0">
          <h5>饮食要点</h5>
          ${g.diet.slice(0, 3).map((d) => `<div class="gitem"><span class="gt">${esc(d.t)}</span><span class="gd">${esc(d.d)}</span></div>`).join("")}
        </div>
        <div style="margin-top:11px;font-size:12px;color:var(--hl);font-weight:600">展开完整要点 ›</div>
      </article>`;
    }).join("");

    // 下方附最新内容流
    const items = visibleItems();
    if (items.length) {
      body += `<div class="feed-head" style="margin:22px 0 12px 2px">
        <h2 style="font-size:14px">最新相关</h2><span>${items.length} 条</span></div>`;
      body += items.slice(0, 12).map((it) => cardHTML(it, "hl")).join("");
    }
  } else {
    const g = meta.guides[state.topic];
    const t = meta.topics.find((x) => x.id === state.topic);
    const items = visibleItems();
    $("#feed-sub").textContent = `${items.length} 条相关内容`;

    body = `<article class="guide">
      <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:12px">
        <h3 style="font-size:16px;font-weight:700;color:var(--hl)">${esc(t.name)}</h3>
        <span style="font-size:11.5px;color:var(--ink-4)">${esc(t.short)}</span>
      </div>
      <div class="guide-lead">${esc(g.headline)}</div>
      <div class="guide-intro">${esc(g.intro)}</div>

      <div class="gsec"><h5>饮食</h5>
        ${g.diet.map((d) => `<div class="gitem"><span class="gt">${esc(d.t)}</span><span class="gd">${esc(d.d)}</span></div>`).join("")}
      </div>
      <div class="gsec"><h5>生活方式</h5>
        ${g.life.map((d) => `<div class="gitem"><span class="gt">${esc(d.t)}</span><span class="gd">${esc(d.d)}</span></div>`).join("")}
      </div>
      <div class="gsec"><h5>需要警惕的信号</h5>
        ${g.watch.map((d) => `<div class="gitem warn"><span class="gt">${esc(d.t)}</span><span class="gd">${esc(d.d)}</span></div>`).join("")}
      </div>
      <div class="gsec"><h5>常见误区</h5>
        ${g.myths.map((m) => `<div class="myth"><q>${esc(m.q)}</q><p>${esc(m.a)}</p></div>`).join("")}
      </div>
    </article>
    <div class="disclaimer">${esc(meta.disclaimer)}</div>`;

    if (items.length) {
      body += `<div class="feed-head" style="margin:22px 0 12px 2px">
        <h2 style="font-size:14px">相关资讯与文献</h2><span>${items.length} 条</span></div>`;
      body += items.map((it) => cardHTML(it, "hl")).join("");
    } else {
      body += `<div class="empty" style="padding:34px 20px"><p>这个主题暂时没有新内容</p>
        <small>上方要点每版随构建更新，文献按周补充</small></div>`;
    }
  }

  listEl.innerHTML = chips + body;

  listEl.querySelectorAll(".topic-chip").forEach((b) => {
    b.onclick = () => {
      state.topic = b.dataset.topic;
      renderHealth();
      $("#feed-title").scrollIntoView({ block: "start", behavior: "smooth" });
    };
  });
  listEl.querySelectorAll(".guide[data-goto]").forEach((g) => {
    g.onclick = () => { state.topic = g.dataset.goto; renderHealth(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  });
  bindCards();
}

/* ---------------- 阅读器 ---------------- */

function findItem(id) {
  for (const cat of Object.keys(state.data)) {
    const hit = state.data[cat].find((x) => x.id === id);
    if (hit) return hit;
  }
  return null;
}

async function getArticle(id) {
  if (state.articleCache[id]) return state.articleCache[id];
  if (state.mode === "inline") {
    const a = (window.__DATA__.articles || {})[id];
    if (!a) return null;
    state.articleCache[id] = a;
    return a;
  }
  if (state.mode === "api") {
    const r = await fetch(`/api/article?id=${id}`);
    if (!r.ok) throw new Error("正文获取失败");
    const d = await r.json();
    state.articleCache[id] = d;
    return d;
  }
  // 静态模式：从 articles.json 取
  if (!state.articlesIndex) {
    try {
      const r = await fetch("data/articles.json", { cache: "no-store" });
      state.articlesIndex = r.ok ? await r.json() : {};
    } catch (e) { state.articlesIndex = {}; }
  }
  const a = state.articlesIndex[id];
  if (!a) return null;
  const rec = { ...a };
  state.articleCache[id] = rec;
  return rec;
}

function paragraphs(text) {
  return String(text || "")
    .split("\n")
    .map((p) => p.trim())
    .filter((p) => p.length > 0)
    .map((p) => `<p>${esc(p)}</p>`)
    .join("");
}

async function openReader(id) {
  const it = findItem(id);
  if (!it) return;

  state.read.add(id);
  saveRead();
  const card = listEl.querySelector(`.card[data-id="${id}"]`);
  if (card) card.classList.add("read");

  const catClass = it.category === "ai" ? "ai" : (it.category === "health" ? "hl" : "pol");
  const zh = isZh(it);
  const rTitle = zh ? it.title_zh : it.title;
  const rSum = zh ? (it.summary_zh || it.summary) : it.summary;
  const rTbtn = it.title_zh
    ? `<button class="tbtn ${zh ? "on" : ""}" id="r-tbtn">${zh ? "看原文" : "译成中文"}</button>`
    : "";

  $("#reader-body").innerHTML = `
    <h1>${esc(rTitle)}</h1>
    <div class="reader-meta">
      <span class="src ${catClass}" style="font-weight:600">${esc(it.source)}</span>
      <span class="meta-sep">·</span><span>${ago(it.published)}</span>
      ${it.tags && it.tags.length ? `<span class="meta-sep">·</span><span>${it.tags.map(esc).join(" / ")}</span>` : ""}
      ${rTbtn}
    </div>
    ${rSum ? `<div class="reader-sum"><b>摘要</b>${esc(rSum)}</div>` : ""}
    <div id="art-body"><div class="loading-line"><span class="spinner"></span>正在提取正文…</div></div>
    ${state.bilingual && it.title_zh && zh ? `
      <div class="orig-toggle">
        <a href="#" id="toggle-orig" style="color:var(--ink-3);border-bottom:1px dotted var(--line-2)">查看英文原标题</a>
        <div class="orig-text" id="orig-box">${esc(it.title)}</div>
      </div>` : ""}
  `;

  const rb = $("#r-tbtn");
  if (rb) rb.onclick = (e) => {
    e.stopPropagation();
    toggleZh(id);
    openReader(id);
  };

  overlayEl.classList.add("on");
  readerEl.classList.add("on");
  document.body.style.overflow = "hidden";

  const tgl = $("#toggle-orig");
  if (tgl) tgl.onclick = (e) => {
    e.preventDefault();
    const box = $("#orig-box");
    box.classList.toggle("on");
    tgl.textContent = box.classList.contains("on") ? "收起英文原标题" : "查看英文原标题";
  };

  const holder = $("#art-body");
  try {
    const art = await getArticle(id);
    if (!art || !art.body) {
      holder.innerHTML = `<div class="notice">
        这篇只提供 RSS 摘要，未预抓全文。<br>点击右上角「原文」可直接阅读原始页面。
      </div>`;
      return;
    }
    const badge = art.translated
      ? `<div style="font-size:11.5px;color:var(--ink-4);margin-bottom:16px;letter-spacing:.02em">以下正文由机器翻译，原文见右上角「原文」</div>`
      : "";
    holder.innerHTML = badge + `<div class="article-text">${paragraphs(art.body)}</div>`;
    if (art.body_orig) {
      holder.innerHTML += `<div class="orig-toggle">
        <a href="#" id="tg2" style="color:var(--ink-3);border-bottom:1px dotted var(--line-2)">查看英文原文正文</a>
        <div class="orig-text" id="ob2">${paragraphs(art.body_orig)}</div></div>`;
      const t2 = $("#tg2");
      t2.onclick = (e) => {
        e.preventDefault();
        const b = $("#ob2");
        b.classList.toggle("on");
        t2.textContent = b.classList.contains("on") ? "收起英文原文" : "查看英文原文正文";
      };
    }
  } catch (e) {
    holder.innerHTML = `<div class="notice">正文加载失败：${esc(e.message)}。<br>可点右上角「原文」直接访问。</div>`;
  }

  $("#r-orig").onclick = () => window.open(it.url, "_blank", "noopener");
}

function closeReader() {
  overlayEl.classList.remove("on");
  readerEl.classList.remove("on");
  document.body.style.overflow = "";
}

/* ---------------- 交互绑定 ---------------- */

function bind() {
  $("#tabs").querySelectorAll(".tab").forEach((b) => {
    b.onclick = async () => {
      if (b.dataset.cat === state.cat) return;
      state.cat = b.dataset.cat;
      state.source = "";
      state.topic = "";
      $("#tabs").querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
      await switchCategory();
      renderRail();
      renderList();
    };
  });

  $("#q").oninput = (e) => { state.query = e.target.value; renderList(); };
  $("#auto-trans").checked = state.autoTrans;
  $("#auto-trans").onchange = (e) => {
    state.autoTrans = e.target.checked;
    localStorage.setItem("st_autotrans", state.autoTrans ? "1" : "0");
    renderList();
    toast(state.autoTrans ? "已开启自动译文" : "已关闭，点每条右侧「译」查看中文");
  };
  $("#only-trans").onchange = (e) => { state.onlyTrans = e.target.checked; renderList(); };
  $("#hide-read").onchange = (e) => { state.hideRead = e.target.checked; renderList(); };
  $("#bilingual").onchange = (e) => { state.bilingual = e.target.checked; };
  $("#btn-reload").onclick = () => reload(true);
  $("#r-close").onclick = closeReader;
  overlayEl.onclick = closeReader;

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeReader();
    if (e.key === "/" && document.activeElement !== $("#q")) {
      e.preventDefault();
      $("#q").focus();
    }
  });
}

/* ---------------- 启动 ---------------- */

async function switchCategory() {
  listEl.innerHTML = Array(4).fill(0).map(() =>
    `<div class="skel"><div style="height:12px;width:34%;margin-bottom:10px"></div>
     <div style="height:17px;width:86%;margin-bottom:9px"></div>
     <div style="height:12px;width:62%"></div></div>`).join("");
  try {
    await loadCategory(state.cat);
    state.items = state.data[state.cat] || [];
    renderRail();
    renderList();
  } catch (e) {
    listEl.innerHTML = `<div class="empty"><p>加载失败</p><small>${esc(e.message)}</small></div>`;
  }
}

async function reload(manual) {
  const btn = $("#btn-reload");
  btn.classList.add("spin");
  try {
    if (state.mode === "api") {
      await fetch("/api/refresh");
      let tries = 0;
      while (tries++ < 60) {
        await new Promise((r) => setTimeout(r, 2000));
        const h = await (await fetch("/api/health", { cache: "no-store" })).json();
        if (!h.refreshing) break;
      }
    } else if (manual) {
      toast("静态站点由云端定时重建，稍后自动生效");
    }
    state.meta = await loadMeta();
    renderStatus();
    await Promise.all(Object.keys(CAT_LABEL).map((c) => loadCategory(c).catch(() => null)));
    state.items = state.data[state.cat] || [];
    $("#n-ai").textContent = (state.data.ai || []).length;
    $("#n-pol").textContent = (state.data.politics || []).length;
    $("#n-health").textContent = (state.data.health || []).length;
    renderRail();
    renderList();
    if (manual) toast("已刷新");
  } catch (e) {
    toast("刷新失败：" + e.message);
  } finally {
    btn.classList.remove("spin");
  }
}

async function boot() {
  bind();
  try {
    state.meta = await loadMeta();
  } catch (e) {
    listEl.innerHTML = `<div class="empty">
      <p>无法加载数据</p>
      <small>本地打开请用 <code>python3 server.py</code> 启动服务后再访问</small></div>`;
    return;
  }
  renderStatus();
  await Promise.all(Object.keys(CAT_LABEL).map((c) => loadCategory(c).catch(() => null)));
  state.items = state.data[state.cat] || [];
  $("#n-ai").textContent = (state.data.ai || []).length;
  $("#n-pol").textContent = (state.data.politics || []).length;
  $("#n-health").textContent = (state.data.health || []).length;
  renderRail();
  renderList();

  // 首次到访：提示译文是手动触发的
  if (localStorage.getItem("st_autotrans") === null) {
    setTimeout(() => toast("英文条目点右侧「译」看中文，或左侧开启自动显示"), 1400);
  }
}
boot();

// 静态模式：每 10 分钟静默检查是否有新的构建产物
if (state.mode === "static") {
  setInterval(async () => {
    try {
      const m = await loadMeta();
      if (state.meta && m.generated_at !== state.meta.generated_at) {
        state.meta = m;
        await Promise.all(Object.keys(CAT_LABEL).map((c) => loadCategory(c).catch(() => null)));
        state.items = state.data[state.cat] || [];
        renderStatus(); renderRail(); renderList();
        toast("内容已更新");
      }
    } catch (e) { /* 静默 */ }
  }, 600000);
}
})();
</script>
</body>
</html>
