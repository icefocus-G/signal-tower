gory":"politics","lang":"zh","desc":"国内时政与社会民生","ok":true,"count":30},{"id":"chinanews_world","name":"中新网 · 国际","category":"politics","lang":"zh","desc":"国际局势，中文视角","ok":true,"count":30},{"id":"chinanews_finance","name":"中新网 · 财经","category":"politics","lang":"zh","desc":"宏观与政策落地的经济面","ok":true,"count":30},{"id":"chinanews_scroll","name":"中新网 · 滚动","category":"politics","lang":"zh","desc":"突发与快讯","ok":true,"count":30},{"id":"chinanews_health","name":"中新网 · 健康","category":"health","lang":"zh","desc":"健康频道，仅保留与四个代谢主题相关的内容","ok":true,"count":22}],"totals":{"fetched":540,"kept":201,"sources_ok":19,"sources_total":21}},"articles":{},"ai":{"category":"ai","label":"前沿 AI","items":[{"id":"bec3e94618eb8a8b","title":"生成式 AI 过度美化现实","title_zh":"","title_orig":"","summary":"生成式 AI 如 ChatGPT 正融入日常生活，成为人们获取信息和辅助决策的重要工具。然而大模型中嵌入的错误信息和偏见引发了一系列伦理方面的担忧。以往的研究已揭示出 AI 在涉及人类特征的内容上存在偏见，例如肤色、性别以及地理文化背景等。为减轻文本生成图像（Text-to-Image）生成式模型中的偏见，OpenAI 等公司引入了提示词修订（Prompt Revision）机制。一种隐性的处理过程，即通过重写用户输入的提示词，添加更多细节，例如要求图像中呈现不同性别和肤色的人物，从而促进图像的多样性。然而重写用户提示词也可能引入其他偏见，在用户不知情下改变其原本的意图。发表在《Technology in Society》上的一项研究以集约化畜牧业（Intensive Livestock Farming）为例，首次提供证据表明，OpenAI 的文本生成图像模型 DALL-E 3 会通过提示词修订机制，抹去具有争议性议题的真实面貌。DALL-E 3 表现出一种明显的偏见，即倾向于将畜牧业浪漫化、美化。它生成的图像通常描绘奶牛在牧场上吃草、猪在泥地里拱土。即使研究人员明确要求生成真实的场景，这种偏见依然存在。当研究人员关闭提示词修订功能后，生成的图像便更加接近现代畜牧业的实际饲养方式，即将农场动物饲养在室内。研究人员要求模型生成北美、欧洲和大洋洲农场的图像。结果发现，无论指定哪个地区，模型生成的图像大多呈现田园牧歌式的场景在关闭提示词修订功能后，不同地区之间的差异开始显现。通过提示词修订机制将畜牧业浪漫化，掩盖其真实状况，可能会进一步强化公众对于农场动物饲养方式的错误认知，甚至传播","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85847","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794308672.0,"tags":["大模型"],"score":102.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c525297fe656ab17","title":"Anthropic 启动 IPO 路演，创始人将套现 17.5 亿美元；谷歌最强 AI 模型正式开放；任天堂招新：经典游戏保存员","title_zh":"","title_orig":"","summary":"英伟达董事会聘请前美国联邦检察官，调查 CEO 黄仁勋相关事件\n\n11 月 11 日消息，英伟达发布公告，宣布已聘请美国前联邦检察官金正贤（Joon H. Kim）及其所在的律师事务所 Wachtell, Lipton, Rosen & Katz，负责开展一项全面、独立的调查。\n\n此前，英伟达董事会表示，鉴于近期有关公司创始人兼 CEO 黄仁勋可能成为外国情报机构目标的报道，董事会决定启动独立调查。董事会将成立由独立董事组成的委员会，并在外部独立法律顾问协助下监督调查。\n\n英伟达董事会此前还表示，目前没有理由认为美国国家安全或英伟达的商业机密已经遭到泄露，但调查将审查所有可获得的信息。黄仁勋支持此次调查，并承诺配合相关工作。董事会同时表示，对黄仁勋及其领导团队保持信心。（来源：凤凰网科技）\n\nAnthropic 启动 IPO 路演，估值目标高达 1.4 万亿美元，七名联创拟套现 17.5 亿美元\n\nAnthropic 已正式启动首次公开募股（IPO）的投资者路演。公司计划发行 8.25 亿股股票，每股发行价区间为 70 至 78 美元，最高募资规模可达 643.5 亿美元。若按区间上限定价，其完全稀释估值将接近 1.4 万亿美元，这将是人工智能行业迄今规模最大的上市交易之一。\n\n根据公司披露的招股文件，本次发行包括公司新发行的 8.01351354 亿股，以及现有股东出售的 2364.8646 万股。公司不会从老股出售中获得任何收益。同时，承销商还获得一项为期 30 天的选择权，可额外认购 1.2375 亿股。\n\n除公开募股外，Anthropic 还宣布多家科技巨头将通过单独的","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373796","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1794357274.0,"tags":["芯片算力","政策监管","融资并购"],"score":97.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f28f90d2895a812c","title":"Gilbert + Tobin rethinks the business of law with AI","title_zh":"Gilbert + Tobin借助人工智能重新思考法律业务","title_orig":"Gilbert + Tobin rethinks the business of law with AI","summary":"A conversation with Sam Nickless, Partner and Chief Executive Officer at Gilbert + Tobin.","summary_zh":"与Gilbert + Tobin合伙人兼首席执行官Sam Nickless的对话。","summary_orig":"A conversation with Sam Nickless, Partner and Chief Executive Officer at Gilbert + Tobin.","url":"https://openai.com/index/gilbert-tobin-sam-nickless","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794441600.0,"tags":[],"score":96.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"15dd571cfe912c58","title":"OpenAI 收购旅游初创公司 Odessia，探索 AI 旅行智能体业务","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，Odessia 创始人弗朗西斯 · 戴维森（Francis Davidson）今天宣布，OpenAI 已收购 AI 旅行智能体公司 Odessia，他本人也已经加入 OpenAI，帮助这家 AI 初创公司探索旅游业务发展方向。\n\n据悉，Odessia 成立仅一年，就拿到了红杉资本领投的 600 万美元（IT之家注：现汇率约合 4,011.9 万元人民币）种子前融资，并在大约 5 个月前推出了 AI 旅游智能体服务，帮助早期用户规划价值数百万美元的旅行行程。\nOpenAI 发言人证实了上述信息，并表示：“我们非常欢迎戴维森加入 OpenAI，他是一名经验丰富的从业者，曾创办多家帮助人们旅行的企业。我们很高兴看到他选择 OpenAI，共同开展新事业。”\n不过，OpenAI 尚未公布任何旅游领域的新产品或计划。目前该公司的同领域合作伙伴有 Booking.com 缤客、Expedia 和 KAYAK。对于未来是否会推出旅游相关产品，OpenAI 发言人没有透露更多信息，仅表示旅游是用户经常向 ChatGPT 咨询的话题之一。\nOpenAI 收购 Odessia 还有另一个值得关注的原因：戴维森在旅游行业颇有名气。2014 年，他读大学期间就创办了旅游初创公司 Sonder。该公司的业务模式与 Airbnb 有些类似，但主要面向全球主要城市，提供高端公寓的短期租赁服务。","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/202.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794350602.0,"tags":["智能体","融资并购"],"score":96.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"46ecb159c1535b09","title":"Helping caregivers use AI in everyday life","title_zh":"帮助护理人员在日常生活中使用人工智能","title_orig":"Helping caregivers use AI in everyday life","summary":"OpenAI Academy is bringing free, hands-on ChatGPT workshops to caregivers in five U.S. cities, helping them build practical AI skills for everyday life.","summary_zh":"OpenAI学院正在为美国五个城市的护理人员提供免费的实用ChatGPT研讨会，帮助他们在日常生活中培养实用的人工智能技能。","summary_orig":"OpenAI Academy is bringing free, hands-on ChatGPT workshops to caregivers in five U.S. cities, helping them build practical AI skills for everyday life.","url":"https://openai.com/index/helping-caregivers-use-ai-in-everyday-life","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794312000.0,"tags":["大模型"],"score":94.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"7be93cf59ad597c0","title":"谷歌更新安卓 AI 开发基准榜单：Kimi K3.1 Pro / DeepSeek V4.1 Flash 成绩揭晓","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，谷歌官方账号 Android Developers（@AndroidDev）昨日（11 月 10 日）在 X 平台发布推文，首次公开了 OpenAI GPT-6.1 Terra、Kimi K3.1 Pro 以及 DeepSeek V4.1 Flash 三款模型的 Android Bench 基准跑分。\n\nIT之家注：Android Bench 是 Google 面向 Android 开发场景推出的 AI 编程基准，重点考察模型完成应用创建、功能开发、代码迁移和应用转换等真实工程任务的能力。\n本次新增的 Kimi K3.1 Pro 使用 kimi-code 智能体，在 30 项长程任务中获得 24.0% 的通过率，平均完成度为 82.3%，平均耗时 27.4 小时，单次基准运行成本为 317.4 美元（现汇率约合 2,123 元人民币）。\n从横向对比看，Kimi K3.1 Pro 的成绩高于 GPT 6 Astra、Claude Fable 5.1 和 Gemini 4 Argon，但低于 GPT 6.1 Terra 的 28.7%。\n\nDeepSeek V4.1 Flash 1017 通过 opencode 智能体参与评测，取得 17.3% 的通过率、71.2% 的平均完成度、12.0 小时的平均耗时，以及 9.9 美元（现汇率约合 66.2 元人民币）的单次基准运行成本。虽然其通过率低于 Kimi K3.1 Pro，但其速度和成本优势明显，尤其适合对预算、响应时间敏感的开发团队。","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/232.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794358616.0,"tags":["大模型"],"score":94.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"86b7b41309e7b8e9","title":"高盛限制交易员和银行家使用第三方 AI 智能体","title_zh":"","title_orig":"","summary":"高盛限制交易员和银行家使用 Anthropic 的 Claude Code 和微软的 GitHub，此举主要是出于风险方面的考虑。AI 编程工具主要提供给软件工程师，以及负责交易、量化研究和软件工程等的策略师。交易员将无法再使用这些工具监控客户交易流、模拟市场走势和持仓，以及制作文字和图表。此次限制适用于能独立编写和运行代码的第三方智能体。以 Claude Code 为例，它能读取文件、编写程序并运行，通常拥有与使用者相同的权限。工程师用此类工具编写的代码通常会经过审查、测试和部署控制，然后才会投入使用。交易员编写的脚本则可能未经任何审查就被投入日常使用。使用智能体模拟仓位的交易员不太可能了解代码如何处理异常情况，在交易台上这可能意味着损失。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85838","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794222261.0,"tags":["大模型","智能体"],"score":94.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"5ca4dc7b6d88cb31","title":"Introducing Businesses in ChatGPT","title_zh":"在ChatGPT中介绍企业","title_orig":"Introducing Businesses in ChatGPT","summary":"Manage your business information, get insights about how your business shows up, and turn interest into action in ChatGPT.","summary_zh":"管理您的业务信息，深入了解您的业务展示方式，并在ChatGPT中将兴趣转化为行动。","summary_orig":"Manage your business information, get insights about how your business shows up, and turn interest into action in ChatGPT.","url":"https://openai.com/index/introducing-businesses-chatgpt","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794304800.0,"tags":["大模型"],"score":94.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"a6c1bceafea48164","title":"挑战微软 Win11：原生 AI 系统 KORA 登场，将率先适配高通骁龙 X2 Elite 芯片","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，KORA Systems 昨日（11 月 10 日）发布公告，宣布推出全新操作系统 KORA OS，宣称这是首个“自下而上”专为 AI PC 设计的操作系统。\n\n不同于在传统系统上叠加 AI 助手，KORA OS 在系统底层直接融入智能体工作流、上下文记忆和本地 AI 推理，目标让电脑从“打开应用完成操作”转向“表达意图、由 AI 协助完成”。\n\n底层方面，KORA OS 基于 NixOS 构建，引入“神经工作区”和新型文件系统。用户可按任务目标组织工作空间，系统则围绕意图、上下文与记忆管理文件，系统依然会保留传统文件夹和桌面应用，但不再是系统核心。\n\n在 AI 能力方面，KORA 采用自研 Cortex 推理引擎，可调度 CPU、GPU 和 NPU 等硬件资源，支持开放权重模型在本地运行。其内置 Lemma 推理引擎基于 llama.cpp，用于提升推理效率；系统还会判断任务应交由云端处理，还是保留在设备本地。\n\n隐私方面，KORA 表示，工作流的记忆与上下文将保留在用户桌面设备上，不会离开本机。官方表示为了降低 AI 自动操作带来的安全风险，每个工作区均在隔离沙箱中运行，应用和 AI 智能体拥有独立权限。IT之家附上相关图片如下：\n\n兼容性方面，KORA 内置基于 Wine 和 Proton 的 Windows 应用转换层，并由本地 AI 模型协助完成应用配置。该公司正与高通合作，骁龙 X2 Elite 有望成为首款支持 KORA OS 的 PC 平台；系统同时计划支持 AMD、Intel 等 x86 芯片，并逐步扩展至其他 Arm 架构设","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/226.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794356835.0,"tags":["芯片算力","智能体"],"score":94.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"8497d95a14c8d75f","title":"工作流成为AI商业化关键词，深演智能(2723.HK)迈入Palantir的复利循环","title_zh":"","title_orig":"","summary":"11 月 2 日盘后，Palantir 公布 2026 财年第三季度业绩：收入 23.13 亿美元，同比增长 96%；净利润 11.28 亿美元。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15318641.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794360772.0,"tags":[],"score":90.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"01a8528fa117926a","title":"Closing the AI guidance gap in education","title_zh":"缩小教育领域的人工智能指导差距","title_orig":"Closing the AI guidance gap in education","summary":"New ThinkYoung research and lessons from OpenAI’s EMEA education partnerships on supporting teachers, AI literacy, and independent learning.","summary_zh":"新的ThinkYoung研究和OpenAI在支持教师、人工智能素养和自主学习方面的EMEA教育合作伙伴关系的经验教训。","summary_orig":"New ThinkYoung research and lessons from OpenAI’s EMEA education partnerships on supporting teachers, AI literacy, and independent learning.","url":"https://openai.com/index/closing-ai-guidance-gap-education","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794301200.0,"tags":[],"score":94.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"571fb0494bf3f24f","title":"OpenAI acquires Odessia, travel startup created by Sonder founder","title_zh":"OpenAI收购由Sonder创始人创建的旅游创业公司Odessia","title_orig":"OpenAI acquires Odessia, travel startup created by Sonder founder","summary":"OpenAI has not yet said what its plans are for the future of travel. But Sonder founder Francis Davidson is a well-known figure in the travel industry.","summary_zh":"OpenAI尚未说明其对未来旅行的计划。但Sonder创始人弗朗西斯·戴维森（Francis Davidson）是旅游业的知名人物。","summary_orig":"OpenAI has not yet said what its plans are for the future of travel. But Sonder founder Francis Davidson is a well-known figure in the travel industry.","url":"https://techcrunch.com/2026/11/10/openai-acquires-odessia-travel-startup-created-by-sonder-founder/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794344932.0,"tags":[],"score":90.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"817197bcd46e543d","title":"实测 HY4：腾讯最「夯」大模型，离一线还有多远？","title_zh":"","title_orig":"","summary":"头图来源：腾讯混元\n\n11 月 4 日，混元 Hy4 正式发布，模型权重将在近期开源，主打性价比的轻量版 Hy4 flash 也一起亮相。腾讯给它的定位是——首次跻身最强开源模型之列。\n\n过去一年，腾讯在 AI 上最多被人看见的，是 WorkBuddy 这类 Agent 和应用产品；到了更底层的模型上，它的声量明显弱于应用。Hy4 真正要回答的，是腾讯在模型这条线上的身位。\n\n从榜单表现来看，在开源模型里，Hy4 已经站进第一梯队；放到全球，和顶尖闭源模型的差距仍然清晰。\n\n而根据国家数据局最近公布的一组数据，我国日均 Token 调用量已经从 2024 年初的 1000 亿，增长到今年 7 月的超 500 万亿，两年增长超 5000 倍。Token 消耗狂飙的背后，Agent 正在从一个技术概念变成新的生产力形态。\n\n极客公园围绕长程 Agent、多模态理解与视觉代码等主线，结合官方评测数据和典型任务，进行了实测，以梳理这一代 Hy4 到底补上了哪些能力。\n\n一、长程 Agent：门槛在「把一整件事跑完」\n\n过去测模型，行业习惯看单轮问答、单道题目的表现。进入 Agent 阶段，变成看跨多轮、跨多步、长时间运行，模型能不能始终记得目标在哪里、自己能走到哪一步，中途出错能不能自己拉回来，最后形成逻辑闭环的交付。\n\n最近对 CPO 赛道关注比较多，我给 Hy4 安排了一个接近买方真实工作的任务：\n\n让它扮演覆盖 AI 算力产业链的研究员，围绕 CPO（共封装光学）赛道，做一份面向投资决策委员会的深度研究报告和可复算估值模型，数据截至最近一个已完成的交易日。\n2026 年被称为 C","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373644","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1794196623.0,"tags":["大模型","智能体","开源"],"score":90.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"6fcd75d626ddcf98","title":"PSI is trying to make a business out of AI-driven scientific discovery","title_zh":"PSI正试图利用人工智能驱动的科学发现做生意","title_orig":"PSI is trying to make a business out of AI-driven scientific discovery","summary":"PSI used an unreleased Anthropic model to answer a fundamental question about quantum computing that scientists have pursued for nearly two decades.","summary_zh":"PSI使用了一个未发布的人类模型来回答科学家们近二十年来一直追求的关于量子计算的一个基本问题。","summary_orig":"PSI used an unreleased Anthropic model to answer a fundamental question about quantum computing that scientists have pursued for nearly two decades.","url":"https://techcrunch.com/2026/11/10/psi-is-trying-to-make-a-business-out-of-ai-driven-scientific-discovery/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794337432.0,"tags":[],"score":90.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"644aecdc3964ea57","title":"谷歌迄今最强模型 Gemini 4 Carbon 登场：主打复杂编程、科学研究与网络安全","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，当地时间 11 月 10 日，谷歌宣布正式开放 Gemini 4 Carbon 模型，面向开发者、企业、科研人员和消费者提供服务。\n\n谷歌高级副总裁、DeepMind 首席 AI 架构师 Koray Kavukcuoglu 介绍称，该模型是谷歌目前能力最强的推理模型，重点面向复杂软件工程、多步骤智能体任务、科学研究和网络安全等场景。\nGemini 4 Carbon 于 10 月 28 日首次公布，此前通过 Fairwind Program（网络安全合作计划）向部分网络安全防御人员开放。此次则进一步扩大使用范围。\n谷歌称，相较于同期推出的 Gemini 4 Argon，Carbon 能够在复杂任务中投入更多推理 Token，进行假设探索、结果验证和边缘情况检查，更适合多步骤编码、复杂调试以及开放式科学研究。\n\n在开发者工具方面，Gemini 4 Carbon 已通过 Gemini API 和 Google AI Studio 向付费开发者开放，同时面向企业客户提供服务。模型也正在向 Google AI Ultra 订阅用户逐步开放，覆盖 Google Antigravity、Gemini 应用和 Google 搜索中的 AI 模式。\n根据 Google AI Studio 官方文档，Gemini 4 Carbon 的模型 ID 为 gemini-4-carbon，支持文本、图像、视频、音频和 PDF 输入，输出为文本。\n该模型拥有 1,048,576 Token 的统一上下文窗口，标准同步请求的最大输出为 65,536 Token，通过 Long","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/203.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794350617.0,"tags":["大模型","智能体","经济"],"score":92.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"9387ddaf04070626","title":"具身智能，也到了 API 时刻？","title_zh":"","title_orig":"","summary":"具身智能的 API 时刻意味着部分具身模型已经开始具备跨本体迁移、在一定范围内适应新任务的能力。作者｜Li Yuan\n编辑｜郑玄\n具身智能，也到了 API 时刻？\n过去，想知道一个具身模型有多强，往往要看它在发布视频里完成了什么任务。不过，这条线正在松动。\n就在近期，一些公司开始把另一种检验方式交到开发者手里：接上你自己的机器人，试着把你的任务做出来。\n10 月，Physical Intelligence（PI）开放了模型 API 测试。开发者可以上传自己的机器人数据，在平台上微调模型，再通过云端推理驱动机器人。PI 表示，一家公司，用这套服务迭代了四天，让双臂机器人开始为自身的零部件去毛刺。\n同月，Dream Labs 推出 Dream API，将机器人模型推理按作业时长计费，并提供面向开发者数据的模型微调服务。让机器人调用云端模型，正在成为一种可以试用、适配和购买的服务。\n国内，11 月 3 日，原力灵机升级了 Dexmal MaaS，将重点放在模型进入具体场景所需的后训练上：开发者可以在同一平台完成数据上传、模型训练和部署，再根据真机执行中的失败继续改进。\n这些动作让具身智能行业出现了一个值得关注的变化。过去，我们常常听到一些公司宣称自己在某个场景正在寻求落地突破。而现在，模型公司开始尝试把自己积累的能力，交给不同硬件、不同任务背后的开发者使用。具身模型的竞争，也由此延伸到一个更实际的问题：别人能不能拿它做成应用？\n这一步比语言模型开放 API 要重得多。机器人需要适配自己的身体，理解现场的物体和流程，还要在执行出错时把任务接着做下去。把模型交到外部开发者手里，就意味着让","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373683","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1794190735.0,"tags":["具身智能"],"score":90.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f7afa1dd4ce8d146","title":"After 7 months, Glasswing overwelms maintainers with underwhelming findings","title_zh":"7个月后， Glasswing以令人印象深刻的发现淹没了维护人员","title_orig":"After 7 months, Glasswing overwelms maintainers with underwhelming findings","summary": r dictation on their Apple Watch.","url":"https://techcrunch.com/2026/11/10/metas-ai-agent-muse-lands-on-apple-watch-and-wear-os/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794324570.0,"tags":["智能体"],"score":90.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"5f12cf459e5b89f7","title":"【钛晨报】李强签署国务院令，公布修订后的《基金会管理条例》；阿里拟分拆平头哥独立赴港上市；Anthropic IPO定价区间确定，目标市值约1万亿美元低于预期","title_zh":"","title_orig":"","summary":"i茅台将从“抢购”模式逐步转为日常售卖；台积电批准409亿美元资本预算，用于长期产能扩张；华为新型存储系统即将启动试商用；贾国龙质押西贝股权，股权数额超2660万；英伟达、黄仁勋遭股东集体诉讼；国家发改委：多渠道增加普通高中和高等教育学位供给；减少个人信息泄露，首批700专用码号服务业务试点获批。","summary_zh":"","summary_orig":"","url":"https://www.tmtpost.com/8200471.html","source":"钛媒体","source_id":"tmtpost","category":"ai","lang":"zh","published":1794352800.0,"tags":["芯片算力","融资并购","民生"],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"bf1a45003184b0a6","title":"微软正式发布 .NET 11：开发更省时，AI 工具更齐全","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，昨日（11 月 10 日）召开的.NET Conf 2026 线上大会上，微软正式发布 .NET 11，围绕运行性能、开发效率及 AI 应用构建推出一系列更新，覆盖网页、移动端和桌面应用开发。\n\nIT之家注：.NET 是由微软支持、与开源社区共同维护的软件开发平台。它免费、开源，开发者可以用它构建网站后台、桌面软件、手机应用、云服务等多种程序。\n本次 .NET 11 围绕性能、AI 应用及跨平台开发展开升级，涵盖 C# 15、网站开发框架 ASP.NET Core 和跨平台框架.NET MAUI 等，从而减少开发等待时间，简化现代应用构建流程。\n性能方面，新版带来数百项运行时与基础库优化，并通过原生编译的命令行入口、保持预热的构建服务，减少工具反复启动的开销。\nAI 方面，.NET 11 开发工具包内置 MCP 服务器模板，方便开发者将应用功能接入 AI 工具调用体系。配套 AI 库与智能体框架支持模型接入、工具调用和工作流编排；Blazor 还推出实验性 AI 界面组件，可用于流式聊天、工具展示与操作审批。\n编程体验上，C# 15 新增联合类型，让程序能够明确列出一项操作的不同结果，并由编译器检查是否遗漏处理。跨平台开发方面，.NET MAUI 默认采用 CoreCLR 运行时，同时改进界面调试与测试；Windows Forms 则提供可选的现代视觉样式。\n.NET 11 属于标准支持版本，提供两年支持，.NET 10 仍是长期支持选项。微软提醒，升级前应检查兼容性、依赖项和硬件要求，并以实际测试验证效果。\n参考\nAnnouncing .NE","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/246.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794360182.0,"tags":["开源"],"score":91.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"db09e2e8ec2b8780","title":"What objective is reasoning solving?","title_zh":"推理求解的目标是什么？","title_orig":"What objective is reasoning solving?","summary":"Article URL: https://alexwang.ai/posts/reasoning-as-pathfinding/\n\nComments URL: https://news.ycombinator.com/item?id=50445013\n\nPoints: 100\n\n# Comments: 45","summary_zh":"","summary_orig":"Article URL: https://alexwang.ai/posts/reasoning-as-pathfinding/\n\nComments URL: https://news.ycombinator.com/item?id=50445013\n\nPoints: 100\n\n# Comments: 45","url":"https://alexwang.ai/posts/reasoning-as-pathfinding/","source":"Hacker News","source_id":"hn","category":"ai","lang":"en","published":1794338714.0,"tags":[],"score":87.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"83b838fee627f58f","title":"首次开放其全平台：苹果启动 2027 Swift 学生挑战赛，获奖者直通 WWDC27 大会","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，苹果公司于 11 月 10 日宣布启动 2027 年 Swift 学生挑战赛，面向全球年轻开发者征集创意应用作品。参赛者可在 2027 年 2 月 8 日至 2 月 28 日提交作品，使用 Xcode 或 Swift Playgrounds 构建的应用需在 3 分钟内完成演示。\n与往年不同，本届比赛首次允许学生提交面向任意平台的应用，不再局限于 iOS 设备。这意味着参赛项目可覆盖 iPhone、iPad、Mac、Apple Watch、Apple TV，甚至 Vision Pro 等苹果生态产品，为学生的创意提供了更广阔的展示空间。\n\nIT之家援引博文介绍，为帮助参赛者备赛，苹果将提供系列教程和“与苹果见面”线上活动，内容涵盖 SwiftUI、人工智能与机器学习、空间计算，以及新的编码智能功能。学生可借此学习开发技能，并寻找适合转化为参赛作品的项目灵感。\n苹果表示，将根据创新性、创造力、社会影响力和包容性等标准评选获奖者。其中，部分“杰出获奖者”将获邀前往加州库比蒂诺的 Apple Park，参加 WWDC 2027 全球开发者大会。\nWWDC 2027 的具体日期尚未公布，但该活动通常于 6 月举行；届时苹果预计将发布 iOS 28、iPadOS 28、macOS 28 等新一代系统。\nSwift 学生挑战赛是苹果面向学生开发者的重要年度活动，不仅为年轻人提供了展示编程与产品创意的舞台，也可能成为他们进入苹果开发者生态、获得行业关注的起点。对有意从事应用开发、AI、空间计算等方向的学生而言，本届比赛尤其值得关注。","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/219.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794354837.0,"tags":[],"score":91.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"3588ceed41552e46","title":"Work at the Frontier: AI’s effect on freelance work","title_zh":"前沿工作：人工智能对自由职业的影响","title_orig":"Work at the Frontier: AI’s effect on freelance work","summary":"New research from OpenAI and Upwork finds shifting demand for freelance work, new skill combinations, and larger budgets and more hours for AI-related projects.","summary_zh":"OpenAI和Upwork的最新研究发现，对人工智能相关项目的自由职业、新技能组合、更大的预算和更多时间的需求正在发生变化。","summary_orig":"New research from OpenAI and Upwork finds shifting demand for freelance work, new skill combinations, and larger budgets and more hours for AI-related projects.","url":"https://openai.com/index/ai-effect-on-freelance-work","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794294000.0,"tags":[],"score":89.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f66ec3132ff052e5","title":"千问办公押注 Team Agent，企业 AI 的流水线时刻真的来了","title_zh":"","title_orig":"","summary":"作者｜Cynthia\n\n编辑｜郑玄\n\n传说，光明之神巴德尔梦见自己将死，于是，巴德尔的母亲弗丽嘉遍走世间，令万物立下了绝不伤害他的誓言。众神也因此放下心来，甚至还发明了一种新的消遣：轮番向巴德尔投掷武器和石块，看着他毫发无损，来确定他们已经战胜了预言。直到一小枝被遗漏的槲寄生投向巴德尔。光明之神轰然倒下，诸神的黄昏由此拉开序章。\n\n这是北欧神话中巴德尔之死的故事。危险早已被预见，人们也采取了行动，却仍然自欺欺人，把一次次看似成功的演示，当成了问题已经解决的证明。\n\n2026 年上半年的企业级 Agent 市场，也曾有过这样的笃定。\n\n每一场发布会上，AI 写方案、做表格、敲代码、生成海报的单任务能力都会轮番刷新上限。台上演示环节的百发百中，带动台下掌声雷动，所有人都觉得——企业级 AI 已经成熟了。\n\n但年中效率复盘，所有人都尴尬地发现：个人用 Agent 提效能翻三到十倍，落到整个团队、整个企业里，整体效率提升往往不到两倍。一个人把报告写快十倍，并不能让另外三个部门提前给出确认。设计师更快做出了十套方案，运营可能还在等商家确认价格，仓库也还没有更新库存。单个员工的产出增加伴随的，是整个项目仍然要按照原来的方式往前推进。\n\n11 月 9 日，千问办公 2.0 正式发布，直击这些痛点。\n\n作为业内首个面向团队协作的「Team Agent」，千问办公 2.0 版本，把多人协作、文档共创和自动任务整合到同一个 Agent 产品中：团队可以关联原有工作群和资料，围绕同一个 Agent 持续讨论、分工和执行。Agent 可以实时理解项目信息，并和群成员协同工作，像项目经理一样推进项目和执","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373760","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1794286327.0,"tags":["智能体"],"score":87.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"38bbc974c2517115","title":"脚本 Ram Altman 监视 PC 闲置内存然后发邮件给 Sam Altman","title_zh":"","title_orig":"","summary":"OpenAI CEO Sam Altman 因为一句 PC 内存浪费的评论而成为无数梗图的讽刺对象，他甚至为此自嘲，在社交媒体上将用户名改名为“Ram Altman”。现在开发者 Iain Kay 为 Linux 系统开发了一个 BASH 脚本 Ram Altman，旨在监测 PC 的闲置内存容量。闲置内存的百分比会被发送邮件给 Sam Altman。当然只是说说，具体取决于用户的设置。默认情况下脚本未预先配置电邮服务器。如果闲置内存超过了总内存的 10%，Ram Altman 会从预设讽刺邮件模板库随机选择一条发送出去。其中一则模板是：“Hi Sam。请别惊慌，我有 8.6 GiB 内存在 PC 上，.它们不在数据中心里。这占了我 PC 总内存的 56.2%，而且据我所知，它们今天也没什么别的安排。一位负责任囤积内存的用户。”","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85834","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794209535.0,"tags":[],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"64724a09b55f8bb1","title":"技嘉推出 RTX Spark 迷你主机 AI Top Aero，最高 128GB 统一内存","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，技嘉今日推出 AI TOP AERO 迷你主机，采用英伟达 RTX Spark 平台。这款产品拥有 Blackwell 架构 GPU、最高 128GB 统一内存和紧凑型设计，将端侧 AI 开发、内容创作和游戏体验带入个人工作空间。\n\n据介绍，这款迷你主机搭载英伟达 RTX Spark N1X 超级芯片，整合 20 核 Grace CPU 和 Blackwell 架构的 RTX GPU，最高可选 128GB LPDDR5X 统一内存，以及 4TB PCIe Gen 5 SSD，为端侧 AI 模型和 AI 应用程序提供充足计算资源。\nIT之家注意到，这款迷你主机配备 USB Type-C、10GbE 以太网等接口，并具备 Wi-Fi 7，可连接外设、传输数据和访问网络，让用户根据自身需求搭建 AI 工作环境。技嘉将自身的散热技术融入到 1 升紧凑机箱，可让系统长时间稳定运行。","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/213.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794353382.0,"tags":["芯片算力"],"score":91.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"5175b6a2b765750a","title":"Show HN: Get your coding agent off ~2019 JavaScript, onto modern web primitives","title_zh":"Show HN：让您的编码代理脱离~ 2019 JavaScript，进入现代网络图元","title_orig":"Show HN: Get your coding agent off ~2019 JavaScript, onto modern web primitives","summary":"Browsers natively handle a lot of what used to take 50 lines of JS (or a dependency): `CSS.highlights` for text range highlighting without s everywhere, `` and showModal() give you backdrops and ideal focus management, `field-sizing` to auto-grow textareas as the user types.. (Something yesterday's ftrain post touched on [0])Models know about some of these by name, but consistently won't default to using the platform-native solution and instead prefer the incumbent +JS based pattern. We started an effort in Chrome to supplement coding agents with this key domain knowledge and we're shipping our 1.0 today, in collaboration with Firefox, MDN, and Edge.200+ guides (~1.7MB) of curated, hand-craf","summary_zh":"","summary_orig":"Browsers natively handle a lot of what used to take 50 lines of JS (or a dependency): `CSS.highlights` for text range highlighting without s everywhere, `` and showModal() give you backdrops and ideal focus management, `field-sizing` to auto-grow textareas as the user types.. (Something yesterday's ftrain post touched on [0])Models know about some of these by name, but consistently won't default to using the platform-native solution and instead prefer the incumbent +JS based pattern. We started an effort in Chrome to supplement coding agents with this key domain knowledge and we're shipping our 1.0 today, in collaboration with Firefox, MDN, and Edge.200+ guides (~1.7MB) of curated, hand-craf","url":"https://github.com/GoogleChrome/modern-web-guidance","source":"Hacker News","source_id":"hn","category":"ai","lang":"en","published":1794333675.0,"tags":["智能体"],"score":86.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"12fa161ba55ab890","title":"成本仅1/3！Meta 新模型 Muse Ember 硬刚 Claude Haiku 5.5","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/Ou4l4aD7zvUzXWXsWJfY?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794324129.0,"tags":["大模型"],"score":82.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"7c7ce56614eeda55","title":"苹果将工程师的每日 AI 预算限制在 200 美元","title_zh":"","title_orig":"","summary":"世界市值最高的公司也开始对 AI 预算设限。苹果据报道将部分工程师的每日 AI 预算从 300 美元削减至 200 美元。苹果市值最近再次超过英伟达跃居第一。苹果此举并非是因为缺乏现金支持内部研发，而是因为在企业级规模下生成式 AI 存在着无法回避的经济规律。如果对先进模型的使用不加限制，成本曲线将呈指数级增长，这足以摧毁任何企业的利润空间，即便苹果也不例外。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85833","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794206412.0,"tags":["芯片算力","经济"],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"5da16e0a7e65b284","title":"“一入短剧深似海”，短剧概念股掀涨停潮，哪些公募提前布局？","title_zh":"","title_orig":"","summary":"多家公募对本次“AI短剧热潮”保持谨慎态度。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15317595.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794360967.0,"tags":[],"score":82.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"111b66d97ab01eca","title":"The climate case for AI has not been made","title_zh":"人工智能的气候案例尚未提出","title_orig":"The climate case for AI has not been made","summary":"This week, as countries meet in Antalya, Turkey for the United Nations climate conference, one topic likely to dominate the conversation is artificial intelligence. The host has already called on countries to commit to ensuring that AI is designed, powered, and deployed in ways that support climate action. But so far, industries around the world…","summary_zh":"本周，当各国在土耳其安塔利亚举行联合国气候大会时，一个可能主导对话的话题是人工智能。体验达人已经呼吁各国致力于确保人工智能的设计、驱动、","summary_orig":"This week, as countries meet in Antalya, Turkey for the United Nations climate conference, one topic likely to dominate the conversation is artificial intelligence. The host has already called on countries to commit to ensuring that AI is designed, powered, and deployed in ways that support climate action. But so far, industries around the world…","url":"https://www.technologyreview.com/2026/11/09/1148166/the-climate-case-for-ai-has-not-been-made/","source":"MIT 科技评论","source_id":"mittr","category":"ai","lang":"en","published":1794218400.0,"tags":[],"score":81.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"116b3e8cc8279f96","title":"从路透社到 Linux Magazine：openKylin 3.0 收获全球关注","title_zh":"","title_orig":"","summary":"openKylin 3.0 正式发布两个月来，这个来自中国的智能操作系统开源根社区正在被越来越多的国际技术媒体和全球开发者看见。 从路透社到 It's FOSS：国际媒体的多层关注 发布当月，路透社（Reuters）刊发 openKylin 3.0 相关报道《openKylin 3.0 Deepens AI Agent Integration, Explores Next-Generation Computing Ecosys...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503505","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794293682.0,"tags":["智能体","开源"],"score":83.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"8e51793c49fe8885","title":"Asahi Linux 从 MIT 许可证切换到 GPL 许可证","title_zh":"","title_orig":"","summary":"旨在将 Linux 移植到运行 Apple Silicon 芯片的 Mac 电脑的发行版项目 Asahi Linux 宣布从 MIT 许可证切换到 GPLv2 或以上版本的许可证。原因是有人将开发者分支尚在开发中的代码未注明出处发表，甚至利用 AI 重写代码以掩盖来源意图取代原项目和进行牟利。AI 出现前，代码洗白（Code laundering）通常涉及逐行手动重写代码、修改变量名，通过调整函数结构，使代码看起来与原版截然不同。LLM 的出现让这一过程变得更轻松、成本也更低。Asahi 团队此前已经注意到有人在利用宽松的 MIT 许可证劫持他们的工作成果。因此他们决定采用更严格的 GPL 许可证。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85832","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794205760.0,"tags":["大模型","芯片算力"],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"be9a1236970823ba","title":"OpenAI 扩展 ChatGPT 商业功能：企业可认领资料并创建 AI 智能体，为 Business Agent 投放广告","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，当地时间 11 月 10 日，OpenAI 宣布推出 ChatGPT Businesses 测试版，为企业提供商家信息认领、资料管理、用户互动数据分析以及 AI 智能体等服务，帮助企业通过 ChatGPT 接触潜在客户。\n\nOpenAI 表示，目前全球每周有 12 亿人使用 ChatGPT。Businesses 功能将通过 Business Hub 提供，企业可以在其中认领自己在 ChatGPT 中的商家资料，并在完成身份验证后更新关键信息，还可以添加包含产品价格和库存情况的自助式产品数据源，让 ChatGPT 能够向用户提供更加准确、及时的商品和服务信息。\n符合条件、所在地区支持 ChatGPT 的企业均可通过 Business Hub 认领商家资料。现有 OpenAI Enterprise 客户和广告客户可以联系 OpenAI 客户代表办理。Shopify 商家则可以通过 Business Hub 或 Shopify 管理后台连接店铺，以简化验证流程。符合条件的 Shopify 商品此前已经通过 Shopify Catalog 集成到 ChatGPT。\n在用户互动数据方面，Business Hub 将向企业提供汇总统计信息，包括商家在 ChatGPT 中被提及的次数、用户点击商家网站的次数，以及用户通过哪些常见话题发现相关企业。这些数据旨在帮助企业了解自身在 ChatGPT 中的展示情况，并据此完善提供给平台的信息。\n\nOpenAI 强调，相关数据分析功能经过隐私保护设计，不会向企业分享用户与 ChatGPT 的对话内容，也不会分享用户与 ","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/206.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794351336.0,"tags":["大模型","智能体"],"score":90.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c1b54c2747a31bbb","title":"Edge AI Daily 早报（11月11日）","title_zh":"","title_orig":"","summary":"Anthropic以发行8.25亿股、70—78美元定价冲刺纳斯达克（代码ANT），含七家芯片与云巨头260亿美元私募配售，募资上限约900亿美元，估值自2万亿美元退守至1.2万亿—1.3万亿美元区间；招股书显示前九月营收332亿美元、净亏损1040亿美元，8954亿美元算力承诺与Q3算力成本占营收58%构成核心矛盾。同期发布Fable 5.2与Mythos 5.2，千级智能体8天从零构建可启动操作系统、30小时完成费马大定理形式化，API降价20%。谷歌一年四发TPU并以Gemini Intelligence扩分发，Meta用Muse Ember把竞争推向单位任务成本，OpenAI收购旅行代理Odessia构建服务闭环。纽约、澳大利亚同步推进强制性AI监管。","summary_zh":"","summary_orig":"","url":"https://www.tmtpost.com/8200609.html","source":"钛媒体","source_id":"tmtpost","category":"ai","lang":"zh","published":1794357294.0,"tags":["大模型","芯片算力","智能体"],"score":81.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"160cd271e14882cf","title":"ChatGPT 占全球 AI 聊天流量超 81%；iOS 27.3 曝光 Siri「个人记忆系统」；传玛莎拉蒂+尊界合作新车曝光｜极客早知道","title_zh":"","title_orig":"","summary":"8 天从零搓出操作系统：Anthropic 最强 Claude Fable / Mythos 5.2 AI 模型登场，API 调用费下降 20%\n11 月 10 日消息，Anthropic 昨日（11 月 9 日）官宣推出 Claude Fable 5.2 和 Claude Mythos 5.2，两款模型基于同一底层模型，前者面向普通用户并内置网络安全与生物安全防护，后者则面向通过审核的网络安全和生命科学机构开放，用于高风险的专业应用。\n定价方面，Claude Fable 5.2 每 100 万词元（Token）输入费用为 8 美元（IT 之家注：现汇率约合 53.4 元人民币），每 100 万词元（Token）输出费用为 40 美元（现汇率约合 267.2 元人民币）。作为对比，Claude Fable 5.1 的每 100 万词元输入 / 输出价格分别为 10 美元（现汇率约合 66.8 元人民币）和 50 美元（现汇率约合 334 元人民币），按此计算 5.2 版本的 API 调用费用下调 20%。\n\n生成速度方面，官方表示相比 Claude Fable 5.1，最新 Claude Fable 5.2 模型生成速度最高提升 30%，而且在可选「快速模式」下，生成速度最高再提升至 2.5 倍，但价格相应更高。\n在预发布测试中，Fable 5.2 完成了多项引人注目的任务：设计出三款可实际运行的电子设备，包括语音助手中枢、USB 会议音箱和手持虚拟宠物；协调逾 1,000 个子智能体，在 8 天内从零构建出可在笔记本电脑启动的原型操作系统；并以约 1,000 个代理在 30 ","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373736","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1794269955.0,"tags":["大模型"],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"353a0d41035409c0","title":"《持械入宋》爆火：“草台班子”斩获120亿流量，历史题材成AI新富矿？","title_zh":"","title_orig":"","summary":"“草台班子”的《持械入宋》，凭什么火出圈？","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15317960.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794360658.0,"tags":[],"score":82.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c012fc7ecd62b33e","title":"OpenAI, Anthropic face new oversight as New York’s AI safety law takes effect","title_zh":"随着纽约人工智能安全法生效， OpenAI、Anthropic面临新的监督","title_orig":"OpenAI, Anthropic face new oversight as New York’s AI safety law takes effect","summary":"New York is preparing to enforce its sweeping AI safety law, requiring major developers like OpenAI and Anthropic to register, disclose safety practices, and report critical incidents or face fines.","summary_zh":"纽约正准备执行其全面的人工智能安全法，要求OpenAI和Anthropic等主要开发商进行注册，披露安全实践，并报告重大事件或面临罚款。","summary_orig":"New York is preparing to enforce its sweeping AI safety law, requiring major developers like OpenAI and Anthropic to register, disclose safety practices, and report critical incidents or face fines.","url":"https://techcrunch.com/2026/11/10/openai-anthropic-face-new-oversight-as-new-yorks-ai-safety-law-takes-effect/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794343933.0,"tags":[],"score":85.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"2abab1cd5fdb5efa","title":"办公提效之后，企业级 Agent 开始对经营结果负责","title_zh":"","title_orig":"","summary":"头图来源：腾讯云\n\n过去一年，智能体是 AI 行业最受关注的方向之一。\n\n从查资料、写文档到处理日常办公事务，桌面办公智能体完成了第一轮普及，办公提效的价值已经成为行业共识。但当 AI 进一步走向企业核心业务，搭出一个智能体不难，难的是让它真正跑进业务流程，适配复杂的系统、权限与规则，持续产出可量化的经营价值。\n\n在腾讯云副总裁吴永坚看来，未来企业级智能体的核心赛道，对话式的桌面办公 Agent 和服务经营的 Service Agent 会是两个长期并行的赛道。大模型提供了理解与推理能力，但想让 AI 真正参与业务经营，还需要一套能够打通系统、管好权限、支撑长期稳定运行的企业级平台。\n\n在 2026 腾讯全球数字生态大会企业级 Agent 产业实践专场上，腾讯云 ADP 宣布完成全生命周期产品升级，同时推出 FDE 交付方法论与生态共建体系，试图回答的正是这一问题：当办公场景的提效已经形成共识，要让智能体真的走进业务经营场景，底层的智能体平台，到底需要补哪些能力。\n\n过去用来搭建单点应用的开发工具，正在成为 Service Agent 扎根企业业务流的核心基础设施。\n\n一、从办公到经营，企业级 Agent 需要新的底座\n\n过去这一年，办公场景的 Agent 已经完成了普及教育，员工用它处理文档、检索信息、辅助日常工作，个人效率的提升是普遍可感知的。\n\n但在个人价值与企业价值之间仍然存在着一道鸿沟，麦肯锡 2026 年 8 月的全球 AI 调查给出了一组很有说服力的反差数据：80% 的人感受到了 AI 带来的个人效率提升，但只有不到四成的人认为 AI 真正为公司利润创造了正向贡献","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373642","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1794022297.0,"tags":["大模型","智能体"],"score":85.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"2c862368560e16b8","title":"不会“画饼”的华科人，凭什么成为AI热潮的香饽饽？","title_zh":"","title_orig":"","summary":"从移动互联网到AI：“华科系”为什么总在浪头上？","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15317959.html","source":"界面新闻","source_id":"jiemian","category":"ai","lang":"zh","published":1794360250.0,"tags":[],"score":82.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"445fc6287a33b8c1","title":"OpenAI rolls out new business profiles, making ChatGPT just a little bit more like Google","title_zh":"OpenAI推出新的业务配置文件，使ChatGPT更像谷歌","title_orig":"OpenAI rolls out new business profiles, making ChatGPT just a little bit more like Google","summary":"OpenAI is looking to make ChatGPT a more robust consumer discovery engine, and a host of new features seek to empower businesses to help it do that.","summary_zh":"OpenAI正在寻求使ChatGPT成为一个更强大的消费者发现引擎，许多新功能旨在帮助企业实现这一目标。","summary_orig":"OpenAI is looking to make ChatGPT a more robust consumer discovery engine, and a host of new features seek to empower businesses to help it do that.","url":"https://techcrunch.com/2026/11/10/openai-rolls-out-new-business-profiles-making-chatgpt-just-a-little-bit-more-like-google/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794336592.0,"tags":["大模型"],"score":85.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"5422acb9724fbcfb","title":"波士顿动力为其人形机器人加入了轮子","title_zh":"","title_orig":"","summary":"波士顿动力通过官方 YouTube 频道公布了一则新视频，展示了其人形机器人 Atlas 改用轮子在地面上移动。视频展示了 Atlas 能通过足部的轮子用脚尖旋转，以及做出其它高强度的动作。Atlas 能在平坦地面上的快速滚动与应对障碍物或不规则地面的关节式腿部运动之间实现平滑切换。Atlas 项目控制工程师 Andy Wu 称，系统在模拟环境中进行了训练，在模拟环境中学会所有动作后能在现实世界中以高准确度执行出来。Atlas 转换到移动模式仅需一个定制的适配器，就能将现有的滑板车轮毂安装到 Atlas 原有的踝关节执行器上。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85849","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794326299.0,"tags":["具身智能"],"score":85.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"33de2b9443d2854c","title":"Hong Kong IPOs Stall as Issuers Pull Deals at the Last Step","title_zh":"","title_orig":"","summary":"Companies that had cleared hearings and opened books are delaying listings, citing market conditions. Fresh first filings have gone quiet even as a long queue remains. Weak secondary demand, not a shortage of applicants, is resetting the calendar.","summary_zh":"","summary_orig":"","url":"https://www.tmtpost.com/8200654.html","source":"钛媒体","source_id":"tmtpost","category":"ai","lang":"zh","published":1794356885.0,"tags":["融资并购"],"score":80.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"05bd9f0351a0c3a2","title":"Innovating with AI in the special chemicals industry","title_zh":"在特殊化学品行业使用人工智能进行创新","title_orig":"Innovating with AI in the special chemicals industry","summary":"As companies look to accelerate innovation with artificial intelligence, cloud computing, and advanced modeling, the primary challenge is connecting new technologies to reliable data, scientific expertise, and the practical realities of bringing products to market. For specialty chemicals manufacturer Lubrizol, digital transformation is all about giving researchers the tools to test ideas faster, make better-informed…","summary_zh":"随着公司希望通过人工智能、云计算和高级建模加速创新，主要挑战是将新技术与可靠的数据、科学专业知识以及将产品引入","summary_orig":"As companies look to accelerate innovation with artificial intelligence, cloud computing, and advanced modeling, the primary challenge is connecting new technologies to reliable data, scientific expertise, and the practical realities of bringing products to market. For specialty chemicals manufacturer Lubrizol, digital transformation is all about giving researchers the tools to test ideas faster, make better-informed…","url":"https://www.technologyreview.com/2026/11/09/1147654/innovating-with-ai-in-the-special-chemicals-industry/","source":"MIT 科技评论","source_id":"mittr","category":"ai","lang":"en","published":1794229200.0,"tags":[],"score":79.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"9c331579e229757a","title":"ChatGPT Enterprise now available in AWS Marketplace","title_zh":"ChatGPT Enterprise现已在AWS Marketplace中提供","title_orig":"ChatGPT Enterprise now available in AWS Marketplace","summary":"ChatGPT Enterprise is now available through AWS Marketplace, helping organizations simplify procurement through existing AWS purchasing and billing relationships.","summary_zh":"ChatGPT Enterprise现已通过AWS Marketplace提供，帮助组织通过现有的AWS采购和计费关系简化采购。","summary_orig":"ChatGPT Enterprise is now available through AWS Marketplace, helping organizations simplify procurement through existing AWS purchasing and billing relationships.","url":"https://openai.com/index/chatgpt-enterprise-aws-marketplace","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794250800.0,"tags":["大模型"],"score":84.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f2a365891fa20b3c","title":"Synaptics patent claims stop work on DisplayLink drivers","title_zh":"Synaptics专利声明停止在DisplayLink驱动程序上的工作","title_orig":"Synaptics patent claims stop work on DisplayLink drivers","summary":"Article URL: https://lwn.net/SubscriberLink/1102549/acbc92e00cee3a3f/\n\nComments URL: https://news.ycombinator.com/item?id=50443824\n\nPoints: 292\n\n# Comments: 161","summary_zh":"","summary_orig":"Article URL: https://lwn.net/SubscriberLink/1102549/acbc92e00cee3a3f/\n\nComments URL: https://news.ycombinator.com/item?id=50443824\n\nPoints: 292\n\n# Comments: 161","url":"https://lwn.net/SubscriberLink/1102549/acbc92e00cee3a3f/","source":"Hacker News","source_id":"hn","category":"ai","lang":"en","published":1794333722.0,"tags":[],"score":82.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"d7ae06cea8833dd7","title":"英伟达董事会聘请前美国联邦检察官，调查 CEO 黄仁勋相关事件","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，英伟达今日发布公告，宣布已聘请美国前联邦检察官金正贤（Joon H. Kim）及其所在的律师事务所 Wachtell, Lipton, Rosen & Katz，负责开展一项全面、独立的调查。\n\nIT之家注：此次调查此前已于 11 月 8 日对外宣布，调查工作将由金正贤及其所在律所参与推进。\n此前，英伟达董事会表示，鉴于近期有关公司创始人兼 CEO 黄仁勋可能成为外国情报机构目标的报道，董事会决定启动独立调查。董事会将成立由独立董事组成的委员会，并在外部独立法律顾问协助下监督调查。\n英伟达董事会此前还表示，目前没有理由认为美国国家安全或英伟达的商业机密已经遭到泄露，但调查将审查所有可获得的信息。黄仁勋支持此次调查，并承诺配合相关工作。董事会同时表示，对黄仁勋及其领导团队保持信心。\n相关阅读：\n《英伟达黄仁勋承认出轨，消息称其去年已聘请擅长处理丑闻的危机公关公司》\n\n《马斯克回应黄仁勋出轨风波，同意其对美国 AI 产业不可或缺》\n\n《英伟达黄仁勋承认出轨：“我对妻子不忠，伤害了家人，没有任何借口”》","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/201.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794349927.0,"tags":["芯片算力","政策监管"],"score":88.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"af7403b4563990ca","title":"Anthropic launches Claude Meetings to turn workplace discussions into plans and tasks","title_zh":"Anthropic推出Claude Meetings，将工作场所的讨论转化为计划和任务","title_orig":"Anthropic launches Claude Meetings to turn workplace discussions into plans and tasks","summary":"As participants talk, Claude can draft the plan being discussed, map out a timeline on a whiteboard, answer questions in the meeting chat, and access connected work apps to retrieve information, such as last year's figures.","summary_zh":"在参与者交谈时， Claude可以起草正在讨论的计划，在白板上绘制时间表，在会议聊天中回答问题，并访问连接的工作应用程序以检索信息，例如去年的数字。","summary_orig":"As participants talk, Claude can draft the plan being discussed, map out a timeline on a whiteboard, answer questions in the meeting chat, and access connected work apps to retrieve information, such as last year's figures.","url":"https://techcrunch.com/2026/11/10/anthropic-launches-claude-meetings-to-turn-workplace-discussions-into-plans-and-tasks/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794331800.0,"tags":["大模型"],"score":85.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"4fc3ea52ddb37613","title":"触觉也能 Token 化！蚂蚁灵波发布通用触觉模型，把“具身原生”推进到机器人指尖","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/W7VPoeNBPX4y2u72WAGM?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794307229.0,"tags":["具身智能"],"score":78.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"23b94c697622500f","title":"CodeRabbit scales agentic software development and ships 20x more","title_zh":"CodeRabbit可扩展代理软件开发并出货量增加20倍","title_orig":"CodeRabbit scales agentic software development and ships 20x more","summary":"CodeRabbit uses OpenAI models to govern and trust AI-generated code and Codex to ship 20 times more software with the same engineering team.","summary_zh":"CodeRabbit使用OpenAI模型来管理和信任AI生成的代码， Codex使用相同的工程团队出货20倍的软件。","summary_orig":"CodeRabbit uses OpenAI models to govern and trust AI-generated code and Codex to ship 20 times more software with the same engineering team.","url":"https://openai.com/index/coderabbit-codex-daybreak","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794211200.0,"tags":["智能体"],"score":84.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"cf157c2027de085c","title":"FDA 警告 GLP-1 减肥药可能增加突然失明风险","title_zh":"","title_orig":"","summary":"FDA 周一表示，GLP-1 药物生产商须在产品标签上增加一项可能导致突然失明的警示。被称为非动脉炎性前部缺血性视神经病变(nonarteritic anterior ischemic optic neuropathy，NAION)的眼部疾病会影响视神经——负责将信号从眼睛传输至大脑的神经。当流向视神经的血液减少或受阻时，可能导致视力突然丧失，这种损伤是永久性的，目前无已知疗法。2024 年《JAMA Ophthalmology》期刊发表了一项研究，发现使用司美格鲁肽处方药的糖尿病患者患 NAION 的可能性是未使用该药患者的四倍。FDA 随后展开了调查，在审查了递交的副作用报告和多项临床试验的数据之后，FDA 发现所有 GLP-1 药物均出现 NAION 病例的报告。FDA 科学家尚未能明确药物导致 NAION 风险增加的具体机制。NAION 的某些危险因素，与 GLP-1 药物使用者中常见的健康状况——如 2 型糖尿病、肥胖症、睡眠呼吸暂停和高血压——存在重叠。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85843","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794292514.0,"tags":[],"score":84.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"1a90d1f46212bead","title":"Show HN: Valencia, Spain in Sim City/Isometric View","title_zh":"显示HN：西班牙瓦伦西亚模拟城市/等距视图","title_orig":"Show HN: Valencia, Spain in Sim City/Isometric View","summary":"Article URL: https://tinyvalencia.com/\n\nComments URL: https://news.ycombinator.com/item?id=50441518\n\nPoints: 191\n\n# Comments: 49","summary_zh":"文章网址： https://tinyvalencia.com/\n\n评论网址： https://news.ycombinator.com/item?id=50441518\n\n积分： 191\n\n#评论： 49","summary_orig":"Article URL: https://tinyvalencia.com/\n\nComments URL: https://news.ycombinator.com/item?id=50441518\n\nPoints: 191\n\n# Comments: 49","url":"https://tinyvalencia.com/","source":"Hacker News","source_id":"hn","category":"ai","lang":"en","published":1794323536.0,"tags":[],"score":82.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"a4f552d37ea08b24","title":"MiniMax 开源 H3-Image 生图模型，10 秒就能生成一张 4K 图像","title_zh":"","title_orig":"","summary":"IT之家 11 月 10 日消息，今天（10 日）深夜，MiniMax 宣布，MiniMax H3-Image 正式发布并开放权重。这是一款衍生自 H3 的图像生成模型，其具备文本生成图像、图像参考和图像编辑能力。\nIT之家从官方介绍获悉，其能够在 10 秒内生成一张 4096 x 4096 像素、约 16 MP（4K）的高分辨率图像，同时呈现丰富、真实的细节，并具备优秀的指令遵循和多参考图理解能力。\nMiniMax 称，在 H3 预训练赋予的广泛图像能力基础上，H3-Image 进一步强化了整个后训练链路，在数据、强化学习、步数压缩、PE、部署优化等方面做了许多扎实的工作。这些工作的组合，使得 MiniMax H3-image 同时具备了速度、画面质量、指令遵循三个方面的竞争力：\n相比于主流的 100 万像素或者 400 万像素，1600 万像素（16MP，4096×4096）的图片在细节上具备显著优势。MiniMax H3-Image 在 10s 内生成 16MP 的高规格图像，速度可达市面主流水平的 5 倍。\n\n画面细节和真实感可以显著拓宽模型的使用范围。有别于常见的“AI 感”，H3-Image 能够提供丰富的画面细节和“极强的真实感”。\n\n模型提供了“开源模型中最强”的指令遵循能力，最多支持 16 张参考图片。\n\n发布首周，MiniMax 还将针对 16MP 及以上规格的生成请求提供官方价格的五折优惠。\n\nHugging Face: https://huggingface.co/MiniMaxAI/MiniMax-H3-Image\n\nAPI: https://plat","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/191.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794324352.0,"tags":["多模态","开源"],"score":88.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"196c0edf93f91dc3","title":"Google broadens its AI hardware portfolio with two new specialized chips","title_zh":"谷歌通过两款新的专用芯片扩大其人工智能硬件产品组合","title_orig":"Google broadens its AI hardware portfolio with two new specialized chips","summary":"Google's new tensor processing units (TPUs) broaden its chip portfolio to more use cases: confidential model training and more memory capacity.","summary_zh":"谷歌的新张量处理单元（TPU）将其芯片产品组合扩展到更多用例：机密模型培训和更大的内存容量。","summary_orig":"Google's new tensor processing units (TPUs) broaden its chip portfolio to more use cases: confidential model training and more memory capacity.","url":"https://techcrunch.com/2026/11/10/google-broadens-its-ai-hardware-portfolio-with-two-new-specialized-chips/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794326048.0,"tags":[],"score":85.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"932fe34bad728f30","title":"Kuken Industries searches 70 years of drawings in minutes","title_zh":"Kuken Industries在几分钟内搜索70年的图纸","title_orig":"Kuken Industries searches 70 years of drawings in minutes","summary":"Kuken Industries uses the OpenAI API to search 70 years of cooling tower drawings. Engineers can find the drawing for a repair in 4.5 minutes, down from nearly an hour.","summary_zh":"Kuken Industries使用OpenAI API搜索70年的冷却塔图纸。工程师可以在4.5分钟内找到图纸进行维修，而将近一个小时。","summary_orig":"Kuken Industries uses the OpenAI API to search 70 years of cooling tower drawings. Engineers can find the drawing for a repair in 4.5 minutes, down from nearly an hour.","url":"https://openai.com/index/kuken","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794211200.0,"tags":[],"score":84.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"fc6c9dc8d37c7ec9","title":"Anthropic 发布 Fable 5.2 与 Mythos 5.2，声称“8 天写出一个能开机的操作系统”","title_zh":"","title_orig":"","summary":"Anthropic 在 11 月 9 日发布了 Claude Fable 5.2 和 Claude Mythos 5.2。这两个名字看起来像两条产品线，实际上是同一个底层模型——Fable 带完整的网络安全和生物学防护，对所有用户开放；Mythos 卸掉部分限制，只通过验证计划提供给从事防御性安全或生物医学研究的机构。 对开发者来说，真正想知道的不是它能解什么难...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503499/claude-fable-and-mythos-5-2","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794281865.0,"tags":["大模型"],"score":78.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"570c53d42f42c778","title":"DeepSeek Harness 日活154万，官方开始给插件作者发Token：Agent 生态要靠开发者了","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/Y7lTO7Q1M8oN5JhxhirK?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794324056.0,"tags":["大模型","智能体"],"score":77.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"5683a6f78917651d","title":"估值 400 亿美元，美国公司，终于做出了中国开源模型的竞对","title_zh":"","title_orig":"","summary":"作者｜Wildcard\n\n编辑｜靖宇\n\n11 月 5 日，OpenAI 前 CTO Mira Murati 创立的 Thinking Machines Lab（简称 TML）同一天出了两条新闻。\n\n当天，公司发布了第二代模型 Inkling 2 Small，第三方评测机构 Artificial Analysis（AA）给的评价相当高：权重放出后，它将成为「中国以外得分最高的开放权重模型」。同一天，据报道，这家公司正以 400 亿美元的投前估值筹集 50 亿美元新融资。\n\nTML 在 2025 年 2 月对外亮相，至今一年半多。这期间，他们拿过 a16z 领投的 20 亿美元种子轮，也经历了联合创始人 Andrew Tulloch 转投 Meta，以及联合创始人 Barret Zoph、Luke Metz 等人今年 1 月回归 OpenAI 的动荡，之后由 PyTorch 联合创始人 Soumith Chintala 接任 CTO。\n\n今年 1 月还有报道称，团队 以约 500 亿美元估值融资的谈判陷入停滞。新一轮融资能不能谈成，很大程度上要看二代模型的成色。\n\n翻开 Inkling 2 Small 的技术博客，跑分表和架构图之外，最意味深长的是一行交代训练数据来源的文字：预训练后半程的数据，大部分采样自更早的模型，其中点名了月之暗面的 Kimi K3。\n\n01\n\n594B 的「Small」，强在哪\n\n「Small」这个词在大模型行业里正在不断膨胀。\n\nTML 今年 7 月发布的初代开放权重模型 Inkling 有 975B 总参数，两周后的 Inkling Small 是 27","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373637","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1793967186.0,"tags":["融资并购","开源"],"score":82.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f9ddc69f831717b4","title":"Adobe brings AI agents and new creative tools to Photoshop, Premiere, and Firefly","title_zh":"Adobe将AI代理和新的创意工具引入Photoshop、Premiere和Firefly","title_orig":"Adobe brings AI agents and new creative tools to Photoshop, Premiere, and Firefly","summary":"Adobe is taking on Figma with a new prototype builder tool in Firefly.","summary_zh":"Adobe正在Firefly中使用新的原型构建器工具来对抗Figma。","summary_orig":"Adobe is taking on Figma with a new prototype builder tool in Firefly.","url":"https://techcrunch.com/2026/11/10/adobe-adds-more-ai-to-its-products-and-launches-an-mcp/","sour "tags":["智能体","外交"],"score":78.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"ee7b3c26684447e7","title":"AI is an information gateway. Audiences still don't want it making their news","title_zh":"","title_orig":"AI is an information gateway. Audiences still don't want it making their news","summary":"Article URL: https://www.niemanlab.org/2026/11/ai-is-becoming-an-information-gateway-audiences-still-dont-want-it-making-their-news/\n\nComments URL: https://news.ycombinator.com/item?id=50448174\n\nPoints: 4\n\n# Comments: 0","summary_zh":"","summary_orig":"Article URL: https://www.niemanlab.org/2026/11/ai-is-becoming-an-information-gateway-audiences-still-dont-want-it-making-their-news/\n\nComments URL: https://news.ycombinator.com/item?id=50448174\n\nPoints: 4\n\n# Comments: 0","url":"https://www.niemanlab.org/2026/11/ai-is-becoming-an-information-gateway-audiences-still-dont-want-it-making-their-news/","source":"Hacker News","source_id":"hn","category":"ai","lang":"en","published":1794356133.0,"tags":[],"score":80.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"2be364cc5f1ef717","title":"Anthropic 发布 IPO 路演视频正式启动最高 643.5 亿美元募资计划，估值约在 1~1.4 万亿美元","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，当地时间 11 月 10 日，Anthropic 正式宣布启动首次公开募股（IPO）路演，并公布股票发行计划。\n \n根据公告，Anthropic 此次拟发行 8.25 亿股 A 类普通股，发行价格区间为每股 70 至 78 美元。按照发行价上限计算，本次基础发行规模最高约为 643.5 亿美元（IT之家注：现汇率约合 4,302.82 亿元人民币）。\n\n根据 Anthropic 官方披露的发行安排，此次发行的 8.25 亿股股票中，有 8.01351354 亿股由 Anthropic 自身发行，另外 2364.8646 万股由部分现有股东出售。Anthropic 不会从现有股东出售股票所得款项中获得收益。\n此外，Anthropic 预计授予承销商一项为期 30 天的额外购股选择权，允许承销商额外购买最多 1.2375 亿股 A 类普通股。若该选择权全部行使，实际发行股份数量和募资规模还将进一步增加。\nAnthropic 已申请将 A 类普通股以股票代码「ANT」在纳斯达克全球精选市场挂牌交易。公司表示，相关证券注册声明已经提交 SEC，但尚未生效。在注册声明生效之前，相关股票不能出售。\n路透社进一步报道称，Anthropic 此次 IPO 还将配合一项独立的私募配售交易，计划向包括谷歌、英伟达、AMD、博通、美光、微软和台积电在内的投资方发行价值 260 亿美元（现汇率约合 1,738.51 亿元人民币）的 N 类普通股。若将 IPO 和这项私募配售合并计算，相关融资规模最高可达 904 亿美元（现汇率约合 6,044.67 亿元人民币）。\n估","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/209.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794352125.0,"tags":["融资并购"],"score":86.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"da795f2924119e2e","title":"Nancy Pelosi’s replacement is ready to regulate AI","title_zh":"南希·佩洛西（Nancy Pelosi）的继任者已经准备好监管","title_orig":"Nancy Pelosi’s replacement is ready to regulate AI","summary":"As a California state senator, Scott Wiener authored legislation aimed at curbing the risks of advanced AI. Now, after winning a tight congressional race for former Speaker of the House Nancy Pelosi’s open San Francisco seat, he could play a key role in setting federal AI policy. I spoke with Wiener on Friday, only a…","summary_zh":"作为加利福尼亚州参议员，斯科特·维纳（Scott Wiener）撰写了旨在遏制先进人工智能风险的立法。现在，在赢得前众议院议长南希·佩洛西(Nancy Pelosi)在旧金山的空缺席位后，他可以在竞选中发挥关键作用。","summary_orig":"As a California state senator, Scott Wiener authored legislation aimed at curbing the risks of advanced AI. Now, after winning a tight congressional race for former Speaker of the House Nancy Pelosi’s open San Francisco seat, he could play a key role in setting federal AI policy. I spoke with Wiener on Friday, only a…","url":"https://www.technologyreview.com/2026/11/09/1148182/nancy-pelosis-replacement-is-ready-to-regulate-ai/","source":"MIT 科技评论","source_id":"mittr","category":"ai","lang":"en","published":1794243943.0,"tags":[],"score":76.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"a5aa06529e01def6","title":"黄仁勋承认「婚外情」，英伟达启动调查；ChatGPT 突现封号风波，200 美元 Pro 用户也遭殃；腾讯姚顺雨谈「AI 公司护城河」：在产品层，而不是模型层","title_zh":"","title_orig":"","summary":"黄仁勋承认「婚外情」，英伟达启动调查\n\n11 月 9 日消息，英伟达 CEO 黄仁勋当地时间 8 日于公司官网发布致全员公开信，就个人私事致歉，同时披露董事会将针对相关报道提及的国家安全关切展开独立调查。\n\n黄仁勋在信中承认自己对妻子不忠，坦言该行为伤害家人，对此承担全部责任，并接受外界批评。他表示家人不应为其个人选择负责，恳请公众给予家人隐私空间，希望能有机会重新赢回家人信任。他强调自己对英伟达始终坚定，将努力重新赢得团队与投资方的信赖。\n\n针对近期报道带出的国家安全相关质疑，黄仁勋确认董事会已启动独立调查，本人将全力配合。\n\n此前据《纽约时报》报道，美国政府认为黄仁勋与一家名为 Megaspeed 的新加坡科技公司前高管 Alice Huang（黄乐）存在密切关系。（来源：DoNews）\n\n特斯拉更新 AI 加速器路线图：SI6 算力达 HW4 的 80 倍，Dojo D3 将面向太空部署\n\n11 月 8 日消息，特斯拉公布了更新后的 AI 加速器路线图，进一步揭示了公司未来几年的芯片研发方向。根据这份路线图，特斯拉第六代推理加速器的算力预计将达到现有第四代芯片的 80 倍；而用于训练任务的 Dojo D3 将放弃以 SRAM 为核心的架构，转向采用多芯粒设计，并搭载堆叠式 HBM 高带宽内存。\n\n此外，特斯拉还开始用「超级智能」（Super Intelligence，SI）取代「人工智能」（Artificial Intelligence，AI）这一名称，为旗下 AI 加速器启用 SI 系列命名。出于相同原因，马斯克近期也确认，SpaceXAI 将更名为 SpaceXSI。","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373687","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1794193084.0,"tags":["大模型","芯片算力"],"score":80.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f301ed3285d83c48","title":"谷歌联合 Artificial Analysis 推出 MKA 基准测试：Gemini 4 Carbon 多模态知识工作测试获第二，任务成本仅为第一名六分之一","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，当地时间 11 月 10 日，谷歌宣布联合 AI 模型评测机构 Artificial Analysis 推出多模态知识智能体基准测试 MKA（Multimodal Knowledge Agent），用于评估 AI 智能体处理视觉复杂文件、完成现实世界知识工作任务的能力。\n谷歌表示，其最新发布的 Gemini 4 Carbon 在该测试中取得了参测模型第二名的成绩，完成任务的平均成本仅为排名第一模型的约六分之一。\n\n谷歌 DeepMind 高级产品经理 Rohan Doshi 和首席工程师 Ben Caine 介绍称，现有不少知识工作基准测试仅依赖文本即可完成，而现实工作往往涉及大量视觉信息。例如，建筑师需要交叉核对建筑蓝图，工程师需要分析工程示意图，专业人员还需要将不同来源的信息整理成演示文稿、报告和电子表格。\nMKA 基准测试旨在评估 AI 智能体在这些复杂工作场景中的表现。谷歌与来自 10 个行业、83 种职业的领域专家合作，建立了包含 200 项任务的评测集，覆盖商业、建筑、教育、工程、金融、医疗、法律与政府、物流与地图、科学以及软件与数据等领域。\n每项任务都模拟一个多步骤专业项目，包含真实工作提示词以及一组多模态输入文件。谷歌称，这些任务通常需要经验丰富的专业人员花费 3 至 8 小时完成。IT之家注意到，每项任务还配有专家编写的评分标准，平均包含约 70 项是非判断检查项，其中事实准确性占 75%，视觉设计占 25%。\n\n在评测机制方面，所有参测模型均运行于相同的开源智能体框架 Stirrup，使用相同工具、沙箱环境和交互轮次预算。最","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/205.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794350930.0,"tags":["大模型","智能体","多模态"],"score":85.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c5fc08c856e26611","title":"Chinese Short Dramas Own Overseas Attention but Not Yet the Profits","title_zh":"","title_orig":"","summary":"Vertical micro-dramas from Chinese teams now command extreme mobile engagement abroad. The real product is a paid-hook, ad-bought industrial system, not cultural soft power. Thin margins, rising user-acquisition costs, and copycats will decide whether the boom becomes a lasting business.","summary_zh":"","summary_orig":"","url":"https://www.tmtpost.com/8200340.html","source":"钛媒体","source_id":"tmtpost","category":"ai","lang":"zh","published":1794312006.0,"tags":[],"score":73.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"db4d2c77795ec3b7","title":"AI越来越聪明，企业却快管不住了：Gartner 2027年十大趋势，智能体治理成新战场","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/CUgMFMX7uRJNMec1pfYo?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794243359.0,"tags":["智能体"],"score":73.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"284898f133c9f97a","title":"RXThinkCMF 敏捷开发框架 Laravel13+NaiveVue 版本 v2.6.0 发布","title_zh":"","title_orig":"","summary":"v2.6.0 更新内容： 1、修复近用户反馈的问题； 项目介绍 一款基于 Laravel13、Vue3、TypeScript、NaiveUI、Vite、VueRouter 等技术栈构建的前后端分离企业级数据中台解决方案。内置精细化到按钮及方法级别的 RBAC 权限管控体系，集成用户管理、角色管理、权限菜单、部门管理、职级岗位、系统日志、数据字典、系统参数、行...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503519","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794357019.0,"tags":[],"score":75.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"f37b680abcf7adcb","title":"Control Room: A central system to track and stop model workloads across our research infrastructure","title_zh":"控制室：一个中央系统，用于跟踪和停止整个研究基础设施的模型工作负载","title_orig":"Control Room: A central system to track and stop model workloads across our research infrastructure","summary":"Learn how OpenAI’s Control Room tracks model workloads across our research infrastructure and can rapidly stop them when safety or security concerns arise.","summary_zh":"了解OpenAI的控制室如何在我们的研究基础设施中跟踪模型工作负载，并在出现安全问题或安全问题时快速阻止它们。","summary_orig":"Learn how OpenAI’s Control Room tracks model workloads across our research infrastructure and can rapidly stop them when safety or security concerns arise.","url":"https://openai.com/index/control-room","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1794229200.0,"tags":[],"score":79.5,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"e18f58ec7dc7acb9","title":"All 7 Anthropic founders will each cash out about $250M in IPO","title_zh":"所有7位Anthropic创始人都将在首次公开募股中兑现约$ 2.5亿","title_orig":"All 7 Anthropic founders will each cash out about $250M in IPO","summary":"Each of the seven co-founders plans to sell exactly the same number of shares in the IPO, which would bring each of them about $250 million in cash at the midpoint of the price range while leaving the group in control of the company.","summary_zh":"七位联合创始人中的每一位都计划在IPO中出售完全相同数量的股票，这将使他们在价格区间的中点获得约2.5亿美元的现金，同时让集团控制公司。","summary_orig":"Each of the seven co-founders plans to sell exactly the same number of shares in the IPO, which would bring each of them about $250 million in cash at the midpoint of the price range while leaving the group in control of the company.","url":"https://techcrunch.com/2026/11/10/all-7-anthropic-founders-will-each-cash-out-about-250m-in-ipo/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794340672.0,"tags":["融资并购"],"score":80.0,"translated":true,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"33cda315fe318977","title":"接大模型别再自己配 Key、搭代理了，火山引擎 IGA Pages 一步搞定","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/juu2R26yD8B6ABUEQuWB?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794337136.0,"tags":["大模型"],"score":72.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"4e458092e1d68307","title":"为什么「陪伴」，注定是 Personal AI 的核心","title_zh":"","title_orig":"","summary":"作者｜宇航猿\n\n编辑｜靖宇\n\n最近这一波 Personal AI 实在太火了，我也注册了一个 Muse 体验了一下。\n\n整个体验下来，我感觉 Muse 的能力实在一般，远没到让人惊叹的地步。但奇怪的是，它确实带来了一种真切的陪伴感。这种陪伴感，甚至直接改变了我的使用习惯，让我总是忍不住想找它聊聊，哪怕只是把最琐碎的需求丢给它。\n\n就在本周，Muse 又往前迈了一步，正式上线了实时语音和会动的头像。无独有偶，各家 AI 助手最近都在做同一件事，就是给个人 AI 助手开通语音和对话功能。\n\n这让我非常好奇，距离 ChatGPT 端出惊艳的语音模式，已经过去两年了，为什么到了现在这个时间点，所有的个人 AI 助手又开始一窝蜂地往语音赛道上挤？\n\n01\n\n口喷「派活」的魅力\n\n2024 年 GPT-4o 发布演示时，那种流畅自然的对话体验常被拿来和电影《Her》对比。但在此后的很长一段时间里，AI 语音始终停留在聊天层，双方客客气气地说完，交互也就结束了。\n\n这一轮语音热潮的核心变量在于，AI 身后终于长出了一双手，语音因此成了派活门槛最低的入口。\n\n当地时间 11 月 5 日，Muse 在美国上线实时语音功能。Meta 官方给出的典型场景非常务实，用户可以在散步或者双手忙碌的时候，直接口头给它安排任务，随后 Muse 会在后台继续处理这些工作；当然，用户也可以拿它来排练面试或演讲。\n\n这种「动口不动手」的派活逻辑，正在成为智能体产品的标配。\n\n早在 9 月 17 日，SpaceXAI 旗下的 Grok Bot 就上线了语音功能。在 X 上，早期用户最看重的也是这一点，散步和通勤的路上","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373653","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1794131565.0,"tags":["大模型","多模态"],"score":77.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"91398c822ba2b396","title":"Anthropic 升级 AI 办公套件：从头脑风暴到数据看板，Claude 想承包团队协作全流程","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，Anthropic 今日开始推出 Claude Whiteboards（白板）、Claude Sheets（表格）和 Claude Data（原 Claude Dashboards），把 AI 助手从“聊天问答”进一步推向团队协作工作台，用户可以在白板上梳理计划、在表格中搭建追踪器，并把业务数据变成可共享的仪表盘、数据故事或解说视频。\n \n三项产品面向所有付费计划提供，支持网页端、桌面端和移动端；其中白板应用 Whiteboards 与表格 Sheets 目前处于测试阶段，Claude Data 则已正式上线。\n\n官方希望让 Claude 从生成文字、代码或文档，转向直接参与团队的日常协作。Claude Whiteboards 方面，用户可以口头描述一个模糊计划，Claude 会将其整理为包含时间线、负责人和日期的白板，团队成员则可实时在同一块白板上补充想法。会议复盘时，Claude 还能将零散讨论按主题归类，并起草每个人的行动项。\n\nClaude Sheets 则试图降低制作表格的门槛。用户只需提出“帮我做一个营销活动追踪表”或“招聘预算表”等请求，Claude 即可生成包含多个标签页、公式、格式和下拉菜单的电子表格，并直接在单元格中修改内容。\nClaude Sheets 会清晰标注每一次 AI 修改，便于团队追踪变更；文件也可导出为 .xlsx 或 CSV，或继续在 Airtable、Asana、monday.com、Smartsheet 等工具中处理。\nClaude Data 的定位是让企业数据“会讲故事”。它可连接 Amazon Red","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/204.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794350626.0,"tags":["大模型"],"score":83.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"7c8a91a2ee020dca","title":"Aaron Swartz 诞辰四十周年","title_zh":"","title_orig":"","summary":"Aaron Swartz 出生于 1986 年 11 月 8 日，上周日原本是他四十岁生日。2011 年他因为从 MIT 网络下载数百万篇 JSTOR 学术论文计划免费公开而遭到逮捕，检方指控他犯有计算机欺诈等罪名，面临最高数十年监禁。2013 年 1 月 11 日他自杀身亡，年仅 26 岁。虽然他已去世 14 年但他的遗产仍然活着。Swartz 与 John Gruber 合作开发了 Markdown，一种简化的纯文本格式系统，允许用户使用普通文本创建结构化文档，不需要私有软件。Markdown 于 2004 年推出，二十多年后成为了最流行的文档和出版格式之一，广泛应用于论坛和维基等社区网站。LLM 产品和开发工具也广泛使用 Markdown。Swartz 还开发了 web.py，协助开发了 RSS 1.0。","summary_zh":"","summary_orig":"","url":"https://www.solidot.org/story?sid=85835","source":"Solidot","source_id":"solidot","category":"ai","lang":"zh","published":1794213774.0,"tags":[],"score":76.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"b2d00df72e41b706","title":"Reddit is turning user conversations into AI-powered product reviews","title_zh":"","title_orig":"Reddit is turning user conversations into AI-powered product reviews","summary":"Reddit's new AI-powered reviews summarize what users like and dislike about 10,000 products, helping shoppers research purchases ahead of the holidays.","summary_zh":"","summary_orig":"Reddit's new AI-powered reviews summarize what users like and dislike about 10,000 products, helping shoppers research purchases ahead of the holidays.","url":"https://techcrunch.com/2026/11/10/reddit-is-turning-user-conversations-into-ai-powered-product-reviews/","source":"TechCrunch","source_id":"techcrunch","category":"ai","lang":"en","published":1794322800.0,"tags":[],"score":80.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"9bfb605f2e708d66","title":"10x 工程师变成 100x 了，普通工程师还是那么普通","title_zh":"","title_orig":"","summary":"一位 CTO 用反证法证明：我们还没被 AI 取代，但理由可能和你想的不一样。 shaharglazner 是 keepalerting 的联合创始人兼 CTO，11 月 9 日他在 X 上发了篇长文《On Being an Engineer in 2026》，标题下面跟着一行小字：「我们还需要吗？」 他先承认了那种普遍的失控感。每隔一周，就有一块工作被交出去。最早是不写代码...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503514","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794305293.0,"tags":[],"score":73.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"9bc9b2dc3b4a5b1a","title":"近 700 亿美元 IPO 定价突然撤回！Anthropic 最快今天路演，下周冲刺上市","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/article/8tquwes1yGbmTeyOjOId?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794336858.0,"tags":["融资并购"],"score":72.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"06392c35b338f07a","title":"创业者做 Personal Agent，有没有一线生机？","title_zh":"","title_orig":"","summary":"最近一阶段，Personal Agent 很热。有趣的是，这个概念迅速火爆又迅速有了一个共识，几波讨论下来大家的观点似乎是： Personal Agent 的机会是大厂的，创业者基本没戏。\n\n虽然一般情况下，「入口级机会归大厂」确实是大概率发生的事情，但 Personal Agent 真的是个「入口」的问题吗？真的意味着「这件事里没有创业者的位置」吗？\n\n这依旧值得认真聊一聊。\n\n \n\n真正值得兴奋的事：价值可以长在基模外\n\n我们换一个视角看，Personal Agent 为什么让人兴奋？\n\n因为它给创业者提供了一种新的可能：产品的终极价值不来自于今天大模型公司提供的智能，而是可以借助大模型的能力来孕育产品，最终在和用户的共同发展中，把大部分能力和价值留在创业公司自身。\n\n回顾过去三年 AI 和 Agent 的演进，通用大模型就像一个营养丰富的「蛋」。绝大多数 AI 应用和 Agent 产品，本质上都没能离开大模型这层「卵壳」。无论是从最初的「套壳」，还是后来开始做 Environment Engineering、Harness Engineering，努力让模型能用工具、能执行更长的任务，很多时候仍然受制于同一个事实：产品的智商、响应能力和行为边界，很大程度上由底层模型决定。\n\n早期生长依赖大模型提供的「养分」，这本身没有问题。问题在于，如果产品一直只能从基础模型里「吸收营养」，无法破壳去真实世界里独立生长，最后就容易沦为模型厂商的「Token 分销商」。并且始终难以摆脱在沙滩上建城堡的风险：模型一升级，别人也能跟上；模型一涨价，自己的成本就被牵着走；模型一迭代，你的产品可能","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373650","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1794105620.0,"tags":["大模型","智能体"],"score":77.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"46b645d06298bb35","title":"美女陪打LOL，腾讯入局AI游戏陪伴，会走米哈游的老路吗？","title_zh":"","title_orig":"","summary":"行业长期趋势看，AI陪伴赛道已经告别“只要有好看数字人、会聊天就能吸引用户”的早期幻想。","summary_zh":"","summary_orig":"","url":"https://www.tmtpost.com/8199749.html","source":"钛媒体","source_id":"tmtpost","category":"ai","lang":"zh","published":1794305153.0,"tags":[],"score":70.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"bab93a711bafd39a","title":"嵌入式 x86 算力天花板：AMD 霄龙嵌入式 9006 系列 SP7 处理器发布，吞吐量飙升 1.8 倍","title_zh":"","title_orig":"","summary":"IT之家 11 月 11 日消息，AMD 今天（11 月 11 日）发布霄龙（EPYC）嵌入式 9006 系列 SP7 处理器，基于 Zen 6 架构，最高可达 256 核 512 线程，率先在嵌入式平台落地 PCIe Gen6、CXL3.1，搭配 16 通道 DDR5/MRDIMM 内存、7 年产品生命周期。\n\n不同于 9 月发布的 AMD 霄龙 9006 系列服务器 CPU（面向智能体 AI、云计算、企业应用等），本次发布的嵌入式 9006 系列 SP7 处理器主要面向半导体 ATE 测试设备、企业存储、高端网络防火墙等关键嵌入式场景。\n在插槽规格方面，AMD 霄龙嵌入式 9006 系列采用新一代 SP7 规格，而前代 9005 系列采用 SP5 插槽规格，两者物理不兼容。SP7 是 EPYC 9006 系列中的高性能、高密度服务器平台，采用 LGA 7536 插槽，支持 1P/2P（单路或双路）服务器。\n规格方面，AMD 霄龙嵌入式 9006 系列升级支持 PCIe Gen6（96 通道 @64GT/s）与 CXL3.1，内存方面 16 通道支持 MRDIMM 12800MT/s，内存带宽最高为上一代 2.7 倍。\nIT之家注：这里的 2.7 倍是按照 EPYC Embedded 9756（SP7 平台，Zen6）支持 MRDIMM 12800 MT/s，单插槽理论峰值带宽 1638 GB/s；而上一代 EPYC 9005（SP5，Zen5）DDR5‑6400 MT/s，单插槽理论峰值带宽 614 GB/s。\n\n该系列多核吞吐量较自家上代提升最高 1.8 倍，防火墙吞吐量","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/195.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794330305.0,"tags":["芯片算力","智能体"],"score":83.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"bc8f9eac19663ff6","title":"Partnering with Hacktron to find vulnerabilities in OpenAI’s systems","title_zh":"","title_orig":"Partnering with Hacktron to find vulnerabilities in OpenAI’s systems","summary":"OpenAI is partnering with Hacktron to find vulnerabilities, test connections with third-party services, and strengthen defenses with frontier AI.","summary_zh":"","summary_orig":"OpenAI is partnering with Hacktron to find vulnerabilities, test connections with third-party services, and strengthen defenses with frontier AI.","url":"https://openai.com/index/partnering-with-hacktron","source":"OpenAI 官方","source_id":"openai","category":"ai","lang":"en","published":1793952000.0,"tags":[],"score":76.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"2fcf63146d057d41","title":"开源新生力：一群中学生登上 GOTC 主会场","title_zh":"","title_orig":"","summary":"上个周末，「百格成城」少年开源 AI 黑客松在北京亦庄实验中学收官。短短两天，同学们拿出的项目都很接地气：有人只用普通摄像头识别手语字母，帮听障朋友把手势转成文字和语音；有人想着家里长辈吃药容易忘，做了个吃药提醒工具，家人还能远程确认；还有人把二十四节气做成交互式网页，到立冬，就能在页面里 “包饺子”...","summary_zh":"","summary_orig":"","url":"https://www.oschina.net/news/503507","source":"开源中国","source_id":"oschina","category":"ai","lang":"zh","published":1794295607.0,"tags":["多模态","开源"],"score":73.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"12a8c454a9e7d7ab","title":"面向 AI Native 的数据库技术演进 | 腾讯云数据库 DBTalk","title_zh":"","title_orig":"","summary":"点击查看原文>","summary_zh":"","summary_orig":"","url":"https://www.infoq.cn/video/W1VS3q3eMAosMwrHb1k4?utm_source=rss&utm_medium=article","source":"InfoQ 中文","source_id":"infoq","category":"ai","lang":"zh","published":1794325997.0,"tags":[],"score":72.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c0f297cec16ea8c1","title":"博世用豆包工作：让工程师少搬信息，多解问题","title_zh":"","title_orig":"","summary":"头图来源：豆包工作\n\n客户在群里抛出一个问题，到工程师真正坐下来分析故障，中间隔着多少工作？\n\n在博世的某研发事业部，答案曾经是：找齐散落在各个群和私聊里的消息，按多个维度整理成完整描述，凭经验判断该找谁，接着再开会，再把结论写成报告。\n\n故障分析还没开始，大半天已经过去了。\n\n如今，这中间的一大段路，工程师交给了豆包工作和豆包工作伙伴。\n\n博世的尝试：让 AI 接手沟通之后的工作\n\n汽车产业链企业的研发部门，经常会遇到这样的情况：一个工程师要当三个用：研发细节要盯，还有很多日常重复的活儿需要做。\n\n博世某事业部的工程师，其所在的团队需要对接各家客户，为客户提供系统综合解决方案。面对同一家客户，不同项目会有不同的群，测试、路试、投产任何一个环节出了问题，消息一条条蹦出来：哪个项目、哪个软件、报了什么故障代码、出现什么报错。\n\n他得把这些碎片按不同的数个维度整合起来，所属项目、软件版本、车辆配置、测试工况、报错时间、诊断截图都在其中，再凭经验自己排障，或者转给负责对应模块的研发同学。解释不清的就拉会，双方澄清之后，再出报告发给客户。\n\n让这位工程师下决心改变的，是两件事。\n\n一是知识沉淀靠不住。经验都装在工程师个人脑子里，云文档、知识库不是没有，但每个人的模板和习惯不同，项目一忙，没人顾得上往里放。新问题来了还得先找人，人一走，经验就断档，这个恶性循环一直破不掉。\n\n如果沉淀这件事不再靠自觉，不管是消息还是会议，AI 能在人无感的状态下自动记下来，那就可以节省很多时间精力。\n\n二是客户不会按模板提问。问题是流式发生的，消息不停往外蹦，没人能把故障代码、截图和十四五条字段在一条消息","summary_zh":"","summary_orig":"","url":"http://www.geekpark.net/news/373643","source":"极客公园","source_id":"geekpark","category":"ai","lang":"zh","published":1794022536.0,"tags":[],"score":77.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"e695596b85adc82a","title":"谷歌最强 VLA 机器人模型：Gemini Robotics 2.5 登场，会系蝴蝶结、已在奔驰生产线上岗","title_zh":"","title_orig":"","summary":"IT之家 11 月 10 日消息，谷歌推出迄今为止能力最强的视觉-语言-动作（VLA）机器人模型 Gemini Robotics 2.5，大幅提升机器人可学习的技能广度与学习速度。\n该模型增强了机器人的灵巧度、可靠性与安全性，助力机器人走出实验室，进入更非结构化的真实环境，协助人类完成更多类型的任务。\n\n谷歌今年早些时候已为包括人形机器人在内的多种机器人引入全身智能。此次进展很大程度上得益于 Gemini 4 Argon 加速机器人研发的能力，进一步拓展了物理智能的边界。\n谷歌在超过 200 项不同任务中测试了 Gemini Robotics 2.5 的任务广度、性能与复杂度。\nGemini Robotics 2.5 在三大关键领域实现跃升：\n灵巧度：机器人可借助日常工具、处理娇嫩柔性物体，完成显著更多任务，且性能与灵巧度大幅提升。\n\n可靠性：在奔驰生产线的真实概念验证中，该模型助力 Apptronik 的 Apollo 2 人形机器人拣选并打包汽车零部件，成功率达 96%，可承接单调工作，让技术人员专注于复杂装配任务。\n\n安全性：随着机器人进入日常环境，谷歌优化了物理安全可引导性，并推出针对机器人对抗越狱的全新测试基准。\n\n目前 Gemini Robotics 2.5 正面向谷歌的机器人合作伙伴开放。\n\n真实环境非结构化且不可预测，机器人必须同时具备高精度与高可靠性来处理日常物体。借助 Gemini Robotics 2.5，谷歌拓展了模型在任务广度、性能与复杂度上的能力，测试任务达 200 项，例如用夹子分发食物、给礼品盒系蝴蝶结、移液操作液体等。\n这些任务融合了高级工具使","summary_zh":"","summary_orig":"","url":"https://www.ithome.com/1/025/188.htm","source":"IT之家","source_id":"ithome","category":"ai","lang":"zh","published":1794351284.0,"tags":["大模型","具身智能"],"score":82.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""}],"stats":{"input":264,"junk":1,"stale":16,"duplicate":0,"kept":131,"dropped_lowscore":116,"reasons":{"过期":16,"广告/导流":1},"sources_ok":19,"sources_total":21},"generated_at":1794361669.74755},"politics":{"category":"politics","label":"时政","items":[{"id":"c38f26566b667f90","title":"韩国多车相撞致57人受伤","title_zh":"","title_orig":"","summary":"据韩国消防部门通报，当地时间今天（11月11日）早7时34分左右，一辆公交车在京畿道城南市盆唐区连续撞上30多辆等待红绿灯的车辆，造成9人重伤，48人轻伤。事故发生时，一辆由60多岁男性驾驶的公交车在连续追尾了前方的4辆公交车、1辆货车和27辆小轿车等32辆车后，撞上中央隔离带后停了下来。由于相撞车辆中包含多辆公交车，导致多名乘客因冲击而受伤，经确认，所有伤者都没有致命伤。（CCTV国际时讯）","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15318890.html","source":"界面新闻","source_id":"jiemian","category":"politics","lang":"zh","published":1794360977.0,"tags":[],"score":94.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"c969c663bda3ae0a","title":"川土微电子启动IPO辅导","title_zh":"","title_orig":"","summary":"证监会网站披露，上海川土微电子股份有限公司于2026年11月10日在上海证监局办理辅导备案登记，拟首次公开发行股票并上市，辅导券商为中信建投证券。","summary_zh":"","summary_orig":"","url":"https://www.jiemian.com/article/15318851.html","source":"界面新闻","source_id":"jiemian","category":"politics","lang":"zh","published":1794360789.0,"tags":["政策监管","融资并购"],"score":94.5,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"61e1b07a051ab147","title":"第八届中法文化论坛·温州菜品鉴活动在巴黎举行","title_zh":"","title_orig":"","summary":"中新网巴黎11月11日电 (记者 李洋)当地时间11月10日，第八届中法文化论坛·温州菜品鉴活动在位于法国巴黎的联合国教科文组织总部举行。活动由浙江省温州市文化广电旅游局承办，在法温籍侨胞协助下，以温州菜为媒介，搭建起美食文化的桥梁，为这场文化对话注入了“温州味道”。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gj/2026/11-11/10729904.shtml","source":"中新网 · 国际","source_id":"chinanews_world","category":"politics","lang":"zh","published":1794358774.0,"tags":["外交"],"score":92.0,"translated":false,"has_body":false,"topic":"","kind":"news","journal":"","year":""},{"id":"38d90a4782766758","title":"韩正会见联合国秘书长古特雷斯","title_zh":"","title_orig":"","summary":"新华社土耳其安塔利亚11月10日电(记者傅云威)当地时间11月10日，习近平主席特别代表、国家副主席韩正在土耳其安塔利亚出席《联合国气候变化框架公约》第三十一次缔约方大会(COP31)领导人峰会期间会见联合国秘书长古特雷斯。","summary_zh":"","summary_orig":"","url":"https://www.chinanews.com.cn/gn/2026/11-11/10729886.shtml","source":"中新网 · 国内","source_id":"chinanews","
