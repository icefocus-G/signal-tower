<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>信号塔 · 前沿 AI / 时政 / 养生</title>
<meta name="description" content="中文呈现的前沿 AI、时政、养生资讯聚合，多源去重过滤，英文按需翻译，每日自动更新。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
:root{
  --bg:#f7f6f3; --bg-elev:#ffffff; --bg-sunken:#f0eee9;
  --ink:#1a1917; --ink-2:#4a4844; --ink-3:#8a8680; --ink-4:#b5b1aa;
  --line:#e5e2db; --line-2:#d5d1c8;
  --brand:#0f6b5c; --brand-soft:#e3f0ed;
  --accent:#b45309; --accent-soft:#fdf0e3;
  --ai:#0f6b5c; --pol:#8c4a2f;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(26,25,23,.04),0 4px 14px rgba(26,25,23,.05);
  --shadow-lg:0 8px 40px rgba(26,25,23,.14);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif CJK SC",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--brand);color:#fff}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(247,246,243,.86);backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid var(--line);
}
.hd{max-width:1180px;margin:0 auto;padding:0 22px;height:60px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16.5px;letter-spacing:-.3px;flex-shrink:0}
.logo-mark{
  width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-size:14px;
  box-shadow:0 2px 8px rgba(15,107,92,.28);
}
.logo small{font-weight:400;color:var(--ink-3);font-size:11.5px;letter-spacing:0;margin-left:2px}

.tabs{display:flex;gap:2px;background:var(--bg-sunken);padding:3px;border-radius:10px;flex-shrink:0}
.tab{
  padding:6px 15px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink-3);
  transition:.18s;white-space:nowrap;
}
.tab:hover{color:var(--ink-2)}
.tab.on{background:var(--bg-elev);color:var(--ink);box-shadow:0 1px 3px rgba(26,25,23,.1)}
.tab .n{font-size:11px;color:var(--ink-4);margin-left:4px;font-weight:500}

.search{flex:1;position:relative;max-width:340px;margin-left:auto}
.search input{
  width:100%;height:34px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--bg-elev);padding:0 12px 0 32px;font-size:13.5px;font-family:inherit;
  color:var(--ink);outline:none;transition:.18s;
}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{position:absolute;left:10px;top:9px;width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.hd-btn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--ink-3);transition:.18s;flex-shrink:0;
}
.hd-btn:hover{background:var(--bg-sunken);color:var(--ink)}
.hd-btn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 状态条 ---------- */
.statusbar{
  max-width:1180px;margin:0 auto;padding:11px 22px 0;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-size:12px;color:var(--ink-3);
}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;background:var(--bg-elev);border:1px solid var(--line)}
.dot{width:5px;height:5px;border-radius:50%;background:#22a06b}
.dot.warn{background:var(--accent)}
.dot.err{background:#d14343}

/* ---------- 主体 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:16px 22px 0;display:grid;grid-template-columns:196px 1fr;gap:26px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr;gap:0}.rail{display:none}}

/* 侧栏 */
.rail{position:sticky;top:76px;font-size:13px}
.rail h4{font-size:11px;font-weight:700;color:var(--ink-4);letter-spacing:.09em;text-transform:uppercase;margin:0 0 9px 10px}
.rail-item{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:8px;
  color:var(--ink-2);transition:.14s;font-size:13px;text-align:left;
}
.rail-item:hover{background:var(--bg-sunken)}
.rail-item.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.rail-item .c{margin-left:auto;font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.rail-item.on .c{color:var(--brand)}
.rail-sep{height:1px;background:var(--line);margin:14px 10px}

.switch{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer;border-radius:8px}
.switch:hover{background:var(--bg-sunken)}
.switch input{appearance:none;width:30px;height:17px;border-radius:9px;background:var(--line-2);position:relative;transition:.18s;flex-shrink:0;cursor:pointer}
.switch input:checked{background:var(--brand)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked::after{transform:translateX(13px)}

/* 列表 */
.feed{min-width:0}
.feed-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px 2px}
.feed-head h2{font-size:15px;font-weight:700;letter-spacing:-.2px}
.feed-head span{font-size:12px;color:var(--ink-3)}

.card{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:9px;cursor:pointer;position:relative;
  transition:box-shadow .18s,border-color .18s,transform .18s;
}
.card:hover{box-shadow:var(--shadow);border-color:var(--line-2);transform:translateY(-1px)}
.card.read{opacity:.55}
.card.read:hover{opacity:1}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11.5px;color:var(--ink-3)}
.src{font-weight:600;color:var(--ink-2)}
.src.ai{color:var(--ai)}
.src.pol{color:var(--pol)}
.meta-sep{color:var(--ink-4)}
.tr-badge{
  display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:5px;
  background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:600;letter-spacing:.02em;
}
.card h3{
  font-size:17px;line-height:1.45;font-weight:650;letter-spacing:-.2px;margin-bottom:6px;
  color:var(--ink);
}
.card:hover h3{color:var(--brand)}
.card p{
  font-size:13.5px;color:var(--ink-2);line-height:1.62;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg-sunken);color:var(--ink-2);font-weight:500}

.empty{text-align:center;padding:70px 20px;color:var(--ink-3)}
.empty svg{width:38px;height:38px;stroke:var(--ink-4);fill:none;stroke-width:1.4;margin-bottom:12px}
.empty p{font-size:14px;margin-bottom:4px}
.empty small{font-size:12.5px;color:var(--ink-4)}

.skel{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:9px}
.skel div{background:linear-gradient(90deg,var(--bg-sunken) 25%,#f7f6f3 50%,var(--bg-sunken) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:5px}
@keyframes shimmer{to{background-position:-200% 0}}

/* ---------- 阅读抽屉 ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(26,25,23,.32);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .26s;z-index:80;
}
.overlay.on{opacity:1;pointer-events:auto}
.reader{
  position:fixed;top:0;right:0;bottom:0;width:min(740px,100%);background:var(--bg-elev);
  z-index:90;transform:translateX(101%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.reader.on{transform:none}
.reader-bar{
  display:flex;align-items:center;gap:10px;padding:13px 22px;border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.reader-bar .sp{flex:1}
.rbtn{
  display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:8px;
  font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--bg-sunken);transition:.15s;
}
.rbtn:hover{background:var(--line);color:var(--ink)}
.rbtn.primary{background:var(--brand);color:#fff}
.rbtn.primary:hover{background:#0b5749}
.rbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.reader-body{overflow-y:auto;padding:30px 34px 70px;flex:1}
@media(max-width:640px){.reader-body{padding:22px 18px 60px}}
.reader-body h1{font-size:24px;line-height:1.42;letter-spacing:-.4px;font-weight:700;margin-bottom:14px}
.reader-meta{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-3);margin-bottom:22px;flex-wrap:wrap}
.reader-sum{
  background:var(--bg-sunken);border-left:3px solid var(--brand);border-radius:0 8px 8px 0;
  padding:13px 16px;font-size:13.5px;color:var(--ink-2);margin-bottom:24px;line-height:1.7;
}
.reader-sum b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:5px;font-weight:700}
.article-text p{font-size:15.5px;line-height:1.85;color:var(--ink);margin-bottom:17px;letter-spacing:.01em}
.article-text p:last-child{margin-bottom:0}
.orig-toggle{font-size:12px;color:var(--ink-3);margin-top:26px;padding-top:18px;border-top:1px dashed var(--line)}
.orig-text{margin-top:14px;font-size:13.5px;line-height:1.75;color:var(--ink-2);font-family:var(--serif);display:none}
.orig-text.on{display:block}
.notice{
  padding:12px 15px;border-radius:9px;background:var(--accent-soft);color:#8a4b06;
  font-size:13px;margin-bottom:20px;line-height:1.6;
}
.loading-line{display:flex;align-items:center;gap:9px;color:var(--ink-3);font-size:13px;padding:30px 0}
.spinner{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,80px);z-index:120;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  opacity:0;transition:.28s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.25);
}
.toast.on{transform:translate(-50%,0);opacity:1}

footer{max-width:1180px;margin:44px auto 0;padding:22px;text-align:center;font-size:11.5px;color:var(--ink-4);border-top:1px solid var(--line)}
footer a{color:var(--ink-3);border-bottom:1px dotted var(--line-2)}

/* ---------- 养生栏目 ---------- */
:root{--hl:#a16207;--hl-soft:#fdf6e3;--hl-line:#f0e2be}

.topic-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.topic-chip{
  display:flex;flex-direction:column;gap:1px;padding:9px 15px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg-elev);transition:.16s;text-align:left;min-width:118px;
}
.topic-chip:hover{border-color:var(--hl-line);background:var(--hl-soft)}
.topic-chip.on{background:var(--hl-soft);border-color:var(--hl);box-shadow:0 0 0 3px rgba(161,98,7,.09)}
.topic-chip b{font-size:13.5px;font-weight:650;color:var(--ink)}
.topic-chip.on b{color:var(--hl)}
.topic-chip span{font-size:11px;color:var(--ink-4);line-height:1.35}

.guide{
  background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:18px;
}
.guide-lead{
  font-size:16px;font-weight:650;line-height:1.6;color:var(--ink);letter-spacing:-.2px;
  padding-left:13px;border-left:3px solid var(--hl);margin-bottom:13px;
}
.guide-intro{font-size:13.5px;color:var(--ink-2);line-height:1.78;margin-bottom:20px}
.gsec{margin-bottom:19px}
.gsec:last-child{margin-bottom:0}
.gsec h5{
  font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-4);margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.gsec h5::after{content:"";flex:1;height:1px;background:var(--line)}
.gitem{display:flex;gap:9px;padding:6px 0;font-size:13.5px;line-height:1.7}
.gitem .gt{font-weight:650;color:var(--ink);flex-shrink:0;min-width:132px}
.gitem .gd{color:var(--ink-2)}
@media(max-width:640px){.gitem{flex-direction:column;gap:2px}.gitem .gt{min-width:0}}
.gitem.warn .gt{color:#b3410f}
.myth{background:var(--bg-sunken);border-radius:9px;padding:11px 13px;margin-bottom:7px}
.myth q{font-size:13px;font-weight:650;color:var(--ink);display:block;margin-bottom:4px;quotes:"「" "」"}
.myth p{font-size:13px;color:var(--ink-2);line-height:1.68}

.disclaimer{
  font-size:11.5px;color:var(--ink-3);line-height:1.7;
  background:var(--hl-soft);border:1px solid var(--hl-line);border-radius:9px;
  padding:11px 14px;margin:0 0 18px;
}
.paper-badge{
  display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:5px;
  background:#eef2f7;color:#3b5b82;font-size:10.5px;font-weight:600;
}
.src.hl{color:var(--hl)}

/* 逐条翻译按钮 */
.tbtn{
  margin-left:auto;display:inline-flex;align-items:center;gap:3px;
  padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;
  background:var(--accent-soft);color:var(--accent);border:1px solid transparent;
  transition:.15s;flex-shrink:0;
}
.tbtn:hover{border-color:var(--accent);background:#fbe7cf}
.tbtn.on{background:var(--bg-sunken);color:var(--ink-3);font-weight:500}
.tbtn.on:hover{color:var(--ink);border-color:var(--line-2)}
.card .card-top{gap:8px}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="logo">
      <span class="logo-mark">📡</span>
      <span>信号塔</span>
      <small>AI · 时政</small>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-cat="ai">前沿 AI <span class="n" id="n-ai"></span></button>
      <button class="tab" data-cat="politics">时政 <span class="n" id="n-pol"></span></button>
      <button class="tab" data-cat="health">养生 <span class="n" id="n-health"></span></button>
    </nav>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索标题、来源…" autocomplete="off">
    </div>
    <button class="hd-btn" id="btn-reload" title="重新抓取">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>

<div class="statusbar" id="statusbar"></div>

<div class="wrap">
  <aside class="rail">
    <h4>来源</h4>
    <div id="rail-sources"></div>
    <div class="rail-sep"></div>
    <label class="switch"><input type="checkbox" id="auto-trans"> 自动显示译文</label>
    <label class="switch"><input type="checkbox" id="only-trans"> 只看有译文的</label>
    <label class="switch"><input type="checkbox" id="hide-read"> 隐藏已读</label>
    <label class="switch"><input type="checkbox" id="bilingual" checked> 阅读页保留原文</label>
  </aside>

  <main class="feed">
    <div class="feed-head">
      <h2 id="feed-title">前沿 AI</h2>
      <span id="feed-sub"></span>
    </div>
    <div id="list"></div>
  </main>
</div>

<footer>
  信号塔 · 多源聚合 · 英文自动翻译 · 每日重建<br>
  <span id="foot-meta"></span>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="reader" id="reader">
  <div class="reader-bar">
    <button class="rbtn" id="r-close"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>关闭</button>
    <span class="sp"></span>
    <button class="rbtn" id="r-orig"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>原文</button>
  </div>
  <div class="reader-body" id="reader-body"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

const CAT_LABEL = { ai: "前沿 AI", politics: "时政", health: "养生" };
const state = {
  cat: "ai",
  topic: "",
  items: [],
  meta: null,
  healthMeta: null,
  data: { ai: [], politics: [], health: [] },
  articleCache: {},
  articlesIndex: null,
  source: "",          // 来源筛选（source_id）
  query: "",
  onlyTrans: false,
  hideRead: false,
  bilingual: true,
  autoTrans: localStorage.getItem("st_autotrans") === "1",
  zhShown: new Set(JSON.parse(localStorage.getItem("st_zh") || "[]")),
  mode: "static",      // static | api
  read: new Set(JSON.parse(localStorage.getItem("st_read") || "[]")),
  stat: null,
};

const $ = (s) => document.querySelector(s);
const listEl = $("#list");
const readerEl = $("#reader");
const overlayEl = $("#overlay");
const toastEl = $("#toast");

/* ---------------- 工具 ---------------- */

function ago(ts) {
  if (!ts) return "时间未知";
  const d = Math.floor(Date.now() / 1000 - ts);
  if (d < 0) return "刚刚";
  if (d < 60) return "刚刚";
  if (d < 3600) return Math.floor(d / 60) + " 分钟前";
  if (d < 86400) return Math.floor(d / 3600) + " 小时前";
  if (d < 86400 * 3) return Math.floor(d / 86400) + " 天前";
  const t = new Date(ts * 1000);
  return `${t.getMonth() + 1}月${t.getDate()}日`;
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("on"), 2100);
}

function saveRead() {
  localStorage.setItem("st_read", JSON.stringify([...state.read].slice(-800)));
}

/* ---------------- 数据加载 ---------------- */

async function loadMeta() {
  // 内联数据版（单文件，双击即可看）优先
  if (window.__DATA__ && window.__DATA__.meta) {
    state.mode = "inline";
    return window.__DATA__.meta;
  }
  // 再探测静态数据，最后回退到本地 API
  try {
    const r = await fetch("data/meta.json", { cache: "no-store" });
    if (r.ok) {
      state.mode = "static";
      return await r.json();
    }
  } catch (e) { /* 忽略，尝试 API */ }
  try {
    const r = await fetch("/api/health", { cache: "no-store" });
    if (r.ok) {
      state.mode = "api";
      return { api: true, ...(await r.json()) };
    }
  } catch (e) { /* 都没有 */ }
  throw new Error("无法加载数据");
}

async function loadCategory(cat) {
  if (state.mode === "inline") {
    const d = window.__DATA__[cat] || { items: [] };
    state.data[cat] = d.items || [];
    if (cat === "health") {
      state.healthMeta = { topics: d.topics || [], guides: d.guides || {}, disclaimer: d.disclaimer || "" };
    }
    return d;
  }
  if (state.mode === "static") {
    const r = await fetch(`data/${cat}.json`, { cache: "no-store" });
    if (!r.ok) throw new Error("分类数据缺失");
    const d = await r.json();
    state.data[cat] = d.items || [];
    if (cat === "health") {
      state.healthMeta = {
        topics: d.topics || [],
        guides: d.guides || {},
        disclaimer: d.disclaimer || "",
      };
    }
    return d;
  }
  // 本地服务模式
  const r = await fetch(`/api/feed?category=${cat}`, { cache: "no-store" });
  if (!r.ok) throw new Error("接口错误");
  const d = await r.json();
  state.data[cat] = d.items || [];
  if (cat === "health") {
    state.healthMeta = { topics: d.topics || [], guides: d.guides || {}, disclaimer: d.disclaimer || "" };
  }
  return d;
}

/* ---------------- 渲染 ---------------- */

function renderStatus() {
  const m = state.meta || {};
  const el = $("#statusbar");
  const t = m.generated_at || (state.stat && state.stat.updated_at);
  const when = t ? new Date(t * 1000).toLocaleString("zh-CN", { hour12: false }) : "—";
  const total = m.totals || {};
  const engineName = { google: "Google", llm: "大模型", mymemory: "MyMemory" }[m.engine] || "免费引擎";

  el.innerHTML = `
    <span class="pill"><span class="dot"></span>更新于 ${esc(when)}</span>
    ${total.sources_total ? `<span class="pill">源 ${total.sources_ok}/${total.sources_total} 在线</span>` : ""}
    ${total.fetched ? `<span class="pill">抓取 ${total.fetched} → 保留 ${total.kept}</span>` : ""}
    <span class="pill"><span class="dot ${m.engine === "google" ? "" : "warn"}"></span>翻译 ${esc(engineName)}</span>
    ${state.mode === "static" ? '<span class="pill">静态托管</span>'
      : state.mode === "inline" ? '<span class="pill">单文件离线版</span>'
      : '<span class="pill">本地服务</span>'}
  `;
  $("#foot-meta").textContent =
    `上次构建 ${m.generated_at_iso || when} · 耗时 ${m.elapsed || "?"}s · ${total.sources_total || "—"} 个源`;
}

function renderRail() {
  const m = state.meta || {};
  const srcs = (m.sources || []).filter((s) => s.ok);
  const countBy = {};
  state.items.forEach((it) => { countBy[it.source_id] = (countBy[it.source_id] || 0) + 1; });
  const mine = srcs.filter((s) => countBy[s.id]);
  mine.sort((a, b) => countBy[b.id] - countBy[a.id]);

  let html = `<button class="rail-item ${state.source === "" ? "on" : ""}" data-src="">
      全部来源 <span class="c">${state.items.length}</span></button>`;
  for (const s of mine) {
    html += `<button class="rail-item ${state.source === s.id ? "on" : ""}" data-src="${esc(s.id)}">
      ${esc(s.name)} <span class="c">${countBy[s.id]}</span></button>`;
  }
  $("#rail-sources").innerHTML = html;
  $("#rail-sources").querySelectorAll(".rail-item").forEach((b) => {
    b.onclick = () => { state.source = b.dataset.src; renderRail(); renderList(); };
  });
}

function visibleItems() {
  const q = state.query.trim().toLowerCase();
  return state.items.filter((it) => {
    if (state.source && it.source_id !== state.source) return false;
    if (state.onlyTrans && !it.translated) return false;
    if (state.hideRead && state.read.has(it.id)) return false;
    if (state.topic && it.topic !== state.topic) return false;
    if (q) {
      const blob = (it.title + " " + it.summary + " " + it.source + " " + (it.title_orig || "")).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function isZh(it) {
  return !!it.title_zh && (state.autoTrans || state.zhShown.has(it.id));
}

function cardHTML(it, catClass) {
  const isRead = state.read.has(it.id);
  const isPaper = it.kind === "paper";
  const zh = isZh(it);
  const title = zh ? it.title_zh : it.title;
  const summary = zh ? (it.summary_zh || it.summary) : it.summary;
  const tbtn = it.title_zh
    ? `<button class="tbtn ${zh ? "on" : ""}" data-tid="${it.id}" title="${zh ? "切换回英文原文" : "显示中文译文"}">${zh ? "原文" : "译"}</button>`
    : "";
  return `<article class="card ${isRead ? "read" : ""}" data-id="${it.id}">
    <div class="card-top">
      <span class="src ${catClass}">${esc(it.source)}</span>
      <span class="meta-sep">·</span>
      <span>${isPaper && it.year ? esc(it.year) + " 年" : ago(it.published)}</span>
      ${zh ? '<span class="tr-badge">译文</span>' : ""}
      ${isPaper ? '<span class="paper-badge">循证文献</span>' : ""}
      ${tbtn}
    </div>
    <h3>${esc(title)}</h3>
    ${summary ? `<p>${esc(summary)}</p>` : ""}
    ${it.tags && it.tags.length ? `<div class="tags">${it.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
  </article>`;
}

function toggleZh(id) {
  if (state.zhShown.has(id)) state.zhShown.delete(id);
  else state.zhShown.add(id);
  localStorage.setItem("st_zh", JSON.stringify([...state.zhShown]));
  renderList();
}

function bindCards() {
  listEl.querySelectorAll(".tbtn").forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      toggleZh(b.dataset.tid);
    };
  });
  listEl.querySelectorAll(".card").forEach((c) => {
    c.onclick = () => {
      const it = findItem(c.dataset.id);
      // 文献条目没有正文可抓，直接去 DOI
      if (it && it.kind === "paper") {
        window.open(it.url, "_blank", "noopener");
        return;
      }
      openReader(c.dataset.id);
    };
  });
}

function renderList() {
  if (state.cat === "health") return renderHealth();

  const items = visibleItems();
  const catClass = state.cat === "ai" ? "ai" : "pol";
  $("#feed-title").textContent = CAT_LABEL[state.cat];
  $("#feed-sub").textContent = items.length
    ? `${items.length} 条${state.source ? " · 已按来源筛选" : ""}`
    : "";

  if (!items.length) {
    listEl.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <p>没有匹配的内容</p>
      <small>换个关键词，或清除左侧筛选条件</small></div>`;
    return;
  }

  listEl.innerHTML = items.map((it) => cardHTML(it, catClass)).join("");
  bindCards();
}

/* ---------------- 养生栏目 ---------------- */

function renderHealth() {
  const meta = state.healthMeta;
  $("#feed-title").textContent = "养生";
  if (!meta) {
    listEl.innerHTML = `<div class="empty"><p>指南数据缺失</p><small>请重新构建后再试</small></div>`;
    return;
  }

  const chips = `<div class="topic-row">
    <button class="topic-chip ${!state.topic ? "on" : ""}" data-topic="">
      <b>全部</b><span>四个主题总览</span></button>
    ${meta.topics.map((t) => {
      const n = state.items.filter((i) => i.topic === t.id).length;
      return `<button class="topic-chip ${state.topic === t.id ? "on" : ""}" data-topic="${t.id}">
        <b>${esc(t.name)}</b><span>${esc(t.short)} · ${n} 条</span></button>`;
    }).join("")}
  </div>`;

  let body = "";

  if (!state.topic) {
    // 总览：四个主题的要点预览
    $("#feed-sub").textContent = "点击主题查看完整要点与相关文献";
    body = meta.topics.map((t) => {
      const g = meta.guides[t.id];
      if (!g) return "";
      const n = state.items.filter((i) => i.topic === t.id).length;
      return `<article class="guide" data-goto="${t.id}" style="cursor:pointer">
        <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:10px">
          <h3 style="font-size:15px;font-weight:700;color:var(--hl)">${esc(t.name)}</h3>
          <span style="font-size:11.5px;color:var(--ink-4)">${esc(t.short)} · ${n} 条相关内容</span>
        </div>
        <div class="guide-lead">${esc(g.headline)}</div>
        <div class="gsec" style="margin-bottom:0">
          <h5>饮食要点</h5>
          ${g.diet.slice(0, 3).map((d) => `<div class="gitem"><span class="gt">${esc(d.t)}</span><span class="gd">${esc(d.d)}</span></div>`).join("")}
        </div>
        <div style="margin-top:11px;font-size:12px;color:var(--hl);font-weight:600">展开完整要点 ›</div>
      </article>`;
    }).join("");

    // 下方附最新内容流
    const items = visibleItems();
    if (items.length) {
      body += `<div class="feed-head" style="margin:22px 0 12px 2px">
        <h2 style="font-size:14px">最新相关</h2><span>${items.length} 条</span></div>`;
      body += items.slice(0, 12).map((it) => cardHTML(it, "hl")).join("");
    }
  } else {
    const g = meta.guides[state.topic];
    const t = meta.topics.find((x) => x.id === state.topic);
    const items = visibleItems();
    $("#feed-sub").textContent = `${items.length} 条相关内容`;

    body = `<article class="guide">
      <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:12px">
        <h3 style="font-size:16px;font-weight:700;color:var(--hl)">${esc(t.name)}</h3>
        <span style="font-size:11.5px;color:var(--ink-4)">${esc(t.short)}</span>
      </div>
      <div class="guide-lead">${esc(g.headline)}</div>
      <div class="guide-intro">${esc(g.intro)}</div>

      <div class="gsec"><h5>饮食</h5>
        ${g.diet.map((d) => `<div class="gitem"><span class="gt">${esc(d.t)}</span><span class="gd">${esc(d.d)}</span></div>`).join("")}
      </div>
      <div class="gsec"><h5>生活方式</h5>
        ${g.life.map((d) => `<div class="gitem"><span class="gt">${esc(d.t)}</span><span class="gd">${esc(d.d)}</span></div>`).join("")}
      </div>
      <div class="gsec"><h5>需要警惕的信号</h5>
        ${g.watch.map((d) => `<div class="gitem warn"><span class="gt">${esc(d.t)}</span><span class="gd">${esc(d.d)}</span></div>`).join("")}
      </div>
      <div class="gsec"><h5>常见误区</h5>
        ${g.myths.map((m) => `<div class="myth"><q>${esc(m.q)}</q><p>${esc(m.a)}</p></div>`).join("")}
      </div>
    </article>
    <div class="disclaimer">${esc(meta.disclaimer)}</div>`;

    if (items.length) {
      body += `<div class="feed-head" style="margin:22px 0 12px 2px">
        <h2 style="font-size:14px">相关资讯与文献</h2><span>${items.length} 条</span></div>`;
      body += items.map((it) => cardHTML(it, "hl")).join("");
    } else {
      body += `<div class="empty" style="padding:34px 20px"><p>这个主题暂时没有新内容</p>
        <small>上方要点每版随构建更新，文献按周补充</small></div>`;
    }
  }

  listEl.innerHTML = chips + body;

  listEl.querySelectorAll(".topic-chip").forEach((b) => {
    b.onclick = () => {
      state.topic = b.dataset.topic;
      renderHealth();
      $("#feed-title").scrollIntoView({ block: "start", behavior: "smooth" });
    };
  });
  listEl.querySelectorAll(".guide[data-goto]").forEach((g) => {
    g.onclick = () => { state.topic = g.dataset.goto; renderHealth(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  });
  bindCards();
}

/* ---------------- 阅读器 ---------------- */

function findItem(id) {
  for (const cat of Object.keys(state.data)) {
    const hit = state.data[cat].find((x) => x.id === id);
    if (hit) return hit;
  }
  return null;
}

async function getArticle(id) {
  if (state.articleCache[id]) return state.articleCache[id];
  if (state.mode === "inline") {
    const a = (window.__DATA__.articles || {})[id];
    if (!a) return null;
    state.articleCache[id] = a;
    return a;
  }
  if (state.mode === "api") {
    const r = await fetch(`/api/article?id=${id}`);
    if (!r.ok) throw new Error("正文获取失败");
    const d = await r.json();
    state.articleCache[id] = d;
    return d;
  }
  // 静态模式：从 articles.json 取
  if (!state.articlesIndex) {
    try {
      const r = await fetch("data/articles.json", { cache: "no-store" });
      state.articlesIndex = r.ok ? await r.json() : {};
    } catch (e) { state.articlesIndex = {}; }
  }
  const a = state.articlesIndex[id];
  if (!a) return null;
  const rec = { ...a };
  state.articleCache[id] = rec;
  return rec;
}

function paragraphs(text) {
  return String(text || "")
    .split("\n")
    .map((p) => p.trim())
    .filter((p) => p.length > 0)
    .map((p) => `<p>${esc(p)}</p>`)
    .join("");
}

async function openReader(id) {
  const it = findItem(id);
  if (!it) return;

  state.read.add(id);
  saveRead();
  const card = listEl.querySelector(`.card[data-id="${id}"]`);
  if (card) card.classList.add("read");

  const catClass = it.category === "ai" ? "ai" : (it.category === "health" ? "hl" : "pol");
  const zh = isZh(it);
  const rTitle = zh ? it.title_zh : it.title;
  const rSum = zh ? (it.summary_zh || it.summary) : it.summary;
  const rTbtn = it.title_zh
    ? `<button class="tbtn ${zh ? "on" : ""}" id="r-tbtn">${zh ? "看原文" : "译成中文"}</button>`
    : "";

  $("#reader-body").innerHTML = `
    <h1>${esc(rTitle)}</h1>
    <div class="reader-meta">
      <span class="src ${catClass}" style="font-weight:600">${esc(it.source)}</span>
      <span class="meta-sep">·</span><span>${ago(it.published)}</span>
      ${it.tags && it.tags.length ? `<span class="meta-sep">·</span><span>${it.tags.map(esc).join(" / ")}</span>` : ""}
      ${rTbtn}
    </div>
    ${rSum ? `<div class="reader-sum"><b>摘要</b>${esc(rSum)}</div>` : ""}
    <div id="art-body"><div class="loading-line"><span class="spinner"></span>正在提取正文…</div></div>
    ${state.bilingual && it.title_zh && zh ? `
      <div class="orig-toggle">
        <a href="#" id="toggle-orig" style="color:var(--ink-3);border-bottom:1px dotted var(--line-2)">查看英文原标题</a>
        <div class="orig-text" id="orig-box">${esc(it.title)}</div>
      </div>` : ""}
  `;

  const rb = $("#r-tbtn");
  if (rb) rb.onclick = (e) => {
    e.stopPropagation();
    toggleZh(id);
    openReader(id);
  };

  overlayEl.classList.add("on");
  readerEl.classList.add("on");
  document.body.style.overflow = "hidden";

  const tgl = $("#toggle-orig");
  if (tgl) tgl.onclick = (e) => {
    e.preventDefault();
    const box = $("#orig-box");
    box.classList.toggle("on");
    tgl.textContent = box.classList.contains("on") ? "收起英文原标题" : "查看英文原标题";
  };

  const holder = $("#art-body");
  try {
    const art = await getArticle(id);
    if (!art || !art.body) {
      holder.innerHTML = `<div class="notice">
        这篇只提供 RSS 摘要，未预抓全文。<br>点击右上角「原文」可直接阅读原始页面。
      </div>`;
      return;
    }
    const badge = art.translated
      ? `<div style="font-size:11.5px;color:var(--ink-4);margin-bottom:16px;letter-spacing:.02em">以下正文由机器翻译，原文见右上角「原文」</div>`
      : "";
    holder.innerHTML = badge + `<div class="article-text">${paragraphs(art.body)}</div>`;
    if (art.body_orig) {
      holder.innerHTML += `<div class="orig-toggle">
        <a href="#" id="tg2" style="color:var(--ink-3);border-bottom:1px dotted var(--line-2)">查看英文原文正文</a>
        <div class="orig-text" id="ob2">${paragraphs(art.body_orig)}</div></div>`;
      const t2 = $("#tg2");
      t2.onclick = (e) => {
        e.preventDefault();
        const b = $("#ob2");
        b.classList.toggle("on");
        t2.textContent = b.classList.contains("on") ? "收起英文原文" : "查看英文原文正文";
      };
    }
  } catch (e) {
    holder.innerHTML = `<div class="notice">正文加载失败：${esc(e.message)}。<br>可点右上角「原文」直接访问。</div>`;
  }

  $("#r-orig").onclick = () => window.open(it.url, "_blank", "noopener");
}

function closeReader() {
  overlayEl.classList.remove("on");
  readerEl.classList.remove("on");
  document.body.style.overflow = "";
}

/* ---------------- 交互绑定 ---------------- */

function bind() {
  $("#tabs").querySelectorAll(".tab").forEach((b) => {
    b.onclick = async () => {
      if (b.dataset.cat === state.cat) return;
      state.cat = b.dataset.cat;
      state.source = "";
      state.topic = "";
      $("#tabs").querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
      await switchCategory();
      renderRail();
      renderList();
    };
  });

  $("#q").oninput = (e) => { state.query = e.target.value; renderList(); };
  $("#auto-trans").checked = state.autoTrans;
  $("#auto-trans").onchange = (e) => {
    state.autoTrans = e.target.checked;
    localStorage.setItem("st_autotrans", state.autoTrans ? "1" : "0");
    renderList();
    toast(state.autoTrans ? "已开启自动译文" : "已关闭，点每条右侧「译」查看中文");
  };
  $("#only-trans").onchange = (e) => { state.onlyTrans = e.target.checked; renderList(); };
  $("#hide-read").onchange = (e) => { state.hideRead = e.target.checked; renderList(); };
  $("#bilingual").onchange = (e) => { state.bilingual = e.target.checked; };
  $("#btn-reload").onclick = () => reload(true);
  $("#r-close").onclick = closeReader;
  overlayEl.onclick = closeReader;

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeReader();
    if (e.key === "/" && document.activeElement !== $("#q")) {
      e.preventDefault();
      $("#q").focus();
    }
  });
}

/* ---------------- 启动 ---------------- */

async function switchCategory() {
  listEl.innerHTML = Array(4).fill(0).map(() =>
    `<div class="skel"><div style="height:12px;width:34%;margin-bottom:10px"></div>
     <div style="height:17px;width:86%;margin-bottom:9px"></div>
     <div style="height:12px;width:62%"></div></div>`).join("");
  try {
    await loadCategory(state.cat);
    state.items = state.data[state.cat] || [];
    renderRail();
    renderList();
  } catch (e) {
    listEl.innerHTML = `<div class="empty"><p>加载失败</p><small>${esc(e.message)}</small></div>`;
  }
}

async function reload(manual) {
  const btn = $("#btn-reload");
  btn.classList.add("spin");
  try {
    if (state.mode === "api") {
      await fetch("/api/refresh");
      let tries = 0;
      while (tries++ < 60) {
        await new Promise((r) => setTimeout(r, 2000));
        const h = await (await fetch("/api/health", { cache: "no-store" })).json();
        if (!h.refreshing) break;
      }
    } else if (manual) {
      toast("静态站点由云端定时重建，稍后自动生效");
    }
    state.meta = await loadMeta();
    renderStatus();
    await Promise.all(Object.keys(CAT_LABEL).map((c) => loadCategory(c).catch(() => null)));
    state.items = state.data[state.cat] || [];
    $("#n-ai").textContent = (state.data.ai || []).length;
    $("#n-pol").textContent = (state.data.politics || []).length;
    $("#n-health").textContent = (state.data.health || []).length;
    renderRail();
    renderList();
    if (manual) toast("已刷新");
  } catch (e) {
    toast("刷新失败：" + e.message);
  } finally {
    btn.classList.remove("spin");
  }
}

async function boot() {
  bind();
  try {
    state.meta = await loadMeta();
  } catch (e) {
    listEl.innerHTML = `<div class="empty">
      <p>无法加载数据</p>
      <small>本地打开请用 <code>python3 server.py</code> 启动服务后再访问</small></div>`;
    return;
  }
  renderStatus();
  await Promise.all(Object.keys(CAT_LABEL).map((c) => loadCategory(c).catch(() => null)));
  state.items = state.data[state.cat] || [];
  $("#n-ai").textContent = (state.data.ai || []).length;
  $("#n-pol").textContent = (state.data.politics || []).length;
  $("#n-health").textContent = (state.data.health || []).length;
  renderRail();
  renderList();

  // 首次到访：提示译文是手动触发的
  if (localStorage.getItem("st_autotrans") === null) {
    setTimeout(() => toast("英文条目点右侧「译」看中文，或左侧开启自动显示"), 1400);
  }
}
boot();

// 静态模式：每 10 分钟静默检查是否有新的构建产物
if (state.mode === "static") {
  setInterval(async () => {
    try {
      const m = await loadMeta();
      if (state.meta && m.generated_at !== state.meta.generated_at) {
        state.meta = m;
        await Promise.all(Object.keys(CAT_LABEL).map((c) => loadCategory(c).catch(() => null)));
        state.items = state.data[state.cat] || [];
        renderStatus(); renderRail(); renderList();
        toast("内容已更新");
      }
    } catch (e) { /* 静默 */ }
  }, 600000);
}
})();
</script>
</body>
</html>
